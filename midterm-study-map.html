amp;#39;얼음&amp;#39;이 아니라 &amp;#39;얾&amp;#39;? ㉡ 왜 &amp;#39;엄&amp;#39;이면 안 되나?\u003c/li&gt;\n\u003cli&gt;자료 조사: 사전에서 &amp;#39;얼음&amp;#39;은 명사로 검색되지만 &amp;#39;얾&amp;#39;은 검색 안 됨 → 사전에는 \u003cstrong&gt;용언의 기본형만\u003c/strong&gt; 표제어로 오르고 &amp;#39;얾&amp;#39;은 &amp;#39;얼다&amp;#39;의 \u003cstrong&gt;활용형\u003c/strong&gt;이기 때문\u003c/li&gt;\n\u003cli&gt;문법 지식 빈칸: 제15항에 따라 용언의 \u003cstrong&gt;어간\u003c/strong&gt;과 \u003cstrong&gt;어미\u003c/strong&gt;를 구별 / 모음이나 &amp;#39;ㄹ&amp;#39; 받침 어간에는 명사형 어미 \u003cstrong&gt;&amp;#39;-ㅁ&amp;#39;\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;결론(예시): ㉠ 이 문장에서는 &amp;#39;잘&amp;#39;의 꾸밈을 받으며 서술어로 쓰였으므로 명사 &amp;#39;얼음&amp;#39;이 아니라 &amp;#39;얼다&amp;#39;의 명사형 &amp;#39;얾&amp;#39; ㉡ 어간 &amp;#39;얼-&amp;#39;과 어미 &amp;#39;-ㅁ&amp;#39;을 구별해 적어야 하므로 &amp;#39;엄&amp;#39;은 틀림\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;적용·창의 (73~74쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;1. 국어생활 성찰 일지\u003c/strong&gt;: 헷갈렸거나 잘못 쓴 사례 → 올바른 표기 확인 → 관련 조항 → 느낀 점. 도구: 맞춤법/문법 검사기, 국어사전.\u003cul&gt;\n\u003cli&gt;예시: &amp;quot;선생님, 오늘 찾아봬도 되요?&amp;quot; → &amp;#39;찾아봬도&amp;#39;는 바름, &amp;#39;되요&amp;#39; → \u003cstrong&gt;돼요\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;근거: \u003cstrong&gt;제35항 [붙임 2]\u003c/strong&gt; &amp;#39;ㅚ&amp;#39; 뒤에 &amp;#39;-어, -었-&amp;#39;이 어울려 &amp;#39;ㅙ, ㅙㅆ&amp;#39;으로 될 적에도 준 대로 적는다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;2. 모둠 — 일부러 틀리는 게 유행?\u003c/strong&gt;(&amp;#39;않이&amp;#39;, &amp;#39;외않되?&amp;#39;, &amp;#39;무적권&amp;#39;): 의도적 맞춤법 파괴가 국어생활에 끼칠 부정적 영향 토의 → 올바른 표기 태도를 담은 \u003cstrong&gt;캠페인 자료\u003c/strong&gt;(포스터, 스티커) 제작·게시. 예시 문구: &amp;quot;진정한 유행은 올바르게 표기하는 습관을 지니는 것입니다.&amp;quot;\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;소단원 정리 빈칸 정답 (75쪽)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;빈칸 문장\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;발음 변화를 일반적인 (  )(으)로 설명할 수 없으면 소리대로 / 설명할 수 있으면 형태를 밝혀\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;음운 변동\u003c/strong&gt; (두 칸 모두)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;형태소의 본래 (  )에서 멀어진 경우 / 본래 (  )이/가 유지되는 경우\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;뜻\u003c/strong&gt; (두 칸 모두)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;명사를 만드는 &amp;#39;-(  )&amp;#39;, &amp;#39;-음/-ㅁ&amp;#39;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;이\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;예외적으로 붙여 쓰는 경우: (  )은/는 단어이지만 홀로 쓰일 수 없어 앞말에 붙여 씀\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;조사\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;의존 명사, (  )을/를 나타내는 명사는 띄어 씀\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;단위\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;예상 문제 (14문항)&quot;,&quot;html&quot;:&quot;\u003ch3&gt;[A. 뉴욕제과점]\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;1. &amp;lt;뉴욕제과점&amp;gt;에 대한 설명으로 적절하지 않은 것은?\u003c/strong&gt;\n① 작가의 경험이 담긴 자전적 소설이다.\n② 서술자 &amp;#39;나&amp;#39;가 자신의 과거를 회상하는 방식으로 전개된다.\n③ 실제 역사적 사건을 언급하여 시대적 배경을 드러낸다.\n④ 시대의 변화와 뉴욕제과점의 변화를 담담한 어조로 그리고 있다.\n⑤ 작품 밖의 서술자가 여러 인물의 내면을 번갈아 전달하며 갈등을 극대화한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2. &amp;lt;보기&amp;gt;의 사건을 일어난 순서대로 바르게 배열한 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 대학생인 &amp;#39;나&amp;#39;가 가게를 보며 하루에 빙수 134그릇을 판다.\nㄴ. 어머니가 가게 뒤 골방에 갓난 누나를 혼자 둔 채 장사를 한다.\nㄷ. 뉴욕제과점이 다른 사람에게 팔려 24시간 국밥집이 된다.\nㄹ. &amp;#39;나&amp;#39;가 국밥집에 들어가 고개를 숙인 채 국밥을 먹는다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① ㄱ-ㄴ-ㄷ-ㄹ ② ㄱ-ㄷ-ㄴ-ㄹ ③ ㄴ-ㄱ-ㄷ-ㄹ ④ ㄴ-ㄷ-ㄱ-ㄹ ⑤ ㄷ-ㄴ-ㄱ-ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3. &amp;lt;보기&amp;gt;를 참고하여 &amp;#39;어머니&amp;#39;를 평가한 내용으로 적절하지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\n• &amp;#39;나&amp;#39;에게 대학 등록금까지만 지원해 주고, 그 이후에는 스스로 돈을 벌게 함.\n• 팔지 못한 빵을 남들이 보지 못하게 검은색 봉투에 넣어서 버림.\n• 장사가 잘되지 않음에도 가게를 그만두지 않으려 함.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 등록금까지만 대 준 데서 자식이 스스로 살아가기를 바라는 마음을 엿볼 수 있다.\n② 대기업 빵집이 생기자 가게를 새롭게 바꾸어 적극적으로 경쟁에 나서는 인물이다.\n③ 빵을 봉투에 꽁꽁 묶어 버리는 모습에서 남아 있는 자존심을 읽을 수 있다.\n④ 가게를 그만두겠다는 말을 하지 않는 데서 가게에 대한 집념이 드러난다.\n⑤ &amp;quot;그거보다는 내가 더 많이 팔았지.&amp;quot;라는 말에서 가게에 대한 자부심이 드러난다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4. &amp;lt;보기&amp;gt;의 밑줄 친 &amp;#39;불빛&amp;#39;에 대한 이해로 가장 적절한 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 세상을 살아가는 데 그렇게 많은 &amp;lt;u&amp;gt;불빛&amp;lt;/u&amp;gt;이 필요한 것은 아니다. 그저 조금만 있으면 된다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 역전 거리를 밝히는 가로등의 실제 불빛만을 가리킨다.\n② 대기업 빵집의 화려한 간판처럼 새롭게 변한 세상을 뜻한다.\n③ 개발로 사라진 상점들에 대한 &amp;#39;나&amp;#39;의 원망을 상징한다.\n④ &amp;#39;나&amp;#39;가 마음속에 간직한, 자신을 살아가게 하는 소중한 추억을 비유한 것이다.\n⑤ 가게를 끝까지 그만두지 않은 어머니의 고집을 비판하는 표현이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5. &amp;lt;보기&amp;gt;는 작품 마지막 부분에서 &amp;#39;나&amp;#39;의 감정을 보여 주는 표현이다. 이에 대한 해석으로 적절하지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\n(가) 나는 문득 이제 내가 살아갈 세상에는 괴로운 일만 남았다는 생각을 하게 됐다.\n(나) 나는 깨달았다, 이제 내가 살아갈 세상에 괴로운 일만 남은 것은 아니라는 사실을.\n(다) 나는 더 이상 고개를 들고 실내를 바라볼 수 없었다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① (가)에서 &amp;#39;나&amp;#39;는 뉴욕제과점이 문을 닫은 것을 다행으로 여기며 안도하고 있다.\n② (가)의 감정은 아는 사람이 죽고 거리가 바뀌고 소중한 것이 떠날 것이라는 생각에서 비롯된다.\n③ (나)는 사라진 것들이 내 안에 추억으로 고스란히 남아 있다는 깨달음과 관련된다.\n④ (다)는 국밥집 곳곳에서 가족과 자신의 옛 모습을 떠올리며 감정이 북받친 상태로 볼 수 있다.\n⑤ (가)에서 (나)로 가면서 &amp;#39;나&amp;#39;의 마음은 두려움에서 위안 쪽으로 바뀐다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6. &amp;lt;보기&amp;gt;의 설명을 바탕으로 할 때, 학생들의 감상 중 &amp;#39;주체적 감상&amp;#39;으로 보기 어려운 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 작품을 주체적인 관점에서 해석하고 평가한다는 것은 자신의 경험, 지식, 가치관 등이 반영된 자신만의 관점으로, 타당한 근거를 들어 작품의 의미를 해석하고 평가함을 뜻한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 지민: 나도 이사 뒤 옛 동네가 바뀐 걸 보고 허전했던 적이 있어서, &amp;#39;나&amp;#39;가 스스로를 실향민 같다고 한 마음에 공감했어.\n② 서준: &amp;#39;나&amp;#39;가 등록금보다 웃음이 더 훌륭하다고 한 부분을 보니, 이 작품은 물질보다 마음을 더 소중히 여기는 가치관을 보여 준다고 생각해.\n③ 하윤: 인터넷에 나온 평론가의 감상 평이 멋있어서 내 생각 없이 그대로 옮겨 적었어.\n④ 도현: 어머니가 갓난 딸을 돌보지 못한 점도 있지만 삼남매를 끝까지 키워 낸 점을 함께 고려하면, 어머니는 책임감이 강한 인물이라고 평가할 수 있어.\n⑤ 수아: 할머니와의 추억이 나를 버티게 해 준 경험이 있어서, 추억이 사람을 살아가게 한다는 주제가 설득력 있다고 느꼈어.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7. 작품 속 소재와 그 의미를 연결한 것으로 적절하지 않은 것은?\u003c/strong&gt;\n① 뉴욕제과점 – &amp;#39;나&amp;#39;의 성장과 가족의 추억이 담긴 공간\n② 검은 비닐봉투에 담아 버리는 빵 – 쇠락해 가는 가게와 어머니의 남은 자존심\n③ ◯◯◯, ××× 같은 대기업 빵집 – 세계화에 따른 시대의 변화\n④ 사라진 고향 거리의 상점들 – &amp;#39;나&amp;#39;가 스스로 실향민이나 마찬가지라고 느끼는 까닭\n⑤ 국밥집의 따뜻한 국밥 – 가게를 인수한 사람에 대한 &amp;#39;나&amp;#39;의 분노와 원망\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8. 이 소단원의 &amp;#39;적용·창의&amp;#39; 활동과 관련된 설명으로 적절하지 않은 것은?\u003c/strong&gt;\n① 작품 소개 블로그 글에는 자료의 성격을 고려한 제목을 붙인다.\n② 이미지와 글귀를 조합하여 작품과 관련된 마중그림(섬네일)을 만든다.\n③ 자료의 내용을 잘 요약하는 단어를 활용하여 해시태그를 단다.\n④ 문학의 생활화는 전문 작가가 되어 작품을 발표하는 활동에 한정된다.\n⑤ 작품의 마지막 문단과 관련하여 나에게 &amp;#39;불빛&amp;#39;에 해당하는 것을 떠올려 이야기 책을 만든다.\u003c/p&gt;\n\u003ch3&gt;[B. 우리말 바로 쓰기]\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;9. &amp;lt;보기&amp;gt;에 대한 설명으로 가장 적절한 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 제1항 한글 맞춤법은 표준어를 소리대로 적되, 어법에 맞도록 함을 원칙으로 한다.\n저 &amp;lt;u&amp;gt;거위&amp;lt;/u&amp;gt;도 벽을 넘어 하늘을 날을 거라고 / 달팽이도 &amp;lt;u&amp;gt;넓고&amp;lt;/u&amp;gt; 거친 &amp;lt;u&amp;gt;바다&amp;lt;/u&amp;gt; 끝에 꿈을 둔다고\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① &amp;#39;구름&amp;#39;과 &amp;#39;얼음&amp;#39;은 모두 소리대로 적은 예이다.\n② &amp;#39;넓고&amp;#39;를 &amp;#39;널꼬&amp;#39;로 적지 않는 것은 어간의 형태를 고정하여 뜻을 쉽게 파악하게 하기 위해서이다.\n③ &amp;#39;설거지&amp;#39;는 어간의 원형을 밝혀 적은 예이다.\n④ &amp;#39;젊다&amp;#39;는 발음대로 적은 예이므로 &amp;#39;소리대로&amp;#39;의 원칙에 해당한다.\n⑤ &amp;#39;어법에 맞도록&amp;#39;은 표음 문자인 한글의 특성을 고려하여 발음에 따라 적는다는 의미이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10. &amp;lt;보기&amp;gt;의 규정에 따라 괄호 안의 표기를 바르게 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 제5항 한 단어 안에서 뚜렷한 까닭 없이 나는 된소리는 다음 음절의 첫소리를 된소리로 적는다. …… 다만, &amp;#39;ㄱ, ㅂ&amp;#39; 받침 뒤에서 나는 된소리는 같은 음절이나 비슷한 음절이 겹쳐 나는 경우가 아니면 된소리로 적지 아니한다.\n• 앞머리를 (싹둑/싹뚝) 자른 아이가 (함박/함빡) 웃고 있다.\n• 인기 메뉴는 (깍두기/깍뚜기) 볶음밥이다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 싹둑 – 함빡 – 깍두기\n② 싹뚝 – 함빡 – 깍두기\n③ 싹둑 – 함박 – 깍뚜기\n④ 싹뚝 – 함박 – 깍두기\n⑤ 싹둑 – 함빡 – 깍뚜기\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11. &amp;lt;보기&amp;gt;의 밑줄 친 ㉠~㉤에 대한 설명으로 적절하지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 수해 복구에 ㉠&amp;lt;u&amp;gt;베풂&amp;lt;/u&amp;gt;의 손길이 이어졌다. 강풍에 나무가 ㉡&amp;lt;u&amp;gt;쓰러지면서&amp;lt;/u&amp;gt; 정전이 되었지만, 기부하는 사람들이 ㉢&amp;lt;u&amp;gt;늘어나고&amp;lt;/u&amp;gt; 있다. 도움의 손길 덕분에 희망이 다시 ㉣&amp;lt;u&amp;gt;드러났다&amp;lt;/u&amp;gt;. 처음 온 봉사자들도 ㉤&amp;lt;u&amp;gt;낯섦&amp;lt;/u&amp;gt;을 이겨 냈다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① ㉠은 어간 &amp;#39;베풀-&amp;#39;에 명사형 어미 &amp;#39;-ㅁ&amp;#39;이 결합한 것이다.\n② ㉡은 앞말 &amp;#39;쓸다&amp;#39;의 본뜻에서 멀어졌으므로 소리 나는 대로 적었다.\n③ ㉢은 앞말 &amp;#39;늘다&amp;#39;의 뜻이 유지되므로 원형을 밝혀 적었다.\n④ ㉣은 &amp;#39;들다&amp;#39;의 본뜻이 유지되므로 &amp;#39;들어났다&amp;#39;로 고쳐 써야 한다.\n⑤ ㉤은 어간이 &amp;#39;ㄹ&amp;#39; 받침으로 끝나므로 &amp;#39;-ㅁ&amp;#39;을 붙여 &amp;#39;낯섦&amp;#39;으로 적었다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12. &amp;lt;보기&amp;gt;에서 맞춤법에 맞게 표기한 것만을 있는 대로 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; ㄱ. 그는 &amp;lt;u&amp;gt;우스개&amp;lt;/u&amp;gt; 이야기를 잘한다. ㄴ. 친구들을 &amp;lt;u&amp;gt;우슴&amp;lt;/u&amp;gt; 짓게 한다. ㄷ. 내가 만든 &amp;lt;u&amp;gt;목걸이&amp;lt;/u&amp;gt;가 조잡하다. ㄹ. &amp;lt;u&amp;gt;참아&amp;lt;/u&amp;gt; 친구에게 주지 못했다. ㅁ. 의자 &amp;lt;u&amp;gt;높이&amp;lt;/u&amp;gt;를 조절한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① ㄱ, ㄴ ② ㄴ, ㄹ ③ ㄱ, ㄷ, ㅁ ④ ㄴ, ㄷ, ㄹ ⑤ ㄷ, ㄹ, ㅁ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;13. 한글 맞춤법의 띄어쓰기 규정에 맞게 쓴 문장은?\u003c/strong&gt;\n① 숙제 도와줄 사람은 너 밖에 없어.\n② 오늘만 이라도 너 혼자서 해 봐.\n③ 도로 이용시 참고하시기 바랍니다.\n④ 네가 꿈꾸는대로 모두 이루어질 거야.\n⑤ 나무 한 그루는 연간 약 삼십오 그램의 미세먼지를 흡수한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;14. &amp;lt;보기&amp;gt;의 도식을 적용한 결과로 적절하지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; [사이시옷 표기 조건]\n① 두 명사가 결합한 합성어에서 하나 이상이 고유어인가? → ② 앞 단어가 받침 없이 모음으로 끝나는가? → ③ 뒷말 첫소리가 된소리가 나거나, &amp;#39;ㄴ&amp;#39; 소리나 &amp;#39;ㄴㄴ&amp;#39; 소리가 덧나는가? → 모두 &amp;#39;예&amp;#39;이면 사이시옷을 적는다.\n(예외: 고유어+외래어에는 적지 않음. 한자어끼리는 곳간, 셋방, 숫자, 찻간, 툇간, 횟수만 적음.)\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① &amp;#39;깨+잎&amp;#39;은 고유어끼리 결합했고 앞말이 모음으로 끝나며 &amp;#39;ㄴㄴ&amp;#39; 소리가 덧나므로 &amp;#39;깻잎&amp;#39;으로 적는다.\n② &amp;#39;돌솥+밥&amp;#39;은 뒷말의 첫소리가 된소리로 나므로 사이시옷을 적어야 한다.\n③ &amp;#39;교차(交叉)+점(點)&amp;#39;은 한자어끼리 결합했고 예외 6개 단어에 해당하지 않으므로 &amp;#39;교차점&amp;#39;으로 적는다.\n④ &amp;#39;최대(最大)+값&amp;#39;은 한자어와 고유어가 결합했고 뒷말이 된소리로 나므로 &amp;#39;최댓값&amp;#39;으로 적는다.\n⑤ &amp;#39;피자+집&amp;#39;은 외래어와 고유어가 결합했으므로 사이시옷을 적지 않는다.\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;번호\u003c/th&gt;\n\u003cth&gt;1\u003c/th&gt;\n\u003cth&gt;2\u003c/th&gt;\n\u003cth&gt;3\u003c/th&gt;\n\u003cth&gt;4\u003c/th&gt;\n\u003cth&gt;5\u003c/th&gt;\n\u003cth&gt;6\u003c/th&gt;\n\u003cth&gt;7\u003c/th&gt;\n\u003cth&gt;8\u003c/th&gt;\n\u003cth&gt;9\u003c/th&gt;\n\u003cth&gt;10\u003c/th&gt;\n\u003cth&gt;11\u003c/th&gt;\n\u003cth&gt;12\u003c/th&gt;\n\u003cth&gt;13\u003c/th&gt;\n\u003cth&gt;14\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;정답\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003col&gt;\n\u003cli&gt;\u003cstrong&gt;⑤\u003c/strong&gt; — 이 작품은 &amp;#39;나&amp;#39;가 서술자인 1인칭 시점으로, 자신의 과거를 회상한다. 작품 밖 서술자가 여러 인물의 내면을 전달하지 않는다. ①~④는 소단원 정리의 &amp;#39;작품의 특징&amp;#39;과 본문(월남 파병, 한일 협정, 세계화 언급)에서 확인된다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;③\u003c/strong&gt; — ㄴ(누나 1965년생, 개업 초창기) → ㄱ(1994년 여름방학) → ㄷ(&amp;#39;나&amp;#39;가 대학을 졸업한 해에 팔림, 1995년 8월 폐업) → ㄹ(어느 명절에 국밥집 방문).\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — 대기업 빵집이 생긴 뒤에도 뉴욕제과점은 &amp;quot;새롭게 바뀔 만한 능력이 없었기 때문에&amp;quot; 1980년대풍으로 자리를 지켰다. 적극적으로 경쟁에 나서지 않았다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;④\u003c/strong&gt; — &amp;#39;나&amp;#39;는 두려움 속에서 &amp;quot;내 안에 간직한 불빛들&amp;quot;을 꺼내 보고, 그 중심에 뉴욕제과점이 있음을 깨닫는다. 소단원 정리: &amp;quot;불빛과도 같은 소중한 추억&amp;quot;.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;①\u003c/strong&gt; — (가)는 아는 사람이 죽고 거리가 바뀌고 소중한 것들이 떠날 것이라는 두려움이다. 안도감이 아니다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;③\u003c/strong&gt; — 주체적 감상은 자신의 경험·지식·가치관이 반영된 &amp;#39;자신만의 관점&amp;#39;과 &amp;#39;타당한 근거&amp;#39;가 필요하다. 남의 평을 자기 생각 없이 그대로 옮긴 것은 주체적 감상이 아니다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;⑤\u003c/strong&gt; — &amp;#39;나&amp;#39;는 가게가 팔렸을 때 &amp;quot;잘됐다고 말했다&amp;quot;. 국밥은 따뜻했다고만 서술되며, 인수한 사람에 대한 분노나 원망은 나타나지 않는다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;④\u003c/strong&gt; — 문학의 생활화는 문학 활동이 생활의 한 부분으로 자리 잡는 것이다. 해석·평가를 설득력 있게 표현하기, 창작·재창작하기 등 누구나 할 수 있는 활동을 포함한다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — ① 얼음은 &amp;#39;얼-+-음&amp;#39;으로 원형을 밝혔다. ③ 설거지는 소리대로 적었다. ④ 젊다는 [점따]로 소리 나지만 원형을 밝혀 적었다. ⑤ 이것은 &amp;#39;소리대로&amp;#39;에 대한 설명이다. &amp;#39;어법에 맞도록&amp;#39;은 형태소의 원형을 밝혀 적는 것이다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;①\u003c/strong&gt; — 싹둑, 깍두기는 &amp;#39;ㄱ&amp;#39; 받침 뒤의 된소리이므로 된소리로 적지 않는다. 함빡은 &amp;#39;ㅁ&amp;#39; 받침 뒤에서 까닭 없이 나는 된소리이므로 소리대로 적는다(소단원 정리 예: 듬뿍, 함빡 / 깍두기, 접시, 싹둑).\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;④\u003c/strong&gt; — &amp;#39;드러나다&amp;#39;는 가려진 것이 보이게 된다는 뜻이다. 앞말 &amp;#39;들다&amp;#39;의 본뜻에서 멀어졌으므로 소리대로 &amp;#39;드러났다&amp;#39;로 적는 것이 맞다. &amp;#39;들어내다&amp;#39;는 물건을 들어서 옮긴다는 뜻이다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;③\u003c/strong&gt; — ㄴ &amp;#39;웃음&amp;#39;은 &amp;#39;-음&amp;#39;이 붙어 원형을 밝힌다. ㄹ &amp;#39;차마&amp;#39;는 &amp;#39;-이, -음&amp;#39; 이외의 모음 접미사가 결합해 원형을 밝히지 않는다. ㄱ 우스개, ㄷ 목걸이, ㅁ 높이는 바르다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;⑤\u003c/strong&gt; — ① 너밖에(조사) ② 오늘만이라도(조사 연속) ③ 이용 시(의존 명사) ④ 꿈꾸는 대로(의존 명사). ⑤ 단위 명사 &amp;#39;그루&amp;#39;, &amp;#39;그램&amp;#39;을 띄어 썼으므로 바르다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — &amp;#39;돌솥&amp;#39;은 받침(ㅌ)으로 끝나므로 &amp;#39;앞 단어가 받침 없이 모음으로 끝나는가?&amp;#39;에서 &amp;#39;아니요&amp;#39;이다. 따라서 사이시옷을 적지 않고 &amp;#39;돌솥밥&amp;#39;으로 쓴다.\u003c/li&gt;\n\u003c/ol&gt;\n&quot;}]},{&quot;id&quot;:&quot;korean-chunhyang&quot;,&quot;subject&quot;:&quot;국어&quot;,&quot;title&quot;:&quot;② 춘향전&quot;,&quot;file&quot;:&quot;국어_정리_2_춘향전.md&quot;,&quot;range&quot;:&quot;교과서 126~141쪽 / 수록 부분: 절정~결말&quot;,&quot;flow&quot;:[[&quot;발단&quot;,&quot;춘향 · 몽룡의 만남&quot;,&quot;광한루 / 신분을 넘는 사랑&quot;],[&quot;전개&quot;,&quot;사랑과 이별&quot;,&quot;몽룡이 한양으로 떠남&quot;],[&quot;위기&quot;,&quot;변학도의 수청 강요&quot;,&quot;춘향의 거부 → 투옥&quot;],[&quot;절정&quot;,&quot;암행어사 출두&quot;,&quot;몽룡의 한시 · 지배층 풍자 / 변학도 봉고파직&quot;],[&quot;결말&quot;,&quot;재회 · 행복한 결말&quot;,&quot;춘향의 정렬부인 봉작 / 백년동락&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;인물의 관계와 역할&quot;,&quot;head&quot;:[&quot;관계&quot;,&quot;작품에서의 역할&quot;],&quot;rows&quot;:[[&quot;춘향 ↔ 이몽룡&quot;,&quot;사랑과 신뢰 / 신분 제약 극복&quot;],[&quot;춘향 ↔ 변학도&quot;,&quot;수청 강요와 거부 / 권력에 대한 항거&quot;],[&quot;이몽룡 → 변학도&quot;,&quot;암행어사의 심판 / 부패한 지배층 비판&quot;],[&quot;판소리 → 소설&quot;,&quot;춘향가의 소설화 / 해학 · 장면 극대화 · 서술자 개입&quot;]]},&quot;note&quot;:&quot;전체 구성과 교과서 수록 장면을 구분. 한시·언어유희·주요 구절은 아래 정리 노트에 수록.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;천재교육(김수학) 공통국어2 3단원 &amp;#39;우리 문학의 어제와 오늘&amp;#39;. 이 파일의 내용은 모두 교과서 본문·날개 설명·학습 활동·소단원 정리에 근거함. 교과서에 직접 나오지 않는 풀이는 &amp;#39;(풀이)&amp;#39;나 &amp;#39;(교과서 확인 필요)&amp;#39;로 표시함.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;학습 목표\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;한국 문학사의 흐름을 고려하여 고전 소설 작품을 수용할 수 있다.\u003c/li&gt;\n\u003cli&gt;주체적인 관점에서 작품을 감상하며 문학을 생활화하는 태도를 지닌다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 작품 한눈에 보기&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;항목\u003c/th&gt;\n\u003cth&gt;내용\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;작가\u003c/td&gt;\n\u003ctd&gt;작자 미상 (송성욱 풀어 옮김)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;갈래\u003c/td&gt;\n\u003ctd&gt;고전 소설, \u003cstrong&gt;판소리계 소설\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;성격\u003c/td&gt;\n\u003ctd&gt;해학적·풍자적 (교과서: 언어유희를 사용한 해학적 표현, 양반·지배층 풍자)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;배경\u003c/td&gt;\n\u003ctd&gt;시간: 조선 \u003cstrong&gt;숙종 즉위 초\u003c/strong&gt; / 공간: 전라도 \u003cstrong&gt;남원\u003c/strong&gt; (광한루, 관아, 옥, 객사)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;주제\u003c/td&gt;\n\u003ctd&gt;주제는 어떤 사회상에 주목하느냐에 따라 다양하게 파악 가능 ① 신분을 뛰어넘는 지고지순한 \u003cstrong&gt;사랑\u003c/strong&gt; ② 부패한 지배 계층에 대한 항거 ③ 신분 제약을 벗어나기 위한 인간의 의지\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;형성 과정\u003c/td&gt;\n\u003ctd&gt;판소리 **&amp;lt;춘향가&amp;gt;**가 소설로 정착된 판소리계 소설\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;특징\u003c/td&gt;\n\u003ctd&gt;서술자 개입 / 상투적 표현·한자어 / 장면의 극대화 / 언어유희를 사용한 해학적 표현 / 조선 후기 사회상 반영\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;가치·의의\u003c/td&gt;\n\u003ctd&gt;부패한 사회와 지배 계층인 양반에 대한 비판 의식을 드러냄 / 사회·문화적 맥락, 독자 맥락 등에 따라 다양하게 해석 가능 / 오늘날에 맞게 각색한 작품이 꾸준히 창작·향유됨\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;교과서 수록 이본\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;&amp;lt;열녀춘향수절가(완판 84장본)&amp;gt;\u003c/strong&gt; 에서\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수록 부분\u003c/td&gt;\n\u003ctd&gt;변학도의 생일잔치 → 암행어사 출두 → 춘향과 재회 → 결말(정렬부인, 백년동락)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;판소리계 소설이란? (교과서 날개)\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;연희에서 부르던 \u003cstrong&gt;판소리의 창을 산문화하여 기록한 서사 문학\u003c/strong&gt;.\u003c/li&gt;\n\u003cli&gt;판소리에서 유래했기 때문에 문체와 수사적 특징, 인물형과 세계관 등이 판소리와 비슷하다.\u003c/li&gt;\n\u003cli&gt;대표작: &amp;lt;춘향전&amp;gt;, &amp;lt;흥부전&amp;gt;, &amp;lt;심청전&amp;gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;문학사적 맥락 (소단원 도입, 126쪽)\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;서사 문학은 아득한 옛날부터 \u003cstrong&gt;설화\u003c/strong&gt; 같은 \u003cstrong&gt;구비 문학\u003c/strong&gt;으로 향유됨 → \u003cstrong&gt;한자가 도입\u003c/strong&gt;되면서 문자로 기록됨 → \u003cstrong&gt;조선 시대\u003c/strong&gt;에 본격적인 소설 시대가 열려 \u003cstrong&gt;한문 소설과 한글 소설\u003c/strong&gt;이 많이 창작됨.\u003c/li&gt;\n\u003cli&gt;생각 깨우기 예시: 설화 &amp;lt;견우직녀&amp;gt;(칠월 칠석 오작교 재회), 고전 소설 &amp;lt;운영전&amp;gt;(궁녀 운영과 김 진사).\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 줄거리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;앞부분 줄거리 (교과서 제시)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;숙종 즉위 초, 남원 부사의 자제 \u003cstrong&gt;이몽룡\u003c/strong&gt;이 단옷날 \u003cstrong&gt;광한루\u003c/strong&gt;에 오름.\u003c/li&gt;\n\u003cli&gt;기생 \u003cstrong&gt;월매\u003c/strong&gt;의 딸이자 절세미인인 \u003cstrong&gt;춘향\u003c/strong&gt;이 그네를 타고 있었음 → 둘은 첫눈에 반해 그날로 \u003cstrong&gt;백년가약\u003c/strong&gt;을 맺음.\u003c/li&gt;\n\u003cli&gt;몽룡의 부친이 한양으로 가면서 둘은 헤어지고 후일을 기약함.\u003c/li&gt;\n\u003cli&gt;신임 부사 \u003cstrong&gt;변학도\u003c/strong&gt;가 춘향에게 \u003cstrong&gt;수청\u003c/strong&gt;을 강요 → 춘향은 거부하고 \u003cstrong&gt;옥에 갇힘\u003c/strong&gt;.\u003c/li&gt;\n\u003cli&gt;몽룡은 \u003cstrong&gt;암행어사\u003c/strong&gt;가 되어 남원에 오는 길에 변학도의 가혹한 정치와 춘향의 투옥 사실을 알게 됨.\u003c/li&gt;\n\u003cli&gt;몽룡은 신분을 속이고 변학도의 생일잔치에 참석함.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;교과서 수록 부분 (장면 순서)\u003c/h3&gt;\n\u003col&gt;\n\u003cli&gt;\u003cstrong&gt;생일잔치\u003c/strong&gt;: 운봉 영장, 구례·곡성·순창·옥과·진안·장수 원님이 모여듦. 변학도가 다과·소·악공·천막을 준비시키고 잡인을 금함. 풍류 소리와 기생들의 춤에 어사의 마음이 심란함.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;걸인 박대\u003c/strong&gt;: 어사또가 술과 안주를 청하자 사령이 등을 밀쳐 냄. 운봉 영장이 &amp;quot;양반의 후예인 듯하니 말석에 앉히자&amp;quot;고 청하고, 변학도는 &amp;quot;운봉의 소견대로 하오마는.&amp;quot; 하며 못마땅해함.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;초라한 상\u003c/strong&gt;: 수령들 앞에는 다과상, 어사또 앞에는 모서리 떨어진 개상판에 닥나무 젓가락, 콩나물, 깍두기, 막걸리 한 사발 → 어사또가 상을 차 던지고 운봉의 갈비를 청함.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;차운(한시 짓기)\u003c/strong&gt;: 운봉이 &amp;#39;높을 고(高)&amp;#39;, &amp;#39;기름 고(膏)&amp;#39;를 운자로 냄 → 어사또가 백성들의 형편과 본관 사또의 정체를 감안하여 한시를 지음 → 변학도는 몰라보고, 운봉은 &amp;#39;아뿔싸! 일이 났다.&amp;#39;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;운봉의 대비\u003c/strong&gt;: 어사또가 떠난 뒤 운봉이 아전들을 불러 돗자리·역마·다담상·죄인·형구·장부·숙직을 단속함. 변학도는 사정도 모르고 &amp;quot;운봉은 어디를 다니시오?&amp;quot; / 운봉 &amp;quot;소피 보고 들어오오.&amp;quot; 변학도는 술주정이 나서 &amp;quot;춘향을 급히 올리라.&amp;quot;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;출두 준비\u003c/strong&gt;: 어사또가 서리·중방과 눈길로 내통, 역졸들이 차려입고 육모 방망이를 쥐고 남원읍에 퍼짐.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;암행어사 출두\u003c/strong&gt;: 역졸이 마패를 들고 &amp;quot;암행어사 출두야.&amp;quot; → 남문·북문·동서문에서 출두 소리. 육방이 넋을 잃고, 아전들은 등채에 맞음.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;수령들의 도망\u003c/strong&gt;: 인궤 잃고 강정 들고, 병부 잃고 송편 들고, 탕건 잃고 용수 쓰고… 변학도는 똥을 싸고 &amp;quot;어 추워라. 문 들어온다 바람 닫아라.&amp;quot; 하며 허둥댐.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;처결\u003c/strong&gt;: 어사또가 객사로 자리를 옮겨 &amp;quot;본관 사또는 \u003cstrong&gt;봉고파직\u003c/strong&gt;하라.&amp;quot; 사대문에 방을 붙이고 옥의 죄수를 올려 죄 없는 자를 풀어 줌.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;춘향 시험\u003c/strong&gt;: 어사또가 정체를 숨긴 채 &amp;quot;내 수청도 거역할까?&amp;quot; → 춘향 &amp;quot;층암절벽 높은 바위가… 어서 바삐 죽여 주오.&amp;quot; 하며 거절하고, 향단에게 서방님을 찾아보라 함.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;재회\u003c/strong&gt;: &amp;quot;얼굴 들어 나를 보라.&amp;quot; → 걸인이던 낭군이 어사또임을 알고 반 웃음 반 울음으로 기뻐함. 춘향 어미(월매)도 들어와 한없이 기뻐함.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;남원 하직\u003c/strong&gt;: 어사또가 춘향 모녀와 향단을 서울로 데려감. 춘향은 부용당·광한루·오작교·영주각과 이별하며 \u003cstrong&gt;일희일비\u003c/strong&gt;.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;결말\u003c/strong&gt;: 어사또는 민정을 살핀 뒤 임금께 보고 → 이조 참의 대사성에 봉해지고 춘향은 \u003cstrong&gt;정렬부인\u003c/strong&gt;에 봉해짐. 몽룡은 이조 판서~영의정까지 지내고 정렬부인과 \u003cstrong&gt;백년동락\u003c/strong&gt;, 삼남삼녀를 두고 일품 관직이 대대로 이어짐.\u003c/li&gt;\n\u003c/ol&gt;\n\u003ch3&gt;전체 줄거리 중 위치 (139~140쪽 구성 단계)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구성 단계\u003c/th&gt;\n\u003cth&gt;&amp;lt;춘향전&amp;gt;의 내용\u003c/th&gt;\n\u003cth&gt;교과서 수록 여부\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;발단\u003c/td&gt;\n\u003ctd&gt;우연한 만남\u003c/td&gt;\n\u003ctd&gt;앞부분 줄거리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;전개\u003c/td&gt;\n\u003ctd&gt;사랑과 이별\u003c/td&gt;\n\u003ctd&gt;앞부분 줄거리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;위기\u003c/td&gt;\n\u003ctd&gt;변학도의 부임\u003c/td&gt;\n\u003ctd&gt;앞부분 줄거리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;절정\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;암행어사 출두\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;수록\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;결말\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;행복한 결말\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;수록\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;→ 교과서 수록 부분 = \u003cstrong&gt;절정(암행어사 출두)~결말\u003c/strong&gt;.\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 등장인물과 인물 관계&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;인물\u003c/th&gt;\n\u003cth&gt;성격·역할\u003c/th&gt;\n\u003cth&gt;근거\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;성춘향\u003c/td&gt;\n\u003ctd&gt;기생 월매의 딸. 정절을 목숨처럼 지키는 \u003cstrong&gt;지조 있고 강인한\u003c/strong&gt; 인물. 권력에 굴하지 않음\u003c/td&gt;\n\u003ctd&gt;수청 거부로 옥에 갇힘, &amp;quot;어서 바삐 죽여 주오&amp;quot;, 정렬부인으로 봉해짐\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;이몽룡(어사또)\u003c/td&gt;\n\u003ctd&gt;암행어사. 백성의 고통을 알고 탐관오리를 \u003cstrong&gt;심판\u003c/strong&gt;하는 인물. 기지·여유가 있음\u003c/td&gt;\n\u003ctd&gt;걸인 행색으로 잠입, 한시로 변학도 비판, 봉고파직, 춘향의 마음을 시험\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;변학도(본관 사또)\u003c/td&gt;\n\u003ctd&gt;남원 부사. 백성을 수탈하는 \u003cstrong&gt;탐관오리\u003c/strong&gt;, 거만하고 어리석고 비겁함\u003c/td&gt;\n\u003ctd&gt;걸인 박대, 한시를 몰라봄, 술주정하며 춘향을 올리라 함, 출두 때 똥을 싸며 허둥댐\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;운봉 영장\u003c/td&gt;\n\u003ctd&gt;눈치 빠르고 사리 판단이 빠른 인물\u003c/td&gt;\n\u003ctd&gt;걸인을 말석에 앉히자 청함, 시를 보고 어사임을 짐작해 미리 대비\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;월매(춘향 어미)\u003c/td&gt;\n\u003ctd&gt;기생. 춘향의 어머니\u003c/td&gt;\n\u003ctd&gt;재회 장면에서 들어와 가없이 즐거워함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;향단\u003c/td&gt;\n\u003ctd&gt;춘향의 곁에 있는 인물\u003c/td&gt;\n\u003ctd&gt;춘향이 &amp;quot;향단아, 서방님 어디 계신가 보아라.&amp;quot; / 서울로 함께 감\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;사령·형리·아전·서리·역졸\u003c/td&gt;\n\u003ctd&gt;관아의 하급 관리들\u003c/td&gt;\n\u003ctd&gt;걸인을 밀쳐 냄 / 춘향의 죄를 아룀 / 출두 때 우왕좌왕\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;※ &amp;#39;방자&amp;#39;는 교과서 수록 부분에 등장하지 않음. 향단과 춘향의 관계(몸종)는 수록 부분에 직접 설명되지 않음(교과서 확인 필요).\u003c/p&gt;\n\u003ch3&gt;인물 관계도 (136쪽 이해 활동)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;춘향 ↔ 이몽룡: \u003cstrong&gt;서로 믿고 사랑함\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;변학도 → 춘향: \u003cstrong&gt;수청을 강요함\u003c/strong&gt; / 춘향 → 변학도: \u003cstrong&gt;수청을 거부함\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;변학도 → 이몽룡: \u003cstrong&gt;거지로 알고 박대함\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;이몽룡 → 변학도: \u003cstrong&gt;암행어사가 되어 심판함\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 표현상 특징과 중요 구절 풀이&quot;,&quot;html&quot;:&quot;\u003ch3&gt;(1) 판소리계 소설의 특징 (137쪽 연결 활동 정답)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구절\u003c/th&gt;\n\u003cth&gt;판소리계 소설의 특징\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;&amp;quot;등을 밀쳐 내니 어찌 아니 명관(名官)인가.&amp;quot;(129쪽 6행)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;서술자가 작품 속 상황에 개입하여 서술함\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;&amp;quot;인궤 잃고 강정 들고, ~ 부서지는 것은 거문고요 깨지는 것은 북과 장고라.&amp;quot;(133쪽 2~4행)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;특정 상황을 장황하게 나열하거나 과장하여 표현함\u003c/strong&gt; (장면의 극대화)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;&amp;quot;어 추워라. 문 들어온다 바람 닫아라. 물 마르다 목 들여라.&amp;quot;(133쪽 6행)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;언어유희를 사용한 해학적 표현이 쓰임\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;&amp;quot;층암절벽 높은 바위가 바람 분들 무너지며, 청송녹죽 푸른 나무가 눈이 온들 변하리까.&amp;quot;(134쪽 11~13행)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;한자어나 상투적 표현이 자주 나타남\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;그 밖에 본문에서 볼 수 있는 특징 (풀이)\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;&amp;quot;저 사령의 거동 보소.&amp;quot;, &amp;quot;서리, 역졸 거동 보소.&amp;quot;, &amp;quot;&amp;#39;마는&amp;#39; 하는 끝말을 내뱉고는 입맛이 사납겠다.&amp;quot; → 판소리 창자가 청중에게 말하듯 서술자가 직접 나서서 말하는 투.\u003c/li&gt;\n\u003cli&gt;한시(양반의 언어)와 &amp;quot;똥을 싸고&amp;quot;, &amp;quot;애고 박 터졌네&amp;quot; 같은 비속한 말(서민의 언어)이 함께 쓰임. (교과서 학습 활동에서 직접 묻지는 않음)\u003c/li&gt;\n\u003cli&gt;역졸의 차림새(&amp;quot;외올망건 공단 모자 새 패랭이 눌러쓰고…&amp;quot;), 춘향의 이별가(&amp;quot;놀고 자던 부용당아, / 너 부디 잘 있거라.&amp;quot;)처럼 운율이 느껴지는 부분이 산문 속에 섞여 있음. (교과서 학습 활동에서 직접 묻지는 않음)\u003c/li&gt;\n\u003cli&gt;&amp;quot;진양조가 높아 가는데&amp;quot; → 판소리 장단(가장 느린 곡조) 용어가 등장함.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;(2) 어사또의 한시 (교과서 번역)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;원문\u003c/th&gt;\n\u003cth&gt;교과서 풀이\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;금준미주(金樽美酒) 천인혈(千人血)이요\u003c/td&gt;\n\u003ctd&gt;금동이의 아름다운 술은 일만 백성의 피요\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;옥반가효(玉盤佳肴) 만성고(萬姓膏)라\u003c/td&gt;\n\u003ctd&gt;옥소반의 아름다운 안주는 일만 백성의 기름이라\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;촉루락시(燭淚落時) 민루락(民淚落)이요\u003c/td&gt;\n\u003ctd&gt;촛불 눈물 떨어질 때 백성 눈물 떨어지고\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;가성고처(歌聲高處) 원성고(怨聲高)라\u003c/td&gt;\n\u003ctd&gt;노랫소리 높은 곳에 원망 소리 높았더라\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;운봉이 낸 운자 &amp;#39;고(膏)&amp;#39;, &amp;#39;고(高)&amp;#39;를 따서 지음(차운).\u003c/li&gt;\n\u003cli&gt;잔치의 화려함(술·안주·촛불·노래) ↔ 백성의 고통(피·기름·눈물·원망)을 \u003cstrong&gt;대구\u003c/strong&gt;로 맞세워 탐관오리의 \u003cstrong&gt;수탈을 비판\u003c/strong&gt;함.\u003c/li&gt;\n\u003cli&gt;&amp;quot;백성들의 형편을 생각하고 본관 사또의 정체를 감안하여&amp;quot; 지은 시 → 운봉은 알아채고, 변학도는 몰라봄(변학도의 무지 풍자).\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;(3) 중요 구절 풀이\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구절\u003c/th&gt;\n\u003cth&gt;뜻·기능\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;어사의 마음이 심란하구나\u003c/td&gt;\n\u003ctd&gt;백성은 고통받는데 수령들은 호화로운 잔치를 벌이고, 춘향은 옥에 갇혀 있기 때문 (날개 질문)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;등을 밀쳐 내니 어찌 아니 명관인가\u003c/td&gt;\n\u003ctd&gt;걸인을 내쫓는 모습을 &amp;#39;훌륭한 관리&amp;#39;라고 \u003cstrong&gt;반어적으로 비꼼\u003c/strong&gt; → 서술자 개입\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;&amp;quot;운봉의 소견대로 하오마는.&amp;quot;\u003c/td&gt;\n\u003ctd&gt;&amp;#39;마는&amp;#39;으로 말끝을 흐려 \u003cstrong&gt;마지못해 허락하는\u003c/strong&gt; 변학도의 못마땅한 태도\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;오냐, 도적질은 내가 하마. 오라는 네가 받아라.\u003c/td&gt;\n\u003ctd&gt;오라 = 죄인을 묶는 붉고 굵은 줄. (풀이) 지금은 내가 얻어먹는 처지지만, 벌(오라)은 결국 네가 받게 될 것이라는 어사또의 속다짐\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;모서리 떨어진 개상판에 ~ 막걸리 한 사발\u003c/td&gt;\n\u003ctd&gt;수령들의 다과상과 대비되는 초라한 상 → 어사또가 통분한 까닭\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;&amp;quot;갈비 한 대 먹고지고.&amp;quot;\u003c/td&gt;\n\u003ctd&gt;-고지고: ~하고 싶다. 걸인 행세를 하며 운봉을 떠보는 말 (풀이)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;아뿔싸! 일이 났다\u003c/td&gt;\n\u003ctd&gt;운봉이 시의 내용을 보고 걸인이 \u003cstrong&gt;암행어사임을 짐작\u003c/strong&gt;함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;&amp;quot;소피 보고 들어오오.&amp;quot;\u003c/td&gt;\n\u003ctd&gt;소피 = 오줌. (풀이) 대비하러 다닌 것을 숨기려고 둘러댄 말\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;문 들어온다 바람 닫아라 / 물 마르다 목 들여라\u003c/td&gt;\n\u003ctd&gt;원래 &amp;#39;바람 들어온다 문 닫아라&amp;#39;, &amp;#39;목 마르다 물 들여라&amp;#39;를 뒤바꿔 말함 → 혼비백산한 변학도를 우스꽝스럽게 그린 \u003cstrong&gt;언어유희\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;멍석 구멍 새앙쥐 눈 뜨듯\u003c/td&gt;\n\u003ctd&gt;겁에 질려 두리번거리는 변학도의 모습을 비유 → 풍자\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;봉고파직(封庫罷職)\u003c/td&gt;\n\u003ctd&gt;어사나 감사가 못된 짓을 많이 한 고을의 원을 파면하고 관가의 창고를 봉하여 잠금\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수절이 정절이라\u003c/td&gt;\n\u003ctd&gt;정절을 지키려고 수청을 거부함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;내려오는 관장마다 모두 명관이로구나\u003c/td&gt;\n\u003ctd&gt;어사또까지 수청을 요구하자 \u003cstrong&gt;관리들을 반어적으로 비꼬는\u003c/strong&gt; 춘향의 말\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;층암절벽 ~ 청송녹죽 ~ 변하리까\u003c/td&gt;\n\u003ctd&gt;바위·푸른 소나무·대나무처럼 \u003cstrong&gt;절개가 변하지 않음\u003c/strong&gt;을 설의적으로 강조\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;남원 읍내 가을이 들어 떨어지게 되었더니\u003c/td&gt;\n\u003ctd&gt;(풀이) 가을 낙엽처럼 죽게 되었더니\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;객사에 봄이 들어 이화춘풍(李花春風) 날 살린다\u003c/td&gt;\n\u003ctd&gt;(풀이) 오얏꽃(李, 이 도령의 성 &amp;#39;이&amp;#39;) 봄바람이 나를 살린다 → 이몽룡 덕분에 살아남\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;어찌 다 설화하랴\u003c/td&gt;\n\u003ctd&gt;설화하다 = 자세히 이야기하다. 서술자가 다 이야기할 수 없을 만큼 기쁨이 크다고 말함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;일희일비(一喜一悲)\u003c/td&gt;\n\u003ctd&gt;영귀(지체가 높고 귀함)하게 되어 기쁘나, 고향을 떠나 슬픔\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;봄풀은 해마다 푸르건만 떠난 객은 돌아오지 않는다\u003c/td&gt;\n\u003ctd&gt;고향을 떠나는 자신의 처지를 옛 시에 빗댐\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;정렬부인(貞烈夫人)\u003c/td&gt;\n\u003ctd&gt;정조와 지조를 굳게 지킨 부인에게 내리던 칭호\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;(4) 어휘 풀이 (교과서 날개)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;암행어사: 왕의 특명을 받아 지방 관리의 통치와 백성의 생활을 살피던 벼슬\u003c/li&gt;\n\u003cli&gt;영장: 진영장. 지방 군대를 관리하던 벼슬 / 행수: 군사를 지휘하는 우두머리\u003c/li&gt;\n\u003cli&gt;본관 사또: 자기 고을의 원을 존대하여 부르던 말(여기서는 변학도)\u003c/li&gt;\n\u003cli&gt;삼현육각: 피리 둘, 대금·해금·장구·북 각 하나로 편성되는 풍류\u003c/li&gt;\n\u003cli&gt;남루하다: 옷이 낡아 해지고 차림새가 너저분하다 / 말석: 맨 끝 자리\u003c/li&gt;\n\u003cli&gt;진양조: 판소리·산조 장단의 하나로 곡조가 가장 느림\u003c/li&gt;\n\u003cli&gt;개상판: 개다리소반 / 차운: 남이 지은 시의 운자를 따서 시를 지음 / 필연: 붓과 벼루\u003c/li&gt;\n\u003cli&gt;육방: 이방·호방·예방·병방·형방·공방 / 아전: 관아에 속한 구실아치\u003c/li&gt;\n\u003cli&gt;역마: 각 역참에 갖추어 둔 말 / 서리: 말단 행정 실무 담당 하급 관리 / 중방: 수령의 시중을 들던 사람\u003c/li&gt;\n\u003cli&gt;공형: 호장·이방·수형리 / 등채: 채찍 / 좌수: 향청의 우두머리\u003c/li&gt;\n\u003cli&gt;인궤: 도장을 넣어 두던 상자 / 병부: 군대를 동원하는 표지로 쓰던 나무패 / 탕건: 갓 아래 받쳐 쓰던 관 / 용수: 싸리나 대오리로 만든 둥글고 긴 통\u003c/li&gt;\n\u003cli&gt;관장: 관가의 우두머리 / 위의: 위엄 있고 엄숙한 태도나 차림새 / 민정: 백성들의 사정과 생활 형편 / 입시하다: 대궐에 들어가 임금을 뵙다\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;5. 학습 활동 포인트와 소단원 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;날개 질문 (본문 옆 질문)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;어사또의 마음이 심란한 까닭 → 백성은 고통받는데 수령들은 호화 잔치를 벌이고 있어서\u003c/li&gt;\n\u003cli&gt;본관 사또의 표정과 말투 → &amp;#39;마는&amp;#39;으로 끝을 흐리며 못마땅하고 불쾌한 표정\u003c/li&gt;\n\u003cli&gt;어사또가 상을 보고 통분한 까닭 → 수령들과 달리 자신에게는 초라한 상을 내놓아 차별하므로\u003c/li&gt;\n\u003cli&gt;운봉 영장이 시를 보고 놀란 까닭 → 시가 수령의 수탈을 꾸짖는 내용이라 걸인이 어사임을 눈치챔\u003c/li&gt;\n\u003cli&gt;어사또의 말을 들은 춘향의 심정 → 새 관리마저 수청을 강요하니 기가 막히고 절망스러움\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;이해 — 인물 관계 (3번 항목의 관계도 참고)\u003c/h3&gt;\n\u003ch3&gt;탐구 ① 작품에 반영된 조선 후기 사회상\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;작품의 내용\u003c/th&gt;\n\u003cth&gt;조선 후기의 사회상\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;어사또가 쓴 한시\u003c/td&gt;\n\u003ctd&gt;탐관오리들의 수탈이 심해 백성들이 고통을 받았음 (교과서 예시)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;기생의 딸 춘향과 양반 이몽룡 / 걸인이라고 박대함\u003c/td&gt;\n\u003ctd&gt;신분 제도가 있었음 (예시 답)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;변학도가 수청을 강요하고 거부한 춘향을 옥에 가둠\u003c/td&gt;\n\u003ctd&gt;지방 관청(수령)의 권위가 막강하였음 (예시 답)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;(2) 사회상과 관련지어 주제 말하기 → 사랑 / 부패한 지배층에 대한 항거 / 신분 제약을 벗어나려는 의지\u003c/li&gt;\n\u003cli&gt;(3) 오랜 세월 사랑받은 까닭 → 오늘날 독자도 공감할 수 있는 사랑, 불의에 맞서는 모습, 권선징악의 통쾌함, 해학적 재미 등 (학생 자유 답)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;탐구 ② 판소리계 소설의 특징 → 4번 (1) 표 참고\u003c/h3&gt;\n\u003ch3&gt;탐구 ③ &amp;lt;봉산 탈춤&amp;gt;과 엮어 읽기 (138쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;&amp;lt;봉산 탈춤&amp;gt;: 황해도 봉산 지방에 전승되던 \u003cstrong&gt;가면극\u003c/strong&gt;. &amp;#39;제6과장 양반춤&amp;#39;에서 \u003cstrong&gt;말뚝이가 양반들을 희롱\u003c/strong&gt;함.\u003c/li&gt;\n\u003cli&gt;말뚝이는 양반을 높은 벼슬을 다 지낸 퇴로 재상이 아니라 \u003cstrong&gt;&amp;#39;개잘량&amp;#39;의 &amp;#39;양&amp;#39;, &amp;#39;개다리소반&amp;#39;의 &amp;#39;반&amp;#39;\u003c/strong&gt; 자 쓰는 양반이라고 조롱(언어유희) → 양반들이 &amp;quot;이놈, 뭐야아!&amp;quot; 하자 둘러대고, 양반들은 속아서 춤을 춤. 도령은 형들의 면상을 치며 논다.\u003c/li&gt;\n\u003cli&gt;(1) 양반 묘사: &amp;lt;봉산 탈춤&amp;gt; – 말뚝이에게 조롱당하는 어리석은 모습 / &amp;lt;춘향전&amp;gt; 출두 장면 – 허둥지둥 도망가는 무능하고 비겁한 수령들\u003c/li&gt;\n\u003cli&gt;(2) 그렇게 묘사한 이유: 서민 중심의 향유층이 지배 계층의 위선과 횡포를 웃음으로 비판하고 싶었기 때문\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;풍자\u003c/strong&gt;(날개): 대상에 대한 부정적 인식을 바탕으로 대상을 과장하거나 웃음을 유발하는 방식으로 표현하는 것\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;적용·창의 — 재창작 (139~140쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;예: 드라마 &amp;lt;쾌걸 춘향&amp;gt;(2005) – 춘향과 몽룡을 \u003cstrong&gt;고등학생\u003c/strong&gt;으로 설정. 고전 소설의 \u003cstrong&gt;권선징악 주제 의식과 이야기 구조는 가져오되\u003c/strong&gt;, 상황과 인물의 성격은 오늘날에 맞게 재구성.\u003cul&gt;\n\u003cli&gt;광한루에서 처음 만나 티격태격 말다툼 / 춘향은 불의를 참지 못하고 억척스러운 인물 / 몽룡은 우유부단하고 철없는 인물\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;재구성 방법: 인물 성격을 현대적으로 바꾸기, 중심 갈등을 다르게 설정하기, 주제 바꾸기\u003c/li&gt;\n\u003cli&gt;인물, 사건, 배경, 갈등, 구성, 주제 측면에서 공통점·차이점 비교 → 구성 단계(발단~결말)에 대응하여 새 이야기 구상\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;소단원 정리 빈칸 정답 (141쪽)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;빈칸\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;조선 후기 사회상: &amp;quot;• ( ) 들이 백성을 수탈하였음.&amp;quot;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;탐관오리\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;판소리계 소설 특징: &amp;quot;• ( ) 을/를 사용한 해학적 표현이 쓰임.&amp;quot;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;언어유희\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;주제: &amp;quot;• 신분을 뛰어넘는 지고지순한 ( )&amp;quot;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;사랑\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;가치: &amp;quot;부패한 사회와 지배 계층인 양반에 대한 ( ) 의식을 드러냄.&amp;quot;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;비판\u003c/strong&gt; (원본 변환 시 빈칸이 지워져 있음, 교과서 확인 필요)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;엮어 읽기: &amp;quot;두 작품은 모두 ( )의 표현 방식으로 웃음을 유발하고…&amp;quot;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;풍자\u003c/strong&gt; (말풍선: &amp;quot;두 작품은 모두 당대 현실을 풍자하고 있어.&amp;quot;)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;6. 예상 문제 (14문항)&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;1. 윗글(&amp;lt;춘향전&amp;gt;)에 대한 설명으로 적절하지 않은 것은?\u003c/strong&gt;\n① 판소리 &amp;lt;춘향가&amp;gt;가 소설로 정착된 판소리계 소설이다.\n② 교과서에 실린 부분은 &amp;lt;열녀춘향수절가(완판 84장본)&amp;gt;의 일부이다.\n③ 작가가 분명히 밝혀진 작품으로, 작가 개인의 체험이 반영되어 있다.\n④ 조선 후기의 신분 제도, 수령의 막강한 권위 등 당대 사회상이 반영되어 있다.\n⑤ 사회·문화적 맥락, 독자 맥락 등에 따라 다양하게 해석될 수 있다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2. 교과서 수록 부분의 사건을 일어난 순서대로 바르게 나열한 것은?\u003c/strong&gt;\n(가) 운봉이 아전들을 불러 돗자리, 역마, 형구 등을 단속한다.\n(나) 어사또가 &amp;#39;높을 고&amp;#39;, &amp;#39;기름 고&amp;#39;를 운자로 한시를 짓는다.\n(다) 어사또가 본관 사또를 봉고파직하라고 명한다.\n(라) 어사또가 춘향에게 자신의 수청을 들라고 한다.\n(마) 사령이 걸인 행색의 어사또를 밀쳐 낸다.\n① (마)-(나)-(가)-(다)-(라) ② (마)-(가)-(나)-(다)-(라) ③ (나)-(마)-(가)-(라)-(다)\n④ (마)-(나)-(다)-(가)-(라) ⑤ (가)-(마)-(나)-(다)-(라)\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3. 어사또가 지은 한시에 대한 설명으로 적절하지 않은 것은?\u003c/strong&gt;\n① 운봉 영장이 낸 운자를 따서 지은 시이다.\n② 잔치의 화려함과 백성의 고통을 대응시켜 표현하였다.\n③ &amp;#39;천인혈&amp;#39;, &amp;#39;만성고&amp;#39;는 백성에게서 거두어들인 재물을 의미한다.\n④ &amp;#39;촛불 눈물&amp;#39;은 잔치를 즐기지 못하는 수령들의 슬픔을 드러낸다.\n⑤ 본관 사또의 정체를 감안하여 탐관오리의 수탈을 비판하고 있다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4. 어사또의 한시를 본 운봉 영장과 본관 사또의 반응에 대한 설명으로 가장 적절한 것은?\u003c/strong&gt;\n① 운봉 영장은 시의 뜻을 몰라 본관 사또에게 풀이를 부탁한다.\n② 본관 사또는 시의 내용을 알아채고 춘향을 풀어 주려 한다.\n③ 운봉 영장은 걸인의 정체를 짐작하고 아전들을 불러 미리 대비한다.\n④ 본관 사또는 시를 칭찬하며 걸인에게 좋은 상을 내리도록 명한다.\n⑤ 운봉 영장과 본관 사또 모두 걸인이 암행어사임을 알아챈다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5. &amp;lt;보기&amp;gt;는 본문의 한 구절이다. 이에 대한 이해로 가장 적절한 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 본관 사또 하는 말이, &amp;quot;운봉의 소견대로 하오마는.&amp;quot; / &amp;#39;마는&amp;#39; 하는 끝말을 내뱉고는 입맛이 사납겠다. 어사또 속으로, &amp;#39;오냐, 도적질은 내가 하마. 오라는 네가 받아라.&amp;#39;\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① &amp;#39;마는&amp;#39;이라는 말끝에서 본관 사또의 흔쾌한 태도가 드러난다.\n② &amp;#39;입맛이 사납겠다&amp;#39;는 어사또가 음식을 맛없어하는 모습을 나타낸다.\n③ &amp;#39;오라&amp;#39;는 죄인을 묶는 줄로, 본관 사또가 결국 벌을 받게 될 것임을 암시한다.\n④ 어사또는 운봉 영장에게 자신의 정체를 밝히려 결심하고 있다.\n⑤ 서술자는 사건에 개입하지 않고 인물의 대화만 객관적으로 전달한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6. &amp;lt;보기&amp;gt;를 참고할 때, 본문 구절과 판소리계 소설의 특징을 연결한 것으로 적절하지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 판소리계 소설은 연희에서 부르던 판소리의 창을 산문화하여 기록한 서사 문학으로, 판소리에서 유래했기 때문에 문체와 수사적 특징 등이 판소리와 비슷하다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① &amp;quot;등을 밀쳐 내니 어찌 아니 명관인가.&amp;quot; – 서술자가 작품 속 상황에 개입하여 서술함.\n② &amp;quot;인궤 잃고 강정 들고, 병부 잃고 송편 들고&amp;quot; – 특정 상황을 장황하게 나열하여 표현함.\n③ &amp;quot;문 들어온다 바람 닫아라.&amp;quot; – 언어유희를 사용한 해학적 표현이 쓰임.\n④ &amp;quot;층암절벽 높은 바위가 바람 분들 무너지며&amp;quot; – 한자어나 상투적 표현이 나타남.\n⑤ &amp;quot;저 계집은 무엇인고?&amp;quot; – 특정 장면을 과장하여 극대화함.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7. &amp;quot;어 추워라. 문 들어온다 바람 닫아라. 물 마르다 목 들여라.&amp;quot;에 대한 설명으로 가장 적절한 것은?\u003c/strong&gt;\n① 계절적 배경이 겨울임을 알려 준다.\n② 본관 사또가 침착하게 부하에게 명령하는 모습이다.\n③ 말의 순서를 뒤바꾸어 본관 사또의 혼비백산한 모습을 우스꽝스럽게 드러낸다.\n④ 한자 성어를 활용하여 양반의 위엄을 강조한다.\n⑤ 어사또가 본관 사또를 꾸짖는 말이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8. 암행어사 출두 장면에 대한 설명으로 적절하지 않은 것은?\u003c/strong&gt;\n① &amp;quot;출두야&amp;quot; 소리를 여러 문에서 반복하여 긴박감을 높인다.\n② 수령들이 허둥대며 도망가는 모습을 나열하여 장면을 극대화한다.\n③ &amp;quot;본관 사또가 똥을 싸고&amp;quot;처럼 비속한 표현으로 지배층을 풍자한다.\n④ 아전들이 등채에 맞으며 &amp;quot;애고 박 터졌네.&amp;quot; 하는 부분에서 해학이 드러난다.\n⑤ 수령들의 당당한 모습을 통해 비장하고 엄숙한 분위기를 조성한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9. 어사또가 춘향에게 &amp;quot;내 수청도 거역할까?&amp;quot;라고 말한 장면에 대한 이해로 적절하지 않은 것은?\u003c/strong&gt;\n① 어사또는 정체를 숨긴 채 춘향의 마음을 시험하고 있다.\n② 춘향은 &amp;quot;내려오는 관장마다 모두 명관이로구나.&amp;quot;라며 관리들을 반어적으로 비꼰다.\n③ 춘향은 바위와 푸른 나무에 빗대어 변하지 않는 절개를 드러낸다.\n④ 춘향은 향단에게 서방님을 찾아보라고 하며 몽룡을 여전히 믿고 있다.\n⑤ 춘향은 목숨을 지키기 위해 어사또의 요구를 받아들이려 고민한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10. 구절의 의미를 풀이한 것으로 적절하지 않은 것은?\u003c/strong&gt;\n① &amp;#39;봉고파직하라&amp;#39; – 못된 짓을 한 원을 파면하고 관가의 창고를 봉하여 잠그라.\n② &amp;#39;이화춘풍 날 살린다&amp;#39; – 이 도령(이몽룡) 덕분에 내가 살게 되었다.\n③ &amp;#39;어찌 다 설화하랴&amp;#39; – 옛날이야기처럼 꾸며 낸 말이라 믿을 수 없다.\n④ &amp;#39;일희일비가 아니 되랴&amp;#39; – 귀하게 되어 기쁘지만 고향을 떠나 슬프기도 하다.\n⑤ &amp;#39;말석에 앉히고&amp;#39; – 좌석의 차례에서 맨 끝 자리에 앉히고.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11. 등장인물에 대한 이해로 적절하지 않은 것은?\u003c/strong&gt;\n① 변학도는 걸인 행색의 어사또를 거지로 알고 박대한다.\n② 운봉 영장은 걸인을 말석에 앉혀 술잔이나 먹여 보내자고 청한다.\n③ 춘향은 권력자의 수청 요구를 끝까지 거부한 인물이다.\n④ 월매는 어사또의 정체를 가장 먼저 알아보고 변학도에게 알린다.\n⑤ 이몽룡은 암행어사가 되어 변학도를 심판한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12. &amp;lt;보기&amp;gt;를 참고하여 &amp;lt;춘향전&amp;gt;과 &amp;lt;봉산 탈춤&amp;gt;을 비교한 내용으로 적절하지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 말뚝이: 개잘량이라는 &amp;#39;양&amp;#39; 자에 개다리소반이라는 &amp;#39;반&amp;#39; 자 쓰는 양반이 나오신단 말이오. / 양반들: 야아, 이놈, 뭐야아! / 말뚝이: …이 생원네 삼 형제분이 나오신다고 그리하였소. / 양반들: (합창) 이 생원이라네. (모두 춤을 춘다.)\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① &amp;lt;보기&amp;gt;에서 말뚝이는 언어유희를 사용하여 양반을 조롱하고 있다.\n② &amp;lt;보기&amp;gt;의 양반들은 말뚝이의 둘러댐에 쉽게 넘어가는 어리석은 모습으로 그려진다.\n③ &amp;lt;춘향전&amp;gt;의 출두 장면과 &amp;lt;보기&amp;gt;는 모두 지배층을 풍자하여 웃음을 유발한다.\n④ 두 작품 모두 불합리한 사회에 대한 저항과 같은 향유층의 의식을 드러낸다.\n⑤ 두 작품 모두 양반 계층이 향유하며 양반의 권위를 드높이려 한 작품이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;13. &amp;lt;보기&amp;gt;를 바탕으로 &amp;lt;춘향전&amp;gt;에 반영된 조선 후기 사회상을 추론한 것으로 적절하지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 소설에는 작품이 창작된 당대의 사회·문화적 배경이 반영되어 있다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 어사또의 한시를 통해 탐관오리의 수탈로 백성이 고통받았음을 알 수 있다.\n② 변학도가 수청을 거부한 춘향을 옥에 가둔 것에서 지방 관청의 권위가 막강했음을 알 수 있다.\n③ 기생의 딸 춘향과 양반 몽룡의 사랑에서 신분 제도가 있었음을 짐작할 수 있다.\n④ 암행어사가 지방 관리의 통치를 살핀 것에서 왕이 지방 관리를 감찰했음을 알 수 있다.\n⑤ 걸인도 잔치에서 수령과 똑같은 대접을 받은 것에서 차별 없는 사회였음을 알 수 있다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;14. &amp;lt;보기&amp;gt;에 대한 이해로 적절하지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 드라마 &amp;lt;쾌걸 춘향&amp;gt;(2005)은 춘향과 몽룡을 고등학생들로 설정하여 현대식으로 각색한 작품이다. 고전 소설 &amp;lt;춘향전&amp;gt;의 권선징악 주제 의식과 이야기 구조는 가져오되, 작품 속 상황과 인물들의 성격은 오늘날에 맞게 재구성되었다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 고전 작품이 오늘날에 맞게 각색되어 꾸준히 향유되고 있음을 보여 준다.\n② 인물의 성격을 현대적으로 바꾸어 재창작한 예이다.\n③ 몽룡을 우유부단하고 철없는 인물로 그린 것은 원작과 달라진 점이다.\n④ 악한 자가 벌을 받고 선한 자가 복을 받는 이야기 구조는 원작과 공통된다.\n⑤ 원작의 주제 의식을 버리고 전혀 다른 주제로 바꾸었다는 점이 핵심이다.\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;번호\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003cth&gt;해설\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;&amp;lt;춘향전&amp;gt;은 \u003cstrong&gt;작자 미상\u003c/strong&gt;이다. 판소리 &amp;lt;춘향가&amp;gt;가 소설로 정착된 판소리계 소설이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;걸인 박대(마) → 한시 짓기(나) → 운봉의 대비(가) → 출두 후 봉고파직(다) → 춘향 시험(라).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;3\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;&amp;#39;촛불 눈물 떨어질 때 백성 눈물 떨어지고&amp;#39; → 촛농은 \u003cstrong&gt;백성의 눈물\u003c/strong&gt;과 연결된다. 수령들의 슬픔이 아니다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;운봉은 &amp;#39;아뿔싸! 일이 났다.&amp;#39; 하고 아전들을 불러 단속한다. 본관 사또는 끝까지 몰라보고 술주정하며 춘향을 올리라 한다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;5\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;&amp;#39;오라&amp;#39;는 도둑이나 죄인을 묶던 붉고 굵은 줄 → 벌은 변학도가 받게 된다는 암시. &amp;#39;마는&amp;#39;은 못마땅한 태도, &amp;#39;입맛이 사납겠다&amp;#39;는 서술자의 개입이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;&amp;quot;저 계집은 무엇인고?&amp;quot;는 어사또가 죄수를 묻는 평범한 대사로, 장면의 극대화와 관계없다. ①~④는 교과서 137쪽 연결 활동의 정답이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;7\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;&amp;#39;바람 들어온다 문 닫아라, 목 마르다 물 들여라&amp;#39;를 뒤바꾼 \u003cstrong&gt;언어유희\u003c/strong&gt;. 겁에 질린 변학도를 우스꽝스럽게 그린 해학적 표현이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;수령들은 인궤·병부를 잃고 허둥지둥 도망가는 \u003cstrong&gt;우스꽝스러운\u003c/strong&gt; 모습 → 풍자와 해학. 비장·엄숙과는 거리가 멀다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;9\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;춘향은 &amp;quot;그런 분부 마옵시고 어서 바삐 죽여 주오.&amp;quot;라며 단호히 거절한다. 고민하지 않는다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;교과서 날개: 설화하다 = &amp;#39;자세히 이야기하다.&amp;#39; 춘향 어미의 기쁨을 다 자세히 이야기할 수 없다는 뜻이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;11\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;월매(춘향 어미)는 재회 뒤에 들어와 기뻐할 뿐이다. 어사를 먼저 알아본 인물은 운봉 영장이고, 월매가 변학도에게 알리는 내용은 없다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;12\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;두 작품은 \u003cstrong&gt;양반을 풍자\u003c/strong&gt;하며, 교과서는 향유층의 저항 의식이 드러난다고 설명한다. 양반의 권위를 드높이려 한 작품이 아니다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;13\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;어사또는 개상판에 콩나물·깍두기·막걸리의 초라한 상을 받아 \u003cstrong&gt;차별 대우\u003c/strong&gt;를 받았다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;14\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;&amp;lt;쾌걸 춘향&amp;gt;은 원작의 \u003cstrong&gt;권선징악 주제 의식과 이야기 구조를 가져왔다.\u003c/strong&gt; 바뀐 것은 상황과 인물의 성격이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;}]},{&quot;id&quot;:&quot;korean-poems&quot;,&quot;subject&quot;:&quot;국어&quot;,&quot;title&quot;:&quot;③ 현대 시 네 작품&quot;,&quot;file&quot;:&quot;국어_정리_3_시4편.md&quot;,&quot;range&quot;:&quot;흰 바람벽이 있어 142~151쪽 / 비교 작품 · 수업 자료&quot;,&quot;flow&quot;:[[&quot;백석&quot;,&quot;흰 바람벽이 있어&quot;,&quot;가난 · 외로움 · 그리움 → 운명 수용 · 자기 긍정&quot;],[&quot;윤동주&quot;,&quot;별 헤는 밤&quot;,&quot;그리움 → 부끄러움 → 미래의 희망&quot;],[&quot;김소월&quot;,&quot;접동새&quot;,&quot;설화 속 누나의 한 / 죽어서도 남은 혈육의 정&quot;],[&quot;이용악&quot;,&quot;낡은 집&quot;,&quot;농민 일가의 몰락과 유랑 / 안타까움 · 연민&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;정서와 표현, 작품끼리 비교&quot;,&quot;head&quot;:[&quot;작품&quot;,&quot;중심 소재&quot;,&quot;표현의 단서&quot;],&quot;rows&quot;:[[&quot;흰 바람벽이 있어&quot;,&quot;벽 · 글자들 · 어머니&quot;,&quot;반복 · 열거 · 방언 / 긴 산문적 시행&quot;],[&quot;별 헤는 밤&quot;,&quot;별 · 이름 · 어머니&quot;,&quot;별 하나에 반복 / 경어체&quot;],[&quot;접동새&quot;,&quot;접동새 · 아우래비&quot;,&quot;설화 차용 / 의성어 · 3음보 민요조&quot;],[&quot;낡은 집&quot;,&quot;털보네 · 셋째 아들&quot;,&quot;서사적 구성 / 전해 들은 말투 · 지명&quot;]]},&quot;note&quot;:&quot;원문 기준: 별 헤는 밤은 교과서 일부 수록. 접동새·낡은 집은 일반 해설이므로 수업 프린트·필기와 대조.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;천재교육(김수학) 공통국어2 3단원 「우리 문학의 어제와 오늘」 (3) 흰 바람벽이 있어 (교과서 142~151쪽).\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;&amp;lt;흰 바람벽이 있어&amp;gt;: 교과서 본문·어휘 풀이·날개 설명·학습 활동·소단원 정리에 근거함.\u003c/li&gt;\n\u003cli&gt;&amp;lt;별 헤는 밤&amp;gt;: 교과서에는 \u003cstrong&gt;일부(“별 하나에 추억과 ~ 시인의 이름을 불러 봅니다”)만\u003c/strong&gt; 비교 작품으로 실림. 그 밖의 내용은 **[일반 해설]**로 표시함.\u003c/li&gt;\n\u003cli&gt;&amp;lt;접동새&amp;gt;, &amp;lt;낡은 집&amp;gt;: \u003cstrong&gt;교과서에 없는 작품\u003c/strong&gt; → 일반적으로 알려진 해설로 정리함. 수업 프린트·필기와 반드시 대조할 것.\u003c/li&gt;\n\u003cli&gt;교과서 빈칸(정리 퀴즈 등)은 정답이 인쇄되어 있지 않아 \u003cstrong&gt;본문 문맥으로 채운 답\u003c/strong&gt;임. 선생님이 말한 답과 확인할 것.\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 네 작품 한눈에 비교&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;흰 바람벽이 있어\u003c/th&gt;\n\u003cth&gt;별 헤는 밤\u003c/th&gt;\n\u003cth&gt;접동새\u003c/th&gt;\n\u003cth&gt;낡은 집\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;작가\u003c/td&gt;\n\u003ctd&gt;백석(1912~1996)\u003c/td&gt;\n\u003ctd&gt;윤동주\u003c/td&gt;\n\u003ctd&gt;김소월\u003c/td&gt;\n\u003ctd&gt;이용악\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;발표 시기\u003c/td&gt;\n\u003ctd&gt;1941. 4. 《문장》 3권 4호(폐간호)\u003c/td&gt;\n\u003ctd&gt;1941. 11. 창작(교과서) / 사후 유고 시집 《하늘과 바람과 별과 시》(1948)에 실림 [일반 해설]\u003c/td&gt;\n\u003ctd&gt;1923년 발표, 시집 《진달래꽃》(1925)에 실림 [일반 해설]\u003c/td&gt;\n\u003ctd&gt;1938년 시집 《낡은 집》 표제작 [일반 해설]\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;화자·상황\u003c/td&gt;\n\u003ctd&gt;좁다란 방에서 흰 바람벽을 바라보는 가난하고 외로운 &amp;#39;나&amp;#39;\u003c/td&gt;\n\u003ctd&gt;가을밤 하늘의 별을 세며 추억·어머니를 떠올리는 &amp;#39;나&amp;#39;\u003c/td&gt;\n\u003ctd&gt;누나를 잃은 동생(오랩동생)\u003c/td&gt;\n\u003ctd&gt;털보네 셋째 아들의 어린 시절 동무 &amp;#39;나&amp;#39;(관찰·전달자)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;정서\u003c/td&gt;\n\u003ctd&gt;쓸쓸함, 외로움, 그리움 → 운명 수용, 자기 긍정\u003c/td&gt;\n\u003ctd&gt;그리움, 쓸쓸함 → 부끄러움 → 희망\u003c/td&gt;\n\u003ctd&gt;슬픔, 한(恨)\u003c/td&gt;\n\u003ctd&gt;안타까움, 연민, 비극성\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;주제\u003c/td&gt;\n\u003ctd&gt;가난하고 외롭지만 고결한 삶에 대한 성찰과 긍정\u003c/td&gt;\n\u003ctd&gt;추억과 그리움, 자기 성찰과 미래에 대한 희망\u003c/td&gt;\n\u003ctd&gt;죽어서도 동생들을 잊지 못하는 누나의 한, 혈육의 정\u003c/td&gt;\n\u003ctd&gt;일제 강점기 궁핍한 농민 일가의 몰락과 유랑의 비애\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;핵심 시어·소재\u003c/td&gt;\n\u003ctd&gt;흰 바람벽, 글자들, 어머니, 사랑하는 사람, 초생달·바구지꽃·짝새·당나귀\u003c/td&gt;\n\u003ctd&gt;별, 어머니, 이름, 언덕, 벌레, 겨울·봄\u003c/td&gt;\n\u003ctd&gt;접동새, 아우래비, 의붓어미, 진두강, 야삼경\u003c/td&gt;\n\u003ctd&gt;낡은 집, 털보네, 셋째 아들, 오랑캐령·아라사\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;주요 표현법\u003c/td&gt;\n\u003ctd&gt;어휘·문장 구조 반복(리듬감), 영사막 같은 벽, 의인법, 열거, 평북 방언, 긴 산문적 시행\u003c/td&gt;\n\u003ctd&gt;&amp;#39;별 하나에 ~과&amp;#39; 반복·열거, 경어체(-ㅂ니다), 산문적 문장\u003c/td&gt;\n\u003ctd&gt;설화 차용, 의성어(접동), 3음보 민요조, 반복, 경어체\u003c/td&gt;\n\u003ctd&gt;서사적(이야기) 구성, 전해 들은 말투, 구체적 지명·방언\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 작품별 핵심 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;2-1. 백석, &amp;lt;흰 바람벽이 있어&amp;gt; ★시험 비중 최대 (교과서 142~151쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;학습 목표(교과서)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;한국 문학사의 흐름을 고려하여 현대 시 작품을 수용할 수 있다.\u003c/li&gt;\n\u003cli&gt;주체적인 관점에서 작품을 감상하며 문학을 생활화하는 태도를 지닌다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;도입(생각 깨우기, 142쪽)\u003c/strong&gt; — 대중가요는 그 시대 사람들의 삶과 정서를 노래한다. 현대 시도 \u003cstrong&gt;고전 시가의 내용과 형식을 계승하거나 변용\u003c/strong&gt;하면서 오늘날 사람들의 삶과 정서를 표현한다. 이 소단원에서는 \u003cstrong&gt;일제 강점기에 창작된 현대 시\u003c/strong&gt;를 \u003cstrong&gt;고전 시가와 다른 현대 시의 특징\u003c/strong&gt;을 파악하며 감상하고, \u003cstrong&gt;당시의 사회상, 다른 작품과의 연관성\u003c/strong&gt;을 고려해 \u003cstrong&gt;문학사적 가치\u003c/strong&gt;를 생각한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;작가(날개)\u003c/strong&gt; — 백석(1912~1996). \u003cstrong&gt;평안도 방언을 의식적으로 사용\u003c/strong&gt;하여 고향 사람들의 소박한 삶과 아름다운 자연을 그린 시를 많이 씀. 주요 작품: &amp;lt;여우난곬족&amp;gt;, &amp;lt;고향&amp;gt;, &amp;lt;국수&amp;gt;, &amp;lt;남신의주 유동 박시봉방&amp;gt;.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;작품 개관\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;갈래: 현대 시, 자유시, 서정시\u003c/li&gt;\n\u003cli&gt;성격: 성찰적, 고백적, 독백적\u003c/li&gt;\n\u003cli&gt;제재: 흰 바람벽 / 주제: 가난하고 외롭지만 높고 고결한 삶에 대한 성찰과 긍정\u003c/li&gt;\n\u003cli&gt;교과서 한 줄 정리: &amp;quot;화자가 &amp;#39;흰 바람벽&amp;#39;을 바라보며 자신의 삶을 \u003cstrong&gt;성찰\u003c/strong&gt;한 현대 시&amp;quot;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;시상 전개 (교과서 학습 활동의 행 구분 그대로)\u003c/strong&gt; — 원문은 교과서 143~145쪽 참고\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;행\u003c/th&gt;\n\u003cth&gt;화자가 보거나 떠올린 대상\u003c/th&gt;\n\u003cth&gt;핵심 구절\u003c/th&gt;\n\u003cth&gt;정서·의미\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1~6행\u003c/td&gt;\n\u003ctd&gt;흰 바람벽에 비친 쓸쓸한 것들: \u003cstrong&gt;희미한 십오 촉 전등의 불빛, 때 글은 낡은 무명 셔츠의 그림자, 감주를 먹고 싶은 외로운 생각\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;&amp;quot;어쩐지 쓸쓸한 것만이 오고 간다&amp;quot;, &amp;quot;지치운 불빛&amp;quot;, &amp;quot;가지가지 외로운 생각이 헤매인다&amp;quot;\u003c/td&gt;\n\u003ctd&gt;가난하고 외로운 현재 처지\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;7~16행\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;가난한 늙은 어머니\u003c/strong&gt;(추운 날 차디찬 물에 무와 배추를 씻음), \u003cstrong&gt;사랑하는 어여쁜 사람\u003c/strong&gt;(먼 앞대 개포가 집에서 지아비·어린것과 대굿국 저녁을 먹음)\u003c/td&gt;\n\u003ctd&gt;&amp;quot;그런데 이것은 또 어인 일인가&amp;quot;, &amp;quot;내 가난한 늙은 어머니가 있다&amp;quot;, &amp;quot;벌써 어린것도 생겨서&amp;quot;\u003c/td&gt;\n\u003ctd&gt;어머니에 대한 연민·그리움, 떠나간 연인에 대한 그리움과 상실감\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;17~23행\u003c/td&gt;\n\u003ctd&gt;화자의 쓸쓸한 얼굴을 쳐다보며 지나가는 \u003cstrong&gt;첫 번째 글자들\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;&amp;quot;― 나는 이 세상에서 가난하고 외롭고 높고 쓸쓸하니 살아가도록 태어났다&amp;quot;, &amp;quot;내 가슴은 … 사랑으로 슬픔으로 가득 찬다&amp;quot;\u003c/td&gt;\n\u003ctd&gt;자신의 삶을 \u003cstrong&gt;운명으로 여기고 받아들임\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;24~29행\u003c/td&gt;\n\u003ctd&gt;나를 위로하는 듯, 울력하는 듯 지나가는 \u003cstrong&gt;두 번째 글자들\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;&amp;quot;― 하늘이 이 세상을 내일 적에 그가 가장 귀해하고 사랑하는 것들은 모두 / 가난하고 외롭고 높고 쓸쓸하니…&amp;quot;, &amp;quot;초생달과 바구지꽃과 짝새와 당나귀가 그러하듯이&amp;quot;, &amp;quot;&amp;#39;프랑시스 잠&amp;#39;과 도연명과 &amp;#39;라이너 마리아 릴케&amp;#39;가 그러하듯이&amp;quot;\u003c/td&gt;\n\u003ctd&gt;자신의 운명을 \u003cstrong&gt;하늘의 사랑으로 여기며 긍정적으로 수용\u003c/strong&gt;, 자기 위안과 자부심\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;→ 흐름 요약: \u003cstrong&gt;쓸쓸한 현재(방) → 그리운 사람들(어머니·연인) → 운명 인식 → 운명의 긍정적 수용\u003c/strong&gt;\n→ 정서 변화: 외로움·쓸쓸함 → 그리움·상실감 → 체념 섞인 수용 → 위안·자긍심\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;어휘 풀이(교과서 날개)\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;어휘\u003c/th&gt;\n\u003cth&gt;뜻\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;바람벽\u003c/td&gt;\n\u003ctd&gt;방이나 칸살의 옆을 둘러막은 둘레의 벽\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;촉\u003c/td&gt;\n\u003ctd&gt;예전에 빛의 세기를 나타내던 단위 (십오 촉 = 아주 희미한 전등)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;앞대\u003c/td&gt;\n\u003ctd&gt;어떤 지방에서 그 남쪽의 지방을 이르는 말\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;개포가\u003c/td&gt;\n\u003ctd&gt;&amp;#39;갯가&amp;#39;의 평북 방언. 바닷물이 드나드는 곳의 물가\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;이즈막\u003c/td&gt;\n\u003ctd&gt;얼마 전부터 이제까지에 이르는 가까운 때\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;호젓하다\u003c/td&gt;\n\u003ctd&gt;매우 홀가분하여 쓸쓸하고 외롭다\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;울력하다\u003c/td&gt;\n\u003ctd&gt;원래 &amp;#39;여러 사람의 힘을 합하는 것&amp;#39;. 여기서는 \u003cstrong&gt;나에게 힘을 실어 준다\u003c/strong&gt;는 뜻\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;[일반 해설 — 교과서 날개에 없는 풀이] 지치운: 지친 / 때 글은: 때가 묻어 찌든 / 감주: 식혜·단술 / 무이: 무 / 대굿국: 대구로 끓인 국 / 바구지꽃: 박꽃 / 짝새: 뱁새 / 눈질: 눈짓 / 내일 적에: 내놓을(만들) 적에\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;시어·구절 의미\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;흰 바람벽\u003c/strong&gt;: 화자의 생각과 감정을 투영하는 \u003cstrong&gt;영사막\u003c/strong&gt; 같은 역할(교과서 소단원 정리). 벽 위로 어머니, 연인, 글자들이 영화 장면처럼 스쳐 지나감.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;희미한 십오 촉 전등, 때 글은 낡은 무명 셔츠\u003c/strong&gt;: 화자의 \u003cstrong&gt;가난하고 초라한\u003c/strong&gt; 처지.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;감주 한잔 먹고 싶다\u003c/strong&gt;: 따뜻함(위로)을 그리워하는 외로운 마음.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;차디찬 물에 무와 배추를 씻는 어머니\u003c/strong&gt;: 고생하는 어머니에 대한 \u003cstrong&gt;연민\u003c/strong&gt;과 그리움. &amp;#39;시퍼러둥둥하니 추운 날&amp;#39;과 &amp;#39;차디찬 물&amp;#39;로 고단함 강조.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;지아비·어린것과 저녁 먹는 사랑하는 사람\u003c/strong&gt;: 이미 다른 사람과 가정을 꾸린 연인 → 화자의 \u003cstrong&gt;상실감\u003c/strong&gt;. 연인의 따뜻한 저녁상과 화자의 좁은 방이 \u003cstrong&gt;대조\u003c/strong&gt;됨.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;가난하고 외롭고 높고 쓸쓸하니\u003c/strong&gt;: 화자 삶의 모습. &amp;#39;높고&amp;#39;는 가난·외로움 속에서도 \u003cstrong&gt;고결한 정신, 지조\u003c/strong&gt;를 지킨다는 의미.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;하늘이 … 가장 귀해하고 사랑하는 것들\u003c/strong&gt;: 가난하고 외로운 삶은 하늘이 사랑하는 존재의 삶 → 운명을 \u003cstrong&gt;긍정\u003c/strong&gt;으로 바꿈.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;초생달·바구지꽃·짝새·당나귀\u003c/strong&gt;: 작고 소박하며 외롭지만 순수한 자연물 / \u003cstrong&gt;프랑시스 잠·도연명·릴케\u003c/strong&gt;: 세속과 거리를 두고 고독 속에서 순수한 시 세계를 지킨 시인들 [인물 소개는 일반 해설] → 모두 화자와 같은 삶을 사는 존재로, 화자가 \u003cstrong&gt;동일시\u003c/strong&gt;하며 위안을 얻음.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;표현상 특징\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;반복(교과서 탐구 활동)\u003c/strong&gt;: &amp;#39;흰 바람벽에 …… -ㄴ다&amp;#39;, &amp;#39;이 흰 바람벽에&amp;#39;, &amp;#39;내 가난한 늙은 어머니가&amp;#39;, &amp;#39;내 사랑하는 (어여쁜) 사람이&amp;#39;, &amp;#39;저녁을 먹는다&amp;#39;, &amp;#39;가난하고 외롭고 높고 쓸쓸하니&amp;#39;, &amp;#39;~이/가 그러하듯이&amp;#39;\u003cul&gt;\n\u003cli&gt;효과: 형식이 자유로운데도 \u003cstrong&gt;리듬감(운율) 형성\u003c/strong&gt; + 화자의 \u003cstrong&gt;정서 강조\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;음수율·음보율 같은 고전 시가의 정형적 율격이 없음\u003c/strong&gt; → 화자의 내면을 \u003cstrong&gt;자유로운 형식\u003c/strong&gt;으로 쓴 현대 시(소단원 정리)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;의인법\u003c/strong&gt;: 불빛이 &amp;#39;지치운&amp;#39;, 셔츠가 그림자를 &amp;#39;쉬이고&amp;#39;, 생각이 &amp;#39;헤매인다&amp;#39;, 글자들이 &amp;#39;눈질을 하며 주먹질을 하며&amp;#39; 지나감\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;현재형 서술(&amp;#39;-ㄴ다&amp;#39;)\u003c/strong&gt;: 벽에 비친 장면을 눈앞의 일처럼 생생하게 제시\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;열거\u003c/strong&gt;: 초생달·바구지꽃·짝새·당나귀 / 프랑시스 잠·도연명·릴케\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;대조\u003c/strong&gt;: 따뜻한 것(감주, 대굿국, 연인의 가정) ↔ 차가운 것(추운 날, 차디찬 물, 좁다란 방)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;긴 산문적 시행, 평북 방언\u003c/strong&gt;(개포가, 앞대 등) 사용\u003c/li&gt;\n\u003cli&gt;&amp;#39;글자들&amp;#39;의 \u003cstrong&gt;줄표(―) 문장\u003c/strong&gt;: 화자 내면의 목소리를 벽에 지나가는 글자로 형상화\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;학습 활동 정리 (146~149쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;① 화자가 처한 상황(이해 1-(1))\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;어느 날 저녁에 **(좁다란 방)**에서 **(흰 바람벽)**을/를 바라보며 \u003cstrong&gt;(쓸쓸하고 외로운 생각에 잠겨 있다)\u003c/strong&gt;.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;② 21행 &amp;quot;나는 이 세상에서 가난하고 외롭고 높고 쓸쓸하니 살아가도록 태어났다&amp;quot;에 담긴 처지·심정(148쪽)\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시어\u003c/th&gt;\n\u003cth&gt;시인의 처지나 심정\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;&amp;#39;가난하고&amp;#39;\u003c/td&gt;\n\u003ctd&gt;실업자가 되어 생계 수단이 없는 상황 (교과서 제시)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;&amp;#39;외롭고&amp;#39;, &amp;#39;쓸쓸하니&amp;#39;\u003c/td&gt;\n\u003ctd&gt;고향과 가족(어머니), 사랑하는 사람과 떨어져 타국(만주 신징)에서 홀로 지내는 상황\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;&amp;#39;높고&amp;#39;\u003c/td&gt;\n\u003ctd&gt;창씨개명(일본식 성명 강요)을 거부하고 직장에서 나옴 → 현실과 타협하지 않는 \u003cstrong&gt;고결한 정신·지조\u003c/strong&gt;, 그에 대한 자부심\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;③ 문학사적 가치(148쪽 자료)\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;1940년대 = 우리말과 우리 문학의 암흑기\u003c/strong&gt;. 시인들은 일제에 협력하고 일본어를 사용할 것을 강요받음.\u003c/li&gt;\n\u003cli&gt;백석은 홀로 조선을 떠나 **만주국 수도 신징(지금의 중국 창춘)**에서 \u003cstrong&gt;말단 공무원 보조\u003c/strong&gt; 일을 함.\u003c/li&gt;\n\u003cli&gt;일제가 \u003cstrong&gt;일본식 성명으로 바꾸도록 강요하는 것을 거부\u003c/strong&gt;하고 직장에서 나와 이 시를 씀.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;1941년에만 여덟 편\u003c/strong&gt;의 시를 발표하고, \u003cstrong&gt;1945년 광복 때까지 더 이상 시를 발표하지 않음\u003c/strong&gt;.\u003c/li&gt;\n\u003cli&gt;사진 자료: 《문장》 **폐간호(1941. 4.)**에 실림 (원제 표기 &amp;#39;힌바람벽이있어&amp;#39;).\u003c/li&gt;\n\u003cli&gt;가치: 일본어가 강요되던 시기에 \u003cstrong&gt;한국어로 창작\u003c/strong&gt; → \u003cstrong&gt;우리말과 우리 문학의 명맥\u003c/strong&gt;을 이음.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;④ 적용·창의(150쪽): 친구들에게 추천하고 싶은 시 낭송 — 낭독 속도·성량, 정확한 발음, 어조·강약·억양 조절로 분위기 살리기 (예시 작품: 신경림 &amp;lt;농무&amp;gt;)\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;소단원 정리 빈칸 정답 (151쪽)\u003c/strong&gt; ※ 인쇄된 정답 없음 → 문맥 추론\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;화자는 어느 날 저녁 좁다란 방에서 &amp;#39;흰 바람벽&amp;#39;을 바라보며 **(외로운 생각 / 상념)**에 잠겨 있음.\u003c/li&gt;\n\u003cli&gt;&amp;#39;흰 바람벽&amp;#39;에 늙으신 어머니, 사랑하는 사람, 글자들이 스쳐 지나감. &amp;#39;흰 바람벽&amp;#39;은 화자의 생각과 감정을 투영하는 \u003cstrong&gt;영사막\u003c/strong&gt;과 같은 역할.\u003c/li&gt;\n\u003cli&gt;고전 시가의 정형적 율격은 없지만, 어휘나 문장 구조가 반복되면서 **(리듬감 / 운율)**을/를 형성하고 화자의 정서를 강조함.\u003c/li&gt;\n\u003cli&gt;첫 번째 글자들(21~23행): &amp;#39;가난하고 외롭고 높고 쓸쓸하니 살아가도록&amp;#39; 태어난 것을 \u003cstrong&gt;운명\u003c/strong&gt;으로 여기고 받아들임.\u003c/li&gt;\n\u003cli&gt;두 번째 글자들(26~29행): 자신의 운명을 하늘의 사랑이라고 여기며 \u003cstrong&gt;(긍정적인 태도)\u003c/strong&gt;(으)로 수용함.\u003c/li&gt;\n\u003cli&gt;두 시(흰 바람벽이 있어, 별 헤는 밤)는 비슷한 시기에 발표되었으며 두 시의 \u003cstrong&gt;(발상)\u003c/strong&gt;, 표현, 화자의 정서나 태도 등이 유사함.\u003c/li&gt;\n\u003cli&gt;두 시인은 암담한 상황에서 굳은 신념으로 \u003cstrong&gt;우리말\u003c/strong&gt;로 작품을 창작했고, 두 시는 당대와 오늘날 독자들에게 깊은 **(감동)**과/와 위안을 줌.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2-2. 윤동주, &amp;lt;별 헤는 밤&amp;gt;\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;교과서 날개 설명(148~149쪽 무렵)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;밤하늘의 \u003cstrong&gt;별\u003c/strong&gt;을 바라보며 \u003cstrong&gt;고향과 유년기의 추억, 어머니\u003c/strong&gt;를 떠올리면서 \u003cstrong&gt;자신의 삶을 성찰\u003c/strong&gt;한 시.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;일본 유학 직전인 1941년 11월\u003c/strong&gt;에 지음. 같은 해 4월에 &amp;lt;흰 바람벽이 있어&amp;gt;가 발표됨.\u003c/li&gt;\n\u003cli&gt;윤동주는 과거에 \u003cstrong&gt;백석의 시집 《사슴》의 필사본\u003c/strong&gt;을 만들 정도로 백석을 좋아했다고 함.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;교과서 수록 부분의 특징\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;&amp;quot;별 하나에 추억과 / 별 하나에 사랑과 / 별 하나에 쓸쓸함과 / 별 하나에 동경과 / 별 하나에 시와 / 별 하나에 어머니, 어머니,&amp;quot; → \u003cstrong&gt;같은 구조 반복 + 열거\u003c/strong&gt; → 리듬감, 그리움 강조\u003c/li&gt;\n\u003cli&gt;&amp;quot;어머님, 나는 별 하나에 아름다운 말 한마디씩 불러 봅니다.&amp;quot; → \u003cstrong&gt;경어체(-ㅂ니다)\u003c/strong&gt;, 어머니에게 말을 건네는 방식\u003c/li&gt;\n\u003cli&gt;부르는 이름들: 소학교 때 책상을 같이했던 아이들, 패·경·옥 같은 이국 소녀들, \u003cstrong&gt;벌써 애기 어머니 된 계집애들\u003c/strong&gt;, \u003cstrong&gt;가난한 이웃 사람들\u003c/strong&gt;, 비둘기·강아지·토끼·노새·노루, \u003cstrong&gt;프랑시스 잠, 라이너 마리아 릴케\u003c/strong&gt; → 산문처럼 긴 문장으로 나열\u003c/li&gt;\n\u003cli&gt;별 = 그리운 대상을 떠올리게 하는 \u003cstrong&gt;매개물\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;[일반 해설] 작품 전체 흐름\u003c/strong&gt; — 교과서에 없는 부분, 수업 필기와 대조\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;단계\u003c/th&gt;\n\u003cth&gt;내용\u003c/th&gt;\n\u003cth&gt;정서\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;현재\u003c/td&gt;\n\u003ctd&gt;가을 하늘의 별을 헤아림, 별을 다 못 헤는 까닭(아직 청춘이 다하지 않음)\u003c/td&gt;\n\u003ctd&gt;차분함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;과거 회상\u003c/td&gt;\n\u003ctd&gt;&amp;#39;별 하나에 ~&amp;#39; — 추억, 어머니, 친구·이웃·동물·시인의 이름 (교과서 수록 부분)\u003c/td&gt;\n\u003ctd&gt;그리움\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;현재 인식\u003c/td&gt;\n\u003ctd&gt;그리운 것들은 별처럼 멀리 있고, 어머니는 멀리 북간도에 계심\u003c/td&gt;\n\u003ctd&gt;쓸쓸함, 거리감\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;성찰\u003c/td&gt;\n\u003ctd&gt;별빛 내린 언덕 위에 내 이름자를 써 보고 흙으로 덮어 버림, 밤을 새워 우는 벌레는 부끄러운 이름을 슬퍼하는 까닭\u003c/td&gt;\n\u003ctd&gt;부끄러움, 자기 성찰\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;미래\u003c/td&gt;\n\u003ctd&gt;겨울이 지나고 나의 별에도 봄이 오면 … 내 이름자 묻힌 언덕 위에도 자랑처럼 풀이 무성할 것\u003c/td&gt;\n\u003ctd&gt;희망, 극복 의지\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;시간 흐름: 현재 → 과거 → 현재 → 미래\u003c/li&gt;\n\u003cli&gt;겨울 = 일제 강점기의 암울한 현실 / 봄 = 현실이 극복된 희망의 시간(광복)으로 흔히 해석\u003c/li&gt;\n\u003cli&gt;벌레 = 화자의 감정을 이입한 대상 / 파란 잔디·무성한 풀 = 부활·재생의 이미지\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2-3. 김소월, &amp;lt;접동새&amp;gt;\u003c/h3&gt;\n\u003cblockquote&gt;\n\u003cp&gt;⚠ \u003cstrong&gt;교과서에 없는 작품: 수업 프린트·필기와 반드시 대조할 것\u003c/strong&gt;\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cul&gt;\n\u003cli&gt;갈래: 서정시, \u003cstrong&gt;민요시\u003c/strong&gt;(민요조 서정시) / 성격: 애상적, 민요적, 설화적\u003c/li&gt;\n\u003cli&gt;소재 배경: \u003cstrong&gt;접동새 설화\u003c/strong&gt; — (평안북도 박천 지방에 전하는 이야기로 알려짐) 의붓어미의 시샘으로 죽은 누나가 접동새가 되어, 아홉 동생을 잊지 못해 밤마다 이 산 저 산 옮겨 다니며 슬피 운다는 이야기\u003c/li&gt;\n\u003cli&gt;화자: 누나를 잃은 동생(오랩동생 가운데 하나)\u003c/li&gt;\n\u003cli&gt;정서: 슬픔, \u003cstrong&gt;한(恨)\u003c/strong&gt; / 주제: 죽어서도 동생들을 잊지 못하는 누나의 한과 혈육의 정\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;시상 전개\u003c/strong&gt;\u003c/p&gt;\n\u003col&gt;\n\u003cli&gt;접동새 울음소리 &amp;quot;접동 / 접동 / 아우래비 접동&amp;quot; — 진두강 가람가에 살던 누나가 진두강 앞마을에 와서 웁니다(현재)\u003c/li&gt;\n\u003cli&gt;옛날, 진두강 가람가에 살던 누나가 의붓어미 시샘에 죽음(과거의 사연)\u003c/li&gt;\n\u003cli&gt;&amp;quot;누나라고 불러 보랴 / 오오 불설워&amp;quot; — 화자의 슬픔 직접 표출, 누나가 죽어서 접동새가 됨\u003c/li&gt;\n\u003cli&gt;아홉이나 남아 되는 오랩동생을 죽어서도 못 잊어, 야삼경에 이 산 저 산 옮아가며 슬피 욺(한의 표출)\u003c/li&gt;\n\u003c/ol&gt;\n\u003cp&gt;\u003cstrong&gt;시어 의미\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시어\u003c/th&gt;\n\u003cth&gt;의미\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;접동\u003c/td&gt;\n\u003ctd&gt;접동새의 울음소리를 흉내 낸 말(의성어)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;아우래비\u003c/td&gt;\n\u003ctd&gt;울음소리이면서 **&amp;#39;아홉 오라비&amp;#39;**라는 뜻이 겹침 → 누나가 동생들을 부르는 소리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;가람\u003c/td&gt;\n\u003ctd&gt;&amp;#39;강&amp;#39;의 옛말\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;의붓어미 시샘\u003c/td&gt;\n\u003ctd&gt;누나를 죽게 한 비극의 원인\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;불설워\u003c/td&gt;\n\u003ctd&gt;&amp;#39;몹시 서러워&amp;#39;라는 뜻의 평안도 방언\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;오랩동생\u003c/td&gt;\n\u003ctd&gt;오라비 동생(남동생)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;야삼경\u003c/td&gt;\n\u003ctd&gt;한밤중(밤 11시~새벽 1시 무렵)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;이 산 저 산 옮아가며\u003c/td&gt;\n\u003ctd&gt;죽어서도 풀리지 않는 누나의 한\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;표현상 특징\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;설화를 바탕\u003c/strong&gt;으로 비극적 사연을 전함\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;의성어\u003c/strong&gt;로 시작하여 슬픈 분위기 조성, &amp;#39;접동&amp;#39; 반복\u003c/li&gt;\n\u003cli&gt;전통적인 \u003cstrong&gt;3음보 민요조 율격\u003c/strong&gt;(7·5조 바탕)으로 리듬감\u003c/li&gt;\n\u003cli&gt;&amp;#39;-습니다&amp;#39; 경어체로 사연을 차분하게 들려줌\u003c/li&gt;\n\u003cli&gt;우리 민족의 전통 정서인 \u003cstrong&gt;한\u003c/strong&gt;을 형상화\u003c/li&gt;\n\u003cli&gt;(확장 해석) 일제 강점기 민족의 설움과 연결해 읽기도 함 → 선생님 해석 확인\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2-4. 이용악, &amp;lt;낡은 집&amp;gt;\u003c/h3&gt;\n\u003cblockquote&gt;\n\u003cp&gt;⚠ \u003cstrong&gt;교과서에 없는 작품: 수업 프린트·필기와 반드시 대조할 것\u003c/strong&gt; (저작권이 남아 있는 작품이라 핵심 구절만 짧게 인용함. 구절 표기는 판본에 따라 다를 수 있음)\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cul&gt;\n\u003cli&gt;갈래: 자유시, 서정시(서사적 성격이 강한 \u003cstrong&gt;이야기 시\u003c/strong&gt;) / 성격: 서사적, 사실적, 비극적\u003c/li&gt;\n\u003cli&gt;화자: 털보네 셋째 아들의 어린 시절 동무인 &amp;#39;나&amp;#39; → 한 가족의 이야기를 \u003cstrong&gt;관찰하고 전해 주는\u003c/strong&gt; 위치\u003c/li&gt;\n\u003cli&gt;정서: 안타까움, 연민 / 어조: 담담하지만 비극성이 배어 있음\u003c/li&gt;\n\u003cli&gt;주제: 일제 강점기 궁핍한 농민 일가의 \u003cstrong&gt;몰락과 유랑\u003c/strong&gt;, 고향을 잃은 사람들의 비애\u003c/li&gt;\n\u003cli&gt;시대 배경: 1930년대 일제의 수탈로 삶의 터전을 잃은 많은 농민이 국경을 넘어 만주·러시아 등지로 떠남(유이민)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;흐름 (현재 → 과거 → 현재)\u003c/strong&gt;\u003c/p&gt;\n\u003col&gt;\n\u003cli&gt;현재: 아무도 살지 않아 &amp;quot;왕거미 줄치기에 분주한 집&amp;quot;, 마을에서 &amp;quot;흉집이라고 꺼리는 낡은 집&amp;quot;\u003c/li&gt;\n\u003cli&gt;과거: 털보의 셋째 아들(&amp;#39;나의 싸리말 동무&amp;#39;)이 이 집에서 태어남. 마을 아낙네들은 &amp;quot;송아지래두 불었으면 팔아나 먹지&amp;quot;라며 차갑게 말함 → 아이의 탄생조차 축복받지 못하는 가난\u003c/li&gt;\n\u003cli&gt;가난과 불안 속에서 자라던 동무의 가족이 어느 날 밤 사라짐. 이웃들은 오랑캐령 쪽, 혹은 아라사로 갔을 거라고 짐작함\u003c/li&gt;\n\u003cli&gt;&amp;quot;털보네 간 곳은 아무도 모른다&amp;quot; → 남은 것은 낡은 집뿐\u003c/li&gt;\n\u003c/ol&gt;\n\u003cp&gt;\u003cstrong&gt;시어 의미\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시어·구절\u003c/th&gt;\n\u003cth&gt;의미\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;낡은 집\u003c/td&gt;\n\u003ctd&gt;몰락한 털보네 일가, 나아가 일제 강점기 궁핍한 \u003cstrong&gt;우리 민족(농민)의 삶\u003c/strong&gt;을 상징\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;왕거미 줄치기에 분주한 집\u003c/td&gt;\n\u003ctd&gt;사람이 떠나 버려진 집의 황폐함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;송아지래두 불었으면 팔아나 먹지\u003c/td&gt;\n\u003ctd&gt;사람보다 송아지가 나을 만큼 가난한 현실, 비정한 세태\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;오랑캐령, 아라사\u003c/td&gt;\n\u003ctd&gt;두만강 너머 만주로 가는 고개 / 러시아 → 국경을 넘은 \u003cstrong&gt;유랑\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;털보네 간 곳은 아무도 모른다\u003c/td&gt;\n\u003ctd&gt;고향을 잃고 흩어진 유이민의 비극\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;표현상 특징\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;한 가족의 이야기를 들려주는 \u003cstrong&gt;서사적 구성\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;&amp;#39;~다고 한다&amp;#39;처럼 \u003cstrong&gt;전해 들은 이야기\u003c/strong&gt;를 옮기는 말투 → 객관적·담담한 어조\u003c/li&gt;\n\u003cli&gt;현재의 낡은 집에서 과거를 되짚는 구성\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;구체적 지명·방언\u003c/strong&gt;으로 사실감을 높임\u003c/li&gt;\n\u003cli&gt;한 집안의 몰락을 통해 \u003cstrong&gt;민족 전체의 수난\u003c/strong&gt;을 드러냄\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 교과서 비교 활동: \u003c흰 바람벽이 있어&gt; vs \u003c별 헤는 밤&gt; (149쪽)&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;비교 기준(교과서 질문)\u003c/th&gt;\n\u003cth&gt;흰 바람벽이 있어\u003c/th&gt;\n\u003cth&gt;별 헤는 밤\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;대상을 떠올리게 하는 \u003cstrong&gt;매개물\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;흰 바람벽\u003c/td&gt;\n\u003ctd&gt;별(밤하늘)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;떠올리는 대상\u003c/td&gt;\n\u003ctd&gt;가난한 늙은 어머니, 결혼해 아이를 둔 사랑하는 사람, 초생달·바구지꽃·짝새·당나귀, 프랑시스 잠·도연명·릴케\u003c/td&gt;\n\u003ctd&gt;어머니, 소학교 친구, 이국 소녀들, 애기 어머니 된 계집애들, 가난한 이웃, 비둘기·강아지·토끼·노새·노루, 프랑시스 잠·릴케\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;공통으로 떠올리는 대상\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;어머니 / 이미 다른 이와 가정을 이룬 여인(사랑하는 사람 ↔ 애기 어머니 된 계집애들) / 작은 동물 / 프랑시스 잠, 라이너 마리아 릴케\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;(왼쪽과 같음)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;공통 정서\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;쓸쓸함, 외로움, 그리움\u003c/td&gt;\n\u003ctd&gt;쓸쓸함, 그리움\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;표현\u003c/td&gt;\n\u003ctd&gt;반복·열거, 산문적 긴 시행\u003c/td&gt;\n\u003ctd&gt;&amp;#39;별 하나에&amp;#39; 반복·열거, 산문적 문장\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;발표\u003c/td&gt;\n\u003ctd&gt;1941. 4. 《문장》 폐간호\u003c/td&gt;\n\u003ctd&gt;1941. 11. 창작(일본 유학 직전)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;문학사적 맥락 (교과서 소단원 정리 기준)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;두 작품 모두 **1940년대 일제 강점기 말(우리말과 문학의 암흑기)**에 창작됨.\u003c/li&gt;\n\u003cli&gt;비슷한 시기에 발표되었고 \u003cstrong&gt;발상, 표현, 화자의 정서·태도\u003c/strong&gt;가 유사함 → 윤동주가 백석의 《사슴》을 필사할 만큼 좋아했다는 점과 연결.\u003c/li&gt;\n\u003cli&gt;두 시인은 암담한 상황에서 \u003cstrong&gt;굳은 신념으로 우리말로\u003c/strong&gt; 작품을 창작 → 당대와 오늘날 독자들에게 깊은 \u003cstrong&gt;감동과 위안\u003c/strong&gt;을 줌.\u003c/li&gt;\n\u003cli&gt;오늘날 독자에게 호소력이 있는 이유(짝 활동): 가난·외로움·그리움 같은 보편적 정서, 힘든 삶을 성찰하고 견디는 태도에 공감할 수 있기 때문.\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 헷갈리는 것 비교&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;① 화자의 태도\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;작품\u003c/th&gt;\n\u003cth&gt;태도\u003c/th&gt;\n\u003cth&gt;한 단어\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;흰 바람벽이 있어\u003c/td&gt;\n\u003ctd&gt;쓸쓸함 → 운명을 받아들이고 하늘의 사랑으로 \u003cstrong&gt;긍정\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;수용·긍정\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;별 헤는 밤\u003c/td&gt;\n\u003ctd&gt;그리움 → 자기 \u003cstrong&gt;부끄러움\u003c/strong&gt; → 미래에 대한 \u003cstrong&gt;희망·의지\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;성찰·희망\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;접동새\u003c/td&gt;\n\u003ctd&gt;누나의 죽음을 슬퍼함, 한을 드러냄\u003c/td&gt;\n\u003ctd&gt;애상\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;낡은 집\u003c/td&gt;\n\u003ctd&gt;한 가족의 몰락을 전하며 안타까워함\u003c/td&gt;\n\u003ctd&gt;관찰·연민\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;주의: &amp;lt;흰 바람벽이 있어&amp;gt;의 화자는 현실에 \u003cstrong&gt;저항하거나 극복을 다짐하지 않는다\u003c/strong&gt;. 운명을 &amp;quot;받아들이고 긍정&amp;quot;하는 것. 미래의 &amp;#39;봄&amp;#39;을 기다리는 건 &amp;lt;별 헤는 밤&amp;gt;.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;② 시대적 배경\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;흰 바람벽 / 별 헤는 밤: \u003cstrong&gt;1941년\u003c/strong&gt;, 일제 강점기 말 암흑기(일본어 강요, 창씨개명)\u003c/li&gt;\n\u003cli&gt;접동새: 1920년대 초 발표, 전통 설화 속 과거 이야기\u003c/li&gt;\n\u003cli&gt;낡은 집: 1930년대 후반, 궁핍한 농민의 유랑(유이민)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;③ 표현법\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;표현\u003c/th&gt;\n\u003cth&gt;흰 바람벽\u003c/th&gt;\n\u003cth&gt;별 헤는 밤\u003c/th&gt;\n\u003cth&gt;접동새\u003c/th&gt;\n\u003cth&gt;낡은 집\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;반복·열거\u003c/td&gt;\n\u003ctd&gt;○\u003c/td&gt;\n\u003ctd&gt;○\u003c/td&gt;\n\u003ctd&gt;○(접동)\u003c/td&gt;\n\u003ctd&gt;△\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;정형적 율격\u003c/td&gt;\n\u003ctd&gt;× (자유시)\u003c/td&gt;\n\u003ctd&gt;×\u003c/td&gt;\n\u003ctd&gt;△ 3음보 민요조\u003c/td&gt;\n\u003ctd&gt;×\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;경어체\u003c/td&gt;\n\u003ctd&gt;× (&amp;#39;-ㄴ다&amp;#39;)\u003c/td&gt;\n\u003ctd&gt;○ (&amp;#39;-ㅂ니다&amp;#39;)\u003c/td&gt;\n\u003ctd&gt;○ (&amp;#39;-습니다&amp;#39;)\u003c/td&gt;\n\u003ctd&gt;×\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;설화·이야기\u003c/td&gt;\n\u003ctd&gt;×\u003c/td&gt;\n\u003ctd&gt;×\u003c/td&gt;\n\u003ctd&gt;○ 설화\u003c/td&gt;\n\u003ctd&gt;○ 한 가족 이야기\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;방언\u003c/td&gt;\n\u003ctd&gt;○ 평북\u003c/td&gt;\n\u003ctd&gt;×\u003c/td&gt;\n\u003ctd&gt;○ (불설워 등)\u003c/td&gt;\n\u003ctd&gt;○\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;매개물로 대상 떠올림\u003c/td&gt;\n\u003ctd&gt;○ 흰 바람벽\u003c/td&gt;\n\u003ctd&gt;○ 별\u003c/td&gt;\n\u003ctd&gt;△ 접동새 울음\u003c/td&gt;\n\u003ctd&gt;△ 낡은 집\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;④ 헷갈리는 시어\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;&amp;#39;높고&amp;#39;(흰 바람벽) = 고결함·지조 ≠ 신분이 높음\u003c/li&gt;\n\u003cli&gt;&amp;#39;울력하다&amp;#39; = 힘을 실어 줌 ≠ 꾸짖음\u003c/li&gt;\n\u003cli&gt;&amp;#39;앞대&amp;#39; = 남쪽 지방 ≠ 앞마을\u003c/li&gt;\n\u003cli&gt;&amp;#39;아우래비&amp;#39; = 울음소리 + 아홉 오라비 / &amp;#39;야삼경&amp;#39; = 한밤중 ≠ 새벽\u003c/li&gt;\n\u003cli&gt;&amp;#39;부끄러운 이름&amp;#39;(별 헤는 밤) = 자기 성찰 ≠ 남을 원망\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;5. 예상 문제&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;[1~7] &amp;lt;흰 바람벽이 있어&amp;gt;\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;1.\u003c/strong&gt; 이 시의 내용을 이해한 것으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\n① 화자는 어느 날 저녁 좁다란 방에서 흰 바람벽을 바라보고 있다.\n② 화자는 따끈한 감주를 먹고 싶어 하는 외로운 생각을 한다.\n③ 화자는 추운 날 차디찬 물에 무와 배추를 씻는 어머니의 모습을 떠올린다.\n④ 화자는 떠나간 사랑하는 사람을 되찾기 위해 먼 바닷가 마을로 떠날 결심을 한다.\n⑤ 화자가 사랑하는 사람은 다른 사람과 가정을 이루어 아이까지 두었다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2.\u003c/strong&gt; &amp;#39;흰 바람벽&amp;#39;의 기능으로 가장 적절한 것은?\n① 화자가 벗어나고 싶은 억압적 현실을 상징한다.\n② 화자의 생각과 감정이 비추어지는 영사막 같은 역할을 한다.\n③ 화자와 어머니를 갈라놓은 이별의 원인이다.\n④ 화자가 과거를 잊게 만드는 망각의 공간이다.\n⑤ 화자의 부유했던 과거를 드러내는 소재이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3.\u003c/strong&gt; 이 시의 표현상 특징으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\n① &amp;#39;흰 바람벽에&amp;#39;와 같은 시어를 반복하여 리듬감을 형성한다.\n② &amp;#39;지치운 불빛&amp;#39;, &amp;#39;외로운 생각이 헤매인다&amp;#39;처럼 사물이나 생각을 사람처럼 표현한다.\n③ 음수율과 음보율 같은 정형적 율격을 엄격하게 지켜 운율을 만든다.\n④ &amp;#39;-ㄴ다&amp;#39;로 끝나는 현재형 문장으로 벽에 비친 장면을 생생하게 보여 준다.\n⑤ 연인의 따뜻한 저녁상과 화자의 좁은 방을 대비하여 화자의 외로움을 부각한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4.\u003c/strong&gt; &amp;lt;보기&amp;gt;를 참고하여 이 시를 감상한 것으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 1940년대는 우리말과 우리 문학의 암흑기였다. 당시 백석은 만주국의 수도 신징에서 말단 공무원 보조 일을 하다가, 일제가 일본식 성명으로 바꾸도록 강요하는 것을 거부하고 직장에서 나와 이 시를 썼다. 이 시는 《문장》 폐간호(1941. 4.)에 실렸다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 화자가 떠올린 어머니의 모습은 일제에 협력하여 풍요를 누리는 삶을 비판하기 위한 것이다.\n② &amp;#39;가난하고&amp;#39;는 직장을 그만두어 생계 수단이 없는 시인의 처지와 관련지을 수 있다.\n③ &amp;#39;외롭고&amp;#39;, &amp;#39;쓸쓸하니&amp;#39;는 가족과 떨어져 타국에서 홀로 지내는 처지와 관련지을 수 있다.\n④ &amp;#39;높고&amp;#39;는 창씨개명을 거부하며 현실과 타협하지 않은 고결한 정신과 관련지을 수 있다.\n⑤ 일본어가 강요되던 시기에 우리말로 창작되어 우리말과 문학의 명맥을 이었다는 가치가 있다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5.\u003c/strong&gt; &amp;#39;첫 번째 글자들&amp;#39;(21\u003cdel&gt;23행)과 &amp;#39;두 번째 글자들&amp;#39;(26\u003c/del&gt;29행)에 대한 설명으로 가장 적절한 것은?\n① 첫 번째 글자들에서 화자는 자신의 운명을 거부하고, 두 번째 글자들에서 운명에 맞서 싸우기로 한다.\n② 첫 번째 글자들에서 화자는 모든 슬픔을 극복했다고 선언한다.\n③ 두 번째 글자들에서 화자는 자신을 외롭게 만든 세상 사람들을 원망한다.\n④ 두 글자들은 모두 화자가 벽에 직접 써 넣은 것으로 제시된다.\n⑤ 첫 번째 글자들에서 자신의 삶을 운명으로 받아들이고, 두 번째 글자들에서 그 운명을 하늘의 사랑으로 여기며 긍정한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6.\u003c/strong&gt; 다음 대상들에 대한 설명으로 가장 적절한 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;초생달과 바구지꽃과 짝새와 당나귀 / &amp;#39;프랑시스 잠&a
