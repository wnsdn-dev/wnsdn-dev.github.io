.table tbody tr:last-child :is(th, td) {

}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

.table :is(.text-end, [align=&quot;right&quot;]) {

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);

  background: var(--card);

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);

  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;

}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {

  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {

  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {

}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host's design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(&gt; .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker &gt; summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;

  &lt;div id=&quot;study-content&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;script type=&quot;application/json&quot; id=&quot;study-data&quot;&gt;[{&quot;id&quot;:&quot;history-rule&quot;,&quot;subject&quot;:&quot;한국사&quot;,&quot;title&quot;:&quot;① 식민 통치와 수탈&quot;,&quot;file&quot;:&quot;한국사_정리_1_통치와수탈.md&quot;,&quot;range&quot;:&quot;교과서 10~29쪽&quot;,&quot;flow&quot;:[[&quot;1910년대&quot;,&quot;무단 통치&quot;,&quot;헌병 경찰 · 조선 태형령 / 토지 조사 사업 · 회사령&quot;],[&quot;1919&quot;,&quot;3·1 운동&quot;,&quot;일제의 통치 방식 변화 계기&quot;],[&quot;1920년대&quot;,&quot;문화 정치&quot;,&quot;보통 경찰 · 치안 유지법 / 산미 증식 계획&quot;],[&quot;1930년대 이후&quot;,&quot;민족 말살 · 전시 동원&quot;,&quot;황국 신민화 · 창씨개명 / 병참 기지화 · 국가 총동원법&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;통치와 수탈, 같은 시대끼리 연결&quot;,&quot;head&quot;:[&quot;시기&quot;,&quot;통치의 핵심&quot;,&quot;경제 수탈의 핵심&quot;],&quot;rows&quot;:[[&quot;1910년대&quot;,&quot;헌병 경찰제 · 태형령&quot;,&quot;토지 조사 사업 / 회사 설립 허가제&quot;],[&quot;1920년대&quot;,&quot;문화 정치의 실상: 경찰 증가 · 검열 · 민족 분열&quot;,&quot;산미 증식 계획 / 회사령 폐지 → 신고제&quot;],[&quot;1930년대 이후&quot;,&quot;민족의식 억압 · 전쟁에 강제 동원&quot;,&quot;공업화 · 병참 기지화 / 물자 공출 · 배급제&quot;]]},&quot;note&quot;:&quot;시대 구분은 정리 파일 기준. 통치 정책과 경제 정책을 함께 묶어 기억하기.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;범위: Ⅰ-01 제국주의 질서와 일제의 식민 통치 정책 / Ⅰ-02 일제의 수탈 정책과 한국인의 삶\n천재교육(정요근) 교과서 본문 기준. 교과서에서 확인되지 않는 내용은 넣지 않았다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 한눈에 보기&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시기\u003c/th&gt;\n\u003cth&gt;통치 방식\u003c/th&gt;\n\u003cth&gt;핵심 기구·법령\u003c/th&gt;\n\u003cth&gt;경제 정책\u003c/th&gt;\n\u003cth&gt;목적·결과\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1910년대\u003c/td&gt;\n\u003ctd&gt;무단 통치 (헌병을 앞세운 군사적 지배)\u003c/td&gt;\n\u003ctd&gt;조선 총독부, 중추원(자문 기관), 헌병 경찰제, 범죄 즉결례(1910), 조선 태형령(1912), 제1차 조선 교육령(1911)\u003c/td&gt;\n\u003ctd&gt;식민지 경제 체제 구축: 토지 조사 사업(1910\u003cdel&gt;1918), 회사령(1910, 허가제), 삼림령(1911)·임야 조사 사업(1917\u003c/del&gt;1924), 어업령·광업령, 조선은행·조선 식산 은행, X 자형 간선 철도망\u003c/td&gt;\n\u003ctd&gt;지세 확보·일본인 토지 소유 쉽게 → 총독부 지세 수입 증가, 농민은 소작농으로 전락 / 한국인 기업 활동 제한\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1920년대\u003c/td&gt;\n\u003ctd&gt;&amp;#39;문화 정치&amp;#39; (민족 분열 정책)\u003c/td&gt;\n\u003ctd&gt;문관 총독 임명 가능(실제 0명), 보통 경찰제, 치안 유지법(1925), 제2차 조선 교육령, 도 평의회·부·면 협의회\u003c/td&gt;\n\u003ctd&gt;수탈과 개발: 산미 증식 계획(1920~1934), 회사령 폐지 → 신고제(1920), 일본 상품 관세 폐지(1923)\u003c/td&gt;\n\u003ctd&gt;3·1 운동 이후 지배를 이어 가려는 기만 정책 → 경찰 수 증가, 친일 세력 양성 / 쌀 일본 반출, 일본 자본 본격 침투\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1930년대 이후 (특히 1937년 중일 전쟁 이후)\u003c/td&gt;\n\u003ctd&gt;민족 말살 정책 + 전시 동원 체제\u003c/td&gt;\n\u003ctd&gt;내선일체·황국 신민화, 황국 신민 서사, 신사 참배, 궁성 요배, 창씨개명(1940), 조선 교육령 개정(1938), 조선 사상범 보호 관찰령(1936)·예방 구금령(1941), 국민정신 총동원 조선 연맹·애국반(1938), 국가 총동원법(1938)\u003c/td&gt;\n\u003ctd&gt;1930년대: 식민지 공업화(북부 중심), 남면북양 정책, 농촌 진흥 운동(1932~), 조선 농지령(1934) / 중일 전쟁 이후: 전시 통제 경제, 병참 기지화 정책, 금속·지하자원 공출, 미곡 공출제·식량 배급제\u003c/td&gt;\n\u003ctd&gt;한국인의 민족의식을 억누르고 전쟁에 동원 → 노동자·군인·일본군 &amp;#39;위안부&amp;#39; 강제 동원, 식량·물자 수탈로 일상적 궁핍\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 차시별 핵심 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;01-1 제국주의 시대와 일제의 무단 통치 (10~12쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;제국주의와 일본\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;19세기 후반 제국주의 열강의 식민 통치가 정점. &amp;quot;근대화, 문명화&amp;quot;를 선전했지만 실제 목적은 자원과 노동력 수탈\u003c/li&gt;\n\u003cli&gt;아시아 진출: 프랑스(베트남 → 프랑스령 인도차이나 연방), 러시아(베이징 조약 중재 대가로 연해주), 미국(에스파냐와의 전쟁 → 필리핀), 영국(인도, 미얀마·말레이반도), 네덜란드(인도네시아)\u003c/li&gt;\n\u003cli&gt;청: 1911년 신해혁명 → 공화국인 중화민국 수립\u003c/li&gt;\n\u003cli&gt;일본: 메이지 유신 이후 제국주의 열강에 합류 → 1905년 러일 전쟁 승리(사할린 남부, 랴오둥반도 조차지)\u003c/li&gt;\n\u003cli&gt;한국: 보호국을 거쳐 식민지로 전락(1910). 강제 병합은 제국주의 열강의 묵인 아래 이루어짐\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;조선 총독부\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;식민 통치의 최고 기구. 총독은 육군·해군 대장 출신 중 임명, 입법·사법·행정 + 군사권까지 행사\u003c/li&gt;\n\u003cli&gt;주요 관리는 대부분 일본인\u003c/li&gt;\n\u003cli&gt;중추원: 총독부 자문 기관. 한국인의 정치 참여를 선전했으나 실질적 권한 없음, 이완용·송병준 등 친일파가 대부분\u003c/li&gt;\n\u003cli&gt;총독부 청사: 경복궁을 파괴하고 건립(1916 착공~1926 완공), 1995년 철거\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;헌병 경찰제와 악법\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;헌병 경찰제: 군인인 헌병이 경찰 업무 담당 → 무단 통치의 군사적 성격\u003c/li&gt;\n\u003cli&gt;주재소·파출소를 통해 독립운동 탄압 + 납세 강요, 위생 단속 등 일상 감시\u003c/li&gt;\n\u003cli&gt;범죄 즉결례(1910): 헌병 분대장·경찰서장이 재판 없이 처벌\u003c/li&gt;\n\u003cli&gt;조선 태형령(1912): 한국인에게만 태형 적용\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;사료 포인트 – 조선 태형령: &amp;quot;태로 볼기를 때려 집행&amp;quot;, &amp;quot;본령은 조선인에 한해 적용&amp;quot; → 1910년대 무단 통치\n신문 기사(《매일신보》): 익지 않은 감 판매, 웃통을 벗고 노동했다는 이유로 태형 → 일상까지 통제\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;\u003cstrong&gt;자유 제한과 식민지 교육\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;언론·출판·집회·결사의 자유 불허. 총독부 기관지 《매일신보》만 남기고 한국어 신문 폐간\u003c/li&gt;\n\u003cli&gt;애국 계몽 단체·학회는 물론 일진회 같은 친일 단체까지 해산\u003c/li&gt;\n\u003cli&gt;관리뿐 아니라 교사도 제복을 입고 칼을 참\u003c/li&gt;\n\u003cli&gt;제1차 조선 교육령(1911): 일본어·일본 역사를 &amp;#39;국어&amp;#39;·&amp;#39;국사&amp;#39;로 중시, 주로 초등 교육과 실업 교육, 고등 교육 기회 거의 없음, 사립 학교·서당 탄압\u003c/li&gt;\n\u003cli&gt;교육 차별: 일본인 소학교 6년제 vs 한국인 보통학교 4년제 / 1919년 취학률 일본인 91.5%, 한국인 3.7%\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;사료 포인트 – 제1차 조선 교육령: &amp;quot;국민다운 성격을 함양하며, 일본어를 보급&amp;quot;, &amp;quot;실업 교육&amp;quot; → 1911년\n소설 〈만세전〉(염상섭, 1922): &amp;quot;헌병 주재소&amp;quot;, &amp;quot;학교 선생님이 사벨(칼)을 차고 교단에&amp;quot; → 무단 통치 시기\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003ch3&gt;01-2 일제의 &amp;#39;문화 정치&amp;#39; (13~15쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;제1차 세계 대전과 민족 자결주의\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;제1차 세계 대전(1914~1918): 동맹국(독일, 오스트리아-헝가리 등) vs 연합국(영국, 프랑스, 러시아 등, 이후 이탈리아·미국 가담). 일본은 영일 동맹으로 연합국 참전\u003c/li&gt;\n\u003cli&gt;미국 윌슨 대통령: 민족 자결주의를 포함한 14개조 평화 원칙 → 파리 강화 회의 → 베르사유 조약(독일 식민지 상실, 배상금)\u003c/li&gt;\n\u003cli&gt;민족 자결주의는 동유럽 등 일부에만 적용, 승전국 식민지는 유지. 패전국 식민지는 국제 연맹(1920)의 위임 통치\u003c/li&gt;\n\u003cli&gt;일본: 국제 연맹 상임 이사국, 독일의 태평양 식민지 통치를 위임받음\u003c/li&gt;\n\u003cli&gt;러시아 혁명(1917) → 레닌이 민족 자결 원칙 표명 → 코민테른(1919) → 소련 수립(1922). 많은 한국인이 사회주의 운동에 참가\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;문화 정치의 표면과 실상\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;배경: 1919년 3·1 운동 → 일제가 민족 문화와 관습을 존중한다며 &amp;#39;문화 정치&amp;#39; 표방\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;표면(선전)\u003c/th&gt;\n\u003cth&gt;실상\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;문관도 총독에 임명 가능\u003c/td&gt;\n\u003ctd&gt;식민 통치가 끝날 때까지 문관 총독 단 한 명도 없음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;관리·교사의 제복·칼 폐지, 헌병 경찰제 → 보통 경찰제\u003c/td&gt;\n\u003ctd&gt;경찰 수 증가(경찰 관서 1,861개→2,761개, 인원 13,380명→18,376명, 1918→1920), 치안 유지법(1925) 제정\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;언론·출판·집회·결사의 자유 일부 허용, 《동아일보》·《조선일보》 창간\u003c/td&gt;\n\u003ctd&gt;엄격한 검열로 기사 삭제, 심하면 정간\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;제2차 조선 교육령(연표상 1922): 보통학교 4년 → 6년 가능, &amp;#39;3면 1교&amp;#39; 정책\u003c/td&gt;\n\u003ctd&gt;학교 수 부족, 운영비는 주민 부담 → 여전히 많은 한국인이 교육을 받지 못함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;도 평의회, 부·면 협의회 의원 일부를 선거로 선출\u003c/td&gt;\n\u003ctd&gt;의결권 없이 자문만, 선거권은 일정액 이상 세금 낸 사람만\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;1930년대 지방 제도 개편: 의결 권한이 일부 주어진 도회·부회·읍회로 바뀌었으나 한국인 참여는 여전히 제한\u003c/li&gt;\n\u003cli&gt;양반, 실업가, 교육가, 종교인 등 각계에 친일 세력 양성, 친일 단체 후원·육성\u003c/li&gt;\n\u003cli&gt;결론: 문화 정치 = 민족 운동을 탄압하고 친일 세력을 양성해 저항을 무력화하려는 민족 분열 정책\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;치안 유지법(1925)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;본래 일본에서 사회주의 탄압을 위해 만든 법 → 한국에서는 사회주의 운동 + 민족주의 운동에도 적용\u003c/li&gt;\n\u003cli&gt;1930년 총독부 고등 법원 판결: 조선 독립 추구 = &amp;#39;국체 변혁&amp;#39;\u003c/li&gt;\n\u003cli&gt;1928년 개정: 국체 변혁 최고형을 사형으로\u003c/li&gt;\n\u003cli&gt;&amp;#39;행위&amp;#39;가 없어도 &amp;#39;사상&amp;#39;만으로 처벌 가능한 악법\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;사료 포인트 – 치안 유지법: &amp;quot;국체(천황제)를 변혁하거나 사유 재산 제도를 부인&amp;quot;, 제7조 &amp;quot;시행 구역 외에서 죄를 범한 자에게도 적용&amp;quot;(해외 독립운동가 처벌)\n사이토 마코토 총독의 관제 개정 취지(1919): &amp;quot;일시동인&amp;quot;, &amp;quot;문무관 누구라도 임용&amp;quot;, &amp;quot;보통 경찰&amp;quot;, &amp;quot;제복 대검 폐지&amp;quot; → 문화 정치\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003ch3&gt;01-3 민족 말살 정책과 전시 동원 체제 (16~19쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;대공황과 파시즘, 일본의 침략 확대\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1929년 뉴욕 증권 거래소 주가 폭락 → 대공황\u003c/li&gt;\n\u003cli&gt;미국: 뉴딜 정책 / 영국·프랑스: 블록 경제\u003c/li&gt;\n\u003cli&gt;이탈리아·독일·일본: 파시즘 대두(독일 나치즘, 일본 군국주의도 파시즘의 한 갈래) → 내부 결속과 대외 침략\u003c/li&gt;\n\u003cli&gt;방공 협정(반코민테른 협정): 1936 일본·독일, 1937 이탈리아 참가\u003c/li&gt;\n\u003cli&gt;일본: 만주 사변(1931) → 만주국 → 중일 전쟁(1937) → 제2차 세계 대전(1939) 중 &amp;#39;대동아 공영권&amp;#39; 내걸고 동남아시아 침략 → 진주만 기습, 태평양 전쟁(1941) → 연합국 승리(1945)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;민족 말살 정책(황국 신민화)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;목적: 민족의식을 억누르고 한국인을 전쟁에 원활하게 동원\u003c/li&gt;\n\u003cli&gt;내선일체: 내지(일본)와 조선이 하나가 되면 차별이 없어진다고 선전 → 한국인을 황국 신민으로\u003c/li&gt;\n\u003cli&gt;1938년 조선 교육령 개정: 일본인·한국인 학교 통합, 한국어·한국사 과목 사실상 폐지. 이즈음 학교·관공서에서 한국어 사용 금지\u003c/li&gt;\n\u003cli&gt;1941년 초등 교육 기관 명칭을 국민학교로 변경\u003c/li&gt;\n\u003cli&gt;황국 신민 서사 암송(일본에도 없던 것), 매월 1일 애국일 신사 참배 의무화, 궁성 요배\u003c/li&gt;\n\u003cli&gt;1940년 창씨개명 강요 → 따르지 않으면 불이익(식량 배급 제외, 자녀 입학 거부, 취업 불이익)\u003c/li&gt;\n\u003cli&gt;조선 사상범 보호 관찰령(1936): 형기를 마친 독립운동가 계속 감시\u003c/li&gt;\n\u003cli&gt;조선 사상범 예방 구금령(1941): 죄를 지을 가능성만으로 미리 구금\u003c/li&gt;\n\u003cli&gt;1940년 《동아일보》·《조선일보》 폐간\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;사료 포인트 – 황국 신민 서사: &amp;quot;대일본 제국의 신민&amp;quot;, &amp;quot;천황 폐하에게 충의&amp;quot; → 1930년대 후반 민족 말살 정책\n《대구 여학생 일기》(1937): 애국일, &amp;quot;국어(일본어) 상용&amp;quot;, 황국 신민 서사 → 학교 통제·동원\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;\u003cstrong&gt;전시 동원 체제\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1938년 국민정신 총동원 조선 연맹 → 말단 조직 애국반(10호씩): 주민 감시, 물자 배급\u003c/li&gt;\n\u003cli&gt;1938년 국가 총동원법 제정\u003c/li&gt;\n\u003cli&gt;노동력: 모집, 관 알선 → 국민 징용령(1939)으로 대규모 동원. 국외로만 100만 명 이상. 탄광·토목 공사장·공장에서 강제 노동(예: 하시마섬 탄광)\u003c/li&gt;\n\u003cli&gt;군인: 육군 특별 지원병제(1938) → 학도 지원병제(1943, 전문학교·대학 재학생) → 징병제(1944) → 20만 명 이상이 군인·군무원으로 동원, 2만 명 이상 사망\u003c/li&gt;\n\u003cli&gt;여성: 여자 근로 정신대 등으로 공장 동원, 일본군 &amp;#39;위안부&amp;#39;로 끌고 감(군 위안소는 1930년대 초반부터 운영, 전쟁 확대와 함께 조직적으로 확대)\u003c/li&gt;\n\u003cli&gt;포로 감시원 동원 사례(오행석), 일본군 &amp;#39;위안부&amp;#39; 피해자 김순덕의 그림 등 → 2013년 관련 기록물이 국가 지정 기록물로 지정\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;02-1 식민지 경제 체제의 구축 (20~22쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;토지 조사 사업(1910~1918)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;목적: 지세를 안정적으로 확보해 식민 통치의 경제적 기반 마련 + 일본인의 토지 소유를 쉽게\u003c/li&gt;\n\u003cli&gt;근거: 토지 조사령(1912) – 소유자가 정해진 기간 안에 신고\u003c/li&gt;\n\u003cli&gt;토지 소유권 확정, 농민이 경작을 이어 갈 수 있던 관행 등은 인정하지 않음\u003c/li&gt;\n\u003cli&gt;왕실·관청 소유 명목이지만 농민이 대대로 경작·매매해 온 땅까지 국유지로 편입 → 소유권 분쟁 → 국유지를 동양 척식 주식회사나 일본인 지주에게 팔아넘김\u003c/li&gt;\n\u003cli&gt;결과: 과세 토지 면적 증가 → 총독부 지세 수입 크게 증가 / 일본인 대지주·농업 회사의 토지 소유 확대 / 토지를 잃은 농민은 소작농으로 전락, 높은 소작료 부담\u003c/li&gt;\n\u003cli&gt;농가 경작 형태(1913→1920): 소작농 32.4% → 39.8%, 자작농 22.8% → 19.5%\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;산림·자원 장악\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;삼림령(1911), 임야 조사 사업(1917~1924) → 많은 임야가 국유림으로 편입(1925년 약 16만 km² 중 약 9만 km² 이상)\u003c/li&gt;\n\u003cli&gt;동양 척식 주식회사 등 일본인 회사와 일부 조선인이 총독부가 대여한 산림 경영 → 농민은 땔감·퇴비 원료를 얻기 어려워짐\u003c/li&gt;\n\u003cli&gt;어업령, 광업령 → 수산물·지하자원 통제 강화\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;사료 포인트 – 《동아일보》(1927): &amp;quot;국유림으로 편입&amp;quot;, &amp;quot;삼림 보호라는 미명&amp;quot;, &amp;quot;화전민들의 목숨이 끊어지게&amp;quot; → 임야 조사 사업의 결과\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;\u003cstrong&gt;회사령과 금융\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;회사령(1910): 한국인의 기업 활동 제한, 일본 기업 진출을 선별적으로 지원. 회사 설립은 조선 총독의 허가 필요(허가제), 조건 위반 시 총독이 폐쇄(해산) 가능\u003c/li&gt;\n\u003cli&gt;통감부가 설치한 한국은행(1909) → 조선은행으로 바꿈, 조선은행권 발행\u003c/li&gt;\n\u003cli&gt;조선 식산 은행: 식민지 산업 개발 자금 조달\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;교통망\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;경부선·경의선에 이어 1914년 경원선·호남선 완공 → 서울 중심 X 자형 간선 철도망\u003c/li&gt;\n\u003cli&gt;도로 건설, 부산·인천·목포 등 항만 확충(부산항 제1 부두 1912, 제2 부두 1917)\u003c/li&gt;\n\u003cli&gt;결과: 한국 물자 수탈 수단, 만주까지 이어져 대륙 진출의 발판. 부산은 대륙 침략의 관문\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;02-2 수탈과 개발의 식민지 경제 (23~25쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;산미 증식 계획(1920~1934)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;배경: 제1차 세계 대전 이후 일본의 도시화·산업화 → 쌀 부족, 쌀값 폭등, 쌀 소동\u003c/li&gt;\n\u003cli&gt;목적: 한국의 쌀 생산을 늘려 일본으로 가져가 일본 식량 문제 해결\u003c/li&gt;\n\u003cli&gt;방법: 일본 벼 품종 보급, 수리 조합 설치·수리 시설 확충, 화학 비료 사용, 밭을 논으로 전환\u003c/li&gt;\n\u003cli&gt;결과: 생산량은 계획만큼 늘지 않았지만 일본 반출은 예정대로 → 한국인 1인당 쌀 소비량 감소, 만주산 잡곡으로 끼니 / 농민은 수리 조합비·비룟값 부담, 지주는 소작료 인상\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;회사령 폐지(1920)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;제1차 세계 대전으로 일본 자본 축적 → 일본 자본 진출을 돕는 쪽으로 전환 → 허가제에서 신고제로\u003c/li&gt;\n\u003cli&gt;1920년대 일본 자본 투자 급증: 소비재 중소기업 + 미쓰이, 미쓰비시, 노구치 등 대기업 진출\u003c/li&gt;\n\u003cli&gt;한국인 회사도 늘었지만 대부분 소규모\u003c/li&gt;\n\u003cli&gt;1923년 일본 상품 관세 폐지 → 값싼 일본 상품 유입, 한국인 회사 더 어려워짐\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;식민지 공업화(1930년대)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;배경: 1929년 대공황 → 1931년 만주 사변 → 한국·만주·일본을 하나의 경제 블록으로\u003c/li&gt;\n\u003cli&gt;한국 = 농업 지대 만주와 공업 지대 일본을 잇는 중간 지대 → 일본 본국에 종속된 식민지 공업화\u003c/li&gt;\n\u003cli&gt;일본 독점 자본이 총독부 지원 받아 진출, 지하자원·수력 자원이 풍부한 한반도 북부 중심\u003c/li&gt;\n\u003cli&gt;노구치 재벌: 부전강 수력 발전소 + 흥남 조선 질소 비료 공장(1927) → 흥남은 신흥 공업 도시. 사장 노구치가 흥남 읍장도 맡음(자본과 권력의 유착)\u003c/li&gt;\n\u003cli&gt;한국인 자본: 섬유·고무신 등 특정 소비재, 소규모 가내 공업 중심\u003c/li&gt;\n\u003cli&gt;공업 원료 확보: 광산 개발, 면화 재배, 양모 생산 독려 → 남면북양 정책(남부 면화, 북부 양 사육)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;식민지 개발의 그늘\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;이익은 일본 자본에 집중, 한국인 노동자는 임금·노동 환경 차별\u003c/li&gt;\n\u003cli&gt;일본과 달리 공장법이 적용되지 않아 가혹한 노동\u003c/li&gt;\n\u003cli&gt;조선 질소 비료 공장 건설 때 농민·어민의 저항을 경찰이 막음, 오염 물질로 물고기 떼죽음. 일본은 폐수 정화 시설, 한국은 폐수 방류가 관행\u003c/li&gt;\n\u003cli&gt;소설 《질소 비료 공장》(이북명, 1932): 일본인 노동자 1명 비용으로 조선인 10명 이상 → 한국인 노동자의 비참한 현실\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;농촌 진흥 운동과 조선 농지령\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;배경: 1930년대 대공황으로 농민 생활 악화, 소작 쟁의 격화\u003c/li&gt;\n\u003cli&gt;농촌 진흥 운동(1932~): 근검절약하면 자작농이 될 수 있다고 선전 → 수탈 구조는 그대로, 가난을 게으름·무지 탓으로 돌려 효과 없음\u003c/li&gt;\n\u003cli&gt;조선 농지령(1934): 소작 기간 명시 의무화(3년 이상), 지주가 함부로 소작권을 박탈하지 못하게 함 → 한계: 고율 소작료, 지세 부담 전가 문제는 다루지 않음\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;사료 포인트 – 조선 농지령: &amp;quot;소작지의 임대차 기간은 3년 이상&amp;quot; → 1934년\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003ch3&gt;02-3 전시 통제 경제와 수탈의 강화 (26~27쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;병참 기지화 정책\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1937년 중일 전쟁 → 한국 경제를 전시 통제 경제로 재편, 한국을 군수 물자 공급의 병참 기지로\u003c/li&gt;\n\u003cli&gt;공업 구조가 군수 산업 위주로: 금속·기계·화학 공업 지원, 일본인 독점 자본 주도\u003c/li&gt;\n\u003cli&gt;결과: 소비재 산업 위축, 많은 한국인 공장 폐업, 남은 기업도 원자재 부족으로 생산 감소\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;국가 총동원법(1938)과 수탈\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;모든 인적·물적 자원을 통제 → 인력 + 자원·식량 수탈\u003c/li&gt;\n\u003cli&gt;공출: 석탄·철광석 등 지하자원, 농기구·놋그릇·가마솥, 교회의 종·사찰의 불상까지\u003c/li&gt;\n\u003cli&gt;가장 괴로웠던 식량 수탈: 산미 증식 계획 다시 시행, 미곡 공출제·식량 배급제 → 곡식을 헐값에 넘기고 부족한 배급\u003c/li&gt;\n\u003cli&gt;강제 저축, 국방헌금 강요\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;사료 포인트 – 국가 총동원법: &amp;quot;전시에 국방 목적&amp;quot;, &amp;quot;인적·물적 자원을 통제·운용&amp;quot;, &amp;quot;제국 신민을 징용&amp;quot; → 1938년, 전시 동원 체제\n총독부 농상국 홍보물: &amp;quot;한 알의 쌀이라도 더 많이 나라에 바쳐서&amp;quot;, &amp;quot;공출미는 우리 마을의 공동 책임&amp;quot; → 미곡 공출\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003ch3&gt;(특집) 해외로 이주한 한국인의 삶 (28~29쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;1945년 전체 인구의 약 1/5, 약 400만 명 이상이 해외 거주\u003c/li&gt;\n\u003cli&gt;만주: 국권 피탈 후 본격 이주, 1910년대 후반 약 40만 명 → 독립운동 기지·무장 투쟁 기반. 1930년대 일제의 농업 이민 장려로 증가\u003c/li&gt;\n\u003cli&gt;연해주: 19세기 중반 함경도 농민 이주(&amp;#39;카레이스키&amp;#39;), 독립운동 근거지 → 1937년 소련이 약 17만 명을 중앙아시아로 강제 이주\u003c/li&gt;\n\u003cli&gt;일본: 1910년대 후반 본격화(생활고), 저임금 노동. 1923년 간토 대지진 때 허위 사실 유포로 한국인 학살\u003c/li&gt;\n\u003cli&gt;미주: 하와이 노동 이민(1902~1905, 약 7,000여 명), 사진 신부, 멕시코 이주(1905, 1,000여 명)\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 헷갈리는 것 비교&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;A\u003c/th&gt;\n\u003cth&gt;B\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;경찰 제도\u003c/td&gt;\n\u003ctd&gt;1910년대 헌병 경찰제: 군인(헌병)이 경찰 업무\u003c/td&gt;\n\u003ctd&gt;1920년대 보통 경찰제: 그런데 경찰 수는 오히려 증가\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;처벌 법령\u003c/td&gt;\n\u003ctd&gt;범죄 즉결례(1910): 재판 없이 처벌\u003c/td&gt;\n\u003ctd&gt;조선 태형령(1912): 한국인에게만 태형\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;사상 통제 법령\u003c/td&gt;\n\u003ctd&gt;치안 유지법(1925): 사상만으로 처벌, 1928년 최고형 사형\u003c/td&gt;\n\u003ctd&gt;보호 관찰령(1936): 풀려난 사람 감시 / 예방 구금령(1941): 미리 가둠\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;교육\u003c/td&gt;\n\u003ctd&gt;제1차(1911): 보통학교 4년, 일본어 보급·실업 교육 / 제2차(연표 1922): 6년 가능, 3면 1교\u003c/td&gt;\n\u003ctd&gt;1938년 개정: 한국어·한국사 사실상 폐지 / 1941년 국민학교\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;신문\u003c/td&gt;\n\u003ctd&gt;1910년대: 《매일신보》만 남김\u003c/td&gt;\n\u003ctd&gt;1920년대: 《동아일보》·《조선일보》 창간(검열) → 1940년 폐간\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;지방 기구\u003c/td&gt;\n\u003ctd&gt;1920년대 도 평의회·부·면 협의회: 자문만\u003c/td&gt;\n\u003ctd&gt;1930년대 도회·부회·읍회: 의결권 일부, 참여는 여전히 제한\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;회사령\u003c/td&gt;\n\u003ctd&gt;제정 1910: 허가제, 한국인 기업 활동 제한\u003c/td&gt;\n\u003ctd&gt;폐지 1920: 신고제, 일본 자본 진출 돕기 위함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;조사 사업\u003c/td&gt;\n\u003ctd&gt;토지 조사 사업(1910~1918): 토지 조사령(1912), 지세 확보\u003c/td&gt;\n\u003ctd&gt;임야 조사 사업(1917~1924): 삼림령(1911), 국유림 편입\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;산미 증식 계획\u003c/td&gt;\n\u003ctd&gt;1920~1934: 일본 쌀 부족 해결 목적, 생산 증가 &amp;lt; 반출\u003c/td&gt;\n\u003ctd&gt;중일 전쟁 이후 다시 시행: 군량미 조달 + 미곡 공출제·식량 배급제\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;공업화\u003c/td&gt;\n\u003ctd&gt;1930년대 식민지 공업화: 북부 중심, 대공황 극복·경제 블록\u003c/td&gt;\n\u003ctd&gt;중일 전쟁 이후 병참 기지화: 군수 산업(금속·기계·화학) 중심\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;남면북양\u003c/td&gt;\n\u003ctd&gt;남부 = 면화\u003c/td&gt;\n\u003ctd&gt;북부 = 양(양모)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;농촌 정책\u003c/td&gt;\n\u003ctd&gt;농촌 진흥 운동(1932~): 근검절약 강조, 효과 없음\u003c/td&gt;\n\u003ctd&gt;조선 농지령(1934): 소작 기간 3년 이상, 소작료 문제는 방치\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;병력 동원 순서\u003c/td&gt;\n\u003ctd&gt;육군 특별 지원병제(1938) → 학도 지원병제(1943)\u003c/td&gt;\n\u003ctd&gt;→ 징병제(1944)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;노동력 동원\u003c/td&gt;\n\u003ctd&gt;모집, 관 알선\u003c/td&gt;\n\u003ctd&gt;→ 국민 징용령(1939)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1938년에 한꺼번에\u003c/td&gt;\n\u003ctd&gt;조선 교육령 개정, 국민정신 총동원 조선 연맹(애국반)\u003c/td&gt;\n\u003ctd&gt;국가 총동원법, 육군 특별 지원병제\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 예상 문제&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;1.\u003c/strong&gt; 다음 법령이 시행되던 시기의 모습으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;제1조 3개월 이하의 징역 또는 구류에 처해야 하는 자는 그 상황에 따라 태형에 처할 수 있다.\n제13조 본령은 조선인에 한해 적용한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 《동아일보》가 창간되어 한국어 신문이 발행되었다.\n② 학생들이 매일 아침 궁성 요배를 하였다.\n③ 헌병이 경찰 업무를 담당하며 한국인의 일상을 감시하였다.\n④ 산미 증식 계획으로 많은 쌀이 일본으로 반출되었다.\n⑤ 초등 교육 기관의 명칭이 국민학교로 바뀌었다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2.\u003c/strong&gt; 다음은 조선 총독이 발표한 내용이다. 밑줄 친 &amp;#39;제도의 혁신&amp;#39; 이후 나타난 실상으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;총독은 문무관 누구라도 임용할 수 있는 길을 열고 나아가 헌병에 의한 경찰 제도 대신 보통 경찰에 의한 경찰 제도로 바꾸었다. …… 요컨대 문화적 &amp;lt;u&amp;gt;제도의 혁신&amp;lt;/u&amp;gt;을 통해 조선인을 이끌어서 ……\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 문관 출신 총독이 여러 차례 임명되었다.\n② 보통 경찰제 시행 후 경찰 관서와 인원이 줄었다.\n③ 모든 한국인에게 지방 자문 기구의 선거권이 주어졌다.\n④ 한국어 신문 창간을 허용했지만 엄격히 검열해 기사를 삭제하거나 정간시켰다.\n⑤ 보통학교 수업 연한을 6년에서 4년으로 줄였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3.\u003c/strong&gt; 다음 법에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;제1조 ① 국체(천황제)를 변혁하거나 사유 재산 제도를 부인하는 것을 목적으로 결사를 조직하거나 이에 가입한 자는 10년 이하의 징역 또는 금고에 처한다.\n제7조 이 법은 시행 구역 외에서 죄를 범한 자에게도 적용한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 1910년대 무단 통치를 뒷받침하기 위해 제정되었다.\n② 본래 일본에서 사회주의 탄압을 위해 만들어졌으나 한국에서는 민족주의 운동에도 적용되었다.\n③ 1928년 개정으로 최고형이 무기 징역으로 낮아졌다.\n④ 범죄에 해당하는 행위를 저지른 경우에만 처벌할 수 있었다.\n⑤ 해외로 망명한 독립운동가에게는 적용되지 않았다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4.\u003c/strong&gt; 1920년대 일제의 지방 제도에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 고른 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;ㄱ. 도 평의회, 부·면 협의회의 의원 일부를 선거로 뽑았다.\nㄴ. 도 평의회, 부·면 협의회는 의결 권한을 가졌다.\nㄷ. 선거권은 일정액 이상 세금을 내는 사람에게만 주어졌다.\nㄹ. 일제는 친일 단체를 해산시켜 민족 분열을 막았다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄱ, ㄷ　③ ㄴ, ㄷ　④ ㄴ, ㄹ　⑤ ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5.\u003c/strong&gt; 다음 사료를 외우도록 강요한 시기 일제의 정책으로 옳지 않은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003col&gt;\n\u003cli&gt;우리들은 대일본 제국의 신민입니다.\u003c/li&gt;\n\u003cli&gt;우리들은 마음을 합해 천황 폐하에게 충의를 다합니다.\u003c/li&gt;\n\u003cli&gt;우리들은 인고 단련해 훌륭하고 강한 국민이 되겠습니다.\u003c/li&gt;\n\u003c/ol&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 매월 1일을 애국일로 정해 신사 참배를 의무화했다.\n② 성과 이름을 일본식으로 바꾸는 창씨개명을 강요했다.\n③ 조선 교육령을 개정해 한국어와 한국사 과목을 사실상 폐지했다.\n④ 죄를 지을 가능성이 있다는 이유만으로 미리 사람을 가둘 수 있게 했다.\n⑤ 제1차 조선 교육령을 공포해 한국인에게 주로 초등 교육과 실업 교육을 실시했다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6.\u003c/strong&gt; 다음 사건을 일어난 순서대로 옳게 나열한 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 치안 유지법 제정　(나) 조선 태형령 제정\n(다) 창씨개명 강요　　(라) 국가 총동원법 제정\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① (가)-(나)-(다)-(라)\n② (나)-(가)-(다)-(라)\n③ (나)-(가)-(라)-(다)\n④ (나)-(라)-(가)-(다)\n⑤ (라)-(나)-(가)-(다)\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7.\u003c/strong&gt; 다음 법령에 따라 실시된 사업에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;제4조 토지의 소유자는 조선 총독이 정하는 기간 내에 그 주소, 성명·명칭 및 소유지의 소재, 지목, …… 결 수를 임시 토지 조사 국장에게 신고해야 한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 농민이 토지를 이용해 경작을 이어 갈 수 있었던 관행 등을 인정하지 않았다.\n② 사업 결과 조선 총독부의 지세 수입이 줄어들었다.\n③ 1920년부터 1934년까지 실시되었다.\n④ 늘어난 국유지를 한국인 소작농에게 나누어 주었다.\n⑤ 삼림령을 근거로 임야를 조사한 사업이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8.\u003c/strong&gt; 다음 법령에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;제1조 회사의 설립은 조선 총독의 허가를 받아야 한다.\n제5조 회사가 허가한 조건을 위반하거나 …… 조선 총독은 회사의 해산을 명할 수 있다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 한국인의 기업 활동을 장려하기 위해 제정되었다.\n② 신고만 하면 누구나 회사를 세울 수 있었다.\n③ 대공황을 극복하기 위해 1930년대에 공포되었다.\n④ 1920년에 폐지되어 회사 설립이 신고제로 바뀌었다.\n⑤ 폐지된 뒤 한국인 회사는 대부분 대기업으로 성장했다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9.\u003c/strong&gt; 산미 증식 계획에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 고른 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;ㄱ. 일본의 쌀값 폭등과 쌀 소동 등 식량 문제를 해결하려는 목적이었다.\nㄴ. 쌀 생산량이 계획보다 크게 늘어 한국인 1인당 쌀 소비량이 증가했다.\nㄷ. 지주들이 소작료를 낮추어 농민 생활이 나아졌다.\nㄹ. 한국인들은 쌀 대신 만주에서 수입한 잡곡으로 끼니를 때워야 했다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄱ, ㄷ　③ ㄱ, ㄹ　④ ㄴ, ㄷ　⑤ ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10.\u003c/strong&gt; 밑줄 친 &amp;#39;정책&amp;#39;이 추진되던 시기의 모습으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;대공황 이후 조선 총독부는 한국을 농업 지대인 만주와 공업 지대인 일본을 잇는 중간 지대로 설정하고 일본 본국에 종속된 식민지 공업화 &amp;lt;u&amp;gt;정책&amp;lt;/u&amp;gt;을 추진했다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 공장법이 적용되어 한국인 노동자의 노동 시간이 규제되었다.\n② 지하자원과 수력 자원이 풍부한 한반도 북부 지방을 중심으로 공업화가 진척되었다.\n③ 한반도 남부에서는 양을, 북부에서는 면화를 기르게 했다.\n④ 한국인 자본이 중심이 되어 대규모 비료 공장을 세웠다.\n⑤ 한국에도 폐수 정화 시설을 갖추어 환경 피해가 거의 없었다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11.\u003c/strong&gt; 다음 법령에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;제1조 본령은 경작을 목적으로 하는 토지의 임대차에 적용한다.\n제7조 소작지의 임대차 기간은 3년 이상으로 해야 한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 1910년대 무단 통치기에 제정되었다.\n② 소작료를 낮추도록 규정해 소작농의 부담을 크게 줄였다.\n③ 지세를 지주가 부담하도록 명시했다.\n④ 농민이 근검절약하면 자작농이 될 수 있다고 선전한 운동이다.\n⑤ 지주가 함부로 소작권을 박탈하지 못하도록 정했다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12.\u003c/strong&gt; 다음 법이 제정된 이후의 사실로 옳지 않은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;제1조 국가 총동원이란 전시에 국방 목적을 달성하기 위해 국가의 전력을 가장 유효하게 발휘하도록 인적·물적 자원을 통제·운용하는 것을 말한다.\n제4조 정부는 전시에 국가 총동원상 필요할 때에는 칙령이 정하는 바에 따라 제국 신민을 징용해 ……\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 회사를 세우려면 조선 총독의 허가를 받도록 했다.\n② 농기구, 놋그릇, 가마솥 등 금속 제품을 공출했다.\n③ 미곡 공출제와 식량 배급제를 단행했다.\n④ 국민 징용령을 시행해 대규모로 노동력을 동원했다.\n⑤ 징병제를 실시해 한국인을 군인으로 동원했다.\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;번호\u003c/th&gt;\n\u003cth&gt;1\u003c/th&gt;\n\u003cth&gt;2\u003c/th&gt;\n\u003cth&gt;3\u003c/th&gt;\n\u003cth&gt;4\u003c/th&gt;\n\u003cth&gt;5\u003c/th&gt;\n\u003cth&gt;6\u003c/th&gt;\n\u003cth&gt;7\u003c/th&gt;\n\u003cth&gt;8\u003c/th&gt;\n\u003cth&gt;9\u003c/th&gt;\n\u003cth&gt;10\u003c/th&gt;\n\u003cth&gt;11\u003c/th&gt;\n\u003cth&gt;12\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;정답\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003col&gt;\n\u003cli&gt;③ 조선 태형령(1912) → 1910년대 무단 통치, 헌병 경찰제. ①④ 1920년대, ②⑤ 1930년대 후반 이후(국민학교는 1941년).\u003c/li&gt;\n\u003cli&gt;④ 사이토 총독의 관제 개정 → 문화 정치. 신문 창간은 허용했으나 검열·삭제·정간. ① 문관 총독은 한 명도 없음 ② 경찰 수는 늘어남 ③ 선거권은 일정액 이상 납세자만 ⑤ 4년 → 6년으로 늘릴 수 있게 함.\u003c/li&gt;\n\u003cli&gt;② 치안 유지법(1925). ① 1920년대 ③ 1928년 개정으로 최고형이 사형 ④ &amp;#39;사상&amp;#39;만으로도 처벌 ⑤ 제7조로 해외 독립운동가도 처벌.\u003c/li&gt;\n\u003cli&gt;② ㄴ: 의결 권한 없이 자문만 수행. ㄹ: 친일 단체를 후원·육성함(1910년대에 일진회 등 친일 단체까지 해산한 것과 헷갈리지 말 것).\u003c/li&gt;\n\u003cli&gt;⑤ 황국 신민 서사 → 민족 말살 정책 시기. 제1차 조선 교육령은 1911년(무단 통치). ④는 조선 사상범 예방 구금령(1941).\u003c/li&gt;\n\u003cli&gt;③ 조선 태형령(1912) → 치안 유지법(1925) → 국가 총동원법(1938) → 창씨개명(1940).\u003c/li&gt;\n\u003cli&gt;① 토지 조사령(1912) → 토지 조사 사업(1910~1918). ② 지세 수입 크게 증가 ③ 산미 증식 계획 기간 ④ 동양 척식 주식회사·일본인 지주에게 팔아넘김 ⑤ 임야 조사 사업 설명.\u003c/li&gt;\n\u003cli&gt;④ 회사령(1910, 허가제). ① 한국인 기업 활동 제한 ② 폐지 이후의 신고제 ③ 1910년 공포 ⑤ 한국인 회사는 대부분 소규모, 1923년 관세 폐지로 더 어려워짐.\u003c/li&gt;\n\u003cli&gt;③ ㄴ: 생산량은 계획대로 늘지 않았고 반출은 예정대로 → 1인당 소비량 감소. ㄷ: 지주들이 소작료를 올림, 수리 조합비·비룟값도 부담.\u003c/li&gt;\n\u003cli&gt;② ① 공장법 미적용 ③ 남면북양 = 남부 면화, 북부 양 ④ 조선 질소 비료 공장은 일본 노구치 재벌 ⑤ 한국에서는 폐수 방류가 관행, 물고기 떼죽음.\u003c/li&gt;\n\u003cli&gt;⑤ 조선 농지령(1934). ①③ 해당 없음, ② 고율 소작료 문제를 다루지 않은 한계 ④ 농촌 진흥 운동(1932~)에 대한 설명.\u003c/li&gt;\n\u003cli&gt;① 국가 총동원법(1938) 이후 전시 동원·수탈. 회사 설립 허가제는 1910년 회사령(1920년 폐지). ④ 국민 징용령 1939 ⑤ 징병제 1944.\u003c/li&gt;\n\u003c/ol&gt;\n&quot;}]},{&quot;id&quot;:&quot;history-movement&quot;,&quot;subject&quot;:&quot;한국사&quot;,&quot;title&quot;:&quot;② 다양한 민족 운동&quot;,&quot;file&quot;:&quot;한국사_정리_2_민족운동.md&quot;,&quot;range&quot;:&quot;교과서 30~47쪽&quot;,&quot;flow&quot;:[[&quot;1910년대&quot;,&quot;독립운동의 기반&quot;,&quot;국내 비밀 결사 · 국외 기지 · 독립군 양성&quot;],[&quot;1919&quot;,&quot;3·1 운동 → 임시 정부&quot;,&quot;모든 계층의 참여 / 민주 공화제 정부&quot;],[&quot;1920~1921&quot;,&quot;무장 투쟁의 전개&quot;,&quot;봉오동 → 청산리 → 간도 참변 → 자유시 참변&quot;],[&quot;1926~1929&quot;,&quot;민족 협동 전선&quot;,&quot;6·10 만세 운동 · 정우회 선언 → 신간회 → 광주 학생 항일 운동&quot;],[&quot;1931~1932&quot;,&quot;한인 애국단&quot;,&quot;김구 / 이봉창 · 윤봉길 의거&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;이름이 비슷한 단체 구분&quot;,&quot;head&quot;:[&quot;단체&quot;,&quot;인물&quot;,&quot;핵심 단서&quot;],&quot;rows&quot;:[[&quot;독립 의군부&quot;,&quot;임병찬&quot;,&quot;복벽주의&quot;],[&quot;대한 광복회&quot;,&quot;박상진&quot;,&quot;공화제 정부 수립&quot;],[&quot;의열단&quot;,&quot;김원봉&quot;,&quot;1919 / 조선 혁명 선언(신채호)&quot;],[&quot;신간회&quot;,&quot;이상재 · 홍명희&quot;,&quot;1927 / 민족 협동 전선&quot;],[&quot;한인 애국단&quot;,&quot;김구&quot;,&quot;1931 / 이봉창 · 윤봉길&quot;]]},&quot;note&quot;:&quot;연표는 주요 사건만 추림. 세부 연도·사료·독립운동 기지는 아래 원문에서 확인.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;천재교육(정요근) 한국사2 Ⅰ단원. 이 파일의 내용은 모두 교과서 본문·사료·지도·연표에 근거함.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 한눈에 보기 (연도순)&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;연도\u003c/th&gt;\n\u003cth&gt;사건\u003c/th&gt;\n\u003cth&gt;핵심 인물·단체\u003c/th&gt;\n\u003cth&gt;의의\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1910년대\u003c/td&gt;\n\u003ctd&gt;국외 독립운동 기지 건설\u003c/td&gt;\n\u003ctd&gt;경학사·신흥 강습소(서간도), 간민회·중광단(북간도), 권업회·대한 광복군 정부(연해주), 대한인 국민회·대조선 국민 군단(미주)\u003c/td&gt;\n\u003ctd&gt;독립군 양성의 기반 마련\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1912\u003c/td&gt;\n\u003ctd&gt;독립 의군부 조직\u003c/td&gt;\n\u003ctd&gt;임병찬(고종의 비밀 칙령)\u003c/td&gt;\n\u003ctd&gt;복벽주의 추구\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1915\u003c/td&gt;\n\u003ctd&gt;대한 광복회 조직\u003c/td&gt;\n\u003ctd&gt;박상진\u003c/td&gt;\n\u003ctd&gt;공화제 정부 수립 목표\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1917\u003c/td&gt;\n\u003ctd&gt;&amp;lt;대동단결 선언&amp;gt; 발표(상하이)\u003c/td&gt;\n\u003ctd&gt;신규식, 박은식, 신채호\u003c/td&gt;\n\u003ctd&gt;공화정에 기반한 임시 정부 건설 주장\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1918\u003c/td&gt;\n\u003ctd&gt;한인 사회당 조직(하바롭스크)\u003c/td&gt;\n\u003ctd&gt;이동휘\u003c/td&gt;\n\u003ctd&gt;한국인이 세운 최초의 사회주의 정당\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1919. 2.\u003c/td&gt;\n\u003ctd&gt;2·8 독립 선언(도쿄)\u003c/td&gt;\n\u003ctd&gt;일본 유학생(조선 청년 독립단)\u003c/td&gt;\n\u003ctd&gt;국내 독립 선언에 영향\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1919. 3. 1.\u003c/td&gt;\n\u003ctd&gt;3·1 운동\u003c/td&gt;\n\u003ctd&gt;민족 대표 33인(손병희, 이승훈, 한용운 등), 학생·시민\u003c/td&gt;\n\u003ctd&gt;일제 강점기 최대 규모 항일 민족 운동, 문화 정치로 전환·임시 정부 수립 계기\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1919. 3.~4.\u003c/td&gt;\n\u003ctd&gt;여러 임시 정부 수립\u003c/td&gt;\n\u003ctd&gt;대한 국민 의회(블라디보스토크), 대한민국 임시 정부(상하이), 한성 정부(국내)\u003c/td&gt;\n\u003ctd&gt;독립운동의 구심점 모색\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1919. 9.\u003c/td&gt;\n\u003ctd&gt;통합 대한민국 임시 정부 출범(상하이)\u003c/td&gt;\n\u003ctd&gt;임시 대통령 이승만, 국무총리 이동휘\u003c/td&gt;\n\u003ctd&gt;우리 역사상 최초의 민주 공화제 정부\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1919\u003c/td&gt;\n\u003ctd&gt;의열단 조직(만주)\u003c/td&gt;\n\u003ctd&gt;김원봉 등\u003c/td&gt;\n\u003ctd&gt;의열 투쟁 전개\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1920\u003c/td&gt;\n\u003ctd&gt;조선 물산 장려회 조직(평양)\u003c/td&gt;\n\u003ctd&gt;조만식 등\u003c/td&gt;\n\u003ctd&gt;물산 장려 운동 시작\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1920. 6.\u003c/td&gt;\n\u003ctd&gt;봉오동 전투\u003c/td&gt;\n\u003ctd&gt;홍범도의 대한 독립군 등 연합 부대\u003c/td&gt;\n\u003ctd&gt;독립군의 승리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1920. 10.\u003c/td&gt;\n\u003ctd&gt;청산리 대첩\u003c/td&gt;\n\u003ctd&gt;김좌진의 북로 군정서, 홍범도의 연합 부대\u003c/td&gt;\n\u003ctd&gt;독립군의 큰 승리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1920. 10.~1921 초\u003c/td&gt;\n\u003ctd&gt;간도 참변\u003c/td&gt;\n\u003ctd&gt;일본군\u003c/td&gt;\n\u003ctd&gt;간도 한인 마을 학살·파괴\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1921. 6.\u003c/td&gt;\n\u003ctd&gt;자유시 참변\u003c/td&gt;\n\u003ctd&gt;대한 독립 군단(총재 서일)\u003c/td&gt;\n\u003ctd&gt;러시아 혁명군의 무장 해제 강요로 독립군 희생\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1923\u003c/td&gt;\n\u003ctd&gt;국민 대표 회의\u003c/td&gt;\n\u003ctd&gt;창조파 vs 개조파\u003c/td&gt;\n\u003ctd&gt;결렬 → 임시 정부 약화\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1923\u003c/td&gt;\n\u003ctd&gt;&amp;lt;조선 혁명 선언&amp;gt;\u003c/td&gt;\n\u003ctd&gt;신채호(김원봉 요청)\u003c/td&gt;\n\u003ctd&gt;의열단의 활동 지침\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1923\u003c/td&gt;\n\u003ctd&gt;조선 민립 대학 기성회 조직\u003c/td&gt;\n\u003ctd&gt;이상재 등\u003c/td&gt;\n\u003ctd&gt;민립 대학 설립 운동(1천만 원 모금)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1924\u003c/td&gt;\n\u003ctd&gt;경성 제국 대학 설립\u003c/td&gt;\n\u003ctd&gt;일제\u003c/td&gt;\n\u003ctd&gt;고등 교육 열망 무마\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1925\u003c/td&gt;\n\u003ctd&gt;조선 공산당 조직(서울, 비밀), 치안 유지법, 미쓰야 협정\u003c/td&gt;\n\u003ctd&gt;—\u003c/td&gt;\n\u003ctd&gt;사회주의 운동 확산과 탄압, 3부 위축\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1925\u003c/td&gt;\n\u003ctd&gt;이승만 탄핵, 박은식 제2대 임시 대통령 → 국무령제\u003c/td&gt;\n\u003ctd&gt;임시 정부\u003c/td&gt;\n\u003ctd&gt;위기 극복 노력\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1926\u003c/td&gt;\n\u003ctd&gt;6·10 만세 운동\u003c/td&gt;\n\u003ctd&gt;학생 단체(조선 학생 과학 연구회)\u003c/td&gt;\n\u003ctd&gt;민족 유일당 운동의 계기\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1926\u003c/td&gt;\n\u003ctd&gt;정우회 선언\u003c/td&gt;\n\u003ctd&gt;사회주의 세력\u003c/td&gt;\n\u003ctd&gt;비타협적 민족주의 세력과 연합 주장 → 신간회 결성 계기\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1927\u003c/td&gt;\n\u003ctd&gt;신간회 창립\u003c/td&gt;\n\u003ctd&gt;회장 이상재, 부회장 홍명희\u003c/td&gt;\n\u003ctd&gt;일제 강점기 최대 규모의 항일 단체\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1929 이후\u003c/td&gt;\n\u003ctd&gt;3부 통합 운동 → 국민부·혁신 의회로 재편\u003c/td&gt;\n\u003ctd&gt;조선 혁명당(조선 혁명군), 한국 독립당(한국 독립군, 지청천)\u003c/td&gt;\n\u003ctd&gt;민족 유일당 운동의 영향\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1929. 11. 3.\u003c/td&gt;\n\u003ctd&gt;광주 학생 항일 운동\u003c/td&gt;\n\u003ctd&gt;각 학교 독서회, 신간회(진상 조사단)\u003c/td&gt;\n\u003ctd&gt;3·1 운동 이후 가장 큰 규모의 항일 민족 운동\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1931\u003c/td&gt;\n\u003ctd&gt;신간회 해소\u003c/td&gt;\n\u003ctd&gt;사회주의 세력의 해소 주장\u003c/td&gt;\n\u003ctd&gt;신간회 사실상 해체\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1931\u003c/td&gt;\n\u003ctd&gt;한인 애국단 조직\u003c/td&gt;\n\u003ctd&gt;김구\u003c/td&gt;\n\u003ctd&gt;의열 투쟁으로 임시 정부 활로 모색\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1932\u003c/td&gt;\n\u003ctd&gt;이봉창 의거(도쿄), 윤봉길 의거(상하이 훙커우 공원)\u003c/td&gt;\n\u003ctd&gt;한인 애국단\u003c/td&gt;\n\u003ctd&gt;중국 국민당 정부의 한국 독립운동 지원 계기\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 차시별 핵심 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;1차시. 1910년대 민족 운동과 3·1 운동 (30~33쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;국외 독립운동 기지 건설\u003c/strong&gt; — 무단 통치를 피해 망명, 독립군 양성 목적\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;서간도(삼원보): 신민회의 이회영, 이상룡 등이 자치 기관 \u003cstrong&gt;경학사\u003c/strong&gt; 조직, \u003cstrong&gt;신흥 강습소\u003c/strong&gt;(이후 신흥 무관 학교) 세워 독립군 양성\u003cul&gt;\n\u003cli&gt;지도 흐름: 경학사 → 부민단 → 한족회 / 신흥 강습소 → 신흥 무관 학교\u003c/li&gt;\n\u003cli&gt;이회영 6형제: 모든 재산을 처분해 만주의 독립운동을 이끎\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;북간도: 명동 학교 등 민족 교육, 국권 피탈 후 자치 단체 \u003cstrong&gt;간민회\u003c/strong&gt;, 대종교 중심 \u003cstrong&gt;중광단\u003c/strong&gt; → 이후 \u003cstrong&gt;북로 군정서\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;연해주: 블라디보스토크 신한촌에 자치 단체 \u003cstrong&gt;권업회\u003c/strong&gt; → 권업회의 이상설·이동녕 등이 \u003cstrong&gt;대한 광복군 정부\u003c/strong&gt; 수립\u003c/li&gt;\n\u003cli&gt;미주: 미국 본토 한인 단체들이 \u003cstrong&gt;대한인 국민회\u003c/strong&gt;로 통합, 하와이에서 박용만이 \u003cstrong&gt;대조선 국민 군단\u003c/strong&gt; 조직\u003c/li&gt;\n\u003cli&gt;상하이: 신규식, 박은식, 신채호 등이 \u003cstrong&gt;&amp;lt;대동단결 선언&amp;gt;\u003c/strong&gt;(1917) — 공화정에 기반한 임시 정부 건설 주장\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;국내 비밀 결사\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;독립 의군부\u003c/strong&gt;: 임병찬이 고종의 비밀 칙령을 받아 조직, \u003cstrong&gt;복벽주의\u003c/strong&gt;, 조선 총독에게 국권 반환 요구서 계획(실행 못 함)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;대한 광복회\u003c/strong&gt;: 박상진 등, \u003cstrong&gt;공화제 정부 수립\u003c/strong&gt; 목표, 만주에 무관 학교 세우려고 의연금 모금\u003c/li&gt;\n\u003cli&gt;복벽주의 = 왕을 다시 세우고 나라를 되찾자 / 공화주의 = 주권은 국민에게, 국민의 대표가 정부를 이끎\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;독립 선언의 움직임\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;배경: 제1차 세계 대전 후 레닌의 식민지 민족 해방 운동 지원 선언, 윌슨의 \u003cstrong&gt;민족 자결주의\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;상하이 \u003cstrong&gt;신한 청년당\u003c/strong&gt;: 파리 강화 회의에 \u003cstrong&gt;김규식\u003c/strong&gt; 대표 파견\u003c/li&gt;\n\u003cli&gt;도쿄 유학생: \u003cstrong&gt;2·8 독립 선언\u003c/strong&gt;(1919)\u003c/li&gt;\n\u003cli&gt;국내: 천도교·기독교·불교계 지도자와 학생들이 고종 장례식 즈음 3월 1일 만세 시위 계획, 민족 대표 33인(손병희, 이승훈, 한용운 등) 이름으로 &amp;lt;3·1 독립 선언서&amp;gt; 작성·배포\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;3·1 운동의 전개\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;도시 중심 시작: 민족 대표는 \u003cstrong&gt;태화관\u003c/strong&gt;에서 독립 선언식 후 연행 / 학생·시민은 \u003cstrong&gt;탑골 공원\u003c/strong&gt;에서 선언식 후 거리 시위\u003c/li&gt;\n\u003cli&gt;상인 가게 문 닫음(철시), 노동자 동맹 파업 / 평양, 원산, 의주 등 주요 도시로 확산\u003c/li&gt;\n\u003cli&gt;농촌 확산: 유관순 같은 학생들이 고향에서 시위 주도, \u003cstrong&gt;장날\u003c/strong&gt; 이용 / 3월 말~4월 초 절정, 농민·노동자 참여 폭발적 증가, 일부 지역은 식민 통치 기관 공격 등 폭력 투쟁\u003c/li&gt;\n\u003cli&gt;일제의 무자비한 진압: \u003cstrong&gt;화성 제암리·고주리 학살\u003c/strong&gt;(1919. 4.) → 선교사 \u003cstrong&gt;프랭크 스코필드\u003c/strong&gt;가 미국에 폭로\u003c/li&gt;\n\u003cli&gt;국외: 서간도(부민단 중심), 북간도, 연해주, 일본 / 미국 필라델피아 \u003cstrong&gt;한인 자유 대회\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;탐구 자료: 피고인 업종 1위는 농업(56.8%) → 모든 계층 참여\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;3·1 운동의 의의\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;모든 계층 참여, 독립 의지를 세계에 알린 \u003cstrong&gt;일제 강점기 최대 규모의 항일 민족 운동\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;일제의 통치 방식 변화 → 이른바 \u003cstrong&gt;문화 정치\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;대한민국 임시 정부 수립\u003c/strong&gt;의 계기\u003c/li&gt;\n\u003cli&gt;중국 \u003cstrong&gt;5·4 운동\u003c/strong&gt; 등 다른 나라 독립운동에 영향\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;\u003cstrong&gt;사료 포인트\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;2·8 독립 선언: &amp;quot;조선 청년 독립단&amp;quot;, &amp;quot;일본이나 혹은 세계 각국이 우리 민족에게 \u003cstrong&gt;민족 자결의 기회\u003c/strong&gt;를 주기를 요구&amp;quot;, &amp;quot;생존을 위해 자유 행동&amp;quot;\u003c/li&gt;\n\u003cli&gt;3·1 독립 선언서(기미 독립 선언서): &amp;quot;조선이 독립한 나라이고 조선 사람이 자주적인 국민&amp;quot;, &amp;quot;\u003cstrong&gt;인류 평등\u003c/strong&gt;&amp;quot;, &amp;quot;자기의 건설에 있을 뿐이지 결코 남을 파괴하는 데 있지 않다&amp;quot;\u003c/li&gt;\n\u003cli&gt;&amp;lt;삼가 시장의 상인 여러분에게 고합니다&amp;gt;: &amp;quot;가게 문을 닫는 일&amp;quot;, 윌슨의 민족 자결주의\u003c/li&gt;\n\u003cli&gt;&amp;lt;대한 독립 여자 선언서&amp;gt;(애국 부인회, 1919. 4.): &amp;quot;아녀자 무리이지만 대한의 국민인 것은 남자들과 마찬가지&amp;quot;\u003c/li&gt;\n\u003cli&gt;《뉴욕 타임스》: &amp;quot;소수의 지식인들의 소행이 아니었고 …… 모든 지역과 각계각층&amp;quot;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/blockquote&gt;\n\u003ch3&gt;2차시. 대한민국 임시 정부의 수립과 활동 (34~36쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;수립과 통합\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;대한 국민 의회(1919. 3., 연해주 블라디보스토크) / 대한민국 임시 정부(1919. 4., 상하이) / 한성 정부(1919. 4., 국내 선포)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;한성 정부의 내각 구성안\u003c/strong&gt;을 중심으로 연해주와 상하이의 임시 정부 통합 → 1919. 9. 상하이에서 출범\u003c/li&gt;\n\u003cli&gt;상하이 선택 이유: 서양 열강의 \u003cstrong&gt;조계지\u003c/strong&gt;가 있어 외교 활동에 유리\u003c/li&gt;\n\u003cli&gt;우리 역사상 \u003cstrong&gt;최초의 민주 공화제 정부\u003c/strong&gt;, 삼권 분립: 임시 의정원(입법) · 국무원(행정) · 법원(사법)\u003c/li&gt;\n\u003cli&gt;임시 대통령 \u003cstrong&gt;이승만\u003c/strong&gt;, 국무총리 \u003cstrong&gt;이동휘\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;활동\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;연통제\u003c/strong&gt;: 국내 비밀 행정 조직(문서·명령 전달, 자금 조달, 정보 수집), 1921년 사실상 붕괴\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;교통국\u003c/strong&gt;: 통신 기관, 중국 단둥의 \u003cstrong&gt;이륭 양행\u003c/strong&gt;(조지 루이스 쇼)이 교통국 역할\u003c/li&gt;\n\u003cli&gt;기관지 \u003cstrong&gt;《독립신문》\u003c/strong&gt;, 임시 사료 편찬회 → \u003cstrong&gt;《한일 관계 사료집》\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;외교: 김규식을 전권 대사로 → 파리 강화 회의에 독립 청원서, 미국에 \u003cstrong&gt;구미 위원부\u003c/strong&gt;, 이승만은 미국 주재\u003c/li&gt;\n\u003cli&gt;군사: 남만주의 \u003cstrong&gt;육군 주만 참의부\u003c/strong&gt;를 직속 부대로 편성\u003c/li&gt;\n\u003cli&gt;자금: \u003cstrong&gt;독립 공채\u003c/strong&gt; 발행(상하이 원화·미주 달러), 의연금\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;침체와 국민 대표 회의\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1921년 전후 침체: 연통제·교통국 붕괴, 외교 성과 없음, 독립운동 방향 갈등(무장 투쟁론·외교 운동론·실력 양성론), 이승만의 \u003cstrong&gt;위임 통치 청원서\u003c/strong&gt; 문제\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;국민 대표 회의\u003c/strong&gt;(1923): \u003cstrong&gt;창조파\u003c/strong&gt;(해산 후 새 정부) vs \u003cstrong&gt;개조파\u003c/strong&gt;(존속하되 개조) 대립 → 결렬 → 많은 독립운동가 이탈\u003c/li&gt;\n\u003cli&gt;이승만 탄핵, \u003cstrong&gt;박은식\u003c/strong&gt; 제2대 임시 대통령(1925) → 대통령제를 \u003cstrong&gt;국무령제\u003c/strong&gt;로 전환(1925), \u003cstrong&gt;집단 지도 체제\u003c/strong&gt; 도입(연표상 1927)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;\u003cstrong&gt;사료 포인트\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;대한민국 임시 헌장(1919. 4.): &amp;quot;제1조 대한민국은 \u003cstrong&gt;민주 공화제\u003c/strong&gt;로 함&amp;quot;, &amp;quot;남녀 귀천, 빈부의 계급이 없고 일체 평등&amp;quot;, &amp;quot;국토 회복 후 만 1개년 내에 국회를 소집&amp;quot;\u003c/li&gt;\n\u003cli&gt;대한민국 임시 헌법(1919. 9.): &amp;quot;주권은 대한 인민 전체&amp;quot;, &amp;quot;입법권은 의정원이, 행정권은 국무원이, 사법권은 법원이&amp;quot; → \u003cstrong&gt;삼권 분립\u003c/strong&gt;, 제헌 헌법에 큰 영향\u003c/li&gt;\n\u003cli&gt;위임 통치 청원서(1919): &amp;quot;\u003cstrong&gt;국제 연맹의 위임 통치\u003c/strong&gt;하에 두어&amp;quot; → 이승만, 이동휘·박용만 등이 비판\u003c/li&gt;\n\u003cli&gt;탐구 대화방: 무장 투쟁론 = 이동휘(&amp;quot;전쟁 외에는 다른 방도가 없습니다&amp;quot;), 외교 운동론 = 이승만(&amp;quot;외국의 원조&amp;quot;), 실력 양성론 = 안창호(&amp;quot;지식이 저들보다 부족&amp;quot;)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/blockquote&gt;\n\u003ch3&gt;3차시. 무장 투쟁과 의열 투쟁 (37~40쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;봉오동과 청산리\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;3·1 운동 이후 조직적 무장 투쟁 필요 인식 → 만주에 서로 군정서, 북로 군정서, 대한 독립군 등 조직, \u003cstrong&gt;국내 진공 작전\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;봉오동 전투\u003c/strong&gt;(1920. 6.): 홍범도의 대한 독립군 등 연합 부대가 일본군을 봉오동으로 유인해 격파\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;훈춘 사건\u003c/strong&gt;(1920. 10.): 중국인 마적단의 일본 영사관 공격 → 일제가 구실로 약 2만 명 동원\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;청산리 대첩\u003c/strong&gt;(1920. 10.): 김좌진의 \u003cstrong&gt;북로 군정서\u003c/strong&gt; + 홍범도의 연합 부대, 백두산 부근 청산리 일대에서 큰 승리\u003c/li&gt;\n\u003cli&gt;이범석 《우둥불》: 마을 아낙네들이 치마폭에 밥을 싸 독립군에게 전함\u003c/li&gt;\n\u003cli&gt;홍범도: 1937년 중앙아시아 강제 이주 → 카자흐스탄 크즐오르다, 《홍범도 일지》, 1943년 사망, 2021년 유해 봉환\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;독립군의 시련\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;간도 참변\u003c/strong&gt;(1920. 10.~1921 초): 일본군의 보복, 간도 한인 마을 학살·파괴 (스탠리 마틴이 목격·폭로)\u003c/li&gt;\n\u003cli&gt;독립군은 북만주 \u003cstrong&gt;밀산부\u003c/strong&gt;에 집결 → \u003cstrong&gt;서일\u003c/strong&gt;을 총재로 \u003cstrong&gt;대한 독립 군단\u003c/strong&gt; → 러시아 \u003cstrong&gt;자유시\u003c/strong&gt;(스보보드니)로 이동\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;자유시 참변\u003c/strong&gt;(1921. 6.): 지휘권 갈등 + 러시아 혁명군의 무장 해제 강요 → 수많은 독립군 희생\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;3부 성립과 통합\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;남만주: \u003cstrong&gt;참의부, 정의부\u003c/strong&gt; / 북만주: \u003cstrong&gt;신민부\u003c/strong&gt; → 한인 사회 자치 조직이자 군사 기구\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;미쓰야 협정\u003c/strong&gt;(1925): 일제와 만주 군벌 → 한인 항일 단체 해산, 지도자 체포·인도 → 3부 위축\u003c/li&gt;\n\u003cli&gt;제1차 국공 합작(1924), 안창호의 민족 유일당 건설 제창 → 민족 유일당 운동\u003c/li&gt;\n\u003cli&gt;1929년 이후 남만주 \u003cstrong&gt;국민부\u003c/strong&gt; → 조선 혁명당·\u003cstrong&gt;조선 혁명군\u003c/strong&gt; / 북만주 \u003cstrong&gt;혁신 의회\u003c/strong&gt; 해산 후 → 지청천 등 한국 독립당·\u003cstrong&gt;한국 독립군\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;의열 투쟁\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;개인 의거: 강우규(조선 총독에게 폭탄, 1919), 남자현(조선 총독 암살 계획), 조명하(일본 육군 대장 저격, 1928, 타이중)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;의열단\u003c/strong&gt;(1919, 만주, \u003cstrong&gt;김원봉\u003c/strong&gt; 등): 일제 고관·친일파 처단, 식민 통치 기관 파괴\u003cul&gt;\n\u003cli&gt;김익상 - 조선 총독부(1921) / 김상옥 - 종로 경찰서(1923) / 나석주 - 조선 식산 은행과 동양 척식 주식회사(1926)\u003c/li&gt;\n\u003cli&gt;지도의 다른 사례: 박재혁 - 부산 경찰서(1920), 김지섭 - 일본 왕궁(1924)\u003c/li&gt;\n\u003cli&gt;신채호의 **&amp;lt;조선 혁명 선언&amp;gt;**이 활동 지침 → 민중의 직접 혁명\u003c/li&gt;\n\u003cli&gt;1920년대 후반 조직적 무장 투쟁으로 전환: 단원들을 \u003cstrong&gt;황푸 군관 학교\u003c/strong&gt;에 입학, \u003cstrong&gt;조선 혁명 간부 학교\u003c/strong&gt; 설립(중국 국민당 정부 지원)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;한인 애국단\u003c/strong&gt;(1931, \u003cstrong&gt;김구\u003c/strong&gt;): 임시 정부 침체 극복 목적\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;이봉창\u003c/strong&gt;(1932): 도쿄에서 일왕에게 폭탄\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;윤봉길\u003c/strong&gt;(1932): 상하이 \u003cstrong&gt;훙커우 공원\u003c/strong&gt; 일왕 생일 및 상하이 사변 승리 축하 기념식에 폭탄 → \u003cstrong&gt;중국 국민당 정부가 한국 독립운동을 적극 지원\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;\u003cstrong&gt;사료 포인트\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;조선 혁명 선언(1923): &amp;quot;강도 일본&amp;quot;, &amp;quot;\u003cstrong&gt;민중은 우리 혁명의 대본영\u003c/strong&gt;&amp;quot;, &amp;quot;\u003cstrong&gt;폭력은 우리 혁명의 유일한 무기\u003c/strong&gt;&amp;quot;, &amp;quot;암살, 파괴, 폭동&amp;quot; → 의열단\u003c/li&gt;\n\u003cli&gt;미쓰야 협정(1925): &amp;quot;한인 항일 단체를 해산&amp;quot;, &amp;quot;항일 단체 지도자를 체포해서 조선 관헌에게 인도&amp;quot;\u003c/li&gt;\n\u003cli&gt;스탠리 마틴의 기록: &amp;quot;36개 촌락에서만 140여 명이 학살&amp;quot; → 간도 참변\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/blockquote&gt;\n\u003ch3&gt;4차시. 민족 운동의 분화 (41~43쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;사회주의 사상의 수용\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;제1차 세계 대전·러시아 혁명, 러시아와 코민테른의 약소민족 해방 지원 선언의 영향\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;한인 사회당\u003c/strong&gt;(1918, 이동휘, 러시아 하바롭스크): 최초의 한국인 사회주의 정당, 코민테른 지부 승인, 이후 임시 정부 참여\u003c/li&gt;\n\u003cli&gt;국내 민족 운동이 \u003cstrong&gt;민족주의 운동\u003c/strong&gt;과 \u003cstrong&gt;사회주의 운동\u003c/strong&gt;으로 분화\u003cul&gt;\n\u003cli&gt;공통 목표: 민족 해방 / 사회주의는 노동자·농민의 \u003cstrong&gt;계급 해방\u003c/strong&gt;도 추구 → 민족을 우선시한 민족주의 세력과 대립\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;사회주의 운동\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;독서회·토론회, 신문·잡지 소개 → \u003cstrong&gt;조선 공산당\u003c/strong&gt;(1925, 서울, 비밀 조직), 1928년 탄압으로 해체\u003c/li&gt;\n\u003cli&gt;노동 운동, 농민 운동, 청년 운동 등 \u003cstrong&gt;대중 운동\u003c/strong&gt; 주도\u003c/li&gt;\n\u003cli&gt;일제의 \u003cstrong&gt;치안 유지법\u003c/strong&gt;으로 탄압 → 비타협적 민족주의 세력과 연합 모색\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;민족주의 세력의 실력 양성 운동\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;물산 장려 운동\u003c/strong&gt;: 회사령 철폐, 일본 상품 관세 폐지 움직임에 위기의식 → \u003cstrong&gt;1920년 평양, 조만식\u003c/strong&gt; 등 \u003cstrong&gt;조선 물산 장려회\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;구호 &amp;quot;내 살림 내 것으로&amp;quot;, &amp;quot;조선 사람 조선 것&amp;quot;, 포스터 &amp;quot;자작자급해 우리 것으로 살자&amp;quot;\u003c/li&gt;\n\u003cli&gt;한계: 생산력 부족 → 상품 가격 상승, 일부 사회주의 세력은 &amp;quot;자본가만의 이익&amp;quot; 비판 → 쇠퇴\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;민립 대학 설립 운동\u003c/strong&gt;: 고등 교육 기회 없음 → \u003cstrong&gt;이상재\u003c/strong&gt; 등, \u003cstrong&gt;조선 민립 대학 기성회\u003c/strong&gt;(1923), 1천만 원 모금\u003cul&gt;\n\u003cli&gt;일제 방해, 사회주의 세력은 강습소·야학이 더 시급하다며 비판, 가뭄·홍수로 모금 저조 → 중단\u003c/li&gt;\n\u003cli&gt;일제는 \u003cstrong&gt;경성 제국 대학\u003c/strong&gt;(1924) 설립 → 한국인 입학생은 소수\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자치 운동\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;이광수, 김성수, 최린\u003c/strong&gt; 등: 독립이 당장 불가능 → 일제 지배를 받아들이고 자치 정부·자치 의회 구성 추구\u003c/li&gt;\n\u003cli&gt;조선 총독부가 민족 운동 분열 목적으로 부추김\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;비타협적 민족주의 세력 + 사회주의 세력\u003c/strong&gt;이 격렬히 비판 → 좌절 후 일부는 친일의 길\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;\u003cstrong&gt;사료 포인트\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;&amp;lt;민족적 경륜&amp;gt;(이광수, 《동아일보》 1924. 1. 3.): &amp;quot;조선 내에서 (일본이) \u003cstrong&gt;허용하는 범위 내에서\u003c/strong&gt; 일대 정치적 결사를 조직&amp;quot; → 자치 운동\u003c/li&gt;\n\u003cli&gt;민립 대학 사료(《동아일보》 1923): &amp;quot;가장 필요한 수단은 교육&amp;quot;, &amp;quot;대학의 설립이 아니고는 다른 방도가 없도다&amp;quot;\u003c/li&gt;\n\u003cli&gt;물산 장려 논쟁: 찬성 측 &amp;quot;유산, 무산 계급을 막론한 모든 조선 사람이 대동단결&amp;quot; / 비판 측 &amp;quot;노동자는 오랜 옛날부터 훌륭한 물산 장려 계급&amp;quot;, &amp;quot;누구를 위한 것인가?&amp;quot;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/blockquote&gt;\n\u003ch3&gt;5차시. 신간회와 학생 운동 (44~47쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;6·10 만세 운동(1926)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;순종 사망 → 천도교 등 민족주의 세력 + 조선 공산당 중심 사회주의 세력 + 학생 단체가 계획\u003c/li&gt;\n\u003cli&gt;계획 발각, 지도부 검거 → 발각되지 않은 학생 단체들이 순종 장례일(6월 10일)에 격문 뿌리며 만세 시위\u003c/li&gt;\n\u003cli&gt;200여 명 학생 검거, 전국 확산은 못 함\u003c/li&gt;\n\u003cli&gt;의의: 민족주의·사회주의 세력이 \u003cstrong&gt;민족 유일당 운동\u003c/strong&gt;을 추진하는 계기\u003c/li&gt;\n\u003cli&gt;조선 학생 과학 연구회(1925 설립)가 이끎\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;민족 유일당 운동 → 신간회\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;배경: 코민테른의 민족 통일 전선 지지, 제1차 국공 합작\u003c/li&gt;\n\u003cli&gt;비타협적 민족주의 세력: 자치 운동 경계, 사회주의 세력과 연대 도모\u003c/li&gt;\n\u003cli&gt;사회주의 세력: \u003cstrong&gt;정우회 선언\u003c/strong&gt;(1926) → 비타협적 민족주의 세력과 연합 주장 → 신간회 결성의 계기\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;신간회\u003c/strong&gt;(1927): 회장 \u003cstrong&gt;이상재\u003c/strong&gt;, 부회장 \u003cstrong&gt;홍명희\u003c/strong&gt;, 최대 회원 4만여 명, 서울 본부 + 전국·만주·일본 지회\u003cul&gt;\n\u003cli&gt;주장: 식민 통치 비판, 한국인 본위 교육, 타협적 정치 운동 반대\u003c/li&gt;\n\u003cli&gt;활동: 강연회로 민중 계몽, 대중 운동 지원, 광주 학생 항일 운동 때 \u003cstrong&gt;진상 조사단 파견\u003c/strong&gt;, \u003cstrong&gt;민중 대회\u003c/strong&gt; 계획(발각, 간부 대거 체포)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;해소(1931): 새 집행부의 타협적 합법 운동 모색 → 지회 반발 + 코민테른 노선 변화(계급 투쟁 강조, 민족주의와 연대 부정)로 사회주의 세력이 해소 주장 → 비타협적 민족주의 세력의 반대에도 해소 결정\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;학생 운동과 광주 학생 항일 운동\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1920년대: 교육 환경 개선, 민족 차별 교육 반대, 독서회 등 비밀 결사, \u003cstrong&gt;동맹 휴학\u003c/strong&gt; 증가\u003c/li&gt;\n\u003cli&gt;6·10 만세 운동 전후로 항일 운동 성격 강화\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;광주 학생 항일 운동(1929)\u003c/strong&gt;: 10월 \u003cstrong&gt;나주역\u003c/strong&gt; 한일 학생 충돌 → 경찰이 일본인 학생 편 → 11월 3일 광주 학생 대규모 시위(민족 차별 철폐, 식민지 교육 반대)\u003cul&gt;\n\u003cli&gt;각 학교 독서회가 주도, 신간회 지원, 1930년 서울 여학교 학생 연합 시위 → 전국 확대\u003c/li&gt;\n\u003cli&gt;구호가 일본 제국주의 타도·민족 해방까지 발전 / 거리 시위, 시험 거부, 동맹 휴학, 격문 살포\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;3·1 운동 이후 가장 큰 규모의 항일 민족 운동\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;11월 3일: 학생의 날(1953) → 폐지(1973) → 부활(1984) → &amp;#39;학생 독립운동 기념일&amp;#39;(2006)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cblockquote&gt;\n\u003cp&gt;\u003cstrong&gt;사료 포인트\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;정우회 선언(1926): &amp;quot;민족주의적 세력 …… \u003cstrong&gt;과정적 동맹자\u003c/strong&gt;가 될 수 있음&amp;quot;, &amp;quot;타락한 형태로 나타나지 않는다면 적극적으로 제휴&amp;quot;\u003c/li&gt;\n\u003cli&gt;신간회 강령(1927): &amp;quot;정치·경제적 각성&amp;quot;, &amp;quot;단결을 공고히&amp;quot;, &amp;quot;\u003cstrong&gt;기회주의를 일체 부인\u003c/strong&gt;&amp;quot;\n→ &amp;#39;타락한 형태&amp;#39; = &amp;#39;기회주의&amp;#39; = 자치 운동 세력 같은 \u003cstrong&gt;타협적 민족주의자\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;6·10 만세 운동 재판 발언: &amp;quot;자유를 얻기 위해&amp;quot;\u003c/li&gt;\n\u003cli&gt;광주 학생 항일 운동 격문: &amp;quot;검거자를 즉시 석방&amp;quot;, &amp;quot;조선인 중심의 교육 제도를 확립&amp;quot;, &amp;quot;식민지 노예 교육 제도를 철폐&amp;quot;\u003c/li&gt;\n\u003cli&gt;김제 공보 맹휴(1927): &amp;quot;조선 역사를 가르쳐 달라&amp;quot; → 동맹 휴학\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 헷갈리는 것 비교&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;① 독립군 전투·시련 순서\u003c/strong&gt;\n봉오동 전투(1920. 6.) → 훈춘 사건 → 청산리 대첩(1920. 10.) → 간도 참변(1920. 10.~1921 초) → 대한 독립 군단(밀산) → 자유시 참변(1921. 6.) → 3부 성립 → 미쓰야 협정(1925) → 국민부·혁신 의회(1929 이후)\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;봉오동 전투\u003c/th&gt;\n\u003cth&gt;청산리 대첩\u003c/th&gt;\n\u003cth&gt;간도 참변\u003c/th&gt;\n\u003cth&gt;자유시 참변\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;시기\u003c/td&gt;\n\u003ctd&gt;1920. 6.\u003c/td&gt;\n\u003ctd&gt;1920. 10.\u003c/td&gt;\n\u003ctd&gt;1920. 10.~1921 초\u003c/td&gt;\n\u003ctd&gt;1921. 6.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;핵심\u003c/td&gt;\n\u003ctd&gt;홍범도의 대한 독립군 등\u003c/td&gt;\n\u003ctd&gt;김좌진의 북로 군정서 + 홍범도\u003c/td&gt;\n\u003ctd&gt;일본군이 간도 한인 학살\u003c/td&gt;\n\u003ctd&gt;러시아 혁명군이 무장 해제 강요\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;결과\u003c/td&gt;\n\u003ctd&gt;승리(유인 격파)\u003c/td&gt;\n\u003ctd&gt;큰 승리\u003c/td&gt;\n\u003ctd&gt;독립군 북만주 퇴각\u003c/td&gt;\n\u003ctd&gt;수많은 독립군 희생\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;② 1910년대 비밀 결사\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;독립 의군부\u003c/th&gt;\n\u003cth&gt;대한 광복회\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;인물\u003c/td&gt;\n\u003ctd&gt;임병찬(고종의 비밀 칙령)\u003c/td&gt;\n\u003ctd&gt;박상진\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;지향\u003c/td&gt;\n\u003ctd&gt;복벽주의\u003c/td&gt;\n\u003ctd&gt;공화제 정부 수립\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;활동\u003c/td&gt;\n\u003ctd&gt;국권 반환 요구서 계획(실행 못 함)\u003c/td&gt;\n\u003ctd&gt;만주 무관 학교 설립 위해 의연금\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;③ 의열단 vs 한인 애국단\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;의열단\u003c/th&gt;\n\u003cth&gt;한인 애국단\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;조직\u003c/td&gt;\n\u003ctd&gt;1919, 만주, 김원봉 등\u003c/td&gt;\n\u003ctd&gt;1931, 김구(임시 정부 침체 극복)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;지침·특징\u003c/td&gt;\n\u003ctd&gt;&amp;lt;조선 혁명 선언&amp;gt;(신채호), 민중 직접 혁명\u003c/td&gt;\n\u003ctd&gt;임시 정부의 활로 모색\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;활동\u003c/td&gt;\n\u003ctd&gt;김익상(조선 총독부), 김상옥(종로 경찰서), 나석주(동척·식산 은행)\u003c/td&gt;\n\u003ctd&gt;이봉창(도쿄, 일왕), 윤봉길(훙커우 공원)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;이후\u003c/td&gt;\n\u003ctd&gt;황푸 군관 학교 입학, 조선 혁명 간부 학교 → 조직적 무장 투쟁\u003c/td&gt;\n\u003ctd&gt;중국 국민당 정부의 적극 지원 계기\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;④ 실력 양성 운동 (교과서 이 차시에는 두 가지)\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;물산 장려 운동\u003c/th&gt;\n\u003cth&gt;민립 대학 설립 운동\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;시작\u003c/td&gt;\n\u003ctd&gt;1920, 평양, 조만식 등 조선 물산 장려회\u003c/td&gt;\n\u003ctd&gt;이상재 등, 조선 민립 대학 기성회(1923)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;내용\u003c/td&gt;\n\u003ctd&gt;토산품 애용, &amp;quot;내 살림 내 것으로&amp;quot;\u003c/td&gt;\n\u003ctd&gt;1천만 원 모금, 한국인 본위 교육\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;비판·실패\u003c/td&gt;\n\u003ctd&gt;가격 상승, 사회주의 측 &amp;quot;자본가 이익&amp;quot; 비판\u003c/td&gt;\n\u003ctd&gt;일제 방해, 사회주의 측 &amp;quot;야학이 더 시급&amp;quot;, 가뭄·홍수\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;일제 대응\u003c/td&gt;\n\u003ctd&gt;—\u003c/td&gt;\n\u003ctd&gt;경성 제국 대학(1924)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;※ 문맹 퇴치 운동(브나로드 운동 등)은 04 단원 &amp;#39;민족 문화 수호 운동&amp;#39;에서 다룸.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;⑤ 타협(자치론) vs 비타협\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;자치 운동(타협적 민족주의)\u003c/th&gt;\n\u003cth&gt;비타협적 민족주의\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;인물\u003c/td&gt;\n\u003ctd&gt;이광수, 김성수, 최린 등\u003c/td&gt;\n\u003ctd&gt;(신간회 회장 이상재, 부회장 홍명희)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;주장\u003c/td&gt;\n\u003ctd&gt;일제 지배 인정, 자치 정부·자치 의회\u003c/td&gt;\n\u003ctd&gt;자치 운동 반대, 사회주의 세력과 연대\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;결과\u003c/td&gt;\n\u003ctd&gt;좌절 후 일부 친일\u003c/td&gt;\n\u003ctd&gt;신간회 창립(1927)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;⑥ 임시 정부의 변화 순서\u003c/strong&gt;\n여러 임시 정부 수립(1919. 3.~4.) → 통합·상하이(1919. 9.) → 연통제 사실상 붕괴(1921) → 국민 대표 회의(1923, 창조파·개조파, 결렬) → 이승만 탄핵·박은식 대통령·국무령제(1925) → 집단 지도 체제(1927) → 한인 애국단(1931)\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;⑦ 6·10 만세 운동 vs 광주 학생 항일 운동\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;6·10 만세 운동(1926)\u003c/th&gt;\n\u003cth&gt;광주 학생 항일 운동(1929)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;계기\u003c/td&gt;\n\u003ctd&gt;순종 사망, 장례일\u003c/td&gt;\n\u003ctd&gt;나주역 한일 학생 충돌\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;주도\u003c/td&gt;\n\u003ctd&gt;학생 단체(민족주의·사회주의 세력 계획은 발각)\u003c/td&gt;\n\u003ctd&gt;각 학교 독서회\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;규모\u003c/td&gt;\n\u003ctd&gt;전국 확산 못 함\u003c/td&gt;\n\u003ctd&gt;전국 확대, 3·1 운동 이후 최대\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;관련\u003c/td&gt;\n\u003ctd&gt;민족 유일당 운동(→ 신간회)의 계기\u003c/td&gt;\n\u003ctd&gt;신간회가 진상 조사단 파견·민중 대회 계획\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;⑧ 3부 vs 재편된 조직\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;3부: 참의부·정의부(남만주), 신민부(북만주)\u003c/li&gt;\n\u003cli&gt;재편: 국민부(남만주) → 조선 혁명당·조선 혁명군 / 혁신 의회(북만주) → 한국 독립당·한국 독립군(지청천)\u003c/li&gt;\n\u003cli&gt;주의: 임시 정부 직속 부대는 &amp;#39;육군 주만 참의부&amp;#39;\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 예상 문제&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;1.\u003c/strong&gt; 다음 선언서에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;합병 이래 일본의 조선 통치 정책을 보면 …… 모든 기관이 조선 민족의 인권을 철저히 침해했다. …… 이에 우리 민족은 일본이나 혹은 세계 각국이 우리 민족에게 민족 자결의 기회를 주기를 요구하며 …… 우리 민족의 독립을 이루기를 선언하노라. — 조선 청년 독립단\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 민족 대표 33인의 이름으로 발표되었다.\n② 일본 도쿄의 유학생들이 중심이 되어 발표하였다.\n③ 김원봉의 요청으로 신채호가 작성하였다.\n④ 공화정에 기반한 임시 정부 건설을 처음 주장하였다.\n⑤ 신한 청년당이 파리 강화 회의에 제출하였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2.\u003c/strong&gt; 3·1 운동에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cp&gt;① 민족 대표들은 탑골 공원에서 시위를 이끌었다.\n② 국외에서는 만세 시위가 일어나지 않았다.\n③ 대한민국 임시 정부의 지휘 아래 전개되었다.\n④ 농촌에서는 주로 장날을 이용해 시위가 전개되었다.\n⑤ 운동 이후 일제는 헌병 경찰을 앞세운 무단 통치를 시작하였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3.\u003c/strong&gt; 다
