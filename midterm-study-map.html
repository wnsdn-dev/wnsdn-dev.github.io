;\n\u003cli&gt;의미(정리하기 질문에 대한 해석)\u003cul&gt;\n\u003cli&gt;이쑤시개 = \u003cstrong&gt;생물 개체\u003c/strong&gt;, 이쑤시개 종류 차이 = \u003cstrong&gt;변이\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;종이 = \u003cstrong&gt;서식 환경\u003c/strong&gt;, 종이 색을 바꿈 = \u003cstrong&gt;환경이 다름\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;핀셋으로 제거 = \u003cstrong&gt;포식자에게 잡아먹힘\u003c/strong&gt;, 남은 수만큼 더함 = \u003cstrong&gt;살아남은 개체가 자손을 남김\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;결론: 생물 무리의 구성은 \u003cstrong&gt;변이 중 환경에 유리한 쪽이 더 많이 남는 방향\u003c/strong&gt;으로 변한다\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자연선택\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;자연 상태의 생물 무리에는 \u003cstrong&gt;변이\u003c/strong&gt; → 그중 \u003cstrong&gt;생존에 유리한 변이를 가진 개체가 더 많이 살아남음\u003c/strong&gt; → \u003cstrong&gt;더 많은 자손\u003c/strong&gt; 생산 → 여러 세대 반복 → 생존에 유리한 변이를 가진 개체가 많아지는 방향으로 \u003cstrong&gt;무리의 구성 변화\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;자연선택\u003c/strong&gt;: 자연적으로 일어나는 형질의 선택\u003c/li&gt;\n\u003cli&gt;교과서 문제 7번의 다윈 자연선택 4단계\u003cul&gt;\n\u003cli&gt;(가) 같은 무리 내에서도 \u003cstrong&gt;변이\u003c/strong&gt; → 다양한 형질의 개체 존재\u003c/li&gt;\n\u003cli&gt;(나) 환경에 잘 견디는 형질의 개체가 \u003cstrong&gt;더 많이 살아남음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;(다) 많이 살아남은 개체가 \u003cstrong&gt;번식하여 자손 생산\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;(라) 여러 세대 반복 → 무리의 구성이 점차 변화\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;&amp;#39;과잉 생산&amp;#39;, &amp;#39;생존 경쟁&amp;#39;이라는 용어는 이 교과서 12~35쪽 본문에 나오지 않음 \u003cstrong&gt;(교과서 확인 필요)\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자연선택 사례 — 사사패모 (24쪽, 그림 I-8)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;백합과 식물, 약초로 사용, 해발 \u003cstrong&gt;3700 m 이상\u003c/strong&gt; 고지대, 개체마다 \u003cstrong&gt;색의 변이\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;사람이 가기 힘든 곳(채집 어려움) → \u003cstrong&gt;초록색(녹색)\u003c/strong&gt; 개체 비율 높음\u003c/li&gt;\n\u003cli&gt;사람이 접근하기 쉬운 곳(채집 활발) → \u003cstrong&gt;주변 돌과 비슷한 색(회색·갈색)\u003c/strong&gt; 개체 비율 월등히 높음\u003c/li&gt;\n\u003cli&gt;녹색 개체는 눈에 잘 띄어 채취됨 → 자손을 남기지 못함\u003c/li&gt;\n\u003cli&gt;결론: \u003cstrong&gt;포식자인 인간의 눈에 잘 띄지 않는 방향으로 자연선택\u003c/strong&gt;이 일어남 → 자연선택은 \u003cstrong&gt;지금도 관찰\u003c/strong&gt;된다\u003c/li&gt;\n\u003cli&gt;교과서 문제 3번(세균 실험): 항생제 처리 후 항생제를 견디는 세균만 살아남아 번식 → 원래 무리에 \u003cstrong&gt;항생제를 견디는 변이\u003c/strong&gt;가 있었고, 그 비율이 증가하는 과정\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n\u003ch3&gt;5차시. 다윈의 진화 원리와 새로운 종 (25~27쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;진화와 자연선택설\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;약 \u003cstrong&gt;40억 년 전\u003c/strong&gt; 최초의 생물 탄생 이후 생물은 여러 환경에 적응하며 다양하게 변화\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;진화\u003c/strong&gt;: 생물이 \u003cstrong&gt;여러 세대에 걸쳐 환경에 적응\u003c/strong&gt;하면서 \u003cstrong&gt;이전과는 다른 생물로 변화\u003c/strong&gt;하는 것\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;다윈\u003c/strong&gt;(영국, 1809~1882): 진화의 원리를 체계적으로 정립\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;약 5년\u003c/strong&gt; 동안 세계 항해(\u003cstrong&gt;비글호\u003c/strong&gt;, \u003cstrong&gt;1831년\u003c/strong&gt;부터) → 다양한 생물·자연 현상 관찰·채집\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;갈라파고스 제도\u003c/strong&gt;에서 섬 환경에 따라 \u003cstrong&gt;부리 모양이 다른 여러 종의 핀치\u003c/strong&gt; 관찰\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;자연선택설\u003c/strong&gt;: 최초의 조상 생물이 다양한 환경으로 퍼지고 적응하는 과정에서 \u003cstrong&gt;자연선택이 누적\u003c/strong&gt;되어 조상과 다른 \u003cstrong&gt;새로운 생물종\u003c/strong&gt;이 나타난다\u003c/li&gt;\n\u003cli&gt;한계: 처음 주장했을 때는 \u003cstrong&gt;변이의 원인을 설명하지 못함\u003c/strong&gt; → 많은 증거가 수집되고 보완되어 지금은 \u003cstrong&gt;진화의 원리\u003c/strong&gt;로 받아들여짐\u003c/li&gt;\n\u003cli&gt;그림 I-9 다윈이 관찰한 생물 예: 갈라파고스이구아나, 알다브라땅거북, 다윈여우, 가시복, 산호 화석 등\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 갈라파고스 제도의 핀치 관찰 (26쪽 해 보기)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 핀치 종류와 먹이(식물의 잎, 나뭇가지를 이용해 곤충, 단단한 씨앗, 선인장 꽃과 과육)를 비교\u003c/li&gt;\n\u003cli&gt;결과: \u003cstrong&gt;먹이의 종류에 따라 부리 모양이 다름\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;결론: \u003cstrong&gt;남아메리카 대륙\u003c/strong&gt;에서 건너온 \u003cstrong&gt;최초의 조상 핀치\u003c/strong&gt;가 여러 지역으로 퍼짐 → 각 환경의 \u003cstrong&gt;먹이를 먹기에 알맞은 부리\u003c/strong&gt;를 가진 개체가 \u003cstrong&gt;자연선택\u003c/strong&gt;되어 더 많이 살아남음 → 자손을 더 많이 남기는 과정이 여러 세대 반복 → \u003cstrong&gt;다양한 핀치\u003c/strong&gt;가 나타남\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;종이 둘로 나뉘는 사례 — 그랜드캐니언 영양다람쥐 (27쪽, 그림 I-10)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;미국 애리조나주 그랜드캐니언: \u003cstrong&gt;콜로라도강\u003c/strong&gt;이 흐르며 남북으로 나뉜 협곡\u003c/li&gt;\n\u003cli&gt;협곡이 생기며 최초의 조상 다람쥐가 \u003cstrong&gt;두 무리로 나뉨\u003c/strong&gt; → 각 지역 환경에 맞는 형질이 \u003cstrong&gt;독립적으로 자연선택\u003c/strong&gt; → \u003cstrong&gt;흰꼬리영양다람쥐\u003c/strong&gt;와 \u003cstrong&gt;해리스영양다람쥐\u003c/strong&gt; 두 종\u003c/li&gt;\n\u003cli&gt;결론: 조상 생물이 다양한 환경으로 퍼져 적응 → 조상 종과 다른 생물로 진화 → 수많은 생물종 → \u003cstrong&gt;현재 지구의 매우 다양한 생물\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n\u003ch3&gt;6차시. 생물다양성과 보전 방안 (28~31쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;생물다양성\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;확인된 생물종 수 \u003cstrong&gt;190여만 종\u003c/strong&gt;, 미확인 종 포함 시 \u003cstrong&gt;천만 종 이상\u003c/strong&gt; 추정\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;생물다양성\u003c/strong&gt;: 지구에 서식하는 \u003cstrong&gt;생물의 다양한 정도\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;생물종의 다양함 + 한 무리 내 \u003cstrong&gt;유전자\u003c/strong&gt;의 다양한 정도 + 생물이 서식하는 \u003cstrong&gt;환경\u003c/strong&gt;의 다양한 정도를 \u003cstrong&gt;모두 포함\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;생물다양성의 세 요소\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;유전적 다양성\u003c/strong&gt;: \u003cstrong&gt;같은 종\u003c/strong&gt;의 생물 무리 내에서 개체마다 \u003cstrong&gt;유전정보가 달라 다양한 변이\u003c/strong&gt;가 나타나는 정도\u003cul&gt;\n\u003cli&gt;예: 사람마다 모습이 다름, 달팽이 껍데기 무늬, \u003cstrong&gt;기린\u003c/strong&gt; 개체마다 크기·무늬가 조금씩 다름\u003c/li&gt;\n\u003cli&gt;높을수록 \u003cstrong&gt;불리한 환경 변화에도 적응할 수 있는 개체가 살아남아\u003c/strong&gt; 멸종하지 않을 확률 ↑\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;종다양성\u003c/strong&gt;: \u003cstrong&gt;한 지역\u003c/strong&gt;에서 서식하는 \u003cstrong&gt;생물종\u003c/strong&gt;의 다양한 정도\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;생물종이 많을수록\u003c/strong&gt;, \u003cstrong&gt;여러 종이 고르게 분포할수록\u003c/strong&gt; 높음 (예: 초원 생태계에 적응한 다양한 생물종)\u003c/li&gt;\n\u003cli&gt;높으면 한두 종이 사라져도 \u003cstrong&gt;대체할 다른 종\u003c/strong&gt;이 있어 \u003cstrong&gt;생태계가 안정적으로 유지\u003c/strong&gt;될 확률 ↑\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;생태계다양성\u003c/strong&gt;: 지구 전체 또는 특정 지역에서 생물이 서식할 수 있는 \u003cstrong&gt;환경\u003c/strong&gt;이 다양한 정도\u003cul&gt;\n\u003cli&gt;사막, 습지, 온대초원, 열대우림, 호수와 강, 바다 등 → 다양한 환경이 있어야 다양한 생물이 살 수 있음\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 생물다양성보전 실천 방안 알아보기 (30~31쪽 디지털 탐구)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 국립 생태원 누리집에서 \u003cstrong&gt;생물다양성협약(CBD)\u003c/strong&gt; 조사 → 세계 자연 기금 누리집의 &amp;#39;생활 실천&amp;#39; 항목 조사 → \u003cstrong&gt;우리 반의 생활 수칙\u003c/strong&gt; 만들어 실천\u003c/li&gt;\n\u003cli&gt;생물다양성협약(CBD)의 목적 (교과서 제시)\u003col&gt;\n\u003cli&gt;\u003cstrong&gt;생물다양성을 보전\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;그 구성 요소를 \u003cstrong&gt;지속가능하게 이용\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;생물 유전자원의 이용으로부터 발생되는 \u003cstrong&gt;이익을 공정, 공평하게 공유\u003c/strong&gt;\u003c/li&gt;\n\u003c/ol&gt;\n\u003c/li&gt;\n\u003cli&gt;결론: 생물다양성 파괴는 특정 지역·한 나라의 문제가 아닌 \u003cstrong&gt;인류의 생존과 직결된 문제\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;2022년 196개 국가\u003c/strong&gt;가 \u003cstrong&gt;&amp;#39;쿤밍-몬트리올 글로벌 생물다양성 프레임워크&amp;#39;\u003c/strong&gt; 채택 → \u003cstrong&gt;2030년까지 훼손된 육지와 해양 생태계를 최소 30 % 이상 복원\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;국제 사회·국가 차원의 노력 + 일상생활 속 개인의 노력\u003c/strong&gt;이 함께 필요\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;생물다양성 감소의 구체적 원인(서식지 파괴, 외래종 등)은 이 교과서 28~31쪽 본문에 목록으로 나오지 않음 \u003cstrong&gt;(교과서 확인 필요)\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;단원 문제 속 자료 (34쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;가축화된 닭: 지구 조류의 70 %가 닭 같은 가축, 다리·가슴이 커지고 심장·뼈는 작아짐 → 미래에는 \u003cstrong&gt;닭 뼈가 지금 시대를 대표하는 화석\u003c/strong&gt;이 될 수 있음. 지구 온난화, 폐플라스틱 축적 등 인류는 전 지구 시스템에 영향\u003c/li&gt;\n\u003cli&gt;불가사리 제거 실험(마카만 해변): 불가사리 제거 → 먹이인 \u003cstrong&gt;홍합 크게 번성\u003c/strong&gt; → 1년 뒤 15종 중 7종 사라짐, 5년 뒤 홍합 외 모든 종 사라짐 → 한 종의 제거가 \u003cstrong&gt;종다양성\u003c/strong&gt;을 무너뜨릴 수 있음\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;단원 주요 개념 (32쪽 스토리텔링)\u003c/strong&gt;: 화석·지질 시대(15), 선캄브리아시대(16), 고생대(17), 중생대(18), 신생대(19), 대멸종(20), 변이(22), 자연선택(24), 진화·자연선택설(25), 생물다양성(28), 유전적 다양성·종다양성·생태계다양성(29)\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 헷갈리는 것 비교표&quot;,&quot;html&quot;:&quot;\u003ch3&gt;비교 1. 시대별 바다 생물 vs 육지 생물 vs 식물\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시대\u003c/th&gt;\n\u003cth&gt;바다\u003c/th&gt;\n\u003cth&gt;육지 동물\u003c/th&gt;\n\u003cth&gt;식물\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;선캄브리아\u003c/td&gt;\n\u003ctd&gt;단세포생물, 남세균, 에디아카라 생물군\u003c/td&gt;\n\u003ctd&gt;없음(자외선 때문에 바다에만)\u003c/td&gt;\n\u003ctd&gt;—\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;고생대\u003c/td&gt;\n\u003ctd&gt;삼엽충, 어류, 완족류\u003c/td&gt;\n\u003ctd&gt;양서류, 곤충 (후기 큰 곤충·파충류)\u003c/td&gt;\n\u003ctd&gt;양치식물(고사리류)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;중생대\u003c/td&gt;\n\u003ctd&gt;암모나이트\u003c/td&gt;\n\u003ctd&gt;공룡(파충류) / 포유류 출현(중기)\u003c/td&gt;\n\u003ctd&gt;겉씨식물(은행류, 소철류)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;신생대\u003c/td&gt;\n\u003ctd&gt;화폐석\u003c/td&gt;\n\u003ctd&gt;포유류(매머드), 인류의 조상(후기), 조류\u003c/td&gt;\n\u003ctd&gt;속씨식물\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;비교 2. 대륙 분포 변화\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시기\u003c/th&gt;\n\u003cth&gt;대륙 변화\u003c/th&gt;\n\u003cth&gt;결과\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;고생대 말\u003c/td&gt;\n\u003ctd&gt;흩어진 대륙이 \u003cstrong&gt;합쳐짐\u003c/strong&gt; → 판게아\u003c/td&gt;\n\u003ctd&gt;얕은 바다 감소, 기후 급변, 생물종 수 크게 감소\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;중생대\u003c/td&gt;\n\u003ctd&gt;판게아 \u003cstrong&gt;분리 시작\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;대륙·해양 분포 다양 → 다양한 생물 번성\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;신생대\u003c/td&gt;\n\u003ctd&gt;대서양 확장, 인도-유라시아 충돌, 호주-남극 분리\u003c/td&gt;\n\u003ctd&gt;히말라야산맥, 현재의 대륙 분포, 남극 주변 찬 해류\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;비교 3. 두 번의 대멸종\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;고생대 말 대멸종\u003c/th&gt;\n\u003cth&gt;중생대 말 대멸종\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;다른 이름\u003c/td&gt;\n\u003ctd&gt;페름기 말 대멸종\u003c/td&gt;\n\u003ctd&gt;—\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;규모\u003c/td&gt;\n\u003ctd&gt;생물종의 \u003cstrong&gt;90 % 이상\u003c/strong&gt; (지구 역사상 가장 방대)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;50 % 이상의 해양 생물\u003c/strong&gt;, 육상 동물과 공룡\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;멸종한 대표 생물\u003c/td&gt;\n\u003ctd&gt;삼엽충\u003c/td&gt;\n\u003ctd&gt;공룡, 암모나이트\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;교과서 속 원인\u003c/td&gt;\n\u003ctd&gt;판게아 형성(얕은 바다 감소, 기후 급변), 시베리아 화산 분출설(온실 기체 → 기온 급상승)\u003c/td&gt;\n\u003ctd&gt;급격한 지구 환경 변화 — 소행성 충돌설, 화산 폭발설\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;이후\u003c/td&gt;\n\u003ctd&gt;살아남은 생물이 중생대에 번성\u003c/td&gt;\n\u003ctd&gt;포유류가 공룡의 빈자리 차지\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;비교 4. 공룡 멸종 가설\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;소행성 충돌설\u003c/th&gt;\n\u003cth&gt;화산 폭발설\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;원인 사건\u003c/td&gt;\n\u003ctd&gt;지름 약 10 km 소행성 충돌\u003c/td&gt;\n\u003ctd&gt;인도 데칸 지역 화산 폭발\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;대기 변화\u003c/td&gt;\n\u003ctd&gt;두꺼운 먼지 구름이 성층권을 덮어 햇빛 차단\u003c/td&gt;\n\u003ctd&gt;먼지와 유독 가스가 대기를 덮음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;환경 변화\u003c/td&gt;\n\u003ctd&gt;대규모 해일, 광합성량 감소, 기온 하강\u003c/td&gt;\n\u003ctd&gt;기온 하강, 산성비 → 토양 산성화, 화산재로 식물 못 자람\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;비교 5. 변이 vs 자연선택 vs 진화\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;용어\u003c/th&gt;\n\u003cth&gt;뜻\u003c/th&gt;\n\u003cth&gt;단위·범위\u003c/th&gt;\n\u003cth&gt;예\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;변이\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;같은 종 내에서 개체마다 다른 형질\u003c/td&gt;\n\u003ctd&gt;개체 사이의 차이\u003c/td&gt;\n\u003ctd&gt;사랑앵무 색, 달팽이 무늬\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;자연선택\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;생존에 유리한 변이의 개체가 더 많이 살아남아 자손을 남겨 무리의 구성이 변하는 현상\u003c/td&gt;\n\u003ctd&gt;무리(세대 반복)\u003c/td&gt;\n\u003ctd&gt;사사패모, 항생제 세균\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;진화\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;여러 세대에 걸쳐 환경에 적응해 이전과 다른 생물로 변화\u003c/td&gt;\n\u003ctd&gt;종(새로운 종 탄생)\u003c/td&gt;\n\u003ctd&gt;갈라파고스 핀치, 영양다람쥐\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;비교 6. 사사패모 서식지 비교\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;서식지\u003c/th&gt;\n\u003cth&gt;사람의 채집\u003c/th&gt;\n\u003cth&gt;많은 색\u003c/th&gt;\n\u003cth&gt;까닭\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;사람이 접근하기 어려운 곳\u003c/td&gt;\n\u003ctd&gt;어려움\u003c/td&gt;\n\u003ctd&gt;녹색\u003c/td&gt;\n\u003ctd&gt;채집 압력이 약함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;사람이 접근하기 쉬운 곳\u003c/td&gt;\n\u003ctd&gt;활발\u003c/td&gt;\n\u003ctd&gt;회색·갈색(돌과 비슷)\u003c/td&gt;\n\u003ctd&gt;녹색은 눈에 띄어 채취됨\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;비교 7. 생물다양성의 세 요소\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;요소\u003c/th&gt;\n\u003cth&gt;무엇의 다양함?\u003c/th&gt;\n\u003cth&gt;범위\u003c/th&gt;\n\u003cth&gt;높으면 좋은 점\u003c/th&gt;\n\u003cth&gt;예\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;유전적 다양성\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;유전정보(변이)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;같은 종\u003c/strong&gt; 무리 안\u003c/td&gt;\n\u003ctd&gt;불리한 환경에도 살아남는 개체 → 멸종 확률 ↓\u003c/td&gt;\n\u003ctd&gt;기린 무늬, 사람 생김새\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;종다양성\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;생물종(수 + 고른 분포)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;한 지역\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;한두 종이 사라져도 생태계 안정\u003c/td&gt;\n\u003ctd&gt;초원의 다양한 종\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;생태계다양성\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;서식 환경\u003c/td&gt;\n\u003ctd&gt;지구 전체 또는 특정 지역\u003c/td&gt;\n\u003ctd&gt;다양한 생물이 살 수 있음\u003c/td&gt;\n\u003ctd&gt;사막, 습지, 열대우림, 바다\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;비교 8. 화석이 적은 시대 vs 많은 시대\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;선캄브리아시대\u003c/th&gt;\n\u003cth&gt;고생대 이후\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;화석\u003c/td&gt;\n\u003ctd&gt;거의 없음(스트로마톨라이트, 에디아카라 생물군)\u003c/td&gt;\n\u003ctd&gt;많이 발견\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;까닭\u003c/td&gt;\n\u003ctd&gt;단단한 껍데기가 없어 화석으로 남기 어려움\u003c/td&gt;\n\u003ctd&gt;껍데기·뼈 같은 단단한 부분을 가진 생물 출현\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;구분 기준\u003c/td&gt;\n\u003ctd&gt;화석이 거의 없는 시기\u003c/td&gt;\n\u003ctd&gt;생물의 급격한 변화로 고생대·중생대·신생대 구분\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 외울 것 체크리스트&quot;,&quot;html&quot;:&quot;\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 화석 = 생물의 뼈·이빨·표피 등 유해 + 기어다닌 흔적·이빨 자국이 지층에 남은 것\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 지질 시대 = 약 46억 년 전 지구 탄생 ~ 현재\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 지질 시대 구분 기준 = 화석에 드러난 지구 환경의 변화(생물의 급격한 변화)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 선캄브리아시대 = 화석이 거의 없음, 지질 시대의 대부분(88.3 %)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 시작 시기: 고생대 5억 4천만 년 전 / 중생대 2억 5천만 년 전 / 신생대 6천 6백만 년 전\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 신생대가 가장 짧다(1.4 %), 인류는 신생대에 산다\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 선캄브리아: 강한 자외선 → 생물은 바다에, 최초의 단세포생물도 바다에서\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 남세균(광합성) → 대기에 산소가 쌓이기 시작\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 스트로마톨라이트 = 남세균이 분비한 끈끈한 물질에 퇴적물이 쌓인 것\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 고생대 시작 무렵 생물 폭발적 증가, 껍데기·뼈 가진 생물 출현\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 산소 증가 → 오존층 → 자외선 차단 → 육지 진출(고생대)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 고생대: 삼엽충·어류·완족류(바다), 양서류·곤충·양치식물(육지), 숲 → 석탄층\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 고생대 말 판게아 형성 → 얕은 바다 감소, 기후 급변 → 대멸종(90 % 이상)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 중생대: 판게아 분리, 화산 활동 → CO₂ → 기온 상승, 전 기간 온난\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 중생대: 암모나이트, 공룡, 겉씨식물(은행·소철), 포유류 출현(중기)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 중생대 말 대멸종: 공룡·암모나이트 멸종\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 신생대: 말기 빙하기·간빙기 반복, 포유류(매머드)·속씨식물·화폐석, 후기 인류의 조상\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 인도 + 유라시아 충돌 → 히말라야산맥 (신생대)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 빙하기 → 해수면 ↓ → 대륙이 육지로 연결 → 생물이 다른 대륙으로 퍼짐\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 대멸종 = 대량의 생물종이 한꺼번에 멸종 / 원인: 화산 분화, 운석 충돌, 기후 변화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 대멸종은 살아남은 생물에게 새로운 기회 (공룡 멸종 → 포유류 번성)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 소행성 충돌설(햇빛 차단, 해일) vs 화산 폭발설(인도 데칸, 산성비, 화산재)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 변이 = 같은 종 내 개체마다 다른 형질 / 원인: 유전정보 차이 → 단백질 종류·양 차이\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 자연선택 = 유리한 변이 개체가 더 많이 살아남아 자손을 남김 → 세대 반복 → 무리 구성 변화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 사사패모: 채집이 활발한 곳에서 돌과 비슷한 색 비율 ↑ (인간이 포식자)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 진화 = 여러 세대에 걸쳐 환경에 적응해 이전과 다른 생물로 변화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 다윈: 비글호 약 5년, 갈라파고스 핀치(먹이에 따라 부리 모양 다름), 자연선택설\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 자연선택설의 처음 한계 = 변이의 원인을 설명하지 못함\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 그랜드캐니언 협곡 → 두 무리로 나뉨 → 흰꼬리영양다람쥐·해리스영양다람쥐\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 생물다양성 = 유전적 다양성 + 종다양성 + 생태계다양성\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 종다양성은 종 수가 많고 고르게 분포할수록 높다\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; CBD 목적: 보전, 지속가능한 이용, 유전자원 이익의 공정·공평한 공유\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 2022년 쿤밍-몬트리올 프레임워크: 2030년까지 훼손 생태계 30 % 이상 복원\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;5. 예상 문제 15개&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;1.\u003c/strong&gt; 지질 시대의 구분에 대한 설명으로 옳지 않은 것은?\u003c/p&gt;\n\u003cp&gt;① 지질 시대는 약 46억 년 전 지구가 생긴 뒤 현재까지의 지구의 역사이다.\n② 화석에 드러난 지구 환경의 변화를 기준으로 지질 시대를 구분한다.\n③ 선캄브리아시대는 화석이 많이 발견되며, 지질 시대 중 가장 짧은 시대이다.\n④ 고생대, 중생대, 신생대는 생물의 급격한 변화를 기준으로 구분한다.\n⑤ 현재 인류가 살고 있는 시대는 신생대이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2.\u003c/strong&gt; 표는 지질 시대 A\u003cdel&gt;D의 상대적 길이를 나타낸 것이다. (A\u003c/del&gt;D는 오래된 순서이다.)\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시대\u003c/th&gt;\n\u003cth&gt;A\u003c/th&gt;\n\u003cth&gt;B\u003c/th&gt;\n\u003cth&gt;C\u003c/th&gt;\n\u003cth&gt;D\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;상대적 길이(%)\u003c/td&gt;\n\u003ctd&gt;88.3\u003c/td&gt;\n\u003ctd&gt;6.3\u003c/td&gt;\n\u003ctd&gt;4.0\u003c/td&gt;\n\u003ctd&gt;1.4\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. A는 화석이 거의 발견되지 않는 시기이다.\nㄴ. C 시기의 바다에서는 암모나이트가 번성하였다.\nㄷ. D는 약 6천 6백만 년 전에 시작되었다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3.\u003c/strong&gt; 선캄브리아시대에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 남세균과 같은 광합성 생물이 등장하여 대기에 산소가 쌓이기 시작하였다.\nㄴ. 오존층이 자외선을 차단하여 생물이 육지로 진출하였다.\nㄷ. 생물이 단단한 껍데기를 가지고 있어 화석이 많이 남았다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4.\u003c/strong&gt; 고생대에 대한 설명으로 옳지 않은 것은?\u003c/p&gt;\n\u003cp&gt;① 고생대가 시작될 무렵 생물의 종류와 숫자가 폭발적으로 증가하였다.\n② 껍데기나 뼈와 같이 단단한 부분을 가진 생물이 출현하였다.\n③ 거대한 양치식물 숲이 만들어졌고, 이 숲은 현재 석탄층으로 남아 있다.\n④ 고생대 말에 판게아가 분리되면서 얕은 바다의 면적이 넓어졌다.\n⑤ 고생대 후기에는 산소 농도가 현재보다 높아 몸집이 큰 곤충이 번성하였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5.\u003c/strong&gt; 중생대에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 전 기간에 걸쳐 빙하기와 간빙기가 반복되었다.\nㄴ. 꽃을 피우는 속씨식물이 지배적인 식물이었다.\nㄷ. 은행류나 소철류 같은 겉씨식물이 번성하였다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6.\u003c/strong&gt; 다음은 어느 지질 시대에 대한 설명이다.\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;이 시대는 대체로 온난한 기후였지만 말기에는 기후가 급변하였다. 인도 대륙과 유라시아 대륙이 충돌하여 거대한 산맥이 만들어졌고, 현재와 같은 대륙 분포가 되었다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;이 시대에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cp&gt;① 바다에서 삼엽충이 번성하였다.\n② 육지에서 공룡이 크게 번성하였다.\n③ 해수면이 낮아졌을 때 육지로 연결된 대륙 사이를 통해 생물이 다른 대륙으로 퍼져 나갔다.\n④ 흩어져 있던 대륙이 합쳐져 판게아가 만들어졌다.\n⑤ 최초의 단세포생물이 바다에서 출현하였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7.\u003c/strong&gt; 생물(화석)과 그 생물이 번성한 지질 시대를 옳게 짝 지은 것은?\u003c/p&gt;\n\u003cp&gt;① 삼엽충, 완족류 – 고생대\n② 암모나이트 – 신생대\n③ 화폐석 – 중생대\n④ 스트로마톨라이트 – 신생대\n⑤ 매머드 – 고생대\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8.\u003c/strong&gt; 다음은 강원도 태백 구문소 지역에 대한 자료이다.\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;태백 구문소 지역의 지층에서는 삼엽충 화석을 비롯하여 현재의 조개와 비슷한 다양한 바다 생물의 화석이 발견된다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;이 자료에 대한 해석으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 이 지층은 과거에 바다 환경에서 퇴적되었다.\nㄴ. 이 지층은 고생대에 만들어졌다.\nㄷ. 태백 지역의 환경은 과거와 현재가 다르다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9.\u003c/strong&gt; 그림은 지질 시대 동안 생물 과의 수 변화를 나타낸 것이고, (가)는 고생대 말, (나)는 중생대 말에 과의 수가 급격히 감소한 시기이다.\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(그래프 설명) 과의 수는 고생대 말 (가)와 중생대 말 (나)에서 급격히 감소한 뒤 다시 증가한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. (나) 시기에 지구에 있던 생물종의 90 % 이상이 멸종하였다.\nㄴ. (가) 시기에 공룡과 암모나이트가 멸종하였다.\nㄷ. 대멸종 이후 살아남은 생물종은 새로운 환경에 적응하며 다양한 종으로 진화하였다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10.\u003c/strong&gt; 다음은 공룡의 멸종을 설명하는 두 가설이다.\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 지름 약 10 km의 소행성이 충돌하며 생긴 두꺼운 먼지 구름이 성층권을 뒤덮어 햇빛을 차단했다.\n(나) 인도 데칸 지역의 화산 폭발로 먼지와 유독 가스가 대기를 뒤덮어 기후 변화를 일으켰다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. (가)는 대규모 해일과 산성비에 의한 토양 산성화만을 근거로 한다.\nㄴ. (가)와 (나) 모두 기온이 내려가 식물이 살아가기 어려운 환경이 되었다고 본다.\nㄷ. 두 가설의 타당성을 평가할 때 &amp;#39;전 지구적으로 영향을 주었는가?&amp;#39;를 기준으로 삼을 수 있다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11.\u003c/strong&gt; 다음은 자연선택 모의실험 과정의 일부이다.\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 나무 이쑤시개 20개와 녹말 이쑤시개 20개를 황갈색 종이 위에 섞어 놓는다.\n(나) 보안경을 쓰고 핀셋으로 이쑤시개 20개를 제거한다.\n(다) 남은 이쑤시개 수를 세어 같은 종류의 이쑤시개를 남은 수만큼 더해 준다.\n(라) (나)~(다)를 반복한 뒤, 녹색 종이로 바꾸어 같은 과정을 반복한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;이 실험에 대한 설명으로 가장 적절한 것은?\u003c/p&gt;\n\u003cp&gt;① (나)에서 핀셋으로 이쑤시개를 제거하는 것은 포식자에게 잡아먹히는 것에 해당한다.\n② (다)는 새로운 변이가 생겨나는 과정에 해당한다.\n③ 종이의 색은 생물 무리 내의 변이에 해당한다.\n④ 세대가 거듭되어도 두 이쑤시개의 비율은 변하지 않는다.\n⑤ 종이의 색을 바꾸어도 살아남기 유리한 이쑤시개의 종류는 같다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12.\u003c/strong&gt; 다음은 사사패모에 대한 자료이다.\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;해발 3700 m 이상의 고지대에 사는 사사패모는 개체마다 다른 색을 띤다. 사람이 가기 힘든 곳에서는 초록색 개체의 비율이 높았고, 사람이 접근하기 쉬워 채집이 활발한 곳에서는 주변 돌과 비슷한 색을 띠는 개체의 비율이 월등히 높았다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 사사패모 무리에는 색의 변이가 있다.\nㄴ. 채집이 활발한 곳에서는 사람 눈에 잘 띄지 않는 방향으로 자연선택이 일어났다.\nㄷ. 사람이 접근하기 어려운 곳에서는 회색이나 갈색 개체의 비율이 가장 높다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;13.\u003c/strong&gt; 다음은 갈라파고스 제도에 사는 핀치에 대한 자료이다.\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;갈라파고스 제도에는 단단한 씨앗을 먹는 핀치, 선인장 꽃과 과육을 먹는 핀치, 곤충을 먹는 핀치 등 먹이에 따라 부리 모양이 다른 여러 종의 핀치가 산다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;이 핀치들이 나타나게 된 과정에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 조상 핀치 무리 내에 부리 모양의 변이가 있었다.\nㄴ. 각 환경에서 먹이를 먹기에 알맞은 부리를 가진 개체가 자연선택되었다.\nㄷ. 최초의 조상 핀치는 남아메리카 대륙에서 건너왔다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;14.\u003c/strong&gt; 진화와 다윈의 자연선택설에 대한 설명으로 옳지 않은 것은?\u003c/p&gt;\n\u003cp&gt;① 진화는 생물이 여러 세대에 걸쳐 환경에 적응하면서 이전과는 다른 생물로 변화하는 것이다.\n② 다윈은 자연선택설을 처음 주장할 때부터 변이의 원인을 유전정보의 차이로 설명하였다.\n③ 다윈은 약 5년 동안 세계를 항해하며 다양한 생물과 자연 현상을 관찰하였다.\n④ 자연선택이 누적되면 조상 생물과 다른 새로운 생물종이 나타날 수 있다.\n⑤ 그랜드캐니언의 두 영양다람쥐 종은 협곡으로 나뉜 두 무리에서 각각 독립적으로 자연선택이 일어나 생겼다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;15.\u003c/strong&gt; 생물다양성과 그 보전에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 종다양성은 같은 종의 생물 무리 내에서 개체마다 유전정보가 다른 정도이다.\nㄴ. 유전적 다양성이 높은 생물 무리는 불리한 환경 변화에도 살아남는 개체가 있어 멸종할 확률이 낮아진다.\nㄷ. 생물다양성협약(CBD)의 목적에는 생물 유전자원의 이용으로 생기는 이익을 공정, 공평하게 공유하는 것이 포함된다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;번호\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003cth&gt;해설\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;선캄브리아시대는 화석이 거의 발견되지 않고, 지질 시대의 대부분(88.3 %)을 차지하는 가장 긴 시대이다. 가장 짧은 시대는 신생대(1.4 %).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;A 선캄브리아시대(화석 거의 없음), C 중생대(바다에서 암모나이트 번성), D 신생대(6천 6백만 년 전 시작). 모두 옳다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;3\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;ㄴ. 오존층 형성·육지 진출은 고생대. ㄷ. 선캄브리아시대 생물은 단단한 껍데기가 없어 화석으로 남기 어려웠다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;고생대 말에는 흩어진 대륙이 합쳐져 판게아가 되었고, 얕은 바다 면적이 줄었다. 판게아 분리는 중생대 초부터.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;5\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;ㄱ. 빙하기·간빙기 반복은 신생대 말기. 중생대는 전 기간 온난. ㄴ. 속씨식물이 지배적인 시대는 신생대.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;제시문은 신생대(히말라야산맥 형성). 빙하기에 해수면이 낮아져 대륙 사이가 육지로 연결되면서 생물이 퍼져 나갔다. ①은 고생대, ②는 중생대, ④는 고생대 말, ⑤는 선캄브리아시대.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;7\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;암모나이트는 중생대, 화폐석은 신생대, 스트로마톨라이트는 선캄브리아시대, 매머드는 신생대.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;바다 생물 화석 → 바다에서 퇴적. 삼엽충은 고생대 바다 생물. 지금 태백은 바다가 아니므로 환경이 변했다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;9\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;ㄱ. 생물종의 90 % 이상 멸종은 고생대 말 (가). ㄴ. 공룡과 암모나이트 멸종은 중생대 말 (나). ㄷ. 대멸종 뒤 살아남은 생물은 다양한 종으로 진화했다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;ㄱ. 산성비·토양 산성화는 화산 폭발설의 내용이다. 소행성 충돌설은 햇빛 차단, 해일, 광합성량 감소, 기온 하강. ㄴ. 두 가설 모두 기온 하강과 식물 생장 어려움을 말한다. ㄷ. 교과서의 평가 기준 중 하나.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;11\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;핀셋 제거 = 포식, (다) = 살아남은 개체의 번식(자손 생산), 종이 색 = 서식 환경. 세대가 거듭되면 환경에 유리한 쪽 비율이 커지고, 환경(종이 색)이 바뀌면 유리한 쪽도 달라질 수 있다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;12\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;ㄷ. 사람이 접근하기 어려운 곳에서는 초록색 개체 비율이 높다. 회색·갈색은 채집이 활발한 곳에서 많다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;13\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;남아메리카에서 건너온 조상 핀치가 퍼지고, 변이 중 먹이에 알맞은 부리를 가진 개체가 자연선택되어 세대가 반복되며 다양한 핀치가 나타났다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;14\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;다윈이 처음 자연선택설을 주장했을 때는 변이의 원인을 설명하지 못하는 한계가 있었다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;15\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;ㄱ은 유전적 다양성의 뜻이다. 종다양성은 한 지역에 사는 생물종의 다양한 정도.\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;}]},{&quot;id&quot;:&quot;science-chemistry&quot;,&quot;subject&quot;:&quot;통합과학&quot;,&quot;title&quot;:&quot;② 화학 변화와 에너지&quot;,&quot;file&quot;:&quot;통합과학_정리_2_화학변화와에너지.md&quot;,&quot;range&quot;:&quot;교과서 36~66쪽&quot;,&quot;flow&quot;:[[&quot;산화 · 환원&quot;,&quot;산소 또는 전자 이동&quot;,&quot;산화: 산소 얻음 · 전자 잃음 / 환원: 반대 / 동시 발생&quot;],[&quot;산 · 염기&quot;,&quot;H⁺ · OH⁻&quot;,&quot;산성의 원인 H⁺ / 염기성의 원인 OH⁻&quot;],[&quot;중화 반응&quot;,&quot;H⁺ + OH⁻ → H₂O&quot;,&quot;1 : 1로 반응 / 생성된 물의 양과 중화열&quot;],[&quot;에너지 출입&quot;,&quot;방출 ↔ 흡수&quot;,&quot;방출: 주변 온도 상승 / 흡수: 주변 온도 하강&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;염산에 수산화 나트륨을 넣을 때&quot;,&quot;head&quot;:[&quot;입자 · 값&quot;,&quot;중성 전&quot;,&quot;중성 이후&quot;],&quot;rows&quot;:[[&quot;H⁺&quot;,&quot;감소&quot;,&quot;0&quot;],[&quot;OH⁻&quot;,&quot;0&quot;,&quot;증가&quot;],[&quot;Na⁺ / Cl⁻&quot;,&quot;증가 / 일정&quot;,&quot;증가 / 일정&quot;],[&quot;전체 이온 수&quot;,&quot;일정&quot;,&quot;증가&quot;],[&quot;생성된 물 분자 수&quot;,&quot;증가&quot;,&quot;일정&quot;]]},&quot;note&quot;:&quot;위 이온 변화는 HCl에 NaOH를 넣는 원문 모형 기준. 역방향·온도 비교·반응식 해석은 계산 유형에 수록.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;과목: 통합과학2 (천재교육, 신영준) / 단원: Ⅰ. 변화와 다양성 — 2. 화학 변화와 에너지 출입 / 교과서 36~66쪽 (중단원 도입 ~ 문제 해결하기)\n부교재는 아직 반영 안 됨.\n반응식은 원본에서 화살표·계수가 깨져 있어 모두 원자 수·전하를 직접 검산해서 적었다. 교과서에 반응식이 없는 것은 따로 표시함.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 한눈에 보기&quot;,&quot;html&quot;:&quot;\u003ch3&gt;표 1. 소단원 흐름\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;소단원 (쪽)\u003c/th&gt;\n\u003cth&gt;핵심 질문\u003c/th&gt;\n\u003cth&gt;핵심 개념\u003c/th&gt;\n\u003cth&gt;대표 탐구·자료\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;산화환원 반응의 규칙성 (38~43)\u003c/td&gt;\n\u003ctd&gt;자연과 인류 역사를 바꾼 화학 반응의 공통점은?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;산소\u003c/strong&gt;가 관여 → \u003cstrong&gt;산화\u003c/strong&gt;(산소 얻음/전자 잃음), \u003cstrong&gt;환원\u003c/strong&gt;(산소 잃음/전자 얻음), \u003cstrong&gt;동시에 일어남\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;산화 구리(II)+숯가루 가열, 구리+질산 은 수용액\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;생활 주변의 산화환원 반응 (44~47)\u003c/td&gt;\n\u003ctd&gt;우리 주변 산화환원 반응은?\u003c/td&gt;\n\u003ctd&gt;광합성, 세포호흡, 메테인 연소, 철의 제련, 손난로, 배터리, 갈변 등\u003c/td&gt;\n\u003ctd&gt;그림 I 15\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;산과 염기의 종류와 성질 (48~53)\u003c/td&gt;\n\u003ctd&gt;산과 염기는 어떤 성질이 있고 왜 그런가?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;산성\u003c/strong&gt;(H⁺ 때문), \u003cstrong&gt;염기성\u003c/strong&gt;(OH⁻ 때문)\u003c/td&gt;\n\u003ctd&gt;12홈판 실험(전류, 탄산 칼슘, 마그네슘, 두부)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;중화 반응과 실생활에서의 이용 (54~59)\u003c/td&gt;\n\u003ctd&gt;산과 염기를 섞으면?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;중화 반응\u003c/strong&gt; H⁺ + OH⁻ → H₂O (1 : 1), \u003cstrong&gt;중화열\u003c/strong&gt; ∝ 생성된 물 분자 양\u003c/td&gt;\n\u003ctd&gt;HCl+NaOH 부피 바꿔 최고 온도·BTB 색\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;물질 변화에서 에너지 출입 (60~63)\u003c/td&gt;\n\u003ctd&gt;불 없이 조리할 수 있을까?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;에너지 방출\u003c/strong&gt; → 주변 온도 ↑, \u003cstrong&gt;에너지 흡수\u003c/strong&gt; → 주변 온도 ↓\u003c/td&gt;\n\u003ctd&gt;물+산화 칼슘 조리 장치 설계\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;표 2. 산화·환원 두 가지 기준 한 번에\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;기준\u003c/th&gt;\n\u003cth&gt;산화\u003c/th&gt;\n\u003cth&gt;환원\u003c/th&gt;\n\u003cth&gt;대표 예\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;산소의 이동\u003c/td&gt;\n\u003ctd&gt;산소를 \u003cstrong&gt;얻음\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;산소를 \u003cstrong&gt;잃음\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;2CuO + C → 2Cu + CO₂\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;전자의 이동\u003c/td&gt;\n\u003ctd&gt;전자를 \u003cstrong&gt;잃음\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;전자를 \u003cstrong&gt;얻음\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;Cu + 2Ag⁺ → Cu²⁺ + 2Ag\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;공통\u003c/td&gt;\n\u003ctd&gt;산화와 환원은 항상 \u003cstrong&gt;동시에\u003c/strong&gt; 일어난다\u003c/td&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 소단원별 핵심 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;도입 (36~37쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;이 단원에서 배울 내용: 산화환원 반응의 규칙성 → 생활 주변의 산화환원 반응 → 산과 염기의 종류와 성질 → 중화 반응과 실생활에서의 이용 → 물질 변화에서 에너지 출입\u003c/li&gt;\n\u003cli&gt;도입의 수국 퀴즈 문장(예: &amp;quot;열에너지를 흡수하는 반응이 일어날 때는 주위의 온도가 높아진다&amp;quot;)은 \u003cstrong&gt;O/X 퀴즈 문장\u003c/strong&gt;이라 그대로 외우면 안 됨. 흡수하면 주위 온도는 \u003cstrong&gt;낮아진다\u003c/strong&gt;(61쪽).\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;1차시. 산화환원 반응의 규칙성 (38~43쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;우리 주변 화학 반응의 공통점 (그림 I 11, 39쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;광합성 생물의 등장\u003c/strong&gt;: 바다에 광합성을 하는 \u003cstrong&gt;남세균\u003c/strong&gt;이 생기면서 대기에 산소가 쌓이기 시작\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;산소 호흡을 하는 생물의 등장\u003c/strong&gt;: 산소로 영양소를 분해해 에너지를 얻는 생물 등장\u003c/li&gt;\n\u003cli&gt;대기 중 산소 → \u003cstrong&gt;오존층\u003c/strong&gt; 형성 → 자외선 흡수 → 생물이 바다에서 \u003cstrong&gt;육지로\u003c/strong&gt; 올라옴\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;철의 제련\u003c/strong&gt;: 자연의 철은 산소와 결합한 \u003cstrong&gt;산화 철\u003c/strong&gt; 형태 → 산소를 떼어 내는 \u003cstrong&gt;제련\u003c/strong&gt; 기술 → \u003cstrong&gt;철기 문명\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;화석 연료의 사용\u003c/strong&gt;: 석탄·석유·천연가스를 산소와 반응시키면 \u003cstrong&gt;연소\u003c/strong&gt; → 열에너지로 물품 생산, 전력 생산, 운송 수단, 난방\u003c/li&gt;\n\u003cli&gt;결론: 광합성, 철의 제련, 화석 연료 사용에 공통으로 관여한 원소는 \u003cstrong&gt;산소\u003c/strong&gt; → \u003cstrong&gt;산소의 이동에 의한 산화환원 반응\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;산소는 대기(기체), 지각(광물)에 흔하므로 산화환원 반응은 생활에서 쉽게 볼 수 있다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;산소의 이동으로 본 산화환원 (40~41쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;산화\u003c/strong&gt;: 물질이 산소와 결합하여 \u003cstrong&gt;산소를 얻는 반응\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;환원\u003c/strong&gt;: 물질이 산소와 분리되어 \u003cstrong&gt;산소를 잃는 반응\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;2CuO + C → 2Cu + CO₂\u003cul&gt;\n\u003cli&gt;산화 구리(II)(CuO): 산소를 잃음 → \u003cstrong&gt;환원\u003c/strong&gt;됨\u003c/li&gt;\n\u003cli&gt;탄소(C): 산소를 얻음 → \u003cstrong&gt;산화\u003c/strong&gt;됨\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;산화 반응과 환원 반응은 동시에 일어난다.\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;철의 녹: 철(Fe)이 공기 중 산소와 만나 서서히 산화 → \u003cstrong&gt;산화 철(III)(Fe₂O₃)\u003c/strong&gt;, 본래 성질을 잃음\u003cul&gt;\n\u003cli&gt;철: 은회색, 광택 있음 / 산화 철(III): \u003cstrong&gt;붉은색, 광택 없음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;페루 \u003cstrong&gt;무지개 산\u003c/strong&gt;이 일부 붉게 보이는 까닭: 흙에 \u003cstrong&gt;산화 철\u003c/strong&gt; 성분이 많기 때문\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트① 산화 구리(II)를 숯가루와 함께 가열 (40쪽 &amp;#39;해 보기&amp;#39;)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 시험관에 산화 구리(II) 가루 + \u003cstrong&gt;충분한 양의 숯가루\u003c/strong&gt; → 고무관 연결 고무마개로 막고 가열 → 발생 기체를 석회수로 보냄\u003c/li&gt;\n\u003cli&gt;결과: \u003cstrong&gt;검은색\u003c/strong&gt; 산화 구리(II) 가루 → \u003cstrong&gt;붉은색\u003c/strong&gt; 구리 가루 / 발생한 \u003cstrong&gt;이산화 탄소\u003c/strong&gt;가 \u003cstrong&gt;석회수를 뿌옇게\u003c/strong&gt; 함\u003c/li&gt;\n\u003cli&gt;결론: 산화 구리(II)에서 떨어진 산소가 탄소로 이동 → CuO는 환원, C는 산화\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;전자의 이동으로 본 산화환원 (42~43쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;문제 제기: 4Fe + 3O₂ → 2Fe₂O₃ 에서 철은 산소를 얻어 산화되지만, \u003cstrong&gt;환원 반응은 산소의 이동으로 설명할 수 없다.\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;Fe₂O₃는 **철 이온(Fe³⁺)**과 **산화 이온(O²⁻)**으로 구성\u003cul&gt;\n\u003cli&gt;철은 전자를 잃어 Fe³⁺ (산화), 산소는 전자를 얻어 O²⁻ (환원) → \u003cstrong&gt;철에서 산소로 전자가 이동\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;산화\u003c/strong&gt;: \u003cstrong&gt;전자를 잃는 반응\u003c/strong&gt; / \u003cstrong&gt;환원\u003c/strong&gt;: \u003cstrong&gt;전자를 얻는 반응\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;전자를 주고받으므로 \u003cstrong&gt;산화와 환원은 동시에\u003c/strong&gt; 일어난다.\u003c/li&gt;\n\u003cli&gt;마그네슘 리본 가열: 2Mg + O₂ → 2MgO\u003cul&gt;\n\u003cli&gt;Mg → Mg²⁺ (전자 잃음, 산화) / O₂ → O²⁻ (전자 얻음, 환원) → 두 이온이 결합해 산화 마그네슘\u003c/li&gt;\n\u003cli&gt;(검산) 2Mg가 전자 4개를 잃고, O₂ 1개(산소 원자 2개)가 전자 4개를 얻음\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트② 구리와 질산 은 수용액의 산화환원 반응 (42쪽 탐구)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: ① 구리줄을 \u003cstrong&gt;사포로 문질러\u003c/strong&gt; 모양 만들기 → ② 페트리 접시에 넣고 질산 은 수용액을 구리줄이 잠기게 부음 → ③ 수용액 색, 구리줄 표면 관찰\u003c/li&gt;\n\u003cli&gt;결과: 무색 수용액이 점점 \u003cstrong&gt;푸른색\u003c/strong&gt;으로 변함 / 구리줄 표면에 **은회색 금속(은)**이 석출되어 달라붙음 (66쪽 9번 문제의 실험 결과와 같음)\u003c/li&gt;\n\u003cli&gt;결론:\u003cul&gt;\n\u003cli&gt;구리(Cu): \u003cstrong&gt;전자를 잃고\u003c/strong&gt; 구리 이온(Cu²⁺)으로 용액에 녹아듦 → \u003cstrong&gt;산화\u003c/strong&gt; → 푸른색의 원인\u003c/li&gt;\n\u003cli&gt;은 이온(Ag⁺): \u003cstrong&gt;전자를 얻어\u003c/strong&gt; 금속 은(Ag)으로 석출 → \u003cstrong&gt;환원\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;반응식: Cu + 2Ag⁺ → Cu²⁺ + 2Ag (전하: 왼쪽 +2, 오른쪽 +2 ✔)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;안전: 실험 후 남은 용액은 \u003cstrong&gt;폐수 통\u003c/strong&gt;에 버림\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2차시. 생활 주변의 산화환원 반응 (44~47쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;그림 I 15 우리 주변의 산화환원 반응 (45쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;반응\u003c/th&gt;\n\u003cth&gt;반응식 (검산 완료)\u003c/th&gt;\n\u003cth&gt;산화되는 물질\u003c/th&gt;\n\u003cth&gt;환원되는 물질\u003c/th&gt;\n\u003cth&gt;특징\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;광합성\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂\u003c/td&gt;\n\u003ctd&gt;물(H₂O)\u003c/td&gt;\n\u003ctd&gt;이산화 탄소(CO₂)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;엽록체\u003c/strong&gt;, \u003cstrong&gt;빛에너지 → 화학 에너지\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;세포호흡\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O\u003c/td&gt;\n\u003ctd&gt;포도당\u003c/td&gt;\n\u003ctd&gt;산소\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;마이토콘드리아\u003c/strong&gt;, 생명 활동에 필요한 에너지\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;메테인의 연소\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;CH₄ + 2O₂ → CO₂ + 2H₂O\u003c/td&gt;\n\u003ctd&gt;메테인\u003c/td&gt;\n\u003ctd&gt;산소\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;액화천연가스\u003c/strong&gt; 주성분, 열에너지 발생\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;철의 제련\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;Fe₂O₃ + 3CO → 2Fe + 3CO₂\u003c/td&gt;\n\u003ctd&gt;일산화 탄소\u003c/td&gt;\n\u003ctd&gt;산화 철(III)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;용광로\u003c/strong&gt;, 철광석+코크스+석회석\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;산화환원 반응은 \u003cstrong&gt;생명을 유지하는 데 필수적\u003c/strong&gt;: 식물은 광합성으로 스스로 영양소를 합성, 대부분 생물은 산소로 호흡하며 영양소를 분해해 에너지를 얻음\u003c/li&gt;\n\u003cli&gt;철의 제련 순서: 고온의 용광로에 \u003cstrong&gt;철광석, 코크스(C), 석회석\u003c/strong&gt; → 코크스가 산소와 결합해 \u003cstrong&gt;일산화 탄소(CO)\u003c/strong&gt; → 산화 철(III)과 CO가 반응해 순수한 철\u003cul&gt;\n\u003cli&gt;코크스 → CO 반응식: 2C + O₂ → 2CO (교과서에는 말로만 나옴, 반응식은 검산해서 적음)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;화석 연료는 공기 중 산소와 반응하여 \u003cstrong&gt;산화\u003c/strong&gt;되면서 많은 양의 \u003cstrong&gt;열에너지를 방출\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;우리 주변에서 찾아본 산화환원 반응 (46~47쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;집: \u003cstrong&gt;섬유 표백\u003c/strong&gt;(표백제 → 누런 옷이 하얗게), \u003cstrong&gt;양초\u003c/strong&gt;(주성분 \u003cstrong&gt;파라핀\u003c/strong&gt;이 연소 → 이산화 탄소 + 수증기), \u003cstrong&gt;손난로\u003c/strong&gt;(철이 산소와 반응해 **산화 철(III)**로 산화될 때 열 발생)\u003c/li&gt;\n\u003cli&gt;길: \u003cstrong&gt;자동차 배기관의 촉매 장치\u003c/strong&gt;(\u003cstrong&gt;산화 질소가 환원\u003c/strong&gt;되어 배기가스 정화)\u003c/li&gt;\n\u003cli&gt;학교 등: \u003cstrong&gt;리튬 배터리\u003c/strong&gt;(리튬이 전자를 잃고 산화된 뒤 이동하며 충전), \u003cstrong&gt;과일의 갈변\u003c/strong&gt;(사과·배·바나나·복숭아의 \u003cstrong&gt;폴리페놀\u003c/strong&gt;이 산화), \u003cstrong&gt;반딧불이\u003c/strong&gt;(광세포에서 \u003cstrong&gt;루시페린\u003c/strong&gt;이 산화되며 \u003cstrong&gt;빛에너지\u003c/strong&gt; 방출)\u003c/li&gt;\n\u003cli&gt;스마트폰 배터리 충전, 표백제 빨래도 산화환원 반응\u003c/li&gt;\n\u003cli&gt;자료 조사 시 생성형 인공지능·스마트 기기 검색 등 \u003cstrong&gt;두 가지 이상의 방법으로 검증\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;3차시. 산과 염기의 종류와 성질 (48~53쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;도입\u003c/strong&gt;: 혈액은 \u003cstrong&gt;약한 염기성\u003c/strong&gt;, 소화 효소 중 산성·염기성인 것도 있음 / 과일에는 산, 찌든 때 세탁에는 염기성 세제\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트③ 산과 염기의 성질 (48~49쪽 탐구)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 12홈판에 묽은 염산, 아세트산 수용액, 수산화 나트륨 수용액, 수산화 칼륨 수용액을 10방울씩 세 줄 → 1줄: 간이 전기 전도계로 전류 확인 후 \u003cstrong&gt;탄산 칼슘\u003c/strong&gt; / 2줄: \u003cstrong&gt;마그네슘 조각\u003c/strong&gt; / 3줄: 작게 자른 \u003cstrong&gt;두부\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;묽은 염산, 아세트산 수용액 (산)\u003c/th&gt;\n\u003cth&gt;수산화 나트륨, 수산화 칼륨 수용액 (염기)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;간이 전기 전도계\u003c/td&gt;\n\u003ctd&gt;전류가 흐름\u003c/td&gt;\n\u003ctd&gt;전류가 흐름\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;탄산 칼슘\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;이산화 탄소(CO₂)\u003c/strong&gt; 기체 발생\u003c/td&gt;\n\u003ctd&gt;반응하지 않음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;마그네슘 조각\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;수소(H₂)\u003c/strong&gt; 기체 발생\u003c/td&gt;\n\u003ctd&gt;반응하지 않음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;두부(단백질)\u003c/td&gt;\n\u003ctd&gt;(본문에 언급 없음 — 교과서 확인 필요)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;단백질을 녹임\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;결론: 산의 공통적인 성질 = \u003cstrong&gt;산성\u003c/strong&gt; / 염기의 공통적인 성질 = \u003cstrong&gt;염기성\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;날개 설명: \u003cstrong&gt;모든 금속이 산과 반응하여 수소를 내는 것은 아니다.\u003c/strong&gt; 구리, 은, 금, 백금은 산과 반응하지 않음\u003c/li&gt;\n\u003cli&gt;참고 반응식(교과서에 없음, 검산함): Mg + 2HCl → MgCl₂ + H₂ / CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;산이 공통적인 성질을 나타내는 까닭 (50쪽, 그림 I 16)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;염화 수소(HCl)가 물에 녹아 묽은 염산이 될 때 **수소 이온(H⁺)**과 **염화 이온(Cl⁻)**으로 \u003cstrong&gt;이온화\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;전극을 넣고 전원을 연결하면 이온들이 전극으로 움직여 \u003cstrong&gt;전류가 흐름\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;산\u003c/th&gt;\n\u003cth&gt;이온화 (검산 완료)\u003c/th&gt;\n\u003cth&gt;음이온 이름\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;염화 수소\u003c/td&gt;\n\u003ctd&gt;HCl → H⁺ + Cl⁻\u003c/td&gt;\n\u003ctd&gt;염화 이온\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;질산\u003c/td&gt;\n\u003ctd&gt;HNO₃ → H⁺ + NO₃⁻\u003c/td&gt;\n\u003ctd&gt;질산 이온\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;황산\u003c/td&gt;\n\u003ctd&gt;H₂SO₄ → 2H⁺ + SO₄²⁻\u003c/td&gt;\n\u003ctd&gt;황산 이온\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;탄산\u003c/td&gt;\n\u003ctd&gt;H₂CO₃ → 2H⁺ + CO₃²⁻\u003c/td&gt;\n\u003ctd&gt;탄산 이온\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;아세트산\u003c/td&gt;\n\u003ctd&gt;CH₃COOH → H⁺ + CH₃COO⁻\u003c/td&gt;\n\u003ctd&gt;아세트산 이온\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;산의 종류에 따라 \u003cstrong&gt;음이온은 다르지만 양이온(H⁺)은 같다.\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;여러 산의 공통 성질은 \u003cstrong&gt;수소 이온 때문\u003c/strong&gt; → \u003cstrong&gt;산: 수용액 상태에서 수소 이온(H⁺)을 내놓는 물질\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;염기가 공통적인 성질을 나타내는 까닭 (51쪽, 그림 I 17)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;고체 수산화 나트륨이 물에 녹으면 **나트륨 이온(Na⁺)**과 **수산화 이온(OH⁻)**으로 이온화 → 전류가 흐름\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;염기\u003c/th&gt;\n\u003cth&gt;이온화 (검산 완료)\u003c/th&gt;\n\u003cth&gt;양이온 이름\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;수산화 나트륨\u003c/td&gt;\n\u003ctd&gt;NaOH → Na⁺ + OH⁻\u003c/td&gt;\n\u003ctd&gt;나트륨 이온\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수산화 칼륨\u003c/td&gt;\n\u003ctd&gt;KOH → K⁺ + OH⁻\u003c/td&gt;\n\u003ctd&gt;칼륨 이온\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수산화 칼슘\u003c/td&gt;\n\u003ctd&gt;Ca(OH)₂ → Ca²⁺ + 2OH⁻\u003c/td&gt;\n\u003ctd&gt;칼슘 이온\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;염기의 종류에 따라 \u003cstrong&gt;양이온은 다르지만 음이온(OH⁻)은 같다.\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;여러 염기의 공통 성질은 \u003cstrong&gt;수산화 이온 때문\u003c/strong&gt; → \u003cstrong&gt;염기: 수용액 상태에서 수산화 이온(OH⁻)을 내놓는 물질\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;우리 주변의 산과 염기 (52~53쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;산: \u003cstrong&gt;식초\u003c/strong&gt;(아세트산), \u003cstrong&gt;과일\u003c/strong&gt;(비타민 C 등의 산), \u003cstrong&gt;아세틸 살리실산\u003c/strong&gt;(해열제·진통제)\u003c/li&gt;\n\u003cli&gt;염기: \u003cstrong&gt;수산화 나트륨\u003c/strong&gt;(비누를 만드는 데 사용), \u003cstrong&gt;유리 세정제\u003c/strong&gt;(기름 성분 제거용 염기 성분)\u003c/li&gt;\n\u003cli&gt;환경:\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;해양 산성화\u003c/strong&gt;: 대기 중 CO₂ 농도 ↑ → 바다에 녹는 CO₂ ↑ → 해수 표면 \u003cstrong&gt;H⁺ 농도 점점 증가\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;산성비\u003c/strong&gt;: 화석 연료 연소 때 나온 \u003cstrong&gt;황 산화물, 질소 산화물\u003c/strong&gt; → \u003cstrong&gt;황산, 질산\u003c/strong&gt; → 산성비\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;수국\u003c/strong&gt;: \u003cstrong&gt;산성 토양 → 푸른색\u003c/strong&gt;, \u003cstrong&gt;염기성 토양 → 붉은색\u003c/strong&gt; 꽃잎\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;염기성 호수\u003c/strong&gt;: 탄자니아의 \u003cstrong&gt;나트론 호수\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;지시약 색 정리 (교과서에 나온 것만)\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;지시약\u003c/th&gt;\n\u003cth&gt;산성\u003c/th&gt;\n\u003cth&gt;중성\u003c/th&gt;\n\u003cth&gt;염기성\u003c/th&gt;\n\u003cth&gt;출처\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;BTB 용액\u003c/td&gt;\n\u003ctd&gt;노란색\u003c/td&gt;\n\u003ctd&gt;초록색\u003c/td&gt;\n\u003ctd&gt;파란색\u003c/td&gt;\n\u003ctd&gt;55쪽 그림 (변환본에 색 이름이 빠져 있음 — 교과서 그림으로 색 확인 필요)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;리트머스 종이\u003c/td&gt;\n\u003ctd&gt;푸른색 → \u003cstrong&gt;붉은색\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;—\u003c/td&gt;\n\u003ctd&gt;(교과서 확인 필요)\u003c/td&gt;\n\u003ctd&gt;36쪽 &amp;#39;이전에 배웠어요&amp;#39;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수국 꽃잎(토양)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;푸른색\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;—\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;붉은색\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;53쪽\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;페놀프탈레인, 메틸 오렌지 등 다른 지시약은 이 범위 교과서에서 확인되지 않음 (부교재/교과서 확인 필요)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;4차시. 중화 반응과 실생활에서의 이용 (54~59쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;도입 만화: 종이가 산성화되는 것을 막으면 오래되어도 삭지 않음\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트④ 산과 염기를 혼합했을 때의 변화 (54~55쪽 탐구)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;준비: \u003cstrong&gt;농도와 온도가 같은\u003c/strong&gt; 묽은 염산과 수산화 나트륨 수용액, BTB 용액, 디지털 온도계\u003c/li&gt;\n\u003cli&gt;과정: 홈 1\u003cdel&gt;5에 묽은 염산 10, 8, 6, 4, 2 mL → 수산화 나트륨 수용액 2, 4, 6, 8, 10 mL를 차례로 넣고 \u003cstrong&gt;최고 온도\u003c/strong&gt; 측정 → BTB 용액 2\u003c/del&gt;3방울 넣고 색 관찰\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;홈\u003c/th&gt;\n\u003cth&gt;1\u003c/th&gt;\n\u003cth&gt;2\u003c/th&gt;\n\u003cth&gt;3\u003c/th&gt;\n\u003cth&gt;4\u003c/th&gt;\n\u003cth&gt;5\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;묽은 염산 (mL)\u003c/td&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수산화 나트륨 수용액 (mL)\u003c/td&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;생성된 물의 양 (상대값, 부피 작은 쪽)\u003c/td&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;6\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;액성\u003c/td&gt;\n\u003ctd&gt;산성\u003c/td&gt;\n\u003ctd&gt;산성\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;중성\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;염기성\u003c/td&gt;\n\u003ctd&gt;염기성\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;결과·결론 (그림 I 19, 57쪽): 두 수용액의 \u003cstrong&gt;부피가 같을 때(홈 3) 최고 온도가 가장 높다\u003c/strong&gt; → 중화 반응이 \u003cstrong&gt;가장 많이\u003c/strong&gt; 일어남\u003c/li&gt;\n\u003cli&gt;그래프 모양: 중성인 곳에서 꼭짓점인 산 모양, 왼쪽은 산성, 오른쪽은 염기성 (그래프 눈금 숫자는 변환 중 섞여 생략)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;중화 반응 (56쪽, 그림 I 18)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;산의 H⁺과 염기의 OH⁻이 \u003cstrong&gt;1 : 1\u003c/strong&gt;로 반응하여 **물(H₂O)**이 생성되는 반응 = \u003cstrong&gt;중화 반응\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;HCl + NaOH → NaCl + H₂O (교과서 그림에서는 H₂O + Na⁺ + Cl⁻로 표시, 실제로 반응하는 것: H⁺ + OH⁻ → H₂O)\u003c/li&gt;\n\u003cli&gt;Na⁺, Cl⁻은 반응하지 않고 용액에 그대로 남음\u003c/li&gt;\n\u003cli&gt;혼합 용액의 액성은 혼합 전 이온의 양으로 결정\u003cul&gt;\n\u003cli&gt;H⁺ 양 &amp;gt; OH⁻ 양 → \u003cstrong&gt;산성\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;H⁺ 양 = OH⁻ 양 → \u003cstrong&gt;중성\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;H⁺ 양 &amp;lt; OH⁻ 양 → \u003cstrong&gt;염기성\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;중화열 (57쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;중화 반응이 일어나면서 동시에 열이 발생 → 이 열 = \u003cstrong&gt;중화열\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;중화 반응이 많이 일어날수록 커짐 → \u003cstrong&gt;중화열의 크기는 생성된 물 분자의 양에 비례\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;일정량의 묽은 염산에 NaOH 수용액을 조금씩 넣으면: H⁺ 수 점점 감소 → H⁺이 모두 반응하면 \u003cstrong&gt;중성\u003c/strong&gt; → 더 넣으면 OH⁻이 반응하지 않고 남아 \u003cstrong&gt;염기성\u003c/strong&gt; (그림 21 모형)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;생활 속 중화 반응 이용 (58쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;상황\u003c/th&gt;\n\u003cth&gt;원인 물질\u003c/th&gt;\n\u003cth&gt;중화에 쓰는 물질\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;충치\u003c/td&gt;\n\u003ctd&gt;입속 박테리아가 만든 \u003cstrong&gt;젖산\u003c/strong&gt;(산)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;염기성 치약\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수영장 소독\u003c/td&gt;\n\u003ctd&gt;염소로 소독 → 물이 \u003cstrong&gt;산성\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;염기성 물질\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;베이킹파우더\u003c/td&gt;\n\u003ctd&gt;산성 물질 + 염기성 물질이 모두 들어 있음\u003c/td&gt;\n\u003ctd&gt;밀가루 반죽에서 중화 반응\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;속쓰림\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;위액의 염산\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;염기성 제산제\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;생선 비린내\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;염기성 물질\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;산성인 \u003cstrong&gt;레몬즙\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;개미·벌에 쏘임\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;산성 물질\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;염기성인 약\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;산성화된 토양·호수\u003c/td&gt;\n\u003ctd&gt;산성\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;석회 가루\u003c/strong&gt;(물에 녹아 염기성)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;65쪽 5번 문제: 제산제 유효 성분 \u003cstrong&gt;수산화 마그네슘\u003c/strong&gt; → 염기라 위산을 중화\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;해 보기: 이산화 탄소를 저장하는 중화 반응 (59쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;대기로 배출되는 CO₂를 \u003cstrong&gt;직접 포집\u003c/strong&gt; → \u003cstrong&gt;수산화 칼슘(Ca(OH)₂) 수용액\u003c/strong&gt;과 반응 → 고체 \u003cstrong&gt;탄산 칼슘(CaCO₃)\u003c/strong&gt; → 건축 재료로 쓰거나 땅속·해저에 저장\u003c/li&gt;\n\u003cli&gt;CO₂는 물에 녹으면 \u003cstrong&gt;탄산\u003c/strong&gt; → H₂CO₃ + Ca(OH)₂ → CaCO₃ + 2H₂O (교과서에서 학생이 쓰도록 한 식, 원자 수 검산함)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;5차시. 물질 변화에서 에너지 출입 (60~63쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트⑤ 물과 산화 칼슘을 이용한 음식 조리 방법 설계 (60쪽 탐구)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;원리: \u003cstrong&gt;발열 용기\u003c/strong&gt;의 발열 팩 주성분은 \u003cstrong&gt;산화 칼슘\u003c/strong&gt; → 물과 반응하면 \u003cstrong&gt;열이 발생\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;과정 1: 비커 3개에 산화 칼슘 10 g, 20 g, 30 g → 각각 물 100 mL → 가장 높은 온도 측정 (결과값은 교과서에 없음 — 교과서 확인 필요)\u003c/li&gt;\n\u003cli&gt;과정 2 설계 시 생각할 것: 필요한 \u003cstrong&gt;산화 칼슘의 질량\u003c/strong&gt;, 반응하는 부분과 음식 놓는 부분의 \u003cstrong&gt;분리\u003c/strong&gt;, 안전 수칙·장치\u003c/li&gt;\n\u003cli&gt;주의: \u003cstrong&gt;알루미늄박은 산화 칼슘 수용액과 반응하여 손상\u003c/strong&gt;될 수 있으니 사용 금지 / 보호 장갑(열 발생), \u003cstrong&gt;마스크\u003c/strong&gt;(가루 날림)\u003c/li&gt;\n\u003cli&gt;참고 반응식(교과서에 없음, 검산함): CaO + H₂O → Ca(OH)₂\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;에너지 출입 (61쪽, 그림 I 20)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;화학 반응이 일어나거나 물질의 상태가 변화할 때 에너지가 출입\u003c/strong&gt;한다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;에너지 방출\u003c/strong&gt; → 주변 온도 \u003cstrong&gt;올라감\u003c/strong&gt; / \u003cstrong&gt;에너지 흡수\u003c/strong&gt; → 주변 온도 \u003cstrong&gt;내려감\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;에너지 방출 (주변 온도 ↑)\u003c/th&gt;\n\u003cth&gt;에너지 흡수 (주변 온도 ↓)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;연료 연소 → 난방, 요리\u003c/td&gt;\n\u003ctd&gt;땀이 \u003cstrong&gt;증발\u003c/strong&gt;할 때 열 흡수 → 시원함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;발열 용기: 물 + 산화 칼슘\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;드라이아이스 승화\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;손난로: 철 가루가 산소와 반응\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;냉각 팩\u003c/strong&gt;의 화학 반응\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;산과 염기의 \u003cstrong&gt;중화 반응\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;소화기 속 액체\u003c/strong&gt;가 불꽃에 닿아 분해\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;냉장고 뒤 방열판: 냉매 \u003cstrong&gt;액화\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;냉장고 안: 냉매 \u003cstrong&gt;기화\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수증기가 \u003cstrong&gt;액화\u003c/strong&gt;되어 구름\u003c/td&gt;\n\u003ctd&gt;물이 태양 에너지 흡수 → 수증기\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;세포호흡\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;광합성\u003c/strong&gt; (빛에너지 흡수해 양분)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;자연 현상과 생명 (62~63쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;물의 순환\u003c/strong&gt;: 물은 태양 에너지 흡수 → 수증기, 수증기는 에너지 방출하며 액화 → 구름 / 에너지 출입이 없으면 물의 순환은 일어나지 않음\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;세포호흡\u003c/strong&gt;(마이토콘드리아): 에너지 \u003cstrong&gt;방출\u003c/strong&gt; → 체온 유지, 움직임\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;광합성\u003c/strong&gt;(엽록체): 에너지 \u003cstrong&gt;흡수\u003c/strong&gt; → 태양의 빛에너지로 양분 합성\u003c/li&gt;\n\u003cli&gt;스스로 확인: 에어컨(액화·기화의 에너지 출입 이용), 눈 쌓인 도로의 \u003cstrong&gt;염화 칼슘\u003c/strong&gt;(물에 용해되면서 \u003cstrong&gt;열 발생\u003c/strong&gt;)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;중단원 마무리 문제(64~66쪽) 출제 포인트\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;4Al + 3O₂ → 2Al₂O₃ / CuO + H₂ → Cu + H₂O / 2Mg + CO₂ → 2MgO + C 에서 산화·환원 물질 찾기\u003c/li&gt;\n\u003cli&gt;철의 제련에서 환원되는 물질: \u003cstrong&gt;산화 철(III)\u003c/strong&gt; (산소를 잃으므로)\u003c/li&gt;\n\u003cli&gt;마그네슘 조각을 넣었을 때 기체 발생 → 아세트산 수용액(산), 변화 없음 → 수산화 나트륨 수용액(염기)\u003c/li&gt;\n\u003cli&gt;이온 모형으로 혼합 용액의 BTB 색·액성 판단 (NaOH에 HCl을 넣는 역방향 문제도 있음)\u003c/li&gt;\n\u003cli&gt;손난로(방출), 에탄올 솜 증발(흡수) 사례 찾기 / 석빙고와 냉장고 원리 비교(서술형)\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2-1. 계산·해석 유형&quot;,&quot;html&quot;:&quot;\u003ch3&gt;유형 A. 산에 염기를 조금씩 넣을 때 이온 수 변화 (57쪽 그림 21, HCl에 NaOH)\u003c/h3&gt;\n\u003cp&gt;풀이 순서\u003c/p&gt;\n\u003col&gt;\n\u003cli&gt;처음 용액에 있는 이온 적기: H⁺, Cl⁻\u003c/li&gt;\n\u003cli&gt;넣는 용액의 이온: Na⁺, OH⁻ → 넣은 OH⁻은 H⁺과 1 : 1로 만나 H₂O가 됨\u003c/li&gt;\n\u003cli&gt;반응하지 않는 이온(Cl⁻, Na⁺)은 그대로 남음\u003c/li&gt;\n\u003cli&gt;중성이 되는 지점(H⁺ = 0이 되는 순간)을 기준으로 앞·뒤를 나눔\u003c/li&gt;\n\u003c/ol&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;입자\u003c/th&gt;\n\u003cth&gt;중성 전\u003c/th&gt;\n\u003cth&gt;중성 이후\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;H⁺\u003c/td&gt;\n\u003ctd&gt;감소\u003c/td&gt;\n\u003ctd&gt;0\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;OH⁻\u003c/td&gt;\n\u003ctd&gt;0\u003c/td&gt;\n\u003ctd&gt;증가\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;Na⁺\u003c/td&gt;\n\u003ctd&gt;증가\u003c/td&gt;\n\u003ctd&gt;계속 증가\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;Cl⁻\u003c/td&gt;\n\u003ctd&gt;일정\u003c/td&gt;\n\u003ctd&gt;일정\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;전체 이온 수\u003c/td&gt;\n\u003ctd&gt;일정 (H⁺ 1개 없어지고 Na⁺ 1개 들어옴)\u003c/td&gt;\n\u003ctd&gt;증가\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;생성된 물 분자 수\u003c/td&gt;\n\u003ctd&gt;증가\u003c/td&gt;\n\u003ctd&gt;일정\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;액성\u003c/td&gt;\n\u003ctd&gt;산성\u003c/td&gt;\n\u003ctd&gt;염기성\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;역방향(NaOH에 HCl, 66쪽 6번): OH⁻ 감소 → 0 / Na⁺ 일정 / Cl⁻ 계속 증가 / H⁺ 0 → 중성 이후 증가 / 액성 염기성 → 중성 → 산성\u003c/li&gt;\n\u003cli&gt;※ 위 표는 교과서 모형(그림 21)과 본문 설명을 이온 개수로 옮긴 것\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;유형 B. 부피를 바꿔 섞었을 때 최고 온도 (탐구, 그림 I 19)\u003c/h3&gt;\n\u003col&gt;\n\u003cli&gt;농도가 같으면 부피 = 이온 수라고 보고, 산의 H⁺ 수와 염기의 OH⁻ 수를 비교\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;작은 쪽 만큼만 물이 생성\u003c/strong&gt;됨 → 물이 많을수록 중화열이 커짐\u003c/li&gt;\n\u003cli&gt;전체 부피가 같으면 물이 가장 많이 생긴 곳이 \u003cstrong&gt;최고 온도가 가장 높음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;남은 이온으로 액성 판단: H⁺이 남으면 산성, OH⁻이 남으면 염기성\u003c/li&gt;\n\u003c/ol&gt;\n\u003cul&gt;\n\u003cli&gt;예: 홈 2(8 mL : 4 mL)와 홈 4(4 mL : 8 mL)는 생성된 물의 양이 같다 → 액성만 다름(산성/염기성)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;유형 C. 이온 모형 그림으로 액성 판단 (그림 I 18, 65쪽 4번)\u003c/h3&gt;\n\u003col&gt;\n\u003cli&gt;그림에서 H⁺ 개수와 OH⁻ 개수를 센다 (부피가 다르면 섞는 부피에 맞춰 개수를 비례로 바꿈)\u003c/li&gt;\n\u003cli&gt;예시(가상 숫자): 묽은 염산 100 mL에 H⁺ 4개, NaOH 수용액 200 mL에 OH⁻ 4개 → NaOH 100 mL에는 OH⁻ 2개 → 100 mL씩 섞으면 H⁺ 2개 남음 → \u003cstrong&gt;산성\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;(65쪽 4번 그림의 실제 개수는 변환본에서 확인 불가 — 교과서 확인 필요)\u003c/li&gt;\n\u003c/ol&gt;\n\u003ch3&gt;유형 D. 산화환원 반응식에서 산화·환원 물질 찾기\u003c/h3&gt;\n\u003col&gt;\n\u003cli&gt;산소가 들어 있는 반응이면 산소를 \u003cstrong&gt;얻은\u003c/strong&gt; 쪽 = 산화, \u003cstrong&gt;잃은\u003c/strong&gt; 쪽 = 환원\u003c/li&gt;\n\u003cli&gt;이온이 등장하면 전자를 \u003cstrong&gt;잃은\u003c/strong&gt; 쪽(전하 증가, 예: Cu → Cu²⁺) = 산화, \u003cstrong&gt;얻은\u003c/strong&gt; 쪽(Ag⁺ → Ag) = 환원\u003c/li&gt;\n\u003cli&gt;양쪽 원자 수, 전하 합이 같은지 확인\u003c/li&gt;\n\u003c/ol&gt;\n\u003cul&gt;\n\u003cli&gt;Cu + 2Ag⁺ → Cu²⁺ + 2Ag: 이동한 전자 2개, 용액 속 양이온 수는 Ag⁺ 2개 → Cu²⁺ 1개로 \u003cstrong&gt;감소\u003c/strong&gt; (NO₃⁻ 수는 일정)\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 헷갈리는 것 비교표&quot;,&quot;html&quot;:&quot;\u003ch3&gt;① 산화 vs 환원\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;산화\u003c/th&gt;\n\u003cth&gt;환원\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;산소 기준\u003c/td&gt;\n\u003ctd&gt;산소를 얻음\u003c/td&gt;\n\u003ctd&gt;산소를 잃음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;전자 기준\u003c/td&gt;\n\u003ctd&gt;전자를 잃음\u003c/td&gt;\n\u003ctd&gt;전자를 얻음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2CuO + C\u003c/td&gt;\n\u003ctd&gt;C\u003c/td&gt;\n\u003ctd&gt;CuO\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;Cu + 2Ag⁺\u003c/td&gt;\n\u003ctd&gt;Cu → Cu²⁺\u003c/td&gt;\n\u003ctd&gt;Ag⁺ → Ag\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;철의 녹\u003c/td&gt;\n\u003ctd&gt;Fe → Fe³⁺\u003c/td&gt;\n\u003ctd&gt;O₂ → O²⁻\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;② 광합성 vs 세포호흡\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;광합성\u003c/th&gt;\n\u003cth&gt;세포호흡\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;장소\u003c/td&gt;\n\u003ctd&gt;엽록체\u003c/td&gt;\n\u003ctd&gt;마이토콘드리아\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;반응물 → 생성물\u003c/td&gt;\n\u003ctd&gt;CO₂ + H₂O → 포도당 + O₂\u003c/td&gt;\n\u003ctd&gt;포도당 + O₂ → CO₂ + H₂O\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;산화되는 물질\u003c/td&gt;\n\u003ctd&gt;물\u003c/td&gt;\n\u003ctd&gt;포도당\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;환원되는 물질\u003c/td&gt;\n\u003ctd&gt;이산화 탄소\u003c/td&gt;\n\u003ctd&gt;산소\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;에너지\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;흡수\u003c/strong&gt; (빛에너지 → 화학 에너지)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;방출\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;③ 메테인 연소 vs 철의 제련\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;메테인 연소\u003c/th&gt;\n\u003cth&gt;철의 제련\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;반응식\u003c/td&gt;\n\u003ctd&gt;CH₄ + 2O₂ → CO₂ + 2H₂O\u003c/td&gt;\n\u003ctd&gt;Fe₂O₃ + 3CO → 2Fe + 3CO₂\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;산화\u003c/td&gt;\n\u003ctd&gt;메테인\u003c/td&gt;\n\u003ctd&gt;일산화 탄소\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;환원\u003c/td&gt;\n\u003ctd&gt;산소\u003c/td&gt;\n\u003ctd&gt;산화 철(III)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;이용\u003c/td&gt;\n\u003ctd&gt;열에너지 (액화천연가스)\u003c/td&gt;\n\u003ctd&gt;순수한 철 얻기 (용광로)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;④ 산 vs 염기\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;산\u003c/th&gt;\n\u003cth&gt;염기\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;정의\u003c/td&gt;\n\u003ctd&gt;수용액에서 **H⁺**을 내놓음\u003c/td&gt;\n\u003ctd&gt;수용액에서 **OH⁻**을 내놓음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;공통 이온\u003c/td&gt;\n\u003ctd&gt;양이온 H⁺ (음이온은 종류마다 다름)\u003c/td&gt;\n\u003ctd&gt;음이온 OH⁻ (양이온은 종류마다 다름)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;전류\u003c/td&gt;\n\u003ctd&gt;흐름\u003c/td&gt;\n\u003ctd&gt;흐름\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;탄산 칼슘\u003c/td&gt;\n\u003ctd&gt;CO₂ 발생\u003c/td&gt;\n\u003ctd&gt;반응 X\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;마그네슘\u003c/td&gt;\n\u003ctd&gt;H₂ 발생\u003c/td&gt;\n\u003ctd&gt;반응 X\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;단백질\u003c/td&gt;\n\u003ctd&gt;(교과서 확인 필요)\u003c/td&gt;\n\u003ctd&gt;녹임\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;예\u003c/td&gt;\n\u003ctd&gt;염산, 질산, 황산, 탄산, 아세트산\u003c/td&gt;\n\u003ctd&gt;수산화 나트륨, 수산화 칼륨, 수산화 칼슘\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑤ 산과 반응할 때 나오는 기체\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;넣은 물질\u003c/th&gt;\n\u003cth&gt;발생 기체\u003c/th&gt;\n\u003cth&gt;주의\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;탄산 칼슘\u003c/td&gt;\n\u003ctd&gt;이산화 탄소(CO₂)\u003c/td&gt;\n\u003ctd&gt;석회수를 뿌옇게\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;마그네슘\u003c/td&gt;\n\u003ctd&gt;수소(H₂)\u003c/td&gt;\n\u003ctd&gt;구리·은·금·백금은 산과 반응 X\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑥ 에너지 방출 vs 흡수 (상태 변화 포함)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;방출\u003c/th&gt;\n\u003cth&gt;흡수\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;주변 온도\u003c/td&gt;\n\u003ctd&gt;올라감\u003c/td&gt;\n\u003ctd&gt;내려감\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;상태 변화\u003c/td&gt;\n\u003ctd&gt;액화 (수증기 → 구름, 냉매 액화)\u003c/td&gt;\n\u003ctd&gt;기화·증발(땀, 냉매), 승화(드라이아이스)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;화학 반응\u003c/td&gt;\n\u003ctd&gt;연소, 중화, CaO + 물, 손난로, 세포호흡\u003c/td&gt;\n\u003ctd&gt;냉각 팩, 소화기 속 액체 분해, 광합성\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;용해\u003c/td&gt;\n\u003ctd&gt;염화 칼슘 용해 (열 발생)\u003c/td&gt;\n\u003ctd&gt;(교과서 확인 필요)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑦ 헷갈리는 이름\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;이름\u003c/th&gt;\n\u003cth&gt;화학식\u003c/th&gt;\n\u003cth&gt;메모\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;산화 구리(II)\u003c/td&gt;\n\u003ctd&gt;CuO\u003c/td&gt;\n\u003ctd&gt;검은색\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;산화 철(III)\u003c/td&gt;\n\u003ctd&gt;Fe₂O₃\u003c/td&gt;\n\u003ctd&gt;붉은색, 녹\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;산화 칼슘\u003c/td&gt;\n\u003ctd&gt;CaO\u003c/td&gt;\n\u003ctd&gt;발열 팩\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수산화 칼슘\u003c/td&gt;\n\u003ctd&gt;Ca(OH)₂\u003c/td&gt;\n\u003ctd&gt;염기, CO₂ 포집\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;탄산 칼슘\u003c/td&gt;\n\u003ctd&gt;CaCO₃\u003c/td&gt;\n\u003ctd&gt;산과 반응해 CO₂\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;일산화 탄소 / 이산화 탄소\u003c/td&gt;\n\u003ctd&gt;CO / CO₂\u003c/td&gt;\n\u003ctd&gt;제련에서 CO가 산화되어 CO₂\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 외울 것 체크리스트&quot;,&quot;html&quot;:&quot;\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 광합성, 철의 제련, 화석 연료 사용의 공통 원소는 \u003cstrong&gt;산소\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 산화 = 산소 얻음 = 전자 잃음 / 환원 = 산소 잃음 = 전자 얻음\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; \u003cstrong&gt;산화와 환원은 동시에\u003c/strong&gt; 일어난다\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 2CuO + C → 2Cu + CO₂ : 검은색 → 붉은색, 석회수 뿌옇게, C 산화·CuO 환원\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 철의 녹 = 산화 철(III), 붉은색·광택 없음 (페루 무지개 산)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 철의 녹 반응의 환원은 산소 이동으로 설명 불가 → \u003cstrong&gt;전자 이동\u003c/strong&gt;으로 설명\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; Cu + 2Ag⁺ → Cu²⁺ + 2Ag : 용액 푸른색, 구리줄에 은 석출\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 2Mg + O₂ → 2MgO : Mg → Mg²⁺(산화), O → O²⁻(환원)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 광합성: CO₂ 환원, H₂O 산화, 빛에너지 → 화학 에너지, 엽록체\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 세포호흡: 포도당 산화, 산소 환원, 마이토콘드리아\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; CH₄ + 2O₂ → CO₂ + 2H₂O : 메테인 산화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; Fe₂O₃ + 3CO → 2Fe + 3CO₂ : 산화 철(III) 환원, 일산화 탄소 산화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 용광로에 철광석, 코크스, 석회석 / 코크스 → 일산화 탄소\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 촉매 장치: 산화 질소 \u003cstrong&gt;환원\u003c/strong&gt; / 갈변: 폴리페놀 산화 / 반딧불이: 루시페린 산화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 산: 전류 O, 탄산 칼슘 → CO₂, 마그네슘 → H₂\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 염기: 전류 O, 단백질 녹임, 탄산 칼슘·마그네슘과 반응 X\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 구리, 은, 금, 백금은 산과 반응하지 않는다\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 산 = 수용액에서 H⁺을 내놓는 물질 / 염기 = OH⁻을 내놓는 물질\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; H₂SO₄ → 2H⁺ + SO₄²⁻ / Ca(OH)₂ → Ca²⁺ + 2OH⁻\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 산·염기 수용액에 전류가 흐르는 까닭: 이온이 전극으로 움직이기 때문\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 수국: 산성 토양 푸른색, 염기성 토양 붉은색\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 산성비: 황 산화물·질소 산화물 → 황산·질산 / 해양 산성화: H⁺ 농도 증가\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 중화 반응: H⁺ + OH⁻ → H₂O, \u003cstrong&gt;1 : 1\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; H⁺ &amp;gt; OH⁻ 산성, = 중성, &amp;lt; 염기성\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 중화열 ∝ 생성된 물 분자의 양, 농도 같으면 \u003cstrong&gt;부피가 같을 때\u003c/strong&gt; 최고 온도\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 제산제·염기성 치약·석회 가루·레몬즙(비린내)·벌 쏘임에 염기성 약\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; CO₂ 포집: Ca(OH)₂와 반응 → 고체 CaCO₃로 저장\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 에너지 방출 → 주변 온도 ↑ / 흡수 → 주변 온도 ↓\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 방출: 연소, 발열 용기(CaO + 물), 손난로, 중화, 액화, 세포호흡\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 흡수: 증발, 드라이아이스 승화, 냉각 팩, 냉매 기화, 광합성\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;5. 예상 문제 15개&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;1.\u003c/strong&gt; 산화환원 반응에 대한 설명으로 옳지 않은 것은?\n① 물질이 산소를 얻는 반응은 산화이다.\n② 물질이 전자를 잃는 반응은 산화이다.\n③ 산화 반응이 먼저 일어난 뒤 시간이 지나서 환원 반응이 일어난다.\n④ 철이 공기 중에서 녹슬면 붉은색의 산화 철(III)이 된다.\n⑤ 물질이 산소를 잃는 반응은 환원이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2.\u003c/strong&gt; 다음은 산화 구리(II) 가루와 충분한 양의 숯가루를 시험관에 넣고 가열한 실험이다. 발생한 기체는 석회수가 든 시험관으로 통과시켰다. 이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;2CuO + C → 2Cu + CO₂\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 시험관 속 검은색 가루가 붉은색으로 변한다.\nㄴ. 탄소는 산소를 얻어 산화된다.\nㄷ. 발생한 기체는 석회수를 뿌옇게 만든다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄴ ③ ㄱ, ㄷ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3.\u003c/strong&gt; 사포로 문지른 구리줄을 질산 은 수용액에 넣었더니 구리줄 표면에 은회색 금속이 석출되고, 무색이던 수용액이 푸른색으로 변했다. 이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 구리는 전자를 잃고 구리 이온(Cu²⁺)이 된다.\nㄴ. 은 이온(Ag⁺)은 산화된다.\nㄷ. 반응이 진행될수록 수용액 속 양이온의 수는 증가한다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4.\u003c/strong&gt; 반응과 그 반응에서 산화되는 물질, 환원되는 물질을 옳게 짝 지은 것은?\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;\u003c/th&gt;\n\u003cth&gt;반응\u003c/th&gt;\n\u003cth&gt;산화되는 물질\u003c/th&gt;\n\u003cth&gt;환원되는 물질\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;광합성\u003c/td&gt;\n\u003ctd&gt;이산화 탄소\u003c/td&gt;\n\u003ctd&gt;물\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;세포호흡\u003c/td&gt;\n\u003ctd&gt;산소\u003c/td&gt;\n\u003ctd&gt;포도당\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;메테인의 연소\u003c/td&gt;\n\u003ctd&gt;산소\u003c/td&gt;\n\u003ctd&gt;메테인\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;철의 제련 (Fe₂O₃ + 3CO → 2Fe + 3CO₂)\u003c/td&gt;\n\u003ctd&gt;일산화 탄소\u003c/td&gt;\n\u003ctd&gt;산화 철(III)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;구리와 질산 은 수용액\u003c/td&gt;\n\u003ctd&gt;은 이온\u003c/td&gt;\n\u003ctd&gt;구리\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;\u003cstrong&gt;5.\u003c/strong&gt; 다음은 세 가지 반응의 화학 반응식이다. 이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 4Al + 3O₂ → 2Al₂O₃\n(나) CuO + H₂ → Cu + H₂O\n(다) 2Mg + CO₂ → 2MgO + C\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. (가)에서 Al은 산화된다.\nㄴ. (나)에서 CuO는 산소를 얻어 산화된다.\nㄷ. (다)에서 CO₂는 산소를 잃어 환원된다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄱ, ㄷ ③ ㄴ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6.\u003c/strong&gt; 생활 주변의 산화환원 반응에 대한 설명으로 옳지 않은 것은?\n① 손난로 속 철이 산소와 반응하여 산화 철(III)로 산화될 때 열이 발생한다.\n② 자동차 배기관의 촉매 장치에서는 산화 질소가 산화되어 배기가스가 정화된다.\n③ 사과를 깎아 두면 폴리페놀 성분이 산화되어 갈변 현상이 일어난다.\n④ 반딧불이의 광세포에서는 루시페린이 산화되면서 빛에너지를 방출한다.\n⑤ 양초에 불을 붙이면 파라핀이 연소되어 이산화 탄소와 수증기로 변한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7.\u003c/strong&gt; 표는 수용액 A와 B로 실험한 결과이다. A와 B는 묽은 염산과 수산화 칼륨 수용액 중 하나이다. 이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;실험\u003c/th&gt;\n\u003cth&gt;A\u003c/th&gt;\n\u003cth&gt;B\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;간이 전기 전도계를 담갔을 때\u003c/td&gt;\n\u003ctd&gt;전류가 흐름\u003c/td&gt;\n\u003ctd&gt;전류가 흐름\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;탄산 칼슘을 넣었을 때\u003c/td&gt;\n\u003ctd&gt;기체 발생\u003c/td&gt;\n\u003ctd&gt;변화 없음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;마그네슘 조각을 넣었을 때\u003c/td&gt;\n\u003ctd&gt;기체 발생\u003c/td&gt;\n\u003ctd
