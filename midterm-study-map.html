mp;#39;과 도연명과 &amp;#39;라이너 마리아 릴케&amp;#39;\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 화자와 대립하는 부정적인 대상이다.\n② 화자가 떠나온 고향의 풍경만을 나타낸다.\n③ 화려하고 강한 힘을 지닌 존재들이다.\n④ 가난하고 외롭고 높고 쓸쓸한 삶을 사는, 하늘이 귀해하고 사랑하는 존재들이다.\n⑤ 화자가 앞으로 찾아가 만나야 할 사람들이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7.\u003c/strong&gt; 이 시의 어휘 풀이로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\n① 바람벽: 방이나 칸살의 옆을 둘러막은 둘레의 벽\n② 울력하다: 이 시에서는 화자를 꾸짖고 벌을 준다는 뜻\n③ 앞대: 어떤 지방에서 그 남쪽의 지방을 이르는 말\n④ 이즈막: 얼마 전부터 이제까지에 이르는 가까운 때\n⑤ 호젓하다: 매우 홀가분하여 쓸쓸하고 외롭다\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;[8~9] &amp;lt;별 헤는 밤&amp;gt;\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8.\u003c/strong&gt; 교과서에 실린 부분(&amp;quot;별 하나에 추억과 ~ 시인의 이름을 불러 봅니다&amp;quot;)에 대한 설명으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\n① &amp;#39;별 하나에 ~과&amp;#39;라는 같은 구조를 반복해 리듬감을 만든다.\n② 그리운 대상들을 열거하여 추억과 그리움을 드러낸다.\n③ &amp;#39;-ㅂ니다&amp;#39;의 경어체로 어머니에게 말을 건네듯 표현한다.\n④ 산문처럼 길게 이어지는 문장으로 떠오르는 이름들을 나열한다.\n⑤ 화자는 별을 보며 현실의 슬픔을 완전히 잊고 즐거움만을 노래한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9.\u003c/strong&gt; &amp;lt;보기&amp;gt;는 이 시의 뒷부분이다. 이에 대한 감상으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 나는 무엇인지 그리워 / 이 많은 별빛이 내린 언덕 위에 / 내 이름자를 써 보고, / 흙으로 덮어 버리었습니다. // (중략) // 그러나 겨울이 지나고 나의 별에도 봄이 오면 / 무덤 위에 파란 잔디가 피어나듯이 / 내 이름자 묻힌 언덕 위에도 / 자랑처럼 풀이 무성할 것이외다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 이름자를 써 보고 흙으로 덮는 행위에서 자신을 돌아보는 부끄러움이 드러난다.\n② &amp;#39;겨울&amp;#39;은 암담한 현실, &amp;#39;봄&amp;#39;은 그 현실이 극복된 희망의 시간으로 볼 수 있다.\n③ &amp;#39;자랑처럼&amp;#39;은 화자가 과거의 자신을 자랑스러워하며 현재를 체념하는 태도를 나타낸다.\n④ &amp;#39;파란 잔디&amp;#39;, &amp;#39;풀이 무성할 것&amp;#39;은 부활·재생의 이미지로 미래에 대한 믿음을 드러낸다.\n⑤ 화자는 부끄러움에 머물지 않고 미래의 희망을 다짐하는 태도로 나아간다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;[10~11] &amp;lt;접동새&amp;gt;\u003c/strong&gt; (교과서 외 작품)\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10.\u003c/strong&gt; 이 시에 대한 설명으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\n① 화자는 설화 속 누나를 비판적으로 바라보며 교훈을 전달한다.\n② 접동새 설화를 바탕으로 누나의 비극적 사연을 전한다.\n③ 새 울음소리를 흉내 낸 말로 시작하여 슬픈 분위기를 만든다.\n④ 3음보의 민요조 율격을 바탕으로 한다.\n⑤ &amp;#39;-습니다&amp;#39;로 끝나는 말투로 사연을 차분하게 들려준다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11.\u003c/strong&gt; 시어의 의미로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\n① &amp;#39;아우래비&amp;#39;: 새 울음소리이면서 &amp;#39;아홉 오라비&amp;#39;라는 뜻이 겹쳐 있다.\n② &amp;#39;의붓어미 시샘&amp;#39;: 누나를 죽음에 이르게 한 비극의 원인이다.\n③ &amp;#39;불설워&amp;#39;: 몹시 서럽다는 뜻으로 화자의 슬픔이 직접 드러난다.\n④ &amp;#39;야삼경&amp;#39;: 해가 뜨는 새벽을 가리키며, 누나의 한이 풀렸음을 뜻한다.\n⑤ &amp;#39;이 산 저 산 옮아가며 슬피 웁니다&amp;#39;: 죽어서도 동생들을 잊지 못하는 누나의 한을 보여 준다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;[12~13] &amp;lt;낡은 집&amp;gt;\u003c/strong&gt; (교과서 외 작품)\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12.\u003c/strong&gt; 이 시에 대한 설명으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\n① 화자 &amp;#39;나&amp;#39;는 털보네 셋째 아들의 어린 시절 동무이다.\n② 털보네는 마을 사람들의 축복 속에 풍요롭게 살며 고향을 지켰다.\n③ 한 가족의 이야기를 들려주는 서사적 성격이 강하다.\n④ 전해 들은 이야기를 옮기는 말투로 담담하게 사연을 전한다.\n⑤ 현재의 낡은 집에서 시작해 과거 털보네의 삶을 되짚는다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;13.\u003c/strong&gt; &amp;lt;보기&amp;gt;를 참고하여 감상한 것으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; 1930년대 일제의 수탈로 삶의 터전을 잃은 많은 농민이 고향을 떠나 국경 너머 만주나 러시아 등지로 떠돌았다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① &amp;#39;낡은 집&amp;#39;은 몰락한 한 가족, 나아가 당대 농민들의 궁핍한 삶을 상징한다.\n② &amp;#39;송아지래두 불었으면 팔아나 먹지&amp;#39;에는 아이의 탄생조차 축복받지 못하는 가난한 현실이 담겨 있다.\n③ &amp;#39;오랑캐령&amp;#39;, &amp;#39;아라사&amp;#39; 같은 지명은 털보네가 국경 너머로 떠난 유랑민이 되었음을 짐작하게 한다.\n④ &amp;#39;털보네 간 곳은 아무도 모른다&amp;#39;는 고향을 잃고 흩어진 사람들의 비극을 드러낸다.\n⑤ 화자는 털보네를 떠나게 만든 원인이 털보의 게으름에 있다고 날카롭게 고발한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;[14] 작품 비교\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;14.\u003c/strong&gt; &amp;lt;흰 바람벽이 있어&amp;gt;, &amp;lt;별 헤는 밤&amp;gt;, &amp;lt;접동새&amp;gt;, &amp;lt;낡은 집&amp;gt;에 대한 설명으로 적절하지 \u003cstrong&gt;않은\u003c/strong&gt; 것은?\n① &amp;lt;흰 바람벽이 있어&amp;gt;와 &amp;lt;별 헤는 밤&amp;gt;은 각각 &amp;#39;흰 바람벽&amp;#39;과 &amp;#39;별&amp;#39;을 매개로 그리운 대상을 떠올린다.\n② &amp;lt;흰 바람벽이 있어&amp;gt;와 &amp;lt;별 헤는 밤&amp;gt;은 모두 프랑시스 잠, 라이너 마리아 릴케를 언급한다.\n③ 네 작품 모두 음수율과 음보율이 엄격하게 정해진 정형시이다.\n④ &amp;lt;접동새&amp;gt;는 설화를, &amp;lt;낡은 집&amp;gt;은 한 가족의 이야기를 바탕으로 하여 서사적 성격을 지닌다.\n⑤ &amp;lt;흰 바람벽이 있어&amp;gt;와 &amp;lt;별 헤는 밤&amp;gt;은 1941년 일제 강점기 말에 우리말로 창작되었다.\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;번호\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003cth&gt;해설\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;사랑하는 사람은 이미 지아비·어린것과 먼 앞대 개포가 집에서 살고 있고, 화자는 그 모습을 벽에서 떠올릴 뿐 찾아갈 결심은 없음.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;소단원 정리: &amp;#39;흰 바람벽&amp;#39;은 화자의 생각과 감정을 투영하는 영사막과 같은 역할.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;3\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;고전 시가의 정형적 율격(음수율·음보율)은 나타나지 않음. 리듬감은 어휘·문장 구조의 반복에서 생김.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;어머니의 모습은 가난하고 고생하는 어머니에 대한 연민과 그리움. 협력자 비판과 관련 없음. ②~⑤는 교과서 148쪽 활동 내용.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;5\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;첫 번째 글자들 = 운명으로 여기고 받아들임, 두 번째 글자들 = 하늘의 사랑으로 여기며 긍정적으로 수용(소단원 정리). 글자들은 벽을 &amp;#39;지나가는&amp;#39; 것으로 제시됨(④ ×).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;&amp;#39;그러하듯이&amp;#39; — 하늘이 가장 귀해하고 사랑하는 것들처럼 가난하고 외롭고 높고 쓸쓸하게 사는 존재들. 화자는 이들과 자신을 동일시하며 위안을 얻음.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;7\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;교과서 날개: &amp;#39;울력하다&amp;#39;는 원래 여러 사람의 힘을 합하는 것, 여기서는 &amp;#39;나에게 힘을 실어 준다&amp;#39;는 뜻.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;교과서 날개: 별을 보며 추억·어머니를 떠올리고 자신의 삶을 성찰한 시. &amp;#39;쓸쓸함&amp;#39;도 함께 드러남.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;9\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;&amp;#39;자랑처럼 풀이 무성할 것&amp;#39;은 미래에 부끄러움을 이겨 내고 자랑스러운 삶을 이루리라는 희망. 체념이 아님.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;화자는 누나를 잃은 동생으로서 슬픔과 한을 드러낼 뿐, 누나를 비판하거나 교훈을 주지 않음.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;11\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;야삼경은 한밤중(밤 11시~새벽 1시 무렵). 남들 다 자는 깊은 밤에도 우는 누나의 한을 강조함.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;12\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;털보네는 가난 속에 살다가 어느 날 고향을 떠나 사라짐. 셋째 아들의 탄생도 축복받지 못함.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;13\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;화자는 가족의 몰락을 담담하게 전하며 안타까워함. 원인을 개인의 게으름으로 돌리지 않음(시대적 궁핍이 배경).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;14\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;&amp;lt;흰 바람벽이 있어&amp;gt;는 교과서에서 정형적 율격이 없는 자유로운 형식의 현대 시로 정리됨. &amp;lt;별 헤는 밤&amp;gt;, &amp;lt;낡은 집&amp;gt;도 자유시이고, &amp;lt;접동새&amp;gt;는 3음보 민요조이지만 엄격한 정형시는 아님.\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;}]},{&quot;id&quot;:&quot;society-rights&quot;,&quot;subject&quot;:&quot;통합사회&quot;,&quot;title&quot;:&quot;① 인권 보장과 헌법&quot;,&quot;file&quot;:&quot;통합사회_정리_1_인권보장과헌법.md&quot;,&quot;range&quot;:&quot;교과서 8~33쪽&quot;,&quot;flow&quot;:[[&quot;시민 혁명&quot;,&quot;자유권 · 참정권 확대&quot;,&quot;미국 독립 선언(1776) / 프랑스 인권 선언(1789)&quot;],[&quot;1919&quot;,&quot;사회권&quot;,&quot;바이마르 헌법 / 인간다운 생활 보장&quot;],[&quot;1948 · 1966&quot;,&quot;인권의 국제화&quot;,&quot;세계 인권 선언 / 국제 인권 규약&quot;],[&quot;헌법 · 시민 참여&quot;,&quot;인권 보장의 장치&quot;,&quot;기본권 · 권력 분립 · 헌법재판소 / 시민 참여&quot;],[&quot;현대 사회&quot;,&quot;인권의 확장&quot;,&quot;주거 · 안전 · 환경 · 문화 / 연대와 협력&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;기본권, 무엇을 보장하는가&quot;,&quot;head&quot;:[&quot;기본권&quot;,&quot;핵심 구분&quot;],&quot;rows&quot;:[[&quot;자유권&quot;,&quot;국가 권력의 간섭을 받지 않을 자유&quot;],[&quot;평등권&quot;,&quot;불합리한 차별을 받지 않을 권리&quot;],[&quot;참정권&quot;,&quot;국가의 정치 과정에 참여할 권리&quot;],[&quot;사회권&quot;,&quot;인간다운 생활을 보장받을 권리&quot;],[&quot;청구권&quot;,&quot;다른 기본권을 보장받기 위한 수단적 권리&quot;]]},&quot;note&quot;:&quot;통합사회 정리 파일의 교과서 내용을 바탕으로 재구성. 부교재는 원문에서도 미반영으로 표시.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;과목: 천재교육(박윤경) 통합사회2 / 단원: Ⅰ. 인권 보장과 헌법 (1. 인권의 의미 변화와 확장, 2. 인권 보장을 위한 헌법의 역할과 시민 참여, 3. 인권 문제의 양상과 해결 방안)\n교과서 쪽 범위: 8~33쪽 (단원 마무리 33쪽까지)\n※ 부교재는 아직 반영 안 됨.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 한눈에 보기&quot;,&quot;html&quot;:&quot;\u003ch3&gt;① 인권은 어떻게 넓어져 왔나 (연도순)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시기\u003c/th&gt;\n\u003cth&gt;사건·문서\u003c/th&gt;\n\u003cth&gt;핵심 내용\u003c/th&gt;\n\u003cth&gt;확립·확장된 권리\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1215년\u003c/td&gt;\n\u003ctd&gt;영국 \u003cstrong&gt;대헌장\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;국왕이 의회 승인 없이 세금 부과 불가, 법에 따르지 않고는 체포 불가\u003c/td&gt;\n\u003ctd&gt;왕권 제한의 시작\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1688년\u003c/td&gt;\n\u003ctd&gt;영국 \u003cstrong&gt;명예혁명\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;의회가 전제 군주를 폐위, 메리와 윌리엄을 공동 왕으로 추대\u003c/td&gt;\n\u003ctd&gt;—\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1689년\u003c/td&gt;\n\u003ctd&gt;영국 \u003cstrong&gt;권리 장전\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;법을 통한 왕권 제한 명시, 의회 권한 강조 → \u003cstrong&gt;입헌 군주제\u003c/strong&gt;의 기초\u003c/td&gt;\n\u003ctd&gt;시민의 권리 확대\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1776년\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;미국 독립 선언\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;영국의 부당한 식민 지배에 반발해 독립, \u003cstrong&gt;저항권\u003c/strong&gt;과 \u003cstrong&gt;자유권\u003c/strong&gt; 등\u003c/td&gt;\n\u003ctd&gt;자유권\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1789년\u003c/td&gt;\n\u003ctd&gt;프랑스 \u003cstrong&gt;인간과 시민의 권리 선언\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;프랑스 혁명 과정에서 \u003cstrong&gt;천부 인권, 자유권, 국민 주권, 저항권, 재산권\u003c/strong&gt; 등의 침해 불가 명시\u003c/td&gt;\n\u003ctd&gt;자유권·평등권·참정권\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;19세기\u003c/td&gt;\n\u003ctd&gt;영국 \u003cstrong&gt;차티스트 운동\u003c/strong&gt;, 여성 참정권 운동\u003c/td&gt;\n\u003ctd&gt;재산·직업·성별에 따른 선거권 제한에 저항\u003c/td&gt;\n\u003ctd&gt;참정권 확대 → 20세기 이후 대부분의 사람이 참정권 보장\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1919년\u003c/td&gt;\n\u003ctd&gt;독일 \u003cstrong&gt;바이마르 헌법\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;모든 국민의 최소한의 인간다운 생활 보장 → \u003cstrong&gt;사회권을 최초로 명시\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;사회권\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1948년\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;세계 인권 선언\u003c/strong&gt; (UN 총회 채택)\u003c/td&gt;\n\u003ctd&gt;제2차 세계 대전 후, \u003cstrong&gt;인권 보장의 국제적 기준\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;인권의 국제화\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1966년\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;국제 인권 규약\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;세계 인권 선언의 권리를 \u003cstrong&gt;국제법상 조약 형태로 구체화\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;1세대·2세대 인권 규약\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;오늘날\u003c/td&gt;\n\u003ctd&gt;전쟁·기아·차별 속 사회적 약자\u003c/td&gt;\n\u003ctd&gt;국제적 연대·협력 강조\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;연대권\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;현대 사회\u003c/td&gt;\n\u003ctd&gt;도시 집중·재난·환경 문제·문화 소외\u003c/td&gt;\n\u003ctd&gt;주거·안전·환경·문화 영역으로 확장\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;주거권, 안전권, 환경권, 문화권\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;② 단원 전체 흐름\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;중단원\u003c/th&gt;\n\u003cth&gt;핵심 질문\u003c/th&gt;\n\u003cth&gt;핵심 개념\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1. 인권의 의미 변화와 확장 (8~15쪽)\u003c/td&gt;\n\u003ctd&gt;인권이란 무엇이고 어떻게 넓어졌나?\u003c/td&gt;\n\u003ctd&gt;인권, 인간 존엄성, 천부 인권, 1·2·3세대 인권, 시민 혁명, 세계 인권 선언, 주거권·안전권·환경권·문화권\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2. 인권 보장을 위한 헌법의 역할과 시민 참여 (16~23쪽)\u003c/td&gt;\n\u003ctd&gt;헌법은 인권을 어떻게 지키나? 시민은 무엇을 할 수 있나?\u003c/td&gt;\n\u003ctd&gt;헌법, 기본권(자유권·평등권·참정권·사회권·청구권), 헌법 제37조 ②, 국민 주권·법치주의·권력 분립, 헌법재판소, 시민 참여, 시민불복종\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;3. 인권 문제의 양상과 해결 방안 (24~33쪽)\u003c/td&gt;\n\u003ctd&gt;국내·세계에는 어떤 인권 문제가 있고 어떻게 해결하나?\u003c/td&gt;\n\u003ctd&gt;사회적 소수자, 청소년 노동권, 근로 계약서, 세계 인권 문제, 인권지수, 세계시민 의식\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 소단원별 핵심 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;1-1. 인권의 의미와 변화 (8~12쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;단원 도입 (8쪽)\u003c/strong&gt; — 1865년 미국에서 노예제가 폐지되었지만 흑인 차별은 계속됨\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;학교·열차 같은 공공시설을 백인용과 흑인용으로 분리, 식수대도 따로 사용\u003c/li&gt;\n\u003cli&gt;흑인은 \u003cstrong&gt;참정권\u003c/strong&gt;을 행사하는 데 어려움을 겪음\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;인권의 의미\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;인권\u003c/strong&gt;: 모든 인간은 인간이라는 이유만으로 \u003cstrong&gt;인간 존엄성\u003c/strong&gt;을 보장받으며 \u003cstrong&gt;인간다운 삶을 살아갈 권리\u003c/strong&gt;를 지니는데, 이를 인권이라고 한다\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;인간 존엄성\u003c/strong&gt;: 모든 인간은 존재 가치가 있으며 그 인격이 존중받아야 한다는 이념\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;천부 인권\u003c/strong&gt;: 하늘이 인권을 부여했다는 뜻 → 인간이 태어날 때부터 인권을 가진다는 견해, 어떠한 권력도 인간의 기본적 권리를 부당하게 침해할 수 없음\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;인권의 특징 (4가지)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;천부성(천부적인 권리)\u003c/strong&gt;: 태어나면서부터 당연하게 가짐\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;보편성\u003c/strong&gt;: 성별, 인종, 계급, 신분과 관계없이 모든 사람의 권리\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;불가침성\u003c/strong&gt;: 국가나 다른 사람이 부당하게 침해할 수 없고 \u003cstrong&gt;양도할 수도 없음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;항구성\u003c/strong&gt;: 일시적 권리가 아니라 \u003cstrong&gt;영구히 보장\u003c/strong&gt;됨\u003c/li&gt;\n\u003cli&gt;과거에는 신분·인종·성별 등을 이유로 동등한 권리를 보장받지 못한 사람이 많았음 → 스스로 인권을 요구하고 노력한 사람들 덕분에 모든 사회 구성원의 권리로 자리 잡고 의미도 확대됨\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;인권의 의미 변화 — 1, 2, 3세대 인권 (9쪽 자료)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;1세대 인권(시민·정치적 권리)\u003c/strong&gt;: 개인의 자유와 인권 보호를 위해 \u003cstrong&gt;국가의 불간섭\u003c/strong&gt;을 요구\u003cul&gt;\n\u003cli&gt;예: 신체의 자유, 표현의 자유, 집회 및 결사의 자유, 생명과 안전의 권리, 정치에 참여할 권리, 공정한 재판을 받을 권리\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;2세대 인권(경제·사회·문화적 권리)\u003c/strong&gt;: 사회적 약자의 인간다운 삶 보장을 위해 \u003cstrong&gt;국가의 적극적인 개입\u003c/strong&gt;을 요구\u003cul&gt;\n\u003cli&gt;예: 근로의 권리, 교육에 관한 권리, 문화에 관한 권리, 사회 보장을 받을 권리, 인간다운 생활을 할 권리, 쾌적한 환경에서 생활할 권리\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;3세대 인권(연대권)\u003c/strong&gt;: 차별받는 개인·집단의 인권 보호에 주목, \u003cstrong&gt;국경을 초월한 연대와 박애\u003c/strong&gt;를 강조하는 \u003cstrong&gt;전 지구적 차원\u003c/strong&gt;의 권리\u003cul&gt;\n\u003cli&gt;예: 자결권, 발전의 권리, 평화에 관한 권리, 재난 구제를 받을 권리, 지속가능한 환경에 관한 권리\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;자결권\u003c/strong&gt;: 다른 나라의 간섭 없이 자유롭게 통치 형태를 결정하고 경제·사회·문화적 발전을 추구할 수 있는 권리\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;인권의 역사적 확립 과정 (10~11쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;근대 이전: 일부 특권층을 제외한 대다수가 엄격한 \u003cstrong&gt;신분 제도\u003c/strong&gt;로 차별받음 → 저항과 투쟁\u003c/li&gt;\n\u003cli&gt;13세기 영국 \u003cstrong&gt;대헌장\u003c/strong&gt; → 17세기 \u003cstrong&gt;명예혁명\u003c/strong&gt;으로 \u003cstrong&gt;권리 장전\u003c/strong&gt; 승인 → 18세기 후반 미국·프랑스 \u003cstrong&gt;시민 혁명\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;미국 독립 선언, 인간과 시민의 권리 선언에 &amp;quot;모든 인간은 태어날 때부터 자유롭고 평등한 권리를 가진다&amp;quot;는 내용 명시\u003c/li&gt;\n\u003cli&gt;시민 혁명으로 확립한 권리\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;자유권\u003c/strong&gt;: 자의적인 권력으로부터 억압받지 않을 권리\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;평등권\u003c/strong&gt;: 부당한 차별을 받지 않을 권리\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;참정권\u003c/strong&gt;: 정치에 참여할 권리\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;한계: 시민 혁명 후에도 \u003cstrong&gt;재산, 직업, 성별 등에 따라 선거권이 제한\u003c/strong&gt;됨 → 영국 \u003cstrong&gt;차티스트 운동\u003c/strong&gt;, \u003cstrong&gt;여성 참정권 운동\u003c/strong&gt; → \u003cstrong&gt;20세기 이후\u003c/strong&gt; 대부분의 사람이 참정권 보장\u003c/li&gt;\n\u003cli&gt;인간과 시민의 권리 선언 인용\u003cul&gt;\n\u003cli&gt;제1조: 인간은 자유롭고 평등한 권리를 지니고 태어나서 살아간다. 사회적 차별은 오로지 공공의 이익에 근거할 때에만 허용될 수 있다.\u003c/li&gt;\n\u003cli&gt;제2조: 모든 정치적 결사의 목적은 침해할 수 없는 \u003cstrong&gt;자연권\u003c/strong&gt;을 보전하는 데 있다 — 자유권, 소유권, 신체 안전에 관한 권리, 억압에 관한 \u003cstrong&gt;저항권\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;사회권의 등장\u003c/strong&gt;: 산업 혁명 이후 자본주의 발전 → 사회 전체의 부는 증가했으나 노동자의 열악한 노동 조건·낮은 임금, \u003cstrong&gt;빈부 격차 심화\u003c/strong&gt; → 국가가 사회적 약자를 적극적으로 보호해야 한다는 생각\u003cul&gt;\n\u003cli&gt;1919년 독일 \u003cstrong&gt;바이마르 헌법\u003c/strong&gt;: 사회권 \u003cstrong&gt;최초\u003c/strong&gt; 명시 → 여러 나라 복지 정책·헌법에 영향\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;세계 인권 선언(1948)\u003c/strong&gt;: 제2차 세계 대전 후 &amp;quot;인권 억압은 인류 전체의 번영을 위협한다&amp;quot;는 공감대 → UN 총회에서 \u003cstrong&gt;인권 보장의 국제적 기준\u003c/strong&gt;으로 채택\u003cul&gt;\n\u003cli&gt;제1조: 모든 인간은 태어날 때부터 자유로우며 그 존엄과 권리에 있어 동등하다 … 형제애의 정신으로 행동하여야 한다.\u003c/li&gt;\n\u003cli&gt;제22조: 모든 사람은 사회의 일원으로서 \u003cstrong&gt;사회 보장을 받을 권리\u003c/strong&gt;를 가진다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;국제 인권 규약(1966)\u003c/strong&gt;: &amp;#39;시민적 및 정치적 권리에 관한 국제 규약&amp;#39;(1세대), &amp;#39;경제적, 사회적 및 문화적 권리에 관한 국제 규약&amp;#39;(2세대) 등\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;인권 보호를 위한 국제 조약\u003c/strong&gt;: 인종 차별 철폐 협약(1965), 여성 차별 철폐 협약(1979), 아동 권리 협약(1989), 장애인 권리 협약(2006)\u003c/li&gt;\n\u003cli&gt;오늘날: 전쟁, 기아, 사회적 차별로 인권을 침해당하는 사회적 약자 → 국제적으로 연대·협력할 권리인 \u003cstrong&gt;연대권\u003c/strong&gt; 강조\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 인권 확대의 역사적 사건 조사 (12쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 차티스트 운동 / 여성 참정권 운동 / 흑인 민권 운동 중 하나를 골라 배경·주체·보장받은 권리를 표로 정리\u003c/li&gt;\n\u003cli&gt;결과\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;사건\u003c/th&gt;\n\u003cth&gt;배경\u003c/th&gt;\n\u003cth&gt;주체\u003c/th&gt;\n\u003cth&gt;보장받게 된 권리\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;차티스트 운동\u003c/td&gt;\n\u003ctd&gt;19세기 영국, 일정 재산 이상의 성인 남성만 투표권\u003c/td&gt;\n\u003ctd&gt;영국 노동자 (\u003cstrong&gt;인민헌장\u003c/strong&gt;)\u003c/td&gt;\n\u003ctd&gt;선거권 확대, 비밀 투표 요구\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;여성 참정권 운동\u003c/td&gt;\n\u003ctd&gt;시민 혁명 후에도 여성은 참정권 없음, 국가 의사 결정에서 배제\u003c/td&gt;\n\u003ctd&gt;여성 (청원, 시위 등)\u003c/td&gt;\n\u003ctd&gt;여성의 참정권\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;흑인 민권 운동\u003c/td&gt;\n\u003ctd&gt;1865년 노예 제도 폐지 후에도 투표권 제한 등 차별\u003c/td&gt;\n\u003ctd&gt;흑인\u003c/td&gt;\n\u003ctd&gt;백인과 동등한 시민권\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;결론: 인권은 차별에 맞선 사람들의 \u003cstrong&gt;요구와 노력\u003c/strong&gt;을 통해 확대되었다\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;1-2. 현대 사회와 인권의 확장 (13~15쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;배경\u003c/strong&gt;: 사회 급변 → 기존 인권 개념으로 충분히 보장되지 않는 새 문제 등장\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;인구의 도시 집중에 따른 \u003cstrong&gt;주택 부족\u003c/strong&gt;, 각종 \u003cstrong&gt;재난·범죄·안전사고\u003c/strong&gt;, \u003cstrong&gt;환경 문제\u003c/strong&gt;, \u003cstrong&gt;문화 소외 계층\u003c/strong&gt; 발생\u003c/li&gt;\n\u003cli&gt;→ 주거, 안전, 환경, 문화 등 여러 영역으로 인권 확장\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;주거권\u003c/strong&gt; — 쾌적하고 안정적인 환경에서 인간다운 주거 생활을 할 권리\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;헌법 제35조 ③: 국가는 주택 개발 정책 등을 통하여 모든 국민이 쾌적한 주거 생활을 할 수 있도록 노력하여야 한다.\u003c/li&gt;\n\u003cli&gt;국가 정책: 주거비 일정 수준 조정, 주거 환경 개선, 사회적 취약 계층에 \u003cstrong&gt;임대 주택 우선 공급\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;자료: \u003cstrong&gt;청년 안심 주택\u003c/strong&gt; — 청년·신혼부부에게 주변 시세보다 낮은 임대료, 임대료 상승 연 5% 이내, 역세권 500 m 이내 건설\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;안전권\u003c/strong&gt; — 생명과 안녕을 위협하는 각종 위험으로부터 안전할 권리\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;헌법 제34조 ⑥: 국가는 재해를 예방하고 그 위험으로부터 국민을 보호하기 위하여 노력하여야 한다. → \u003cstrong&gt;국가의 재해 예방 의무\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;국가: 전염병·재해 예방·관리 / 기업: 산업 현장 안전 관리 강화\u003c/li&gt;\n\u003cli&gt;자료: 서울 지하철 전체 역 \u003cstrong&gt;안전문(스크린 도어)\u003c/strong&gt; 설치 → 역내 자살 사고 사망자 연평균 33.7명(2001\u003cdel&gt;2009) → 0.1명(2010\u003c/del&gt;2022), 무단출입·승객 끼임 사고 감소, 역사 내 공기 질 개선\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;환경권\u003c/strong&gt; — 건강하고 쾌적한 환경에서 살 권리\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;헌법 제35조 ①: 모든 국민은 건강하고 쾌적한 환경에서 생활할 권리를 가지며, 국가와 국민은 환경 보전을 위하여 노력하여야 한다.\u003c/li&gt;\n\u003cli&gt;헌법에서 환경권을 \u003cstrong&gt;권리로 보장\u003c/strong&gt;하는 동시에 \u003cstrong&gt;국민의 의무로도 규정\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;국가: 환경 보호 법률 제정·정책 시행, 국제 사회와 환경 보호 목표 설정·이행\u003c/li&gt;\n\u003cli&gt;자료: ◯◯시 노후 경유차 폐차·저감 장치 지원·운행 제한 → 노후 경유차 76.4% 감소, 미세 먼지 줄여 대기질 개선\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;문화권\u003c/strong&gt; — 계층, 민족, 문화적 배경에 상관없이 누구나 문화생활에 참여하고 문화를 향유할 수 있는 권리\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;헌법: 문화 영역의 자유 보장, 문화 발전에 대한 국가 의무 명시 / \u003cstrong&gt;문화 기본법\u003c/strong&gt;으로 문화권 보장 규정\u003c/li&gt;\n\u003cli&gt;문화 기본법 제4조: 모든 국민은 성별, 종교, 인종, 세대, 지역, 정치적 견해, 사회적 신분, 경제적 지위나 신체적 조건 등에 관계없이 문화 표현과 활동에서 차별을 받지 아니하고 자유롭게 문화를 창조하고 … 향유할 권리를 가진다.\u003c/li&gt;\n\u003cli&gt;국가: 지리적 고립, 경제적·신체적 이유로 문화권을 누리지 못하는 사람 지원\u003c/li&gt;\n\u003cli&gt;자료: \u003cstrong&gt;배리어 프리(Barrier-free)\u003c/strong&gt; = 장벽이 없다는 뜻, 장애인의 문화 접근 권리·창조 권리 보장 → 청각 장애인 수어 통역·자막, 시각 장애인 화면 해설, 장애인·비장애인 배우 함께 출연\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 우리 동네 인권 지도 그리기 (15쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 집·학교·여가 시설 등 생활공간에서 네 가지 권리가 어떻게 보장되는지 조사해 지도에 표시\u003c/li&gt;\n\u003cli&gt;결과(교과서 예시)\u003cul&gt;\n\u003cli&gt;주거권: 최소한의 주거 수준 보장 위해 가구당 면적, 방 개수, 화장실 등의 기준을 정함\u003c/li&gt;\n\u003cli&gt;환경권: 도심 속 공원이 오염된 공기를 정화\u003c/li&gt;\n\u003cli&gt;안전권: 신호등과 횡단보도 설치\u003c/li&gt;\n\u003cli&gt;문화권: &amp;#39;문화가 있는 날&amp;#39;(매달 마지막 수요일) 미술관 무료 관람·할인\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;결론: 새로운 인권은 우리 일상 공간 곳곳에서 보장되고 있다\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2-1. 인권 보장을 위한 헌법의 역할 (16~20쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;단원 도입 (16쪽) — 전동 킥보드 사례\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;속도 제한(25 km/h 미만)·면허 취득 규제 → 일부는 &amp;quot;행복 추구권과 자유권 침해&amp;quot; 주장\u003c/li&gt;\n\u003cli&gt;판단: 고속 주행 시 중상해 사고 위험 → 생명·신체 위해 방지, 도로 교통 안전 확보의 정당성 인정 → \u003cstrong&gt;청구 기각\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;인권과 헌법의 관계\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;인간은 어떤 목적을 위한 \u003cstrong&gt;수단으로 취급되어서는 안 되며\u003c/strong&gt;, 인간이라는 이유만으로 존중받아야 함 → 이를 위해 반드시 보장할 것이 인권\u003c/li&gt;\n\u003cli&gt;국가는 인권 보장을 위한 법과 제도를 마련할 의무 → 그 \u003cstrong&gt;토대가 헌법\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;헌법 = 국민의 인권 보호를 위한 \u003cstrong&gt;최후의 보호막\u003c/strong&gt;, 국가의 \u003cstrong&gt;최고법\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;인권을 \u003cstrong&gt;기본권\u003c/strong&gt;의 형태로 규정 + 국가 조직의 운영 원리 명시\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;기본권\u003c/strong&gt;: 헌법으로 보장되는 국민의 기본적 권리\u003c/li&gt;\n\u003cli&gt;헌법 제10조: 모든 국민은 인간으로서의 \u003cstrong&gt;존엄과 가치\u003c/strong&gt;를 가지며, \u003cstrong&gt;행복을 추구할 권리\u003c/strong&gt;를 가진다. 국가는 개인이 가지는 불가침의 기본적 인권을 확인하고 이를 보장할 의무를 진다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 판례로 알아보는 기본권 (존엄사)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;김 할머니(뇌 손상, 1년 넘게 의식 불명) 자녀들이 인공호흡기 제거 소송\u003c/li&gt;\n\u003cli&gt;대법원: \u003cstrong&gt;헌법 제10조\u003c/strong&gt;를 토대로, 회복 불가능한 사망 단계가 명백하면 연명 치료 중단(\u003cstrong&gt;존엄사\u003c/strong&gt;) 인정\u003c/li&gt;\n\u003cli&gt;의미: \u003cstrong&gt;자기 결정권\u003c/strong&gt;(개인이 자기 운명을 결정할 수 있는 권리) 보장, 품위 있게 죽을 권리 인정 → 이후 &amp;lt;호스피스·완화 의료 및 임종 과정에 있는 환자의 연명 의료 결정에 관한 법률&amp;gt; \u003cstrong&gt;제정\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;헌법에서 보장하는 기본권\u003c/strong&gt; — 자유권, 평등권, 참정권, 사회권, 청구권 등 (아래 3번 비교표 참고)\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;헌법 제37조 ①: 국민의 자유와 권리는 헌법에 \u003cstrong&gt;열거되지 아니한 이유로 경시되지 아니한다\u003c/strong&gt;.\u003cul&gt;\n\u003cli&gt;→ 소비자의 권리, \u003cstrong&gt;일조권, 휴식권, 수면권\u003c/strong&gt; 등도 보장받을 수 있음\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 우리 헌법에 규정된 기본권의 실현 (18쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 사례를 보고 관련 기본권과 헌법 조항 찾기\u003c/li&gt;\n\u003cli&gt;결과: 18세 이상 선거 투표 → 참정권 / 원하는 직업 스스로 선택 → 자유권 / 기초 생활 수급자 생활비 지원 → 사회권 / 파손 도로 정비 청원 → 청구권 / 결혼·출산과 관계없이 같은 승진 기회 → 평등권 (관련 헌법 조항 번호는 교과서 확인 필요)\u003c/li&gt;\n\u003cli&gt;결론: 기본권은 일상생활 곳곳에서 실현되고 있다\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;인권 보장을 위해 헌법에 규정된 제도적 장치 (19쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;국민 주권의 원리\u003c/strong&gt;: 국가 의사를 결정하는 최고 권력인 \u003cstrong&gt;주권이 국민에게\u003c/strong&gt; 있음 → 정치권력 행사는 국민 동의 바탕 / 국회 의원·대통령 선거 제도, \u003cstrong&gt;국민 투표를 통한 헌법 개정\u003c/strong&gt; 등으로 구현\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;법치주의\u003c/strong&gt;: 국민 대표로 구성된 \u003cstrong&gt;국회가 법률을 제정\u003c/strong&gt;하고 이에 근거해 국가 운영 / 국민의 권리·의무는 법률로 정하고, 법률의 목적·내용도 인권 보장에 적법해야 함\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;권력 분립\u003c/strong&gt;: 입법권은 \u003cstrong&gt;국회\u003c/strong&gt;, 행정권은 \u003cstrong&gt;정부\u003c/strong&gt;, 사법권은 \u003cstrong&gt;법원\u003c/strong&gt; → 상호 독립, \u003cstrong&gt;견제와 균형\u003c/strong&gt; → 국가 권력 남용 방지\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;기본권 구제 제도\u003c/strong&gt;: 법률이나 공권력 행사가 기본권을 침해하면 \u003cstrong&gt;헌법재판소\u003c/strong&gt;의 \u003cstrong&gt;위헌 법률 심판\u003c/strong&gt;, \u003cstrong&gt;헌법 소원 심판\u003c/strong&gt; 등으로 구제 / 국가는 \u003cstrong&gt;인권 보호 기관\u003c/strong&gt;을 설치해 일상의 인권 침해 구제\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;위헌 법률 심판\u003c/strong&gt;: 법원 재판 중 적용 법률의 위헌 여부가 문제될 때 \u003cstrong&gt;법원의 제청\u003c/strong&gt;에 따라 판단\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;헌법 소원 심판\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;위헌 심사형: 재판 당사자가 법원에 위헌 법률 심판 제청을 신청했으나 \u003cstrong&gt;받아들여지지 않았을 때\u003c/strong&gt; 헌법재판소에 \u003cstrong&gt;직접 청구\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;권리 구제형: 국가 권력의 \u003cstrong&gt;행사 또는 불행사\u003c/strong&gt; 때문에 기본권을 침해받은 \u003cstrong&gt;국민이 청구\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;기본권 제한과 한계 — 헌법 제37조 ②\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;조문: 국민의 모든 자유와 권리는 \u003cstrong&gt;국가 안전 보장ㆍ질서 유지 또는 공공복리\u003c/strong&gt;를 위하여 \u003cstrong&gt;필요한 경우에 한하여 법률로써\u003c/strong&gt; 제한할 수 있으며, 제한하는 경우에도 자유와 권리의 \u003cstrong&gt;본질적인 내용을 침해할 수 없다\u003c/strong&gt;.\u003c/li&gt;\n\u003cli&gt;교과서: 기본권 제한의 \u003cstrong&gt;목적, 방법, 형식, 내용상 한계\u003c/strong&gt;를 명시해 기본권을 최대한 보장\u003cul&gt;\n\u003cli&gt;목적 → 국가 안전 보장·질서 유지·공공복리\u003c/li&gt;\n\u003cli&gt;방법 → 필요한 경우에 한하여\u003c/li&gt;\n\u003cli&gt;형식 → 법률로써\u003c/li&gt;\n\u003cli&gt;내용상 한계 → 본질적인 내용 침해 금지\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 헌법 소원 심판을 통한 기본권 보장 (육군 훈련소 종교 행사)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;A 씨: 주말 종교 행사 불참 의사 → 계속된 권유로 참석 → 종교 행사 중 하나를 골라 참석하게 한 조치가 \u003cstrong&gt;종교의 자유\u003c/strong&gt; 침해라며 \u003cstrong&gt;헌법 소원 심판\u003c/strong&gt; 청구\u003c/li&gt;\n\u003cli&gt;헌법재판소: 참석 강제는 \u003cstrong&gt;신앙을 가지지 않을 자유\u003c/strong&gt;와 \u003cstrong&gt;종교적 집회에 참석하지 않을 자유\u003c/strong&gt;를 제한 → \u003cstrong&gt;위헌\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 인권 보장을 위한 제도는 어떻게 발달했을까? (20쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 제7차 개정 헌법(1972)과 제9차 개정 헌법(1987) 비교, 인권 보장 제도의 발달사 조사\u003c/li&gt;\n\u003cli&gt;결과 1: 헌법 비교\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;제7차 개정 헌법(1972년)\u003c/th&gt;\n\u003cth&gt;제9차 개정 헌법(1987년)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;체포·구금\u003c/td&gt;\n\u003ctd&gt;제10조 ④ 체포·구금 시 즉시 변호인 조력을 받을 권리 (형사 피고인이 스스로 못 구하면 국가가 변호인을 붙임)\u003c/td&gt;\n\u003ctd&gt;제12조 ⑤ 체포·구속의 \u003cstrong&gt;이유와 변호인 조력을 받을 권리를 고지받지 않고는\u003c/strong&gt; 체포·구속 안 됨, 가족 등에게 이유·일시·장소 \u003cstrong&gt;지체 없이 통지\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;기본권 제한\u003c/td&gt;\n\u003ctd&gt;제32조 ② 제한하는 법률 제정은 국가 안전 보장·질서 유지·공공복리를 위해 필요한 경우에 한함\u003c/td&gt;\n\u003ctd&gt;제37조 ② 위 목적 + 법률로써 제한 + \u003cstrong&gt;본질적인 내용 침해 금지\u003c/strong&gt; 추가\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;결과 2: 우리나라의 인권 보장 제도 발달사\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;연도\u003c/th&gt;\n\u003cth&gt;제도·기관\u003c/th&gt;\n\u003cth&gt;교과서 사례\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1948년\u003c/td&gt;\n\u003ctd&gt;헌법 제정(제헌 헌법)\u003c/td&gt;\n\u003ctd&gt;균등하게 교육받을 권리, \u003cstrong&gt;초등 교육 무상\u003c/strong&gt; 명시\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1988년\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;헌법재판소\u003c/strong&gt; 설립\u003c/td&gt;\n\u003ctd&gt;성과 본관이 같은 사람끼리 결혼 못 하게 한 민법 규정 → 행복 추구권·평등권 침해로 개정하도록 함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2001년\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;국가 인권 위원회\u003c/strong&gt; 설립\u003c/td&gt;\n\u003ctd&gt;크레파스 &amp;#39;살색&amp;#39; → 인종 차별, 국가 기술 표준원에 권고 → &amp;#39;\u003cstrong&gt;살구색\u003c/strong&gt;&amp;#39;으로 변경\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2008년\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;국민 권익 위원회\u003c/strong&gt; 설립\u003c/td&gt;\n\u003ctd&gt;교통 약자를 위해 경계 턱 낮추기, 시각 장애인 위험 장소에 \u003cstrong&gt;점자 블록\u003c/strong&gt; 설치를 국토 교통부에 권고\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;결론: 헌법 개정과 인권 보호 기관 설립으로 인권 보장 제도가 점점 발달해 왔다 (1972·1987 개정의 역사적 배경은 교과서 확인 필요)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2-2. 시민의 권익을 보호하기 위한 시민 참여 (21~23쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;시민 참여의 필요성\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;헌법에 제도적 장치가 있어도 인권 침해가 모두 사라진 것은 아님 → 시민이 정치 과정·공적 문제 해결에 \u003cstrong&gt;적극적으로 참여\u003c/strong&gt;해야 함\u003c/li&gt;\n\u003cli&gt;우리나라는 \u003cstrong&gt;대의 민주주의\u003c/strong&gt; 채택 → 대표가 국민 의사를 제대로 반영하지 못하면 시민 참여로 \u003cstrong&gt;대의 민주주의의 한계 보완\u003c/strong&gt;, 주권자로서 권리 행사\u003c/li&gt;\n\u003cli&gt;시민 참여의 역할: 국가 권력 \u003cstrong&gt;견제·감시\u003c/strong&gt; → 권력 남용 방지 / 시민 권익에 맞는 법·정책 형성 / 공동체 문제 해결 \u003cstrong&gt;역량\u003c/strong&gt; 기름\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 선거 연령 하향을 이끌어 낸 청소년의 시민 참여\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;2005년: 19세부터 선거 참여\u003c/li&gt;\n\u003cli&gt;청소년들이 SNS 의견 공유, \u003cstrong&gt;시민단체\u003c/strong&gt; 결성, \u003cstrong&gt;집회와 서명 운동\u003c/strong&gt; 전개\u003c/li&gt;\n\u003cli&gt;2019년: 선거 가능 연령 \u003cstrong&gt;18세\u003c/strong&gt; / 2021년: 국회 의원·지방 자치 단체장 \u003cstrong&gt;피선거권\u003c/strong&gt; 연령 25세 → \u003cstrong&gt;18세\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;시민 참여의 방안 (22쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;선거\u003c/strong&gt;: 가장 기본적이고 중요한(대표적인) 시민 참여 방법\u003c/li&gt;\n\u003cli&gt;언론·인터넷에 의견 표현, \u003cstrong&gt;청원 및 민원 제기\u003c/strong&gt;, \u003cstrong&gt;탄원서 제출\u003c/strong&gt;, \u003cstrong&gt;1인 시위\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;청원\u003c/strong&gt;: 국민이 법률이 정한 절차에 따라 손해의 구제, 법률·명령·규칙의 제정 및 개폐 등을 국회·관공서·지방 의회 등에 청구하는 것\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;이익 집단\u003c/strong&gt; 활동, \u003cstrong&gt;시민단체\u003c/strong&gt; 활동, 서명 운동, 집회나 시위 참여, \u003cstrong&gt;정당 가입\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;시민 참여는 \u003cstrong&gt;합법적인 방법\u003c/strong&gt;이 바람직\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;시민불복종\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;뜻: \u003cstrong&gt;공익을 수호하려는 목적\u003c/strong&gt;에서 부당한 법이나 정책에 대항하여 \u003cstrong&gt;양심적으로 행하는 의도적인 위법 행위\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;국가 정책·법이 시민의 권익을 심각하게 침해하고 정의에 부합하지 못할 때 \u003cstrong&gt;마지막 방법\u003c/strong&gt;으로 행사\u003c/li&gt;\n\u003cli&gt;정당한 이유 없는 시민불복종은 사회적 혼란 → 신중해야 함\u003c/li&gt;\n\u003cli&gt;롤스, 《정의론》: 시민불복종은 법에 대한 충실성의 한계 내에서 부정의에 항거 → 정의로부터의 이탈을 방지하고 교정하는 데 도움\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;정당화 조건\u003c/strong&gt;\u003col&gt;\n\u003cli&gt;\u003cstrong&gt;목적의 정당성\u003c/strong&gt;: 공공의 이익과 정의 실현\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;비폭력성\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;최후의 수단\u003c/strong&gt;: 다른 모든 합법적 방법으로도 해결하지 못할 때\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;처벌 감수\u003c/strong&gt;: 위법 행위에 대한 처벌을 감수 → 법체계를 존중함을 밝힘\u003c/li&gt;\n\u003c/ol&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 간디의 소금법 폐지 운동 (1930)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;영국이 인도인의 소금 제조·판매 금지, 영국 소금 구매 강제 → 비싼 세금이 농민에게 큰 부담\u003c/li&gt;\n\u003cli&gt;폐지 요구가 받아들여지지 않음 → \u003cstrong&gt;평화적 행진\u003c/strong&gt;(70여 명 → 수천 명) → 바다에서 직접 소금 제조\u003c/li&gt;\n\u003cli&gt;간디 \u003cstrong&gt;체포\u003c/strong&gt;, 경찰 곤봉에 맞아도 시위 멈추지 않음 → 소금법 \u003cstrong&gt;1931년 폐지\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;정당화 조건과 연결: 공익(농민 부담) / 비폭력(평화 행진) / 최후의 수단(요구 거부 후) / 처벌 감수(체포)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 시민의 권익을 보호하기 위해 우리가 할 수 있는 일 (23쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 권익 침해 사례 선택 → 문제점, 제안 정책·법률, 시민 참여 방안(활동 형태·일시·장소·내용) 수립·실천\u003c/li&gt;\n\u003cli&gt;사례: ① 법원 사회 복무 요원 반바지 출근 → 경위서 요구(부당한 차별 주장) ② 지방 의료원 35곳 중 23곳 의료진 부족 → 수도권·비수도권 의료 편차 ③ 공공 기관 AI 면접 → 차별 학습 가능성·불투명성, 정보 공개 거부, 이의 제기 절차 없음(국가 인권 위원회 지침 위반)\u003c/li&gt;\n\u003cli&gt;결론: 시민은 정책 제안·청원 등 다양한 참여로 권익 침해를 해결할 수 있다 (청소년 참여 포털 활용 가능)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;3-1. 국내 인권 문제의 양상과 해결 방안 (24~26쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;도입 (24쪽)\u003c/strong&gt; — 오른손잡이용 시설, 채식 메뉴 부재, 60세 미만만 입사 지원, 손이 닿지 않는 시설 → 다수가 문제없다고 여겨도 누군가에게는 \u003cstrong&gt;차별\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;사회적 소수자 차별\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;사회적 소수자\u003c/strong&gt;: 신체적·문화적 특징 때문에 다른 집단과 구별되고 차별받으며 \u003cstrong&gt;자신이 차별받는 집단에 속한다는 의식\u003c/strong&gt;을 가진 사람\u003c/li&gt;\n\u003cli&gt;성별, 연령, 인종, 국적, 장애 등을 이유로 인권 침해\u003cul&gt;\n\u003cli&gt;성별에 따른 특정 사회적 역할 요구, 나이를 이유로 부당한 대우\u003c/li&gt;\n\u003cli&gt;외국인: 문화적 차이로 불편, 차별적 노동 조건 → \u003cstrong&gt;노동권\u003c/strong&gt; 침해\u003c/li&gt;\n\u003cli&gt;장애인: \u003cstrong&gt;이동권\u003c/strong&gt; 제약, 교육·취업 차별\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;문제점: 인간 존엄성 훼손, 갈등 유발 → \u003cstrong&gt;사회 통합 저해\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;해결 방안\u003cul&gt;\n\u003cli&gt;개인적 차원: 소수자의 입장 이해, \u003cstrong&gt;다양성 존중\u003c/strong&gt;의 태도\u003c/li&gt;\n\u003cli&gt;사회적 차원: 지속적인 \u003cstrong&gt;인권 교육\u003c/strong&gt;·의식 개선 활동, \u003cstrong&gt;차별 금지 법률 제정\u003c/strong&gt;, 지원 제도·정책 시행 → 법적·제도적 장치 확대\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;사회적 소수자 관련 법률\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;양성평등 기본법\u003c/strong&gt;: 국가·지방 자치 단체의 책무 등 규정, 정치·경제·사회·문화 모든 영역에서 양성평등 실현\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;다문화 가족 지원법\u003c/strong&gt;: 다문화 가족 구성원의 삶의 질 향상과 사회 통합\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;장애인 차별 금지 및 권리 구제 등에 관한 법률\u003c/strong&gt;: 장애인의 완전한 사회 참여와 평등권 실현\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;사회적 소수자와 사회적 약자의 차이는 Ⅱ단원 52쪽에서 배움 (이 단원에서는 교과서 확인 필요)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 외국인 근로자의 인권 침해와 권리 구제\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;깻잎 농장 A 씨: 하루 4만 장, 모자라면 임금 공제 동의서 강요, 계약상 휴식 3시간 → 실제 1시간 / 외국인 근로자 30.8%가 임금 체불·장시간 노동 호소\u003c/li&gt;\n\u003cli&gt;권리 구제 방법: 사업장 내 \u003cstrong&gt;고충 처리 기관\u003c/strong&gt; 상담, \u003cstrong&gt;고용 노동부\u003c/strong&gt; 진정, \u003cstrong&gt;노동 위원회\u003c/strong&gt; 구제 신청, \u003cstrong&gt;국가 인권 위원회\u003c/strong&gt; 진정, 사법 기관 재판, \u003cstrong&gt;대한 법률 구조 공단\u003c/strong&gt; 지원\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;청소년 노동권 침해\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;청소년 노동의 의미: 삶의 의미·보람, 소득의 가치 이해\u003c/li&gt;\n\u003cli&gt;청소년 노동권 = 성인과 \u003cstrong&gt;동일하게\u003c/strong&gt; 보장 + 위험·유해한 일 금지, 노동 시간 제한 등 \u003cstrong&gt;성인보다 강한 보호\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;&amp;lt;근로 기준법&amp;gt;에 따라 \u003cstrong&gt;근로 계약서\u003c/strong&gt;를 쓰고 일해야 함\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;근로 계약서\u003c/strong&gt;: 근로자가 사용자에게 근로를 제공하고 사용자는 임금을 지급하는 것을 목적으로 체결하는 계약서 → 임금, 근로 시간, 근로 조건 등 명시\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;문제: 근로 계약서 미작성, 최저 임금보다 적은 임금 등\u003c/li&gt;\n\u003cli&gt;해결: 사용자 — 권리 인식·규정 준수 / 국가 — 제도적 지원 / 청소년 — 자기 노동권 정확히 알기, 침해 시 \u003cstrong&gt;고용 노동부, 중앙 노동 위원회, 대한 법률 구조 공단\u003c/strong&gt; 등에 문의\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;중앙 노동 위원회\u003c/strong&gt;: 노사 간 이익 및 권리 분쟁을 판정하고 조정하는 행정 기관\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 청소년의 노동권을 보호하는 근로 계약서 작성하기 (26쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: &amp;lt;근로 기준법&amp;gt; 조항(자료 1)으로 17세 유정이의 계약서(자료 2) 고치기\u003c/li&gt;\n\u003cli&gt;근로 기준법 핵심\u003cul&gt;\n\u003cli&gt;제43조: 임금은 \u003cstrong&gt;통화로 직접\u003c/strong&gt; 근로자에게 \u003cstrong&gt;그 전액\u003c/strong&gt;을 지급\u003c/li&gt;\n\u003cli&gt;제54조: 근로 시간 4시간 → 30분 이상, 8시간 → 1시간 이상 휴게 (근로 시간 도중)\u003c/li&gt;\n\u003cli&gt;제66조: 18세 미만 → 연령 증명 서류와 \u003cstrong&gt;친권자 또는 후견인의 동의서\u003c/strong&gt;를 사업장에 갖춤\u003c/li&gt;\n\u003cli&gt;제69조: 15세 이상 18세 미만 → \u003cstrong&gt;1일 7시간, 1주 35시간\u003c/strong&gt; 초과 금지 (합의 시 1일 1시간, 1주 5시간 한도 연장)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;결과(수정할 곳): 근로 시간 9\u003cdel&gt;19시(휴게 1시간 포함) = 하루 9시간 → 1일 7시간(연장해도 8시간) 초과 / 월\u003c/del&gt;목 4일 × 9시간 = 주 36시간 → 주 35시간 초과 / 임금 50%를 카페 이용권으로 지급 → 통화로 전액 지급 위반\u003c/li&gt;\n\u003cli&gt;결론: 청소년은 근로 기준법을 알고 올바른 근로 계약서를 써야 노동권을 지킬 수 있다\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;3-2. 세계 인권 문제의 양상과 해결 방안 (27~29쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;세계 인권 문제의 양상\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;정치적 이유\u003c/strong&gt;: 전쟁·독재 → 생명 박탈, 인권 유린, \u003cstrong&gt;난민\u003c/strong&gt; 발생\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;경제적 이유\u003c/strong&gt;: 경제 수준 열악 → \u003cstrong&gt;빈곤, 기아\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;종교적·문화적 요인\u003c/strong&gt;: 특정 민족·인종 차별, \u003cstrong&gt;여성과 아동의 권리 침해\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;국제기구와 비정부 기구가 정기적으로 \u003cstrong&gt;인권지수\u003c/strong&gt; 발표 → 지역별 인권 실태·변화 파악\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;인권지수와 인권 수준\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;인권지수\u003c/strong&gt;: 일정한 기준에 따라 인권의 보장 정도를 나타내는 지표\u003c/li&gt;\n\u003cli&gt;기준 정하는 방식에 따라 수치가 달라짐 → 특정 국가의 \u003cstrong&gt;절대적 인권 수준을 반영하는 것은 아님\u003c/strong&gt; (활용 시 유의)\u003c/li&gt;\n\u003cli&gt;다양한 인권지수와 발표 기관: 세계 노동 권리 지수(국제 노동조합 총연맹, ITUC), 세계 자유 지수(프리덤 하우스, FH), 세계 평화 지수(경제평화 연구소, IEP), 세계 기아 지수(국제 식량 정책 연구소, IFPRI)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;세계 언론 자유 지수\u003c/strong&gt; (국경 없는 기자회, RSF): 비정부 기구·언론인·인권 운동가 설문 토대 / 다원주의, 자기 검열 수준, 권력으로부터의 독립, 제도적 장치, 취재·보도 투명성, 뉴스 생산 구조 등 (지도의 국가별 수치는 변환 상태가 나빠 생략)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;인간 개발 지수(HDI)\u003c/strong&gt; (UNDP): 기대 수명, 교육 기간, 1인당 국민 총소득 → 국민의 건강·교육·생활 수준 보장 정도\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;불평등 조정 인간 개발 지수(IHDI)\u003c/strong&gt;: HDI에 불평등 요소 반영 → \u003cstrong&gt;불평등 정도가 클수록 낮아짐\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;자료(2021년 기준): 대한민국 HDI 19위 → IHDI 22위, 미국 21위 → 26위, 오스트레일리아 5위 → 11위, 노르웨이 2위 → 2위\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;글로벌 성평등 지수(GGPI)\u003c/strong&gt;, \u003cstrong&gt;여성 임파워먼트 지수(WEI)\u003c/strong&gt; (UN Women + UNDP)\u003cul&gt;\n\u003cli&gt;GGPI: 건강·보건, 교육, 노동·재정, 의사 결정 4개 영역의 \u003cstrong&gt;성별 간 상대적 격차\u003c/strong&gt; → 1에 가까울수록 격차가 작음\u003c/li&gt;\n\u003cli&gt;WEI: 위 4개 + \u003cstrong&gt;폭력으로부터의 자유\u003c/strong&gt; = 5개 영역에서 \u003cstrong&gt;여성의 절대적 권리 수준\u003c/strong&gt; → 1에 가까울수록 높음\u003c/li&gt;\n\u003cli&gt;그래프 결론: 성별 간 격차가 큰 국가는 \u003cstrong&gt;여성의 절대적 권리 수준도 높지 않음\u003c/strong&gt; (개별 수치는 생략)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;세계 인권 문제의 해결 방안 모색\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;개별 국가의 노력만으로는 어려움 (해결 의지 약함, 사회 기반 열악) → \u003cstrong&gt;다양한 국제 사회 행위 주체의 연대\u003c/strong&gt; 필요\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;국제 연합(UN)\u003c/strong&gt;: 주요 인권 문제를 의제로 다루고 \u003cstrong&gt;선언과 조약\u003c/strong&gt;을 제정\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;비정부 기구\u003c/strong&gt;: 인권 실상을 국제 사회에 알림, 인권 탄압 방지, 빈곤 국가 경제적 지원, 난민 구호\u003c/li&gt;\n\u003cli&gt;개인: \u003cstrong&gt;세계시민 의식\u003c/strong&gt; 함양 → 세계시민으로서 활동 참여\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;세계시민 의식\u003c/strong&gt;: 보편적 인간애를 바탕으로 특정 민족·국가를 넘어 인류를 하나의 운명 공동체로 인식하여 지구상의 문제에 관심을 가지고 해결하려 노력하는 태도\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 세계 인권 문제 해결을 위한 공익 광고 만들기 (29쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 사례 하나 선정 → 문제 양상·해결 방안 조사 → 공익 광고 제작\u003c/li&gt;\n\u003cli&gt;자료\u003cul&gt;\n\u003cli&gt;난민: UNHCR 발표 2022년 약 1억 800만 명(통계 시작 이래 최다), 원인 = 전쟁·분쟁, 소수 민족 차별·박해, 기근 (시리아·수단·아프가니스탄 등 분쟁, 소말리아·에티오피아 가뭄)\u003c/li&gt;\n\u003cli&gt;기아: WHO — 아프리카 7개국 8천만 명 이상 식량 불안, 약 3천 750만 명 급성 식량 위기, 원인 = 분쟁·기후변화 등 복합적\u003c/li&gt;\n\u003cli&gt;아동 노동: 네팔 벽돌 공장, 2021년 아동 노동자 약 107만 명 이상 추산, 빈곤 지역일수록 심함, 학업 중단\u003c/li&gt;\n\u003cli&gt;인종 차별: 오스트레일리아 원주민 = 인구 3.3%인데 수감자 4분의 1 이상, 기대 수명 9년 정도 짧음, 국민 75%가 부정적 인식 → \u003cstrong&gt;부정적 편견이 차별 행동\u003c/strong&gt;으로 이어짐\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;결론: 세계 인권 문제는 원인이 다양하고 복합적이므로 국제적 연대와 세계시민의 관심이 필요하다\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;단원 프로젝트·마무리 (30~33쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;대중 매체 속 차별과 편견 바로잡기\u003c/strong&gt; (30~31쪽): 차별적 대사·장면에 노출되면 \u003cstrong&gt;왜곡된 사회적 인식\u003c/strong&gt; 형성 → EBS &amp;#39;딩동댕 유치원&amp;#39;(휠체어 탄 하늘이, 자폐성 장애 별이, 다문화 가정 마리)은 인식 변화에 도움 / 바로잡기 예: &amp;#39;여경&amp;#39; → &amp;#39;경찰&amp;#39;, 질병 편견 대사 → 과학적 사실로만, &amp;#39;초딩 입맛&amp;#39; → 연령 고정관념이므로 있는 그대로 표현\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;정보 통신 기술과 인권\u003c/strong&gt; (33쪽 단원 마무리): 빅데이터 맞춤형 정보는 편리하지만 \u003cstrong&gt;개인 정보 유출\u003c/strong&gt;, 인터넷의 \u003cstrong&gt;익명성과 비대면성\u003c/strong&gt;에 바탕을 둔 \u003cstrong&gt;혐오와 차별\u003c/strong&gt;, 인공 지능의 일자리·생존 위협 / 맞춤형 게시물 추천은 정보를 \u003cstrong&gt;편향적으로\u003c/strong&gt; 접하게 함 → 동의 없는 개인 정보 수집 금지, 정보 조작 금지 등 자율성 보호 필요\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 헷갈리는 것 비교표&quot;,&quot;html&quot;:&quot;\u003ch3&gt;① 헌법상 기본권 비교 (필수)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;기본권\u003c/th&gt;\n\u003cth&gt;뜻 (교과서 표현)\u003c/th&gt;\n\u003cth&gt;예시\u003c/th&gt;\n\u003cth&gt;교과서 사례\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;자유권\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;국가 권력의 간섭 없이 자유롭게 생활할 수 있는 권리\u003c/td&gt;\n\u003ctd&gt;신체의 자유, 양심의 자유, 사생활의 비밀과 자유, 언론·출판·집회·결사의 자유\u003c/td&gt;\n\u003ctd&gt;원하는 직업을 스스로 선택, 종교의 자유(육군 훈련소)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;평등권\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;성별, 종교, 사회적 신분 등을 이유로 불합리한 차별을 받지 않을 권리\u003c/td&gt;\n\u003ctd&gt;법 앞에서의 평등, 혼인과 가족생활에서의 양성평등\u003c/td&gt;\n\u003ctd&gt;결혼·출산과 관계없이 같은 승진 기회\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;참정권\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;국민이 국가의 의사 결정 과정에 참여할 수 있는 권리\u003c/td&gt;\n\u003ctd&gt;선거권, 공무 담임권, 국민 투표권\u003c/td&gt;\n\u003ctd&gt;18세 이상 국민의 선거 투표\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;사회권\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;인간다운 삶의 보장을 국가에 요구할 수 있는 권리\u003c/td&gt;\n\u003ctd&gt;교육을 받을 권리, 근로의 권리, 사회 보장을 받을 권리, 쾌적한 환경에서 생활할 권리\u003c/td&gt;\n\u003ctd&gt;기초 생활 수급자 생활비 지원\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;청구권\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;다른 기본권이 침해되었을 때 침해된 권리의 구제를 요구할 수 있는 권리 (\u003cstrong&gt;수단적 성격\u003c/strong&gt;)\u003c/td&gt;\n\u003ctd&gt;청원권, 재판 청구권, 국가 배상 청구권\u003c/td&gt;\n\u003ctd&gt;파손된 도로 정비 청원\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;※ 헌법에 열거되지 않은 권리(소비자의 권리, 일조권, 휴식권, 수면권 등)도 헌법 제37조 ①에 따라 보장 가능\u003c/p&gt;\n\u003ch3&gt;② 1세대 vs 2세대 vs 3세대 인권\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;1세대\u003c/th&gt;\n\u003cth&gt;2세대\u003c/th&gt;\n\u003cth&gt;3세대\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;이름\u003c/td&gt;\n\u003ctd&gt;시민·정치적 권리\u003c/td&gt;\n\u003ctd&gt;경제·사회·문화적 권리\u003c/td&gt;\n\u003ctd&gt;연대권\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;국가에 요구\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;불간섭\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;적극적인 개입\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;국경을 초월한 \u003cstrong&gt;연대와 박애\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;보호 대상\u003c/td&gt;\n\u003ctd&gt;개인의 자유\u003c/td&gt;\n\u003ctd&gt;사회적 약자의 인간다운 삶\u003c/td&gt;\n\u003ctd&gt;차별받는 개인과 집단 (전 지구적)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;관련 역사\u003c/td&gt;\n\u003ctd&gt;시민 혁명\u003c/td&gt;\n\u003ctd&gt;산업 혁명 이후 → 바이마르 헌법(1919)\u003c/td&gt;\n\u003ctd&gt;오늘날 전쟁·기아·차별\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;예\u003c/td&gt;\n\u003ctd&gt;신체·표현의 자유, 정치 참여, 공정한 재판\u003c/td&gt;\n\u003ctd&gt;근로·교육·사회 보장·인간다운 생활\u003c/td&gt;\n\u003ctd&gt;자결권, 발전·평화·재난 구제·지속가능한 환경\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;③ 세계 인권 선언 vs 국제 인권 규약\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;세계 인권 선언\u003c/th&gt;\n\u003cth&gt;국제 인권 규약\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;연도\u003c/td&gt;\n\u003ctd&gt;1948년\u003c/td&gt;\n\u003ctd&gt;1966년\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;성격\u003c/td&gt;\n\u003ctd&gt;UN 총회 채택, \u003cstrong&gt;인권 보장의 국제적 기준\u003c/strong&gt;, 인류의 보편적 가치 선포\u003c/td&gt;\n\u003ctd&gt;세계 인권 선언의 권리를 \u003cstrong&gt;국제법상 조약 형태로 구체화\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;내용\u003c/td&gt;\n\u003ctd&gt;제1조 자유·존엄·권리의 동등, 제22조 사회 보장을 받을 권리\u003c/td&gt;\n\u003ctd&gt;시민적 및 정치적 권리 규약(1세대), 경제적·사회적 및 문화적 권리 규약(2세대) 등\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;④ 새로운 인권 4가지\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;권리\u003c/th&gt;\n\u003cth&gt;뜻\u003c/th&gt;\n\u003cth&gt;교과서 근거\u003c/th&gt;\n\u003cth&gt;사례\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;주거권\u003c/td&gt;\n\u003ctd&gt;쾌적하고 안정적인 환경에서 인간다운 주거 생활을 할 권리\u003c/td&gt;\n\u003ctd&gt;헌법 제35조 ③\u003c/td&gt;\n\u003ctd&gt;청년 안심 주택, 임대 주택 우선 공급\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;안전권\u003c/td&gt;\n\u003ctd&gt;생명과 안녕을 위협하는 각종 위험으로부터 안전할 권리\u003c/td&gt;\n\u003ctd&gt;헌법 제34조 ⑥ (국가의 재해 예방 의무)\u003c/td&gt;\n\u003ctd&gt;지하철 안전문, 신호등·횡단보도\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;환경권\u003c/td&gt;\n\u003ctd&gt;건강하고 쾌적한 환경에서 살 권리\u003c/td&gt;\n\u003ctd&gt;헌법 제35조 ① (권리 + 국민의 의무)\u003c/td&gt;\n\u003ctd&gt;노후 경유차 감축, 도심 공원\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;문화권\u003c/td&gt;\n\u003ctd&gt;누구나 문화생활에 참여하고 문화를 향유할 권리\u003c/td&gt;\n\u003ctd&gt;헌법(문화 자유·국가 의무) + 문화 기본법 제4조\u003c/td&gt;\n\u003ctd&gt;배리어 프리, 문화가 있는 날\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑤ 인권 보장을 위한 헌법의 제도적 장치\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;장치\u003c/th&gt;\n\u003cth&gt;핵심\u003c/th&gt;\n\u003cth&gt;구현 방법\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;국민 주권의 원리\u003c/td&gt;\n\u003ctd&gt;주권이 국민에게 있음\u003c/td&gt;\n\u003ctd&gt;선거 제도, 국민 투표를 통한 헌법 개정\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;법치주의\u003c/td&gt;\n\u003ctd&gt;국회가 만든 법률에 근거해 국가 운영\u003c/td&gt;\n\u003ctd&gt;권리·의무는 법률로, 법률 내용도 인권 보장에 적법\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;권력 분립\u003c/td&gt;\n\u003ctd&gt;입법(국회)·행정(정부)·사법(법원) 분리\u003c/td&gt;\n\u003ctd&gt;견제와 균형 → 권력 남용 방지\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;기본권 구제 제도\u003c/td&gt;\n\u003ctd&gt;침해된 기본권 구제\u003c/td&gt;\n\u003ctd&gt;헌법재판소 심판, 인권 보호 기관\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑥ 위헌 법률 심판 vs 헌법 소원 심판\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;위헌 법률 심판\u003c/th&gt;\n\u003cth&gt;헌법 소원 심판(위헌 심사형)\u003c/th&gt;\n\u003cth&gt;헌법 소원 심판(권리 구제형)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;누가 시작?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;법원의 제청\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;재판 당사자가 \u003cstrong&gt;직접 청구\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;기본권을 침해받은 \u003cstrong&gt;국민이 청구\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;언제?\u003c/td&gt;\n\u003ctd&gt;재판에 적용되는 법률의 위헌 여부가 문제될 때\u003c/td&gt;\n\u003ctd&gt;위헌 법률 심판 제청 신청이 \u003cstrong&gt;받아들여지지 않았을 때\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;국가 권력의 \u003cstrong&gt;행사 또는 불행사\u003c/strong&gt;로 기본권 침해\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;※ 인권 보호 기관(헌법재판소·국가 인권 위원회·국민 권익 위원회) 비교는 2-1의 &amp;#39;인권 보장 제도 발달사&amp;#39; 표 참고. 헌법재판소는 그 밖에 육군 훈련소 종교 행사 강제 위헌 결정, 국가 인권 위원회는 외국인 근로자 진정 창구·AI 면접 관련 지침에도 등장. 각 기관의 법적 권한(결정의 구속력 등)은 교과서 확인 필요.\u003c/p&gt;\n\u003ch3&gt;⑦ 합법적 시민 참여 vs 시민불복종\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;합법적 시민 참여\u003c/th&gt;\n\u003cth&gt;시민불복종\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;방법\u003c/td&gt;\n\u003ctd&gt;선거, 청원·민원, 탄원서, 1인 시위, 이익 집단·시민단체, 서명 운동, 집회·시위, 정당 가입\u003c/td&gt;\n\u003ctd&gt;부당한 법·정책에 대항하는 \u003cstrong&gt;의도적인 위법 행위\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;위치\u003c/td&gt;\n\u003ctd&gt;바람직한 기본 방법\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;마지막 방법\u003c/strong&gt; (최후의 수단)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;조건\u003c/td&gt;\n\u003ctd&gt;법 테두리 안\u003c/td&gt;\n\u003ctd&gt;공익·정의 목적, 비폭력, 최후의 수단, 처벌 감수\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑧ 인간 개발 관련 지수 vs 성평등 관련 지수\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;지수\u003c/th&gt;\n\u003cth&gt;무엇을 재나\u003c/th&gt;\n\u003cth&gt;읽는 법\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;HDI\u003c/td&gt;\n\u003ctd&gt;기대 수명, 교육 기간, 1인당 국민 총소득\u003c/td&gt;\n\u003ctd&gt;건강·교육·생활 수준 보장 정도\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;IHDI\u003c/td&gt;\n\u003ctd&gt;HDI + 불평등 요소\u003c/td&gt;\n\u003ctd&gt;불평등 클수록 낮아짐\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;GGPI\u003c/td&gt;\n\u003ctd&gt;4개 영역 성별 간 \u003cstrong&gt;상대적 격차\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;1에 가까울수록 격차 작음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;WEI\u003c/td&gt;\n\u003ctd&gt;5개 영역(폭력으로부터의 자유 포함) 여성의 \u003cstrong&gt;절대적 권리 수준\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;1에 가까울수록 권리 수준 높음\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 외울 것 체크리스트&quot;,&quot;html&quot;:&quot;\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 인권 = 인간이라는 이유만으로 인간 존엄성을 보장받으며 인간다운 삶을 살아갈 권리\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 인권의 특징: 천부성, 보편성, 불가침성(양도 불가), 항구성\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 1세대 = 시민·정치적 권리(국가 불간섭) / 2세대 = 경제·사회·문화적 권리(국가 적극 개입) / 3세대 = 연대권\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 자결권 = 다른 나라 간섭 없이 통치 형태 결정, 발전 추구\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 대헌장 1215 → 권리 장전 1689(명예혁명, 입헌 군주제 기초) → 미국 독립 선언 1776 → 인간과 시민의 권리 선언 1789\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 시민 혁명으로 확립: 자유권, 평등권, 참정권\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 시민 혁명 후에도 재산·직업·성별로 선거권 제한 → 차티스트 운동(인민헌장), 여성 참정권 운동\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 사회권 최초 명시 = 1919년 독일 바이마르 헌법 (산업 혁명 후 빈부 격차 배경)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 세계 인권 선언 1948 = UN 총회, 인권 보장의 국제적 기준\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국제 인권 규약 1966 = 세계 인권 선언을 국제법상 조약 형태로 구체화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 주거권 헌법 제35조 ③ / 안전권 헌법 제34조 ⑥ / 환경권 헌법 제35조 ①\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 환경권은 권리이면서 국민의 의무(국가와 국민은 환경 보전 노력)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 문화권은 문화 기본법으로도 보장, 배리어 프리 = 장벽이 없다\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 헌법 = 인권 보호의 최후의 보호막, 인권을 기본권 형태로 규정\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 헌법 제10조 = 인간의 존엄과 가치, 행복 추구권, 국가의 기본권 보장 의무\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 존엄사 판결 = 헌법 제10조 근거, 자기 결정권 보장 → 연명 의료 결정 법률 제정\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 헌법 제37조 ① = 열거되지 않은 권리도 경시되지 않음 (일조권, 휴식권, 수면권 등)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 청구권은 수단적 성격 (청원권, 재판 청구권, 국가 배상 청구권)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 헌법 제37조 ② = 국가 안전 보장·질서 유지·공공복리 / 필요한 경우 / 법률로써 / 본질적 내용 침해 금지\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국민 주권(주권은 국민) / 법치주의(국회가 만든 법률) / 권력 분립(국회·정부·법원, 견제와 균형)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 위헌 법률 심판 = 법원의 제청 / 헌법 소원 = 위헌 심사형(제청 신청 기각 시) + 권리 구제형(공권력 행사·불행사)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 헌법재판소 1988, 국가 인권 위원회 2001(살구색), 국민 권익 위원회 2008(점자 블록)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 선거 연령: 2005 19세 → 2019 18세, 2021 피선거권 25세 → 18세\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 가장 기본적이고 중요한 시민 참여 = 선거\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 시민불복종 정당화 조건: 공익·정의 목적, 비폭력, 최후의 수단, 처벌 감수\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 간디 소금법 폐지 운동(1930) → 소금법 1931년 폐지\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 사회적 소수자 = 구별·차별 + 차별받는 집단에 속한다는 의식\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 청소년(15~18세 미만) 근로: 1일 7시간, 1주 35시간 / 임금은 통화로 전액 / 친권자 동의서\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 인권지수는 절대적 인권 수준을 반영하지 않음, IHDI는 불평등 클수록 낮아짐\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 세계시민 의식 = 인류를 하나의 운명 공동체로 인식하고 지구적 문제 해결에 노력하는 태도\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;5. 예상 문제 (15문항)&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;1. 인권의 특징에 대한 설명으로 옳지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;① 인간이 태어나면서부터 당연하게 가지는 천부적인 권리이다.\n② 국가가 법으로 부여한 권리이므로 국가가 필요에 따라 거두어들일 수 있다.\n③ 성별, 인종, 계급, 신분과 관계없이 모든 사람의 권리라는 점에서 보편성을 가진다.\n④ 국가나 다른 사람이 부당하게 침해할 수 없고 양도할 수도 없다.\n⑤ 일시적 권리가 아니라 영구히 보장된다는 점에서 항구성을 가진다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2. 다음 (가)~(라) 문서에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 1215년 – 국왕이 의회의 승인 없이 세금을 부과할 수 없고, 법에 따르지 않고는 체포할 수 없음을 규정하였다.\n(나) 1689년 – 법을 통한 왕권의 제한을 명시하였고 의회의 권한을 강조하였다.\n(다) 1776년 – 부당한 식민 지배에 반발하여 독립하면서 저항권과 자유권 등의 내용을 담았다.\n(라) 1789년 – 천부 인권, 자유권, 국민 주권, 저항권, 재산권 등의 침해 불가를 명시하였다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. (가)는 13세기 영국에서 왕의 권한을 제한하기 위해 발표되었다.\nㄴ. (나)는 명예혁명으로 승인되어 입헌 군주제의 기초를 확립하였다.\nㄷ. (다)는 프랑스 혁명 과정에서 발표되었다.\nㄹ. (라)에는 인간은 자유롭고 평등한 권리를 지니고 태어난다는 내용이 담겨 있다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄱ, ㄷ　③ ㄴ, ㄹ　④ ㄱ, ㄴ, ㄹ　⑤ ㄴ, ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3. 표는 인권을 A~C로 분류한 것이다. 이에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;A\u003c/th&gt;\n\u003cth&gt;B\u003c/th&gt;\n\u003cth&gt;C\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;신체의 자유, 표현의 자유, 공정한 재판을 받을 권리\u003c/td&gt;\n\u003ctd&gt;근로의 권리, 교육에 관한 권리, 사회 보장을 받을 권리\u003c/td&gt;\n\u003ctd&gt;자결권, 발전의 권리, 평화에 관한 권리\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;① A는 개인의 자유를 보호하기 위해 국가의 불간섭을 요구하는 권리이다.\n② B는 국경을 초월한 연대와 박애를 강조하는 전 지구적 차원의 권리이다.\n③ C는 사회적 약자를 위해 국가의 적극적인 개입을 요구하는 권리이다.\n④ A에는 재난 구제를 받을 권리가 포함된다.\n⑤ 시민 혁명을 통해 가장 먼저 확립된 권리는 C이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4. 밑줄 친 (가)~(다)에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;산업 혁명 이후 많은 노동자가 열악한 노동 조건과 낮은 임금에 시달리자 1919년 제정된 (가) 에서 사회권을 최초로 명시하였다. 제2차 세계 대전 이후에는 1948년 국제 연합 총회에서 (나) 을/를 채택하였고, 1966년에는 (나)에 명시된 권리를 구체화한 (다) 이/가 채택되었다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① (가)는 프랑스 혁명 과정에서 제정되었다.\n② (가)는 제2차 세계 대전 이후 여러 나라 헌법의 모델이 되기 위해 만들어졌다.\n③ (나)는 처음부터 국제법상 조약 형태로 만들어졌다.\n④ (다)는 3세대 인권으로만 구성된 규약이다.\n⑤ (가)는 국가가 모든 사회 구성원의 인간다운 삶을 보장해야 한다는 내용을 담았다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5. (가)~(라) 사례와 관련된 권리를 바르게 연결한 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) ◯◯시는 청년과 신혼부부에게 주변 시세보다 낮은 임대료로 주택을 공급한다.\n(나) 지하철 전체 역 승강장에 안전문을 설치한 뒤 사망 사고가 크게 줄었다.\n(다) 노후 경유차 운행 제한 등으로 미세 먼지를 줄여 대기질이 개선되었다.\n(라) 공연에서 청각 장애인을 위한 수어 통역과 자막, 시각 장애인을 위한 화면 해설을 제공한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 주거권 – 환경권 – 안전권 – 문화권\n② 주거권 – 안전권 – 문화권 – 환경권\n③ 주거권 – 안전권 – 환경권 – 문화권\n④ 안전권 – 주거권 – 환경권 – 문화권\n⑤ 문화권 – 안전권 – 환경권 – 주거권\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6. 다음 글에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;대법원은 회복 불가능한 사망 단계에 들어선 것이 명백한 환자의 연명 치료를 중단하는 &amp;#39;존엄사&amp;#39;를 인정하였다. 재판부는 &amp;quot;환자의 의사 결정을 존중하여 연명 치료를 중단하는 것이 인간으로서의 존엄과 행복 추구권을 보호하는 것&amp;quot;이라고 밝혔다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 대법원은 헌법 제10조를 판결의 토대로 삼았다.\nㄴ. 이 판결은 환자의 자기 결정권을 보장하려는 것이다.\nㄷ. 이 판결 이후 연명 의료 결정에 관한 법률이 폐지되었다.\nㄹ. 헌법 제10조는 국가가 개인의 불가침의 기본적 인권을 확인하고 보장할 의무를 진다고 규정한다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ, ㄹ　② ㄱ, ㄷ　③ ㄴ, ㄷ　④ ㄱ, ㄴ, ㄷ　⑤ ㄴ, ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7. 다음 사례 A~E와 관련된 기본권을 바르게 짝지은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;A: 18세 이상의 국민은 국민의 대표를 선출하는 선거에 참여하여 투표할 수 있다.\nB: 나의 능력을 발휘할 수 있도록 원하는 직업을 스스로 선택할 수 있다.\nC: 기초 생활 수급자로 선정되면 국가로부터 기본적인 생활비를 지원받을 수 있다.\nD: 도로가 파손되어 불편을 겪고 있다면 정비해 달라고 청원을 제기할 수 있다.\nE: 직장에서 결혼이나 출산과 관계없이 모두에게 똑같은 승진 기회가 주어진다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① A – 청구권　② B – 사회권　③ C – 평등권　④ D – 청구권　⑤ E – 자유권\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8. 우리 헌법의 기본권에 대한 설명으로 옳지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;① 자유권은 국가 권력의 간섭 없이 자유롭게 생활할 수 있는 권리이다.\n② 청구권은 그 자체가 최종 목적인 권리로, 다른 기본권을 보장하는 수단이 되지 않는다.\n③ 참정권에는 선거권, 공무 담임권, 국민 투표권 등이 있다.\n④ 사회권은 인간다운 삶의 보장을 국가에 요구할 수 있는 권리이다.\n⑤ 헌법에 열거되지 않은 일조권, 휴식권, 수면권 등도 보장받을 수 있다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9. 다음 헌법 조항에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;헌법 제37조 ② 국민의 모든 자유와 권리는 국가 안전 보장ㆍ질서 유지 또는 공공복리를 위하여 필요한 경우에 한하여 법률로써 제한할 수 있으며, 제한하는 경우에도 자유와 권리의 본질적인 내용을 침해할 수 없다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 기본권 제한의 목적을 국가 안전 보장, 질서 유지, 공공복리로 정하고 있다.\nㄴ. 기본권은 법률이 없어도 행정 기관의 판단만으로 제한할 수 있다.\nㄷ. 기본권은 필요한 경우에 한하여 제한할 수 있다.\nㄹ. 기본권을 제한하더라도 자유와 권리의 본질적인 내용은 침해할 수 없다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄴ, ㄷ　③ ㄱ, ㄴ, ㄷ　④ ㄴ, ㄷ, ㄹ　⑤ ㄱ, ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10. 다음 사례에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;A 씨는 육군 훈련소에서 주말 종교 행사에 불참하겠다는 의사를 밝혔으나 계속된 권유에 결국 참석하였다. 이에 A 씨는 종교 행사 중 하나를 선택하여 참석하도록 하는 조치가 기본권을 침해한다며 심판을 청구했다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 법원이 재판 중에 헌법재판소에 위헌 법률 심판을 제청한 사례이다.\n② A 씨는 국가 인권 위원회에 진정하여 시정 권고를 받았다.\n③ A 씨는 헌법 소원 심판을 청구했고, 헌법재판소는 종교의 자유를 침해한다고 보았다.\n④ 헌법재판소는 훈련소의 조치가 정당하다며 청구를 기각하였다.\n⑤ 이 사례에서 침해된 기본권은 사회권이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11. 우리나라의 인권 보장 제도 발달에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;① 헌법재판소는 성과 본관이 같은 사람끼리 결혼할 수 없도록 한 민법 규정이 행복 추구권과 평등권 등을 침해하므로 개정하도록 하였다.\n② 국가 인권 위원회는 1988년에 설립되었다.\n③ 국민 권익 위원회는 크레파스의 &amp;#39;살색&amp;#39; 명칭 변경을 권고하였다.\n④ 국가 인권 위원회는 점자 블록 설치를 국토 교통부에 권고하였다.\n⑤ 1948년 제헌 헌법은 중등 교육까지 무상으로 제공받을 권리를 명시하였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12. 다음 사례에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;2005년에 19세부터 선거에 참여할 수 있게 법령이 개정되었으나, 청소년의 참정권 보장을 위해 선거 연령을 더 낮춰야 한다는 주장이 많았다. 이에 많은 청소년이 누리 소통망(SNS)에 생각을 공유하거나 시민단체를 결성하고 집회와 서명 운동을 전개하였다. 그 결과 국회에서 논의가 다시 이루어져 선거 연령이 낮아졌다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 청소년들은 시민단체 활동, 집회, 서명 운동 등 다양한 방법으로 참여하였다.\nㄴ. 2019년에 선거 가능 연령이 19세로 낮아졌다.\nㄷ. 2021년에는 국회 의원 피선거권 연령이 18세로 낮아졌다.\nㄹ. 시민 참여는 대의 민주주의의 한계를 보완하는 역할을 할 수 있다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄱ, ㄷ　③ ㄴ, ㄹ　④ ㄱ, ㄷ, ㄹ　⑤ ㄴ, ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;13. 다음 사례를 시민불복종의 정당화 조건에 비추어 평가한 내용으로 옳지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;1930년 영국은 인도인의 소금 제조와 판매를 금지하는 소금법을 제정했고, 소금에 붙는 비싼 세금은 농민에게 큰 부담이 되었다. 간디는 소금법 폐지를 요구했으나 받아들여지지 않자 군중과 함께 평화적으로 행진한 뒤 바다에서 직접 소금을 만들었다. 간디는 소금법을 어겼다는 이유로 체포되었고, 군중은 경찰의 곤봉에 맞아 쓰러지면서도 시위를 멈추지 않았다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 폐지 요구가 받아들여지지 않은 뒤 행동했다는 점에서 최후의 수단이라는 조건과 관련된다.\n② 간디와 군중이 경찰에 무력으로 맞섰으므로 비폭력 조건을 충족하지 못했다.\n③ 평화적으로 행진했다는 점에서 비폭력성을 갖추었다.\n④ 법을 어겨 체포된 것을 받아들인 것은 처벌을 감수하여 법체계를 존중한 것으로 볼 수 있다.\n⑤ 농민에게 부담을 주는 부당한 법에 맞섰다는 점에서 공익을 위한 목적이 인정된다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;14. 자료 1을 근거로 17세 유정이의 근로 계약서(자료 2)에서 수정해야 할 점으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;자료 1 &amp;lt;근로 기준법&amp;gt;\n제43조 ① 임금은 통화로 직접 근로자에게 그 전액을 지급하여야 한다.\n제54조 ① 근로 시간이 4시간인 경우 30분 이상, 8시간인 경우 1시간 이상의 휴게 시간을 근로 시간 도중에 주어야 한다.\n제66조 18세 미만인 사람에 대하여는 연령 증명서와 친권자 또는 후견인의 동의서를 사업장에 갖추어 두어야 한다.\n제69조 15세 이상 18세 미만인 사람의 근로 시간은 1일 7시간, 1주 35시간을 초과하지 못한다. 다만, 합의에 따라 1일 1시간, 1주 5시간을 한도로 연장할 수 있다.\u003c/p&gt;\n\u003cp&gt;자료 2 소정 근로 시간: 9시\u003cdel&gt;19시(휴게 시간 1시간 포함) / 근무일: 월\u003c/del&gt;목 / 임금: 50%는 최저 시급 기준으로, 나머지 50%는 카페 이용권으로 지급\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 임금의 일부를 카페 이용권으로 주는 것은 제43조에 어긋난다.\nㄴ. 하루 근로 시간이 9시간이므로 제69조에 어긋난다.\nㄷ. 휴게 시간 1시간은 제54조의 기준에 미달하므로 늘려야 한다.\nㄹ. 사업장은 유정이의 연령 증명서와 친권자 또는 후견인의 동의서를 갖추어 두어야 한다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄴ, ㄷ　③ ㄷ, ㄹ　④ ㄱ, ㄷ, ㄹ　⑤ ㄱ, ㄴ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;15. 다음 자료에 대한 해석으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;국가\u003c/th&gt;\n\u003cth&gt;인간 개발 지수(HDI) 순위\u003c/th&gt;\n\u003cth&gt;불평등 조정 인간 개발 지수(IHDI) 순위\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;노르웨이\u003c/td&gt;\n\u003ctd&gt;2위\u003c/td&gt;\n\u003ctd&gt;2위\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;오스트레일리아\u003c/td&gt;\n\u003ctd&gt;5위\u003c/td&gt;\n\u003ctd&gt;11위\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;대한민국\u003c/td&gt;\n\u003ctd&gt;19위\u003c/td&gt;\n\u003ctd&gt;22위\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;미국\u003c/td&gt;\n\u003ctd&gt;21위\u003c/td&gt;\n\u003ctd&gt;26위\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;*2021년 기준 (국제 연합 개발 계획)\u003c/p&gt;\n\u003cp&gt;① 인권지수는 특정 국가의 절대적인 인권 수준을 그대로 보여 준다.\n② 대한민국은 IHDI 순위가 HDI 순위보다 높다.\n③ IHDI는 불평등 정도가 클수록 인간 개발 지수가 낮아지도록 조정한 지수이다.\n④ HDI는 국경 없는 기자회가 설문을 토대로 발표하는 지수이다.\n⑤ 표의 국가 중 불평등 요소를 반영했을 때 순위가 가장 많이 떨어진 국가는 미국이다.\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;번호\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003cth&gt;해설\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;인권은 국가가 주는 것이 아니라 태어나면서부터 가지는 천부적 권리이며, 부당하게 침해하거나 양도할 수 없다(불가침성).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;ㄷ: 미국 독립 선언(1776)은 영국의 식민 지배에 반발해 독립하며 발표. 프랑스 혁명 과정에서 발표된 것은 (라) 인간과 시민의 권리 선언. ㄱ·ㄴ·ㄹ은 교과서 내용과 일치(ㄹ은 제1조).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;3\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;A=1세대(국가 불간섭), B=2세대(국가 적극 개입), C=3세대(연대권). ② ③은 설명이 뒤바뀜, ④ 재난 구제는 3세대, ⑤ 시민 혁명으로 먼저 확립된 것은 1세대 성격의 자유권·평등권·참정권.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;(가) 바이마르 헌법, (나) 세계 인권 선언, (다) 국제 인권 규약. ① ② 독일, 1919년 제정 ③ 조약 형태로 구체화한 것은 (다) ④ (다)는 1세대 규약, 2세대 규약 등으로 구성.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;5\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;청년 안심 주택=주거권, 지하철 안전문=안전권, 노후 경유차 감축=환경권, 배리어 프리=문화권.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;ㄷ: 판결 이후 &amp;lt;호스피스·완화 의료 및 임종 과정에 있는 환자의 연명 의료 결정에 관한 법률&amp;gt;이 제정되었다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;7\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;A 참정권, B 자유권, C 사회권, D 청구권, E 평등권.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;청구권은 다른 기본권이 침해되었을 때 구제를 요구하는 권리로 수단적 성격을 지닌다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;9\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;ㄴ: 기본권은 &amp;#39;법률로써&amp;#39;만 제한할 수 있다(형식상 한계).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;A 씨는 헌법 소원 심판을 청구했고, 헌법재판소는 신앙을 가지지 않을 자유와 종교적 집회에 참석하지 않을 자유를 제한하여 위헌이라고 결정했다. 종교의 자유는 자유권.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;11\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;② 국가 인권 위원회는 2001년(1988년은 헌법재판소) ③ &amp;#39;살색&amp;#39; 권고는 국가 인권 위원회 ④ 점자 블록 권고는 국민 권익 위원회 ⑤ 제헌 헌법은 초등 교육 무상.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;12\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;ㄴ: 2019년에 선거 가능 연령이 18세로 낮아졌다(19세는 2005년).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;13\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;간디와 군중은 경찰의 곤봉에 맞으면서도 평화적으로 행진해 비폭력 조건을 갖추었다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;14\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;ㄱ: 임금은 통화로 전액 지급. ㄴ: 9\u003cdel&gt;19시에서 휴게 1시간을 빼면 9시간으로 1일 7시간(연장해도 8시간)을 넘고, 월\u003c/del&gt;목 4일이면 주 36시간으로 35시간도 넘는다. ㄷ: 8시간 이상 근로 시 휴게 1시간 이상이면 되므로 1시간은 기준 미달이 아니다. ㄹ: 제66조.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;15\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;① 인권지수는 기준 설정 방식에 따라 달라져 절대적 수준을 반영하지 않음 ② 19위 → 22위로 더 낮음 ④ HDI는 국제 연합 개발 계획(UNDP) 발표 ⑤ 오스트레일리아가 6계단(5→11)으로 가장 많이 떨어짐(미국 5계단).\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;}]},{&quot;id&quot;:&quot;society-justice&quot;,&quot;subject&quot;:&quot;통합사회&quot;,&quot;title&quot;:&quot;② 사회 정의와 불평등&quot;,&quot;file&quot;:&quot;통합사회_정리_2_사회정의와불평등.md&quot;,&quot;range&quot;:&quot;교과서 34~61쪽&quot;,&quot;flow&quot;:[[&quot;정의의 구분&quot;,&quot;분배 · 교정&quot;,&quot;몫을 공정하게 나누기 / 잘못을 바로잡기&quot;],[&quot;분배의 기준&quot;,&quot;업적 · 능력 · 필요&quot;,&quot;서로 다른 장단점 → 사회적 합의&quot;],[&quot;정의관&quot;,&quot;자유주의 ↔ 공동체주의&quot;,&quot;개인선 · 자유와 권리 / 공동선 · 책임과 의무&quot;],[&quot;불평등&quot;,&quot;사회 계층 · 공간 · 차별&quot;,&quot;양극화 / 지역 격차 / 사회적 약자&quot;],[&quot;해결&quot;,&quot;제도와 시민 실천&quot;,&quot;복지 · 지역 격차 완화 · 적극적 평등 실현&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;제시문 속 사상가 구분&quot;,&quot;head&quot;:[&quot;사상가&quot;,&quot;핵심 단서&quot;,&quot;입장&quot;],&quot;rows&quot;:[[&quot;롤스&quot;,&quot;최소 수혜자에게 최대 이익 / 평등한 자유&quot;,&quot;자유주의&quot;],[&quot;노직&quot;,&quot;정당한 취득 · 양도 / 소유 권리&quot;,&quot;자유주의&quot;],[&quot;밀&quot;,&quot;타인에게 해를 끼치지 않는 개인의 자유&quot;,&quot;자유주의&quot;],[&quot;매킨타이어&quot;,&quot;공동체의 역사 · 역할 · 의무&quot;,&quot;공동체주의&quot;]]},&quot;note&quot;:&quot;자유주의와 공동체주의는 정의로운 사회를 지향하며 상호 보완. 비교표의 예외·확인 필요 표시는 원문에 유지.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;과목: 천재교육(박윤경) 통합사회2 / 단원: Ⅱ. 사회정의와 불평등 (1. 정의의 의미와 정의의 실질적 기준, 2. 자유주의와 공동체주의 정의관, 3. 사회 및 공간 불평등 현상과 해결 방안)\n교과서 쪽 범위: 34\u003cdel&gt;61쪽 (단원 도입 34\u003c/del&gt;35쪽, 단원 퀴즈 60쪽, 단원 마무리 61쪽까지)\n※ 부교재는 아직 반영 안 됨.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 한눈에 보기&quot;,&quot;html&quot;:&quot;\u003ch3&gt;① 단원 전체 흐름\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;중단원\u003c/th&gt;\n\u003cth&gt;핵심 질문\u003c/th&gt;\n\u003cth&gt;핵심 개념\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1. 정의의 의미와 정의의 실질적 기준 (36~43쪽)\u003c/td&gt;\n\u003ctd&gt;정의란 무엇이고, 왜 필요하며, 무엇을 기준으로 나눠야 공정한가?\u003c/td&gt;\n\u003ctd&gt;정의, \u003cstrong&gt;분배적 정의\u003c/strong&gt;, \u003cstrong&gt;교정적 정의\u003c/strong&gt;, 아리스토텔레스의 정의, 공동선, \u003cstrong&gt;업적·능력·필요\u003c/strong&gt;, 보편적·선별적 복지\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2. 자유주의와 공동체주의 정의관 (44~49쪽)\u003c/td&gt;\n\u003ctd&gt;개인과 공동체 중 무엇을 더 앞세울 때 정의로운가?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;자유주의\u003c/strong&gt;, \u003cstrong&gt;공동체주의\u003c/strong&gt;, \u003cstrong&gt;개인선\u003c/strong&gt;, \u003cstrong&gt;공동선\u003c/strong&gt;, 롤스·노직·밀·매킨타이어, 권리와 의무·사익과 공익의 조화\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;3. 사회 및 공간 불평등 현상과 해결 방안 (50~59쪽)\u003c/td&gt;\n\u003ctd&gt;우리 사회에는 어떤 불평등이 있고 어떻게 줄일 수 있나?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;사회 계층의 양극화\u003c/strong&gt;, \u003cstrong&gt;공간 불평등\u003c/strong&gt;, \u003cstrong&gt;사회적 약자에 대한 차별\u003c/strong&gt;, \u003cstrong&gt;사회 복지 제도\u003c/strong&gt;, \u003cstrong&gt;지역 격차 완화 정책\u003c/strong&gt;, \u003cstrong&gt;적극적 평등 실현 조치\u003c/strong&gt;, 역차별\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;② 핵심 흐름 한 줄 요약\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;단계\u003c/th&gt;\n\u003cth&gt;내용\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;정의의 뜻\u003c/td&gt;\n\u003ctd&gt;인간이 지켜야 할 올바른 도리 / 사회를 구성하고 유지하는 공정한 도리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;정의의 구분\u003c/td&gt;\n\u003ctd&gt;분배적 정의(마땅히 받을 사람이 받게) ↔ 교정적 정의(잘못을 처벌해 바로잡음)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;분배 기준\u003c/td&gt;\n\u003ctd&gt;업적 · 능력 · 필요 → 각각 장단점 → \u003cstrong&gt;사회적 합의\u003c/strong&gt;로 상황에 맞는 기준 마련\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;정의관\u003c/td&gt;\n\u003ctd&gt;자유주의(개인 &amp;gt; 공동체, 개인선 우선) ↔ 공동체주의(공동체 &amp;gt; 개인, 공동선 우선) → \u003cstrong&gt;상호 보완\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;불평등 현상\u003c/td&gt;\n\u003ctd&gt;사회 계층의 양극화, 공간 불평등, 사회적 약자에 대한 차별\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;해결 방안\u003c/td&gt;\n\u003ctd&gt;제도(사회 복지 제도, 지역 격차 완화 정책, 적극적 평등 실현 조치) + 시민의 실천(관심, 존중, 공감·배려, 기부·봉사)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 소단원(차시)별 핵심 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;단원 도입 (34~36쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;34~35쪽 단원 도입 제목: \u003cstrong&gt;&amp;quot;정의가 필요한 이유는 무엇일까?&amp;quot;\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;36쪽 \u003cstrong&gt;놀이공원 패스트 패스권\u003c/strong&gt;: 줄 서기(\u003cstrong&gt;선착순\u003c/strong&gt;)에도 \u003cstrong&gt;돈을 낸 만큼 가져간다는 시장의 원리\u003c/strong&gt;가 작동\u003cul&gt;\n\u003cli&gt;&amp;quot;\u003cstrong&gt;돈을 받고 새치기할 권리\u003c/strong&gt;를 주는 것&amp;quot; vs &amp;quot;돈으로 서비스를 사는 건 \u003cstrong&gt;자본주의 사회에서 당연\u003c/strong&gt;&amp;quot; → 공정한가?\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;1-1. 정의의 의미와 필요성 (37~39쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;정의의 의미 (37쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;동서양을 막론하고 오래전부터 정의 실현에 관심\u003c/li&gt;\n\u003cli&gt;현대 사회: 사회 구조 복잡 + \u003cstrong&gt;사회적 가치의 분배를 둘러싼 갈등\u003c/strong&gt; 심화 → 정의는 개인과 사회가 추구해야 할 \u003cstrong&gt;중요한 덕목이자 기본적이고 핵심적인 가치\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;정의\u003c/strong&gt;: 일반적으로 \u003cstrong&gt;인간이 지켜야 할 올바른 도리\u003c/strong&gt; 또는 \u003cstrong&gt;사회를 구성하고 유지하는 공정한 도리\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;정의는 크게 \u003cstrong&gt;분배적 정의\u003c/strong&gt;(사회적 가치를 \u003cstrong&gt;마땅히 받을 만한 사람이 받게\u003c/strong&gt; 해 \u003cstrong&gt;각자가 자신의 몫\u003c/strong&gt;을 누리게 함)와 \u003cstrong&gt;교정적 정의\u003c/strong&gt;(잘못을 \u003cstrong&gt;처벌\u003c/strong&gt;해 \u003cstrong&gt;부정의한 상태를 정의로운 상태로 되돌림\u003c/strong&gt;)로 나뉨\u003c/li&gt;\n\u003cli&gt;공정한 처벌 = \u003cstrong&gt;법을 근거로\u003c/strong&gt; + \u003cstrong&gt;그 법이 공정\u003c/strong&gt; + 잘못과 처벌의 \u003cstrong&gt;적정한 균형\u003c/strong&gt;(작은 잘못엔 작은 벌, 큰 잘못엔 큰 벌)\u003c/li&gt;\n\u003cli&gt;※ &amp;#39;절차적 정의&amp;#39;라는 용어는 이 단원 본문에 나오지 않음 (교과서 확인 필요)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 아리스토텔레스의 정의 (《니코마코스 윤리학》, 37쪽)\u003c/strong&gt; → 세부 뜻은 3번 비교표 ①\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;정의 = \u003cstrong&gt;일반적 정의\u003c/strong&gt;(\u003cstrong&gt;법을 준수\u003c/strong&gt;하는 것) + \u003cstrong&gt;특수적 정의\u003c/strong&gt;(\u003cstrong&gt;교정적·분배적·교환적 정의\u003c/strong&gt;)\u003c/li&gt;\n\u003cli&gt;&amp;quot;법을 지키는 사람은 정의로운 사람이고 법을 지키지 않는 사람은 부정의한 사람&amp;quot;, 날개: 공정한 사람은 정의로운 사람\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;정의가 요청되는 이유 (38쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;① \u003cstrong&gt;인간 존엄성\u003c/strong&gt;: 모든 구성원이 기본적인 권리를 누리며 \u003cstrong&gt;인간답게 살아가기 위해\u003c/strong&gt; / 정의롭지 못하면 \u003cstrong&gt;불공정한 행위로 부당한 이익\u003c/strong&gt;, \u003cstrong&gt;권력이나 부로 처벌 회피\u003c/strong&gt;, 사회적 가치가 \u003cstrong&gt;힘 있는 일부 집단에 편중\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;② \u003cstrong&gt;사회 통합\u003c/strong&gt;: 정의롭지 못하면 서로 \u003cstrong&gt;신뢰하지 못하고 갈등과 분열\u003c/strong&gt; → 구성원이 협력해 \u003cstrong&gt;공동선\u003c/strong&gt;(공동의 이익 또는 공동체가 추구하는 가치나 목표)을 추구하도록 \u003cstrong&gt;모두가 동등하게 대우받는 공정한 사회\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;결론: 분배적 정의와 교정적 정의에 부합하는 \u003cstrong&gt;공정함의 기준\u003c/strong&gt;을 세우고 \u003cstrong&gt;법과 제도\u003c/strong&gt;를 마련해 사회정의 실현\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 정의의 여신상 (38쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;법을 대표하는 상징물\u003c/strong&gt;: 한 손의 ( ) → 엄격하고 공정한 \u003cstrong&gt;정의의 기준\u003c/strong&gt; / 다른 손의 ( ) → 정의를 실현하기 위한 \u003cstrong&gt;힘\u003c/strong&gt; / \u003cstrong&gt;눈을 가린 띠\u003c/strong&gt; → 판정할 때 \u003cstrong&gt;공평성\u003c/strong&gt; 유지\u003c/li&gt;\n\u003cli&gt;빈칸은 학생 활동 (흔히 저울·칼로 채우지만 교과서 정답은 확인 필요)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 롤스, 《정의론》: 사회 제도의 제1덕목은 정의 (38쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;&amp;quot;사상 체계의 제1덕목을 \u003cstrong&gt;진리\u003c/strong&gt;라고 한다면 \u003cstrong&gt;사회 제도의 제1덕목은 정의\u003c/strong&gt;이다.&amp;quot; → 법·제도가 아무리 \u003cstrong&gt;효율적이고 정연\u003c/strong&gt;(짜임새와 조리가 있음)해도 \u003cstrong&gt;정당하지 못하면 개선되거나 폐기\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;모든 사람은 \u003cstrong&gt;전체 사회의 복지를 위한다는 이유로도 결코 침해될 수 없는 기본적 권리\u003c/strong&gt;를 가짐 → 타인의 큰 선을 위해 \u003cstrong&gt;소수의 자유를 빼앗는 것은 정당화될 수 없음\u003c/strong&gt;, 권리는 \u003cstrong&gt;정치적 거래나 사회적 이득의 계산에 좌우되지 않음\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 사형 제도는 교정적 정의를 실현하기 위해 필요한가? (39쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 자료 1(사형 제도 논란), 자료 2(칸트·베카리아)로 모둠 토론 → 나의 입장 정리\u003c/li&gt;\n\u003cli&gt;자료 1: 살인범 무기 징역 선고 → 유가족이 사형 제도 부활·집행 청원 / 우리나라는 \u003cstrong&gt;1997년 12월\u003c/strong&gt; 이후 사형 집행 없음 → 국제 앰네스티가 \u003cstrong&gt;실질적인 사형 폐지 국가\u003c/strong&gt;로 분류, 찬반 논란은 여전함\u003c/li&gt;\n\u003cli&gt;자료 2: \u003cstrong&gt;칸트\u003c/strong&gt;(형벌은 \u003cstrong&gt;오직 범죄를 저질렀기 때문에\u003c/strong&gt;, \u003cstrong&gt;동등성의 원리\u003c/strong&gt; → \u003cstrong&gt;살인을 한 사람은 사형\u003c/strong&gt;) vs \u003cstrong&gt;베카리아\u003c/strong&gt;(형벌의 목적 = 해악 \u003cstrong&gt;방지\u003c/strong&gt;·유사 행위 \u003cstrong&gt;억제\u003c/strong&gt;, 사형은 \u003cstrong&gt;예방 효과를 기대하기 어려움\u003c/strong&gt;, \u003cstrong&gt;종신 노역형\u003c/strong&gt;이 더 효과적 → \u003cstrong&gt;유용하지도 필요하지도 않은 형벌\u003c/strong&gt;)\u003c/li&gt;\n\u003cli&gt;결론: 교정적 정의(잘못과 처벌의 균형)를 어떻게 이해하느냐(범죄에 대한 동등한 대가 vs 범죄 예방)에 따라 사형 제도에 대한 입장이 달라짐 (정답 없는 토론 활동)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;1-2. 분배적 정의의 실질적 기준 (40~43쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;분배 기준이 필요한 이유\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;사회적 가치를 공정하게 분배해 \u003cstrong&gt;각자에게 그의 몫이 돌아가게\u003c/strong&gt; 하려면 적절한 분배 기준 필요\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;업적, 능력, 필요\u003c/strong&gt; = 분배적 정의를 실현하는 \u003cstrong&gt;대표적인 실질적 기준\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;업적 · 능력 · 필요에 따른 분배 (40·42쪽)\u003c/strong&gt; → 뜻·예·장단점은 3번 비교표 ②\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;업적\u003c/strong&gt; = \
