u003cstrong&gt;성과와 실적\u003c/strong&gt;에 따라 / \u003cstrong&gt;능력\u003c/strong&gt; = \u003cstrong&gt;육체적·정신적 능력\u003c/strong&gt;에 따라 (예: \u003cstrong&gt;전문적인 자격증\u003c/strong&gt;) / \u003cstrong&gt;필요\u003c/strong&gt; = \u003cstrong&gt;인간다운 삶을 위한 기본적인 욕구\u003c/strong&gt; 충족 (예: 생계비·의료비 복지 지원)\u003c/li&gt;\n\u003cli&gt;시험 포인트: 업적은 \u003cstrong&gt;측정이 쉽지만 약자 배려가 어려움\u003c/strong&gt;, 능력은 \u003cstrong&gt;우연적인 요소\u003c/strong&gt;(선천적 자질, 부모의 사회적·경제적 지위) 개입, 필요는 \u003cstrong&gt;불평등 완화\u003c/strong&gt;지만 \u003cstrong&gt;일할 동기 약화\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 분배 기준과 급여 체계 (40쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;◯◯은행: 근무 연수가 늘면 급여가 오르는 \u003cstrong&gt;호봉제\u003c/strong&gt; → 성과 평가에 따라 급여를 주는 \u003cstrong&gt;성과 연봉제\u003c/strong&gt;로 전환 추진\u003c/li&gt;\n\u003cli&gt;목적: 더 높은 성과를 낸 사람에게 더 많은 보상 → 성과 연봉제의 분배 기준 = \u003cstrong&gt;업적\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 능력에 따른 신입생 선발의 공정성 (샌델, 《공정하다는 착각》, 41쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 제시문 읽고 &amp;#39;능력에 근거한 입시 제도가 공정한가&amp;#39; 모둠 토론 → 자기 입장 서술\u003c/li&gt;\n\u003cli&gt;제시문: 미국 \u003cstrong&gt;SAT\u003c/strong&gt;(대학 입학 자격시험) 같은 능력 기반 입시는 부모의 돈과 상관없이 \u003cstrong&gt;오직 능력과 실력으로\u003c/strong&gt; 입학한다고 여겨 대부분 공정하다고 봄\u003cul&gt;\n\u003cli&gt;그러나 실제로는 \u003cstrong&gt;부유한 가정의 학생일수록 높은 점수\u003c/strong&gt; → 사설 입시 상담사, 무용·음악 개인 지도, 펜싱·골프 등 엘리트 체육, 해외 봉사 활동 주선\u003c/li&gt;\n\u003cli&gt;&amp;quot;\u003cstrong&gt;오직 개인의 능력과 실력으로만 해낸 결과\u003c/strong&gt;라고 할 수 있을까?&amp;quot;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;결론: 능력 자체가 가정 환경 같은 \u003cstrong&gt;우연적인 요소\u003c/strong&gt;의 영향을 받으므로, 능력을 분배 기준으로 삼는 것이 항상 공정하다고 보기는 어려움 (능력 기준의 단점과 연결)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;필요에 따른 분배와 복지 (42쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;날개: \u003cstrong&gt;보편적 복지\u003c/strong&gt;(\u003cstrong&gt;소득 수준에 상관없이 모든 사람\u003c/strong&gt;) vs \u003cstrong&gt;선별적 복지\u003c/strong&gt;(\u003cstrong&gt;소득 수준이 낮거나 혜택이 절실히 필요한 사람\u003c/strong&gt;)\u003c/li&gt;\n\u003cli&gt;결론: 능력, 업적, 필요에는 각각 장단점 → \u003cstrong&gt;어느 하나의 기준만\u003c/strong&gt; 쓰기보다 \u003cstrong&gt;사회적 합의\u003c/strong&gt;를 통해 \u003cstrong&gt;각 상황에 가장 적합한 기준\u003c/strong&gt; 마련\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 노인 지하철 무료 승차 제도 (42쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;만 65세 이상 모든 노인\u003c/strong&gt; 무료 이용 → 사회 참여, 여가·문화생활에 도움 / 급속한 \u003cstrong&gt;고령화\u003c/strong&gt;(노인 인구 비율이 높아지는 것)로 대상자 증가 → 운영사 \u003cstrong&gt;경영난\u003c/strong&gt; → 폐지 주장\u003c/li&gt;\n\u003cli&gt;그래프: 노인 인구 비율은 앞으로 \u003cstrong&gt;계속 증가할 전망\u003c/strong&gt; → 유지 vs 폐지에 대한 \u003cstrong&gt;사회적 고민\u003c/strong&gt; 필요\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 어떤 기준으로 장학금을 분배하는 것이 가장 공정할까? (43쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: ◯◯군 장학 재단 공고(선발 200명)를 보고 분야별 분배 기준과 장단점 정리 → 공정한 분배 비율 정하기\u003c/li&gt;\n\u003cli&gt;자료: 성적 우수 장학금(기준: \u003cstrong&gt;성적\u003c/strong&gt;), 특기자 장학금(기준: \u003cstrong&gt;수상 실적\u003c/strong&gt;, 특별한 기술·기능을 가진 학생), 복지 장학금(기준: \u003cstrong&gt;소득\u003c/strong&gt;, 사회적 취약 계층)\u003c/li&gt;\n\u003cli&gt;결과: 복지 장학금 = \u003cstrong&gt;필요\u003c/strong&gt;에 따른 분배 / 성적·수상 실적 기준은 업적 또는 능력에 따른 분배로 볼 수 있음 (교과서 정답 미제시 — 교과서 확인 필요, 분야별 인원 그래프는 숫자가 뒤섞여 생략)\u003c/li&gt;\n\u003cli&gt;결론: 각 기준의 장단점을 따져 \u003cstrong&gt;비율을 섞어\u003c/strong&gt; 정하는 것이 사회적 합의의 한 예\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2-1. 자유주의적 정의관과 공동체주의적 정의관의 특징 (44~47쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;도입 — 조상이 잘못한 일, 후손이 책임진다? (44쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;미국 노예제 배상 논란 → 반대: 배상 책임은 \u003cstrong&gt;잘못을 한 사람\u003c/strong&gt;에게, 인간은 \u003cstrong&gt;자유롭고 독립된 존재\u003c/strong&gt;로 \u003cstrong&gt;자신이 선택하고 행한 것에 대해서만 책임\u003c/strong&gt; / 찬성: \u003cstrong&gt;독일\u003c/strong&gt;의 유대인 학살 사과·배상, 인간은 \u003cstrong&gt;특정 공동체의 일원\u003c/strong&gt;으로 \u003cstrong&gt;역사적 유산과 책무를 물려받음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;입장 차이는 \u003cstrong&gt;개인과 공동체의 관계\u003c/strong&gt;를 어떻게 보느냐에서 생김\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자유주의적 정의관의 특징 (45쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;자유주의\u003c/strong&gt;: 무엇보다 \u003cstrong&gt;개인의 자유와 권리\u003c/strong&gt;를 중시하는 사상 (인간관·우선순위 세부는 3번 비교표 ④)\u003c/li&gt;\n\u003cli&gt;인간 = \u003cstrong&gt;천부 인권\u003c/strong&gt;을 지닌 존엄한 존재, \u003cstrong&gt;합리적 이성\u003c/strong&gt;에 따라 \u003cstrong&gt;스스로 선택한 삶의 목적\u003c/strong&gt;을 향해 사는 \u003cstrong&gt;독립적 존재\u003c/strong&gt;, \u003cstrong&gt;자신의 선택으로 이루어지는 자아 정체성\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;국가나 사회보다 개인이, 공동선보다 개인선이 우선\u003c/strong&gt; (\u003cstrong&gt;개인선\u003c/strong&gt; = 개인의 이익 또는 개인이 추구하는 가치나 목표) → 국가·사회는 \u003cstrong&gt;수단\u003c/strong&gt;, \u003cstrong&gt;중립적 입장\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;정의 = 자유와 권리를 최대한 누리며 \u003cstrong&gt;개인선을 실현\u003c/strong&gt; / 조상 사례: 후손 책임 \u003cstrong&gt;없음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;제시문 — \u003cstrong&gt;밀\u003c/strong&gt;: &amp;quot;생각과 의견의 자유, 결사의 자유, 각자 개성에 맞게 자기 삶을 설계하고 자기가 좋은 대로 살아갈 자유가 존중되지 않는 사회는 결코 자유로운 사회라고 할 수 없습니다.&amp;quot;\u003cul&gt;\n\u003cli&gt;밀 = 자유주의 사상가, \u003cstrong&gt;타인에게 영향을 미치지 않는 행위\u003c/strong&gt;에 대해서는 \u003cstrong&gt;개인의 절대적 자유\u003c/strong&gt; 주장\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;자료 — 청소년 보호냐, 자유 침해냐: 누리 소통망 기업이 부모가 자녀의 메신저 사용(누구와, 몇 시간)을 관리·감독하는 기능 추가 → 청소년 범죄 예방 vs \u003cstrong&gt;청소년의 자율성과 선택권 침해\u003c/strong&gt; 우려\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;공동체주의적 정의관의 특징 (46쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;공동체주의\u003c/strong&gt;: \u003cstrong&gt;인간의 삶이 공동체에 뿌리\u003c/strong&gt;를 두고 있음을 강조하는 사상\u003c/li&gt;\n\u003cli&gt;인간 = \u003cstrong&gt;공동체와 분리되어 독립적으로 존재하는 개인은 있을 수 없음\u003c/strong&gt;, \u003cstrong&gt;공동체의 덕목을 실천\u003c/strong&gt;하는 존재, \u003cstrong&gt;주어진 사회적 역할을 수행\u003c/strong&gt;하며 자아 정체성 형성\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;개인보다 공동체가, 개인선보다 공동선이 우선\u003c/strong&gt; → 공동체는 \u003cstrong&gt;좋은 삶의 기반\u003c/strong&gt;, 가치·목적의 \u003cstrong&gt;내면화\u003c/strong&gt;, \u003cstrong&gt;책임과 의무\u003c/strong&gt; 이행 장려\u003c/li&gt;\n\u003cli&gt;정의 = \u003cstrong&gt;유대감\u003c/strong&gt;을 바탕으로 \u003cstrong&gt;역할과 의무\u003c/strong&gt;를 다하며 \u003cstrong&gt;공동선 실현\u003c/strong&gt; / 조상 사례: 사회적 책무를 \u003cstrong&gt;공동체의 역사와 전통으로부터 물려받음\u003c/strong&gt; → 후손 책임 \u003cstrong&gt;있음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;제시문 — \u003cstrong&gt;매킨타이어\u003c/strong&gt;: &amp;quot;나는 공동체와 분리된 존재가 아닙니다. 왜냐하면 내 삶의 역사는 항상 내가 나의 정체성을 도출해 내는 \u003cstrong&gt;공동체의 역사 속에 편입\u003c/strong&gt;되어 있기 때문입니다.&amp;quot;\u003cul&gt;\n\u003cli&gt;현대 사회의 분열은 인간을 \u003cstrong&gt;자유롭고 독립적인 존재로만 보는 자유주의적 인간관\u003c/strong&gt;에서 비롯한다고 비판\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;자료 — 님비에 막힌 소각장 건설\u003cul&gt;\n\u003cli&gt;2026년부터 생활 폐기물 바로 매립 금지·\u003cstrong&gt;발생지 처리 원칙\u003c/strong&gt; → ◯◯시 소각장 신설에 주민들이 \u003cstrong&gt;건강권과 재산권 침해\u003c/strong&gt;를 이유로 반대\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;님비(NIMBY) 현상\u003c/strong&gt;: &amp;#39;내 뒷마당에는 안 된다&amp;#39;, 위험·혐오 시설이 자기 지역에 들어서는 것을 강력히 반대하는 현상\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;이천시 소각장\u003c/strong&gt;: 5개 시군 쓰레기 처리, 님비를 극복한 광역화 첫 성공 사례\u003c/li&gt;\n\u003cli&gt;활동: 공동체주의적 정의관에서 님비를 어떻게 볼까? (교과서는 질문만 제시)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 자유주의적 관점과 공동체주의적 관점 탐색하기 (47쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 자료 1(롤스와 노직의 가상 대담)로 두 사람 비교, 자료 2(매킨타이어)로 나의 공동체 정체성 파악\u003c/li&gt;\n\u003cli&gt;자료 1 — \u003cstrong&gt;롤스\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;각자가 \u003cstrong&gt;자신의 사회적 지위, 타고난 신체적·정신적 재능, 심리적 특성이나 가치관 등을 모른다고 가정한 상황\u003c/strong&gt;에서 가장 공정한 정의의 원칙을 만들 수 있음\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;평등한 자유의 원칙\u003c/strong&gt;: 모든 사람은 \u003cstrong&gt;동등한 기본적 자유\u003c/strong&gt;를 최대한 누려야 함\u003c/li&gt;\n\u003cli&gt;사회적·경제적 불평등은 두 조건 충족 시 허용\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;차등의 원칙\u003c/strong&gt;: 사회에서 가장 불리한 처지에 있는 \u003cstrong&gt;최소 수혜자에게 최대의 이익\u003c/strong&gt; 보장\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;기회균등의 원칙\u003c/strong&gt;: 불평등의 계기가 되는 \u003cstrong&gt;직책이나 지위는 모든 사람에게 개방\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;※ &amp;#39;무지의 베일&amp;#39;, &amp;#39;원초적 입장&amp;#39;이라는 용어는 교과서에 나오지 않음 (교과서 확인 필요)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;자료 1 — \u003cstrong&gt;노직\u003c/strong&gt;: 개인의 자유와 권리 보호·존중이 정의(롤스와 \u003cstrong&gt;공통점\u003c/strong&gt;), 특히 \u003cstrong&gt;개인의 소유 권리 최대 보장\u003c/strong&gt; / \u003cstrong&gt;최소 수혜자에게 최대의 이익을 보장해야 한다는 말에는 동의하기 어려움\u003c/strong&gt;(\u003cstrong&gt;차이점\u003c/strong&gt;)\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;정당하게 소유물을 취득하거나 양도받았다면\u003c/strong&gt; 소유 권리를 가짐, 사용은 \u003cstrong&gt;전적으로 개인의 자유로운 선택\u003c/strong&gt; → \u003cstrong&gt;취득의 원칙, 양도의 원칙\u003c/strong&gt;이 지켜지면 \u003cstrong&gt;빈부 격차가 생기는 것은 문제가 되지 않음\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;자료 2 — \u003cstrong&gt;매킨타이어, 《덕의 상실》\u003c/strong&gt;: 자유주의는 공동체·국가를 개인 자유의 \u003cstrong&gt;수단\u003c/strong&gt;으로만 보고 자아가 사회적·역사적 역할과 \u003cstrong&gt;분리될 수 있다\u003c/strong&gt;고 봄 → 그러나 나는 \u003cstrong&gt;가족, 도시, 친족, 민족, 국가\u003c/strong&gt;의 구성원으로서 \u003cstrong&gt;다양한 빚과 유산, 적절한 기대와 의무를 물려받음\u003c/strong&gt; = \u003cstrong&gt;내 도덕의 출발점\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;결론: 롤스·노직은 모두 자유주의(개인의 자유와 권리 중시)지만 \u003cstrong&gt;불평등·분배\u003c/strong&gt;에 대한 생각이 다르고, 매킨타이어는 공동체와 분리될 수 없는 자아를 강조\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2-2. 자유주의적 정의관과 공동체주의적 정의관의 적용 (48~49쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;개인과 공동체의 관계 — 개발 제한 구역 사례 (48쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;두 정의관은 정책·제도·현안에서 \u003cstrong&gt;충돌\u003c/strong&gt; 가능 — 개발 제한 구역 \u003cstrong&gt;반대\u003c/strong&gt;(소수 토지 소유자의 \u003cstrong&gt;재산권 행사 제약\u003c/strong&gt;) vs \u003cstrong&gt;찬성\u003c/strong&gt;(시민단체: \u003cstrong&gt;도시의 허파\u003c/strong&gt;, 해제 시 환경 악화·국토 균형 발전 저해 → \u003cstrong&gt;미래를 위해 보존\u003c/strong&gt;)\u003c/li&gt;\n\u003cli&gt;자유주의적 정의관: 토지 소유자 \u003cstrong&gt;개인의 권리와 사익을 부당하게 침해\u003c/strong&gt; / 공동체주의적 정의관: 구성원은 \u003cstrong&gt;환경을 보호할 의무\u003c/strong&gt; → 정책 필요\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;어느 한쪽만 강조하는 것은 바람직하지 않음\u003c/strong&gt; → 토지 소유자에게 \u003cstrong&gt;적절한 보상\u003c/strong&gt; / \u003cstrong&gt;상호 보완적 관점\u003c/strong&gt;에서 \u003cstrong&gt;개인선을 실현하면서도 공동선을 훼손하지 않는 대안\u003c/strong&gt; 모색\u003c/li&gt;\n\u003cli&gt;날개: 둘 다 \u003cstrong&gt;개인의 행복한 삶과 정의로운 사회를 지향\u003c/strong&gt;한다는 점에서 상호 보완적\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;권리와 의무, 사익과 공익의 조화 (48쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;권리는 의무를 전제로 하고, 의무는 권리를 전제로 한다\u003c/strong&gt; → 권리만 내세우면 누구도 권리를 누릴 수 없고, 의무만 강요하면 자유와 권리를 제대로 누릴 수 없음\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;사익\u003c/strong&gt;만 → 공동체 파괴 → 개인의 권리·이익도 보장 못 받음 / \u003cstrong&gt;공익\u003c/strong&gt;만 → 권리·이익 침해, \u003cstrong&gt;개인의 희생 강요\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;결론: 개인의 권리와 사익을 \u003cstrong&gt;최대한 보장\u003c/strong&gt;하고, 개인은 \u003cstrong&gt;사회적 책무\u003c/strong&gt;를 다하며 \u003cstrong&gt;공익을 지향하는 공동체\u003c/strong&gt;를 만들어야 함\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 상속세, 정당한 납세의 의무일까? (49쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 두 사람의 대화를 자유주의·공동체주의 입장에서 평가 → 상속세가 정당한 의무인지 서술\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;상속세\u003c/strong&gt;: 사망으로 재산이 가족·친족 등에게 \u003cstrong&gt;무상으로 이전\u003c/strong&gt;될 때 상속 재산에 부과하는 세금\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;의진 씨(국민의 의무)\u003c/strong&gt;: 법령에 따른 \u003cstrong&gt;납세의 의무\u003c/strong&gt;, 상속세법(\u003cstrong&gt;1950년\u003c/strong&gt;~)은 \u003cstrong&gt;실질적 평등의 원칙\u003c/strong&gt; 실현 목적, \u003cstrong&gt;영구적인 부의 대물림\u003c/strong&gt;을 막고 \u003cstrong&gt;부의 재분배\u003c/strong&gt;로 불평등 완화, 물려받은 재산은 \u003cstrong&gt;자신이 한 노동의 대가가 아님\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;상연 씨(폐지해야)\u003c/strong&gt;: \u003cstrong&gt;스웨덴 2005년 폐지\u003c/strong&gt; — 상속세가 \u003cstrong&gt;경제 활동 둔화\u003c/strong&gt;·납세 회피, 기업의 \u003cstrong&gt;해외 이전\u003c/strong&gt;으로 일자리 감소 → 폐지 후 \u003cstrong&gt;자본의 국외 유출 감소\u003c/strong&gt;, \u003cstrong&gt;기업 경쟁력 상승\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;결론: 개인의 재산권(사익)을 중시하는지, 공동체 구성원으로서의 의무·불평등 완화(공익)를 중시하는지에 따라 평가가 달라짐 (어느 정의관에 어느 사람을 연결할지는 교과서가 학생 활동으로 남김 — 교과서 확인 필요)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;3-1. 사회 및 공간 불평등 현상 (50~53쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;도입 — 영화 〈기생충〉 (50쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;부유한 동네 \u003cstrong&gt;저택\u003c/strong&gt;의 박 사장네 vs \u003cstrong&gt;끊임없이 아래로 이어진 계단\u003c/strong&gt; 아래 \u003cstrong&gt;반지하 집\u003c/strong&gt;의 기택네 → 폭우에 한쪽은 정원 캠핑, 한쪽은 \u003cstrong&gt;침수\u003c/strong&gt; → 계단은 두 가족의 격차(불평등)를 상징\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;사회 불평등 현상 (51쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;부, 명예, 권력\u003c/strong&gt; 같은 사회적 가치를 모두가 원하는 만큼 가질 수 없음 → \u003cstrong&gt;어느 정도의 불평등은 불가피\u003c/strong&gt;, 그러나 \u003cstrong&gt;정도가 심해지면\u003c/strong&gt; 정의롭다고 할 수 없음\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;사회 불평등\u003c/strong&gt;(날개): \u003cstrong&gt;희소한 자원\u003c/strong&gt;이 개인이나 집단에 \u003cstrong&gt;차등적으로 분배\u003c/strong&gt;되어 구성원들의 위치가 \u003cstrong&gt;서열화\u003c/strong&gt;되어 있는 현상\u003c/li&gt;\n\u003cli&gt;대표적 현상: \u003cstrong&gt;사회 계층의 양극화, 공간 불평등, 사회적 약자에 대한 차별\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;날개 — 김득신, 〈노상알현도〉: 사회 불평등의 역사적 사례 = \u003cstrong&gt;신분 제도\u003c/strong&gt; (조선 시대 소수 특권 계층이 지위와 부를 차지하는 것이 당연시)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;사회 계층의 양극화 (51쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;사회 계층\u003c/strong&gt;: 사회적 자원과 기회가 차등 분배되어 \u003cstrong&gt;비슷한 수준의 사회적 자원을 가진 사람들이 위계적인 층\u003c/strong&gt;을 이룬 것\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;사회 계층의 양극화\u003c/strong&gt;: \u003cstrong&gt;중간 계층의 비중이 줄고 상층과 하층의 비중이 늘어나\u003c/strong&gt; 양극단으로 쏠리는 현상\u003c/li&gt;\n\u003cli&gt;원인: \u003cstrong&gt;재산과 소득 차이에 따른 경제적 격차\u003c/strong&gt; → 교육, 취업, 주거, 여가, 건강 등에 영향 / 문제: 계층 간 \u003cstrong&gt;위화감\u003c/strong&gt;, \u003cstrong&gt;계층 이동이 어려워짐\u003c/strong&gt; → \u003cstrong&gt;계층 간 갈등\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 계층 간 소득 격차 (51쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;2023년 1분기: 소득 하위 20% 가구와 상위 20% 가구의 월평균 소득 격차 \u003cstrong&gt;약 10.7배\u003c/strong&gt;, 소득 5분위 배율 6.45배\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;소득 5분위 배율\u003c/strong&gt; = 균등화 처분 가능 소득 기준 \u003cstrong&gt;상위 20% 평균 소득 ÷ 하위 20% 평균 소득\u003c/strong&gt; → \u003cstrong&gt;높을수록 빈부 격차가 크고 소득 불평등이 심함\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;균등화 처분 가능 소득\u003c/strong&gt; = 직접 번 소득 \u003cstrong&gt;+ 연금 등의 소득 − 세금과 사회 보험료 등의 지출\u003c/strong&gt; (그래프 세부 숫자는 흩어져 생략)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;공간 불평등 (52쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;뜻: \u003cstrong&gt;지역 간에 사회적·경제적·문화적으로 격차\u003c/strong&gt;가 발생하는 현상\u003c/li&gt;\n\u003cli&gt;예: \u003cstrong&gt;선진국과 개발 도상국\u003c/strong&gt;, \u003cstrong&gt;수도권과 비수도권\u003c/strong&gt;, \u003cstrong&gt;도시와 촌락\u003c/strong&gt;, \u003cstrong&gt;도시 지역 내\u003c/strong&gt; 격차\u003c/li&gt;\n\u003cli&gt;원인: 기본적으로 \u003cstrong&gt;자연환경이나 생산 요소\u003c/strong&gt; 등이 지역마다 다르기 때문 + \u003cstrong&gt;어떤 지역 개발 방식\u003c/strong&gt;을 쓰느냐에 따라 심화\u003c/li&gt;\n\u003cli&gt;우리나라: 빠른 경제 성장을 위해 \u003cstrong&gt;수도권과 대도시 중심 성장 거점 개발\u003c/strong&gt;(\u003cstrong&gt;성장 잠재력이 큰 지역을 집중 육성\u003c/strong&gt;, 효과가 \u003cstrong&gt;주변 지역으로 확산\u003c/strong&gt;) → 수도권·대도시는 성장, 그 외 지역은 \u003cstrong&gt;인구 유출·경제 침체\u003c/strong&gt; → 공간 불평등 심화\u003c/li&gt;\n\u003cli&gt;문제: 소득뿐 아니라 \u003cstrong&gt;교육, 의료, 문화\u003c/strong&gt; 등 생활 전반의 불평등 → 지역 격차 심화, \u003cstrong&gt;지역 간 갈등\u003c/strong&gt;, \u003cstrong&gt;사회 통합 저해\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;사회적 약자에 대한 차별 (52쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;사회적 약자\u003c/strong&gt;: 신체적·정치적·경제적·사회적·문화적으로 \u003cstrong&gt;소외\u003c/strong&gt;되어 인간다운 삶을 영위하는 데 어려움을 겪는 개인이나 집단 (예: 장애인, 노인, 빈곤층)\u003c/li&gt;\n\u003cli&gt;날개 — 사회적 약자(\u003cstrong&gt;불리한 위치에 있는 사람 모두\u003c/strong&gt;) vs \u003cstrong&gt;사회적 소수자\u003c/strong&gt;(사회적 약자의 \u003cstrong&gt;부분\u003c/strong&gt;, \u003cstrong&gt;특정한 집단의 성원이라는 이유만으로 차별\u003c/strong&gt;받으며 \u003cstrong&gt;스스로 차별받는 집단에 속해 있다는 의식\u003c/strong&gt;을 가진 사람)\u003c/li&gt;\n\u003cli&gt;차별의 원인: 성별, 나이, 신체적 조건, 국적, 민족, 소득 수준 등에 따른 \u003cstrong&gt;선입견과 편견\u003c/strong&gt;, 사회의 \u003cstrong&gt;주류 집단과 다르다는 비합리적인 이유\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;문제: 인간으로서의 \u003cstrong&gt;존엄성과 기본적인 권리 침해\u003c/strong&gt; → 심각한 사회문제\u003c/li&gt;\n\u003cli&gt;자료 — \u003cstrong&gt;무인 정보 단말기(키오스크)\u003c/strong&gt;: 비용 절감·위생·안전·효율로 확대, 젊은 층에 인기 → 익숙하지 않은 \u003cstrong&gt;노인 계층\u003c/strong&gt;은 불편·두려움 → &amp;quot;과거에는 없던 \u003cstrong&gt;배제와 차별\u003c/strong&gt;이 생긴 것&amp;quot;이라는 비판\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 사회 및 공간 불평등의 사례 조사하기 (53쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 자료 1의 &amp;#39;다중 격차&amp;#39; 개념으로 자료 2의 불평등 설명 → 우리 사회의 사례(소득별 교육비 지출, 지역별 의사 수, 미디어 속 차별 등) 조사·분석\u003c/li&gt;\n\u003cli&gt;자료 1 — \u003cstrong&gt;다중 격차\u003c/strong&gt;: 소득, 자산, 주거, 교육, 문화, 건강 등 \u003cstrong&gt;여러 영역에서 격차가 벌어지는 현상\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;소득 격차 → 자산 불평등 → 주거 불평등 → 교육 불평등 → 대학 진학 → 출신 대학 → 다시 소득 격차 (\u003cstrong&gt;악순환\u003c/strong&gt;)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;자료 2 — 그래프가 말하는 결론 (세부 수치 생략): 농촌 가구 소득 = 도시 근로자 가구 소득의 \u003cstrong&gt;약 64%\u003c/strong&gt; / &amp;#39;보통 학력 이상&amp;#39; 비율은 \u003cstrong&gt;세 과목 모두 대도시 &amp;gt; 읍·면\u003c/strong&gt; / \u003cstrong&gt;부모 소득이 높을수록 자녀의 대학 진학률도 높음\u003c/strong&gt; / \u003cstrong&gt;학력이 높을수록 월평균 임금이 높음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;결론: 한국 사회의 불평등은 단순한 빈부 격차가 아니라 \u003cstrong&gt;여러 영역이 서로 연결된 다중 격차\u003c/strong&gt;로 나타남\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;3-2. 정의로운 사회를 위한 다양한 제도와 실천 방안 (54~59쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;왜 제도가 필요한가 (54쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;능력, 업적에 따른 불평등\u003c/strong&gt;은 일할 동기를 주어 \u003cstrong&gt;사회 발전에 긍정적 역할\u003c/strong&gt;도 함 → 그러나 \u003cstrong&gt;환경적·구조적 원인\u003c/strong&gt;의 불평등이나 \u003cstrong&gt;지나친 편중\u003c/strong&gt;은 능력을 발휘할 \u003cstrong&gt;기회를 없애고\u003c/strong&gt; 갈등 심화 → \u003cstrong&gt;제도적 장치 + 시민들의 실천\u003c/strong&gt; 필요\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;사회 복지 제도 (54쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;사회적 약자를 포함한 \u003cstrong&gt;모든 구성원\u003c/strong&gt;이 기본적인 욕구를 충족하며 \u003cstrong&gt;최소한의 인간다운 삶\u003c/strong&gt;을 살 수 있도록 지원하는 제도 → \u003cstrong&gt;사회 계층의 양극화 완화\u003c/strong&gt;에 도움\u003c/li&gt;\n\u003cli&gt;우리나라: \u003cstrong&gt;사회 보험, 공공 부조, 사회 서비스\u003c/strong&gt; (세부 비교는 3번 비교표)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;자료 — 기초 연금 (54쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;65세 이상 노인 중 가구의 소득 인정액이 선정 기준 이하인 노인\u003c/strong&gt;에게 매월 지급 (모든 노인이 아님), \u003cstrong&gt;노인 빈곤 문제\u003c/strong&gt; 해결 위해 \u003cstrong&gt;2014년\u003c/strong&gt; 도입\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;2020년에 처음으로 노인의 상대적 빈곤율이 30%대로\u003c/strong&gt; 하락 → 기초 연금이 크게 이바지 (그래프: 도입 이후 빈곤율 하락 추세)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;지역 격차 완화 정책 (55쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;뜻: 지역 개발에서 \u003cstrong&gt;소외되었던 지방을 중심으로 균형 개발\u003c/strong&gt; → \u003cstrong&gt;국토의 균형 발전\u003c/strong&gt;, \u003cstrong&gt;성장 거점 개발로 심화된 공간 불평등 완화\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;방법: \u003cstrong&gt;공공 기관 지방 이전\u003c/strong&gt; / 수도권 기업에 \u003cstrong&gt;세금 감면, 규제 완화\u003c/strong&gt; → \u003cstrong&gt;지방 이전 유도\u003c/strong&gt;·일자리 창출 / 지방 자치 단체의 \u003cstrong&gt;지역 특성을 살린 발전 전략\u003c/strong&gt; / 낙후 지역 \u003cstrong&gt;주택 재개발 사업\u003c/strong&gt;, \u003cstrong&gt;주거 환경 개선 사업\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;날개 — \u003cstrong&gt;고향 사랑 기부제\u003c/strong&gt;: 개인이 \u003cstrong&gt;현재 주소지를 제외한\u003c/strong&gt; 원하는 지방 자치 단체에 기부 → \u003cstrong&gt;세금 감면 혜택 + 지역 특산품 답례\u003c/strong&gt; → 지역 경제 활성화, 재정 확충, \u003cstrong&gt;국가 균형 발전\u003c/strong&gt;에 기여\u003c/li&gt;\n\u003cli&gt;자료 — \u003cstrong&gt;공공 기관 지방 이전 정책\u003c/strong&gt;: \u003cstrong&gt;2005년\u003c/strong&gt; 전국 \u003cstrong&gt;10대 혁신 도시\u003c/strong&gt; 지정(이전 기관과 지역 대학·연구소·산업체·지자체가 협력해 \u003cstrong&gt;새로운 성장 동력을 창출\u003c/strong&gt;하는 미래형 도시) → 1차 이전 \u003cstrong&gt;2014년부터\u003c/strong&gt;, \u003cstrong&gt;2019년까지 154개\u003c/strong&gt; 이전\u003cul&gt;\n\u003cli&gt;한계: 여전히 \u003cstrong&gt;40%가 넘는 공공 기관이 수도권\u003c/strong&gt;, 대다수 혁신 도시가 \u003cstrong&gt;계획 인구 목표 달성 실패\u003c/strong&gt; → \u003cstrong&gt;2차 이전\u003c/strong&gt; 추진 예정 (지도 속 지역별 특화 발전 전략·기관 배치는 뒤섞여 교과서 확인 필요)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;사진 — \u003cstrong&gt;세종특별자치시\u003c/strong&gt;: 수도권 과밀화 해소와 국토 균형 발전을 위해 \u003cstrong&gt;2012년 행정 중심 복합 도시\u003c/strong&gt;로 출범, 서울의 여러 정부 기관 이전\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;적극적 평등 실현 조치 (56쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;뜻: \u003cstrong&gt;오랫동안 사회적으로 차별받아 온 사회적 약자에게 직간접적으로 혜택\u003c/strong&gt;을 주는 정책 → 취업·입학 등에서 우대해 \u003cstrong&gt;실질적인 기회의 평등\u003c/strong&gt; 보장\u003c/li&gt;\n\u003cli&gt;예: \u003cstrong&gt;장애인 의무 고용 제도\u003c/strong&gt;(관공서·기업이 장애인을 \u003cstrong&gt;일정 비율 이상\u003c/strong&gt; 고용), \u003cstrong&gt;여성 할당제\u003c/strong&gt;(국회 의원 \u003cstrong&gt;비례 대표 후보자\u003c/strong&gt; 추천 시 일정 비율을 여성에게 배분)\u003c/li&gt;\n\u003cli&gt;주의: \u003cstrong&gt;역차별\u003c/strong&gt;(차별 시정 장치가 \u003cstrong&gt;너무 강하여 도리어 반대편이 차별받게 되는 경우\u003c/strong&gt;) → \u003cstrong&gt;사회적 합의\u003c/strong&gt; 필요\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;정의로운 사회를 위한 시민으로서의 실천 방안 (56쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;불평등 현상에 \u003cstrong&gt;관심\u003c/strong&gt; → 사회적 노력이 적절한지 \u003cstrong&gt;살펴보기\u003c/strong&gt; / \u003cstrong&gt;선입견·편견에서 벗어나\u003c/strong&gt; 모두를 \u003cstrong&gt;존중\u003c/strong&gt; / 약자의 고통에 \u003cstrong&gt;공감·배려\u003c/strong&gt; / \u003cstrong&gt;기부, 캠페인, 봉사 활동\u003c/strong&gt; → 약자의 \u003cstrong&gt;자립\u003c/strong&gt; 지원\u003c/li&gt;\n\u003cli&gt;사진 — \u003cstrong&gt;한국 해비타트\u003c/strong&gt;: 열악한 주거 환경의 저소득층·소외 계층의 집과 시설을 고치는 자원봉사\u003c/li&gt;\n\u003cli&gt;자료 — \u003cstrong&gt;싱어\u003c/strong&gt;(현대 실천 윤리학자, \u003cstrong&gt;최대 다수의 최대 행복의 원리\u003c/strong&gt;를 추구하는 \u003cstrong&gt;공리주의자\u003c/strong&gt;), 《물에 빠진 아이 구하기》: \u003cstrong&gt;세계시민의 한 사람\u003c/strong&gt;으로서 빈곤·기아·질병으로 고통받는 지구촌 사람들을 \u003cstrong&gt;돕는 것은 의무\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;적은 돈의 기부\u003c/strong&gt;로 한 아이의 생명을 구할 수 있는데, 필요 없는 일(음료수, 외식, 옷, 여행 등)에 돈을 쓰면서 기부하지 않는 것은 \u003cstrong&gt;구할 수 있는 아이를 죽게 내버려 두는 것\u003c/strong&gt; 아닌가?\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 사회적 약자 배려와 사회 불평등 극복을 위한 실천 (57쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 자료 1로 장애인 의무 고용 제도의 의의·한계 토론 → 자료 2를 참고해 실천 방안 제안\u003c/li&gt;\n\u003cli&gt;자료 1 — \u003cstrong&gt;장애인 의무 고용 제도\u003c/strong&gt;: 국가, 지방 자치 단체, \u003cstrong&gt;50명 이상\u003c/strong&gt; 근로자가 있는 공공 기관·민간 기업 사업주 대상, 민간 기업은 전체 근로자의 \u003cstrong&gt;3.1%\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;의의\u003c/strong&gt;: 일하고 사회 발전에 이바지할 기회 → 삶을 스스로 주도, 사회와 소통, \u003cstrong&gt;경제적 자립\u003c/strong&gt;, 삶의 질 향상\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;한계\u003c/strong&gt;: \u003cstrong&gt;기업 규모와 상관없이 같은 의무 고용 비율\u003c/strong&gt; → 대기업은 더 많이 고용해도 \u003cstrong&gt;매번 의무 고용률에 미달\u003c/strong&gt;, 불만이 큼\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;자료 2 — \u003cstrong&gt;계단 뿌셔 클럽\u003c/strong&gt;: 도시의 계단 정보를 모아 **&amp;#39;계단 정복 지도&amp;#39;**를 만드는 \u003cstrong&gt;비영리 단체\u003c/strong&gt;(2021년 시작) → 휠체어·유아차 사용자 등 \u003cstrong&gt;이동 약자\u003c/strong&gt;의 편리한 이동, \u003cstrong&gt;시민이 직접 참여\u003c/strong&gt;해 만든다는 데 의의\u003c/li&gt;\n\u003cli&gt;결론: 제도(의무 고용)는 의의와 한계가 함께 있고, 시민의 \u003cstrong&gt;자발적 참여\u003c/strong&gt;도 불평등 완화에 기여\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;단원 토론 — 소수 집단 우대 정책에 따른 신입생 선발은 공정한가? (58~59쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;사례(샌델, 《정의란 무엇인가》): 백인 \u003cstrong&gt;셰릴 홉우드\u003c/strong&gt;(홀어머니 밑에서 일하며 학교 다님)가 성적이 우수한데도 \u003cstrong&gt;텍사스 법학 전문 대학원\u003c/strong&gt; 불합격 → 대학은 \u003cstrong&gt;소수 집단 우대 정책\u003c/strong&gt;(사회적 소수자 가산점)으로 입학생의 **약 15%**를 소수 집단에서 선발 → 홉우드가 연방 법원에 소송\u003cul&gt;\n\u003cli&gt;대학의 입장: \u003cstrong&gt;인종적·민족적 다양성\u003c/strong&gt;이 사명, 소수 집단 학생이 공직·전문직에 진출하면 \u003cstrong&gt;지역 발전과 공동선\u003c/strong&gt;에 이바지\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;찬성 근거: 소수 집단 학생도 대부분 졸업·변호사 시험 합격 / 주민의 40%가 흑인·멕시코계인데 법조계엔 훨씬 적음 / 과거 \u003cstrong&gt;차별이 현재까지 영향 → 보상\u003c/strong&gt; / \u003cstrong&gt;문화적 다양성\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;반대 근거: \u003cstrong&gt;입학 기준이 불공정\u003c/strong&gt; / \u003cstrong&gt;백인 지원자의 권리 침해\u003c/strong&gt; / 현재의 소수 집단·백인 모두 차별의 \u003cstrong&gt;당사자가 아님\u003c/strong&gt; / 소수 집단 학생의 \u003cstrong&gt;자부심에 상처\u003c/strong&gt;, 백인 학생은 \u003cstrong&gt;차별받았다고 생각\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;과정: 찬반 모둠 주장 → 반론 → 재반론 → 결론(4단계) → 나의 입장 정리\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;단원 퀴즈·단원 마무리 (60~61쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;단원 퀴즈(60쪽)\u003c/strong&gt;: 공동체에 뿌리를 둔 삶 강조 = \u003cstrong&gt;공동체주의\u003c/strong&gt;(자유주의 아님), 공동선보다 개인선 우선 = \u003cstrong&gt;자유주의\u003c/strong&gt;, 고향 사랑 기부제 = 지역 격차 완화 정책, 기초 연금·국민 건강 보험·노인 돌봄 서비스·국민 기초 생활 보장 제도 = \u003cstrong&gt;모두 사회 복지 제도\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;단원 마무리(61쪽) — 공유지의 비극\u003c/strong&gt;: 미국 생물학자 \u003cstrong&gt;개릿 하딘\u003c/strong&gt;의 개념, \u003cstrong&gt;모두가 함께 사용해야 할 자원\u003c/strong&gt;(지하자원, 초원, 공기, 바다의 물고기)을 마구잡이로 써서 \u003cstrong&gt;고갈될 위험\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;소 100마리용 공유지에 목동마다 소를 더 풀어 → \u003cstrong&gt;황무지\u003c/strong&gt; → 핵심 메시지: \u003cstrong&gt;사익의 극대화가 공익에 악영향\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;해결 방안(장단점은 학생 활동): 가 \u003cstrong&gt;개인 소유\u003c/strong&gt;·자율 관리 / 나 \u003cstrong&gt;정부\u003c/strong&gt;가 적정 수를 정하고 \u003cstrong&gt;벌금\u003c/strong&gt; / 다 사용자들의 \u003cstrong&gt;자발적 합의\u003c/strong&gt; → \u003cstrong&gt;사익과 공익의 조화\u003c/strong&gt; 관점에서 사례 해결 방안 제안\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 헷갈리는 것 비교표&quot;,&quot;html&quot;:&quot;\u003ch3&gt;① 정의의 구분 (본문 + 아리스토텔레스)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;뜻 (교과서 표현)\u003c/th&gt;\n\u003cth&gt;핵심 단서\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;분배적 정의\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;사회적 가치를 \u003cstrong&gt;마땅히 받을 만한 사람이 받게\u003c/strong&gt; 해 각자가 자신의 몫을 누리게 함 (아리스토텔레스: \u003cstrong&gt;각자의 가치에 따라 권력, 명예, 재화를 분배\u003c/strong&gt;)\u003c/td&gt;\n\u003ctd&gt;몫, 분배\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;교정적 정의\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;잘못을 \u003cstrong&gt;처벌\u003c/strong&gt;해 부정의한 상태를 정의로운 상태로 되돌림 (아리스토텔레스: 해를 끼치면 그만큼 보상, \u003cstrong&gt;동등하지 않음을 바로잡음\u003c/strong&gt;)\u003c/td&gt;\n\u003ctd&gt;처벌, 잘못과 처벌의 \u003cstrong&gt;적정한 균형\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;교환적 정의 (아리스토텔레스)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;같은 가치를 지닌 두 물건을 교환\u003c/strong&gt; → 교환 결과를 공정하게\u003c/td&gt;\n\u003ctd&gt;교환\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;일반적 정의 (아리스토텔레스)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;법을 준수\u003c/strong&gt;하는 것\u003c/td&gt;\n\u003ctd&gt;법을 지키는 사람 = 정의로운 사람\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;※ 아리스토텔레스: 정의 = 일반적 정의 + 특수적 정의(교정적·분배적·교환적). &amp;#39;절차적 정의&amp;#39;는 교과서 본문에 없음.\u003c/p&gt;\n\u003ch3&gt;② 분배적 정의의 실질적 기준 (필수)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;기준\u003c/th&gt;\n\u003cth&gt;뜻\u003c/th&gt;\n\u003cth&gt;교과서 예\u003c/th&gt;\n\u003cth&gt;장점\u003c/th&gt;\n\u003cth&gt;단점\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;업적\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;성과와 실적\u003c/strong&gt;에 따라\u003c/td&gt;\n\u003ctd&gt;성과를 낸 사람에게 더 많은 보수, \u003cstrong&gt;성과 연봉제\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;객관적 평가·측정이 비교적 쉬움\u003c/strong&gt;, 노력 동기 → 사회 발전\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;다른 종류의 업적 비교 어려움\u003c/strong&gt;, \u003cstrong&gt;사회적 약자 배려 어려움\u003c/strong&gt;, 경쟁 과열 → 갈등·비인간적 사회\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;능력\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;육체적·정신적 능력\u003c/strong&gt;에 따라\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;전문 자격증\u003c/strong&gt; 소지자 우대, SAT 입시\u003c/td&gt;\n\u003ctd&gt;능력 개발 동기 → 개인·사회 발전\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;선천적 자질, 부모의 사회적·경제적 지위 등 우연적 요소\u003c/strong&gt; 개입, \u003cstrong&gt;객관적 평가 기준\u003c/strong&gt; 세우기 어려움\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;필요\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;인간다운 삶을 위한 기본적인 욕구\u003c/strong&gt; 충족\u003c/td&gt;\n\u003ctd&gt;생계비·의료비 복지 지원, 복지 장학금\u003c/td&gt;\n\u003ctd&gt;최소한의 인간다운 삶 보장, \u003cstrong&gt;사회적 불평등 완화\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;자원 한정 → 모든 필요 충족 어려움, \u003cstrong&gt;어느 수준까지\u003c/strong&gt; 충족할지 결정 어려움, \u003cstrong&gt;일할 동기 약화 → 효율성 저하\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;→ 어느 하나만 쓰지 말고 \u003cstrong&gt;사회적 합의\u003c/strong&gt;로 상황에 맞는 기준 마련\u003c/p&gt;\n\u003ch3&gt;③ 보편적 복지 vs 선별적 복지\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;보편적 복지\u003c/th&gt;\n\u003cth&gt;선별적 복지\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;대상\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;소득 수준에 상관없이 모든 사람\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;소득 수준이 낮거나 혜택이 절실히 필요한 사람\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;교과서 관련 사례\u003c/td&gt;\n\u003ctd&gt;만 65세 이상 \u003cstrong&gt;모든 노인\u003c/strong&gt; 지하철 무료 승차 (연령 기준)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;기초 연금\u003c/strong&gt;(소득 인정액이 선정 기준 이하인 노인만)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;※ 두 사례를 보편적·선별적 복지로 직접 분류한 문장은 교과서에 없음 — 대상 조건을 보고 판단한 것 (교과서 확인 필요)\u003c/p&gt;\n\u003ch3&gt;④ 자유주의 vs 공동체주의 정의관 (필수)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;자유주의적 정의관\u003c/th&gt;\n\u003cth&gt;공동체주의적 정의관\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;중시하는 것\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;개인의 자유와 권리\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;공동체\u003c/strong&gt;, 인간의 삶이 \u003cstrong&gt;공동체에 뿌리\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;인간관\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;천부 인권\u003c/strong&gt;, \u003cstrong&gt;합리적 이성\u003c/strong&gt;으로 스스로 선택한 목적을 향해 사는 \u003cstrong&gt;독립적 존재\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;공동체와 \u003cstrong&gt;분리된 개인은 있을 수 없음\u003c/strong&gt;, 공동체의 \u003cstrong&gt;덕목을 실천\u003c/strong&gt;하는 존재\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;자아 정체성\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;자신의 선택\u003c/strong&gt;으로 이루어짐\u003c/td&gt;\n\u003ctd&gt;주어진 \u003cstrong&gt;사회적 역할 수행\u003c/strong&gt;으로 형성\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;우선순위\u003c/td&gt;\n\u003ctd&gt;국가·사회 &amp;lt; 개인, \u003cstrong&gt;공동선 &amp;lt; 개인선\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;개인 &amp;lt; 공동체, \u003cstrong&gt;개인선 &amp;lt; 공동선\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;국가·공동체의 역할\u003c/td&gt;\n\u003ctd&gt;개인의 자유·권리를 보호·증진하는 \u003cstrong&gt;수단\u003c/strong&gt;, \u003cstrong&gt;중립적 입장\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;좋은 삶의 기반\u003c/strong&gt;, 가치·목적의 \u003cstrong&gt;내면화\u003c/strong&gt;와 책임·의무 이행 장려\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;정의로운 것\u003c/td&gt;\n\u003ctd&gt;자유와 권리를 최대한 누리며 \u003cstrong&gt;개인선 실현\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;유대감\u003c/strong&gt; 바탕으로 역할과 의무를 다하며 \u003cstrong&gt;공동선 실현\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;조상의 잘못(노예제)\u003c/td&gt;\n\u003ctd&gt;후손 책임 \u003cstrong&gt;없음\u003c/strong&gt; (조상 행위와 무관)\u003c/td&gt;\n\u003ctd&gt;후손 책임 \u003cstrong&gt;있음\u003c/strong&gt; (공동체의 역사·전통에서 책무를 물려받음)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;개발 제한 구역\u003c/td&gt;\n\u003ctd&gt;토지 소유자의 \u003cstrong&gt;권리와 사익 부당 침해\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;구성원은 \u003cstrong&gt;환경을 보호할 의무\u003c/strong&gt; → 정책 필요\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;사상가\u003c/td&gt;\n\u003ctd&gt;밀, 롤스, 노직\u003c/td&gt;\n\u003ctd&gt;매킨타이어\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;→ 공통점: 둘 다 \u003cstrong&gt;개인의 행복한 삶과 정의로운 사회\u003c/strong&gt;를 지향 → \u003cstrong&gt;상호 보완적\u003c/strong&gt;\u003c/p&gt;\n\u003ch3&gt;⑤ 사상가별 주장 비교표 (필수 — 제시문 단서 암기)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;사상가\u003c/th&gt;\n\u003cth&gt;입장\u003c/th&gt;\n\u003cth&gt;핵심 주장\u003c/th&gt;\n\u003cth&gt;키워드\u003c/th&gt;\n\u003cth&gt;교과서 제시문 단서\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;아리스토텔레스\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;정의의 구분\u003c/td&gt;\n\u003ctd&gt;정의 = 일반적 정의 + 특수적 정의(교정적·분배적·교환적)\u003c/td&gt;\n\u003ctd&gt;《니코마코스 윤리학》\u003c/td&gt;\n\u003ctd&gt;&amp;quot;법을 지키는 사람은 정의로운 사람&amp;quot;, &amp;quot;각자의 가치에 따라 권력, 명예, 재화를 분배&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;롤스\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;자유주의\u003c/td&gt;\n\u003ctd&gt;사회 제도의 제1덕목은 정의 / 평등한 자유의 원칙, 차등의 원칙, 기회균등의 원칙\u003c/td&gt;\n\u003ctd&gt;《정의론》, \u003cstrong&gt;최소 수혜자\u003c/strong&gt;, 기본적 자유\u003c/td&gt;\n\u003ctd&gt;&amp;quot;사상 체계의 제1덕목을 진리라고 한다면…&amp;quot;, &amp;quot;사회적 지위, 타고난 재능…을 모른다고 가정한 상황&amp;quot;, &amp;quot;최소 수혜자에게 최대의 이익&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;노직\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;자유주의\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;개인의 소유 권리\u003c/strong&gt; 최대 보장, 정당한 취득·양도 시 소유 권리\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;취득의 원칙, 양도의 원칙\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;&amp;quot;최소 수혜자에게 최대의 이익을 보장해야 한다는 말에는 동의하기 어렵습니다&amp;quot;, &amp;quot;빈부 격차가 생기는 것은 문제가 되지 않습니다&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;밀\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;자유주의\u003c/td&gt;\n\u003ctd&gt;타인에게 영향을 미치지 않는 행위에 대한 \u003cstrong&gt;개인의 절대적 자유\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;생각·의견·결사의 자유\u003c/td&gt;\n\u003ctd&gt;&amp;quot;자기가 좋은 대로 살아갈 자유가 존중되지 않는 사회는 결코 자유로운 사회라고 할 수 없습니다&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;매킨타이어\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;공동체주의\u003c/td&gt;\n\u003ctd&gt;자아는 공동체와 분리 불가, 현대 사회 분열은 \u003cstrong&gt;자유주의적 인간관\u003c/strong&gt; 탓\u003c/td&gt;\n\u003ctd&gt;《덕의 상실》, 빚과 유산, 기대와 의무\u003c/td&gt;\n\u003ctd&gt;&amp;quot;나는 공동체와 분리된 존재가 아닙니다&amp;quot;, &amp;quot;공동체의 역사 속에 편입&amp;quot;, &amp;quot;내 도덕의 출발점&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;칸트\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;사형 찬성 (교정적 정의)\u003c/td&gt;\n\u003ctd&gt;형벌은 \u003cstrong&gt;오직 범죄를 저질렀기 때문에\u003c/strong&gt;, \u003cstrong&gt;동등성의 원리\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;동등한 형벌\u003c/td&gt;\n\u003ctd&gt;&amp;quot;살인을 한 사람은 사형에 처해져야만 합니다&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;베카리아\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;사형 반대\u003c/td&gt;\n\u003ctd&gt;형벌의 목적 = 해악 \u003cstrong&gt;방지·억제\u003c/strong&gt;(예방), 사형은 예방 효과 어려움\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;종신 노역형\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;&amp;quot;사형은 유용하지도 않고 필요하지도 않은 형벌입니다&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;샌델\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;(교과서에 입장 분류 없음)\u003c/td&gt;\n\u003ctd&gt;능력 기반 입시의 공정성에 의문 / 홉우드 사례로 우대 정책 논쟁 소개\u003c/td&gt;\n\u003ctd&gt;《공정하다는 착각》, 《정의란 무엇인가》, SAT\u003c/td&gt;\n\u003ctd&gt;&amp;quot;오직 개인의 능력과 실력으로만 해낸 결과라고 할 수 있을까?&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;싱어\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;공리주의\u003c/td&gt;\n\u003ctd&gt;세계시민으로서 고통받는 지구촌 사람을 \u003cstrong&gt;돕는 것은 의무\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;최대 다수의 최대 행복, 기부\u003c/td&gt;\n\u003ctd&gt;《물에 빠진 아이 구하기》, &amp;quot;구할 수 있는 아이를 죽게 내버려 두고 있지는 않은가?&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;하딘\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;(단원 마무리)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;공유지의 비극\u003c/strong&gt; → 사익의 극대화가 공익에 악영향\u003c/td&gt;\n\u003ctd&gt;공유지, 고갈\u003c/td&gt;\n\u003ctd&gt;&amp;quot;100마리의 소를 기를 수 있는 공유지&amp;quot;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑥ 사회 복지 제도 비교표 (필수, 교과서 54쪽)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;사회 보험\u003c/th&gt;\n\u003cth&gt;공공 부조\u003c/th&gt;\n\u003cth&gt;사회 서비스\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;뜻\u003c/td&gt;\n\u003ctd&gt;사회적 위험을 \u003cstrong&gt;보험 방식으로 사전에 대처\u003c/strong&gt;해 국민의 건강과 생활 보전 보장\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;국가와 지방 자치 단체의 책임하에\u003c/strong&gt; 생활 유지 능력이 없거나 어려운 국민의 \u003cstrong&gt;최저 생활 보장 및 자립\u003c/strong&gt; 지원\u003c/td&gt;\n\u003ctd&gt;도움이 필요한 모든 국민에게 \u003cstrong&gt;상담, 재활, 돌봄, 복지 시설 이용, 사회 참여 지원\u003c/strong&gt; 등 제공\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;비용·책임\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;일정 수준의 소득이 있는 개인과 정부, 사업주가 보험료 분담\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;국가·지방 자치 단체 책임\u003c/td&gt;\n\u003ctd&gt;(교과서 확인 필요)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;대표 사례\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;국민연금, 국민 건강 보험, 고용 보험, 산업 재해 보상 보험\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;국민 기초 생활 보장 제도, 기초 연금, 의료 급여\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;노인 돌봄 서비스, 장애인 활동 지원, 가사·간병 서비스\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;※ 헷갈림 주의: \u003cstrong&gt;국민연금 = 사회 보험\u003c/strong&gt;, \u003cstrong&gt;기초 연금 = 공공 부조\u003c/strong&gt;\u003c/p&gt;\n\u003ch3&gt;⑦ 사회적 약자 vs 사회적 소수자\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;사회적 약자\u003c/th&gt;\n\u003cth&gt;사회적 소수자\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;범위\u003c/td&gt;\n\u003ctd&gt;사회적으로 \u003cstrong&gt;불리한 위치에 있는 사람 모두\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;사회적 약자의 \u003cstrong&gt;부분\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;뜻\u003c/td&gt;\n\u003ctd&gt;신체적·정치적·경제적·사회적·문화적으로 \u003cstrong&gt;소외\u003c/strong&gt;되어 인간다운 삶이 어려운 개인·집단\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;특정 집단의 성원이라는 이유만으로 차별\u003c/strong&gt;받고 \u003cstrong&gt;스스로 차별받는 집단에 속한다는 의식\u003c/strong&gt;을 가진 사람\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;예\u003c/td&gt;\n\u003ctd&gt;장애인, 노인, 빈곤층\u003c/td&gt;\n\u003ctd&gt;(교과서 이 단원에 예시 없음)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑧ 불평등 현상 ↔ 해결 제도 연결\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;불평등 현상\u003c/th&gt;\n\u003cth&gt;핵심\u003c/th&gt;\n\u003cth&gt;주로 연결되는 해결 방안\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;사회 계층의 양극화\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;중간 계층 감소\u003c/strong&gt;, 상층·하층 증가 / 원인 = 경제적 격차\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;사회 복지 제도\u003c/strong&gt; (양극화 완화에 도움)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;공간 불평등\u003c/td&gt;\n\u003ctd&gt;지역 간 사회적·경제적·문화적 격차 / \u003cstrong&gt;성장 거점 개발\u003c/strong&gt;로 심화\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;지역 격차 완화 정책\u003c/strong&gt; (공공 기관 이전, 고향 사랑 기부제, 재개발 등)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;사회적 약자에 대한 차별\u003c/td&gt;\n\u003ctd&gt;선입견·편견, 주류와 다르다는 비합리적 이유\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;적극적 평등 실현 조치\u003c/strong&gt; (장애인 의무 고용, 여성 할당제) + 시민의 실천\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;⑨ 성장 거점 개발 vs 지역 격차 완화 정책\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;성장 거점 개발\u003c/th&gt;\n\u003cth&gt;지역 격차 완화 정책\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;방식\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;성장 잠재력이 큰 지역 집중 육성\u003c/strong&gt; → 효과가 주변으로 확산\u003c/td&gt;\n\u003ctd&gt;소외된 \u003cstrong&gt;지방 중심 균형 개발\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;목적·결과\u003c/td&gt;\n\u003ctd&gt;빠른 경제 성장 / 수도권·대도시 성장, 그 외 지역 인구 유출 → \u003cstrong&gt;공간 불평등 심화\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;국토의 균형 발전\u003c/strong&gt;, 공간 불평등 완화\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 외울 것 체크리스트&quot;,&quot;html&quot;:&quot;\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 정의 = 인간이 지켜야 할 올바른 도리 / 사회를 구성하고 유지하는 공정한 도리\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 분배적 정의 = 마땅히 받을 만한 사람이 받게 / 교정적 정의 = 처벌로 부정의한 상태를 되돌림\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 공정한 처벌 = 법에 근거 + 공정한 법 + 잘못과 처벌의 적정한 균형\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 아리스토텔레스: 일반적 정의(법 준수) + 특수적 정의(교정적·분배적·교환적)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 정의가 필요한 이유 = 인간 존엄성 보장 + 사회 통합(공동선 추구)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 롤스: 사회 제도의 제1덕목은 정의, 전체 복지를 이유로도 침해할 수 없는 기본적 권리\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 칸트 = 동등성의 원리, 살인자는 사형 / 베카리아 = 예방 효과 없음, 종신 노역형\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 분배의 실질적 기준 3가지 = 업적, 능력, 필요\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 업적 = 성과·실적, 측정 쉬움 / 다른 업적 비교 어렵고 약자 배려 어려움\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 능력 = 육체적·정신적 능력 / 우연적 요소(선천적 자질, 부모 지위) 개입\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 필요 = 기본적 욕구 충족, 불평등 완화 / 자원 한정, 일할 동기 약화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 성과 연봉제 = 업적 기준 / 샌델: 능력 기반 입시도 부유층에 유리\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 보편적 복지 = 소득 무관 모두 / 선별적 복지 = 소득 낮거나 절실한 사람\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 자유주의 = 개인선 우선, 국가는 중립적 수단 / 공동체주의 = 공동선 우선, 공동체는 좋은 삶의 기반\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 개인선 = 개인의 이익·가치·목표 / 공동선 = 공동의 이익, 공동체가 추구하는 가치·목표\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 롤스 3원칙 = 평등한 자유의 원칙, 차등의 원칙(최소 수혜자 최대 이익), 기회균등의 원칙\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 노직 = 소유 권리, 취득·양도의 원칙 지키면 빈부 격차 문제없음\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 밀 = 타인에게 영향 없는 행위에 절대적 자유 / 매킨타이어 = 공동체의 역사 속에 편입된 자아\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 권리는 의무를, 의무는 권리를 전제 → 권리·의무, 사익·공익의 조화\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 사회 불평등 3현상 = 사회 계층의 양극화, 공간 불평등, 사회적 약자에 대한 차별\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 양극화 = 중간 계층 감소, 상층·하층 증가 / 원인 = 재산·소득의 경제적 격차\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 소득 5분위 배율 = 상위 20% ÷ 하위 20%, 높을수록 불평등 심함\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 공간 불평등은 성장 거점 개발로 심화, 다중 격차 = 여러 영역의 격차가 연결\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 사회 복지 제도 = 사회 보험(보험료 분담) · 공공 부조(국가·지자체 책임, 최저 생활) · 사회 서비스(상담·재활·돌봄)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 기초 연금 = 2014년 도입, 65세 이상 중 소득 인정액 기준 이하 노인\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 지역 격차 완화 = 공공 기관 지방 이전(2005년 10대 혁신 도시), 기업 지방 이전 혜택, 고향 사랑 기부제, 재개발\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 세종특별자치시 = 2012년 행정 중심 복합 도시\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 적극적 평등 실현 조치 = 차별받아 온 약자에게 혜택 → 실질적 기회의 평등 (장애인 의무 고용, 여성 할당제), 주의점 = 역차별\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 장애인 의무 고용 = 50명 이상 사업장, 민간 기업 3.1%, 한계 = 기업 규모와 관계없이 같은 비율\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 싱어 = 공리주의, 지구촌 사람 돕는 것은 의무 / 하딘 = 공유지의 비극(사익 극대화 → 공익 악영향)\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;5. 예상 문제 (15문항)&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;1. 정의에 대한 설명으로 옳지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;① 정의는 일반적으로 인간이 지켜야 할 올바른 도리 또는 사회를 구성하고 유지하는 공정한 도리를 의미한다.\n② 분배적 정의는 사회적 가치를 마땅히 받을 만한 사람이 받게 하여 각자가 자신의 몫을 누리게 하는 것이다.\n③ 교정적 정의에서는 잘못의 크기와 관계없이 모든 잘못에 똑같은 처벌을 해야 공정하다고 본다.\n④ 처벌이 공정하려면 법을 근거로 처벌해야 하고 그 법이 공정해야 한다.\n⑤ 사회가 정의롭지 못하면 사회적 가치가 힘 있는 일부 집단에 편중될 수 있다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2. 다음 글의 사상가에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;정의는 일반적 정의와 특수적 정의로 구분되며, 특수적 정의는 다시 교정적 정의, 분배적 정의, 교환적 정의로 나뉜다. 법을 지키는 사람은 정의로운 사람이고 법을 지키지 않는 사람은 부정의한 사람이다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 일반적 정의는 법을 준수하는 것이라고 본다.\nㄴ. 분배적 정의는 같은 가치를 지닌 두 물건을 교환하게 하는 것이라고 본다.\nㄷ. 교정적 정의는 다른 사람에게 해를 끼치면 그만큼 보상하게 하여 동등하지 않음을 바로잡는 것이라고 본다.\nㄹ. 분배적 정의는 각자의 가치에 따라 권력, 명예, 재화를 분배하는 것이라고 본다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄱ, ㄷ　③ ㄴ, ㄹ　④ ㄴ, ㄷ, ㄹ　⑤ ㄱ, ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3. 사형 제도에 대한 갑, 을의 입장으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;갑: 형벌은 범죄자 자신이나 사회의 다른 선을 촉진하기 위해 가해지는 것이 아니라 오직 범죄를 저질렀기 때문에 가해진다. 동등성의 원리에 따라 살인을 한 사람은 사형에 처해져야만 한다.\n을: 형벌의 목적은 범죄자가 해악을 입힐 가능성을 방지하고 시민들이 유사한 행위를 할 가능성을 억제하는 것이다. 사형은 유용하지도 않고 필요하지도 않은 형벌이다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 갑은 범죄와 동등한 형벌이 가해져야 한다고 본다.\n② 갑은 종신 노역형이 사형보다 범죄 예방에 효과적이라고 본다.\n③ 을은 형벌이 오직 범죄를 저질렀기 때문에 가해진다고 본다.\n④ 을은 사형을 통해 범죄 예방 효과를 충분히 기대할 수 있다고 본다.\n⑤ 갑, 을 모두 사형 제도가 필요하다고 본다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4. 표는 분배적 정의의 실질적 기준 A~C를 나타낸 것이다. 이에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;A\u003c/th&gt;\n\u003cth&gt;B\u003c/th&gt;\n\u003cth&gt;C\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;성과와 실적에 따라 분배\u003c/td&gt;\n\u003ctd&gt;육체적·정신적 능력에 따라 분배\u003c/td&gt;\n\u003ctd&gt;인간다운 삶을 위한 기본적인 욕구를 충족하도록 분배\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;① A는 선천적 자질이나 부모의 사회적·경제적 지위 등 우연적인 요소가 개입된다는 단점이 있다.\n② B는 객관적으로 평가하고 측정하기가 비교적 쉽다는 장점이 있다.\n③ C는 열심히 일하려는 동기를 강화하여 경제적 효율성을 높인다.\n④ A는 서로 다른 종류의 업적을 비교하기 어렵고 사회적 약자를 배려하기 어렵다.\n⑤ 교과서는 C 하나의 기준만 사용하는 것이 가장 공정하다고 본다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5. 다음 사례에 나타난 분배 기준에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;◯◯은행은 근무 연수가 늘어나면 급여가 올라가는 호봉제에서 성과 평가에 따라 급여를 주는 성과 연봉제로 급여 체계를 전환하는 방안을 추진 중이다. 더 높은 성과를 낸 사람에게 더 많은 보상을 하는 것이 목적이다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 인간다운 삶을 위한 기본적인 욕구 충족을 가장 중시한다.\n② 열심히 노력하려는 동기를 제공하여 사회 발전에 이바지할 수 있다.\n③ 사회적 약자를 배려하기 쉽다는 장점이 있다.\n④ 어느 수준의 필요까지 충족해야 할지 결정하기 어렵다는 것이 대표적 단점이다.\n⑤ 전문 자격증을 가진 사람을 능력이 더 낫다고 보고 우대하는 것과 같은 기준이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6. 다음 글의 글쓴이가 제기하는 문제의식으로 가장 적절한 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;능력에 근거한 입시 제도에서는 부모가 가진 돈과 상관없이 오직 능력과 실력으로만 대학에 입학할 수 있다고 여겨진다. 그러나 실제로는 부유한 가정의 학생일수록 입학시험에서 더 높은 점수를 받을 가능성이 크다. 일부 부유한 부모는 사설 입시 상담사를 고용하고, 엘리트 체육을 익히게 하며, 해외 봉사 활동을 주선해 주기도 한다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 능력에 근거한 입시는 오직 개인의 노력만 반영하므로 완전히 공정하다.\n② 부유한 가정의 학생일수록 입학시험 점수가 낮게 나타난다.\n③ 입학생은 모두 필요에 따른 분배 기준으로만 선발해야 한다.\n④ 해외 봉사 활동은 개인의 능력만으로 이룬 성취이다.\n⑤ 능력은 가정 환경 같은 우연적 요소의 영향을 받으므로 능력에 따른 선발이 공정하다고 단정하기 어렵다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7. 다음 글과 관련된 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;한국은 만 65세 이상 모든 노인이 지하철을 무료로 이용할 수 있도록 하고 있다. 그러나 급속한 고령화로 대상자가 늘어나 지하철 운영사들이 심각한 경영난을 겪자 제도를 폐지해야 한다는 주장이 제기되고 있다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 보편적 복지는 소득 수준에 상관없이 모든 사람에게 복지 혜택을 제공하는 것이다.\nㄴ. 선별적 복지는 소득 수준이 낮거나 복지 혜택이 절실히 필요한 사람들에게 제공하는 것이다.\nㄷ. 필요에 따른 분배는 사회적 약자에게 최소한의 인간다운 삶을 보장하고 불평등을 완화할 수 있다.\nㄹ. 필요에 따른 분배는 사회적·경제적 가치가 무한하므로 모든 사람의 필요를 쉽게 충족할 수 있다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄴ, ㄹ　③ ㄱ, ㄴ, ㄷ　④ ㄱ, ㄷ, ㄹ　⑤ ㄴ, ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8. 갑, 을의 주장에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;갑: 생각과 의견의 자유, 결사의 자유, 각자 개성에 맞게 자기 삶을 설계하고 자기가 좋은 대로 살아갈 자유가 존중되지 않는 사회는 결코 자유로운 사회라고 할 수 없다.\n을: 나는 공동체와 분리된 존재가 아니다. 내 삶의 역사는 항상 내가 나의 정체성을 도출해 내는 공동체의 역사 속에 편입되어 있기 때문이다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 갑은 공동선보다 개인선이 우선한다고 본다.\n② 을은 국가가 중립적 입장에서 개인의 자유로운 삶을 최대한 허용해야 한다고 본다.\n③ 갑은 주어진 사회적 역할을 수행함으로써 자아 정체성이 형성된다고 본다.\n④ 을은 인간을 공동체와 독립된 자유로운 존재로만 본다.\n⑤ 을은 조상이 노예를 소유했던 잘못에 대해 후손이 배상할 책임이 없다고 볼 것이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9. 다음 가상 대담의 갑, 을에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;갑: 각자가 자신의 사회적 지위, 타고난 재능, 가치관 등을 모른다고 가정한 상황에서 공정한 정의의 원칙을 만들 수 있다. 사회적·경제적 불평등은 최소 수혜자에게 최대의 이익을 보장하고, 직책과 지위가 모든 사람에게 개방될 때 허용될 수 있다.\n을: 다른 사람에게 피해를 주지 않고 정당하게 소유물을 취득하거나 양도받았다면 그 사람은 소유 권리를 갖는다. 취득의 원칙, 양도의 원칙이 지켜진다면 빈부 격차가 생기는 것은 문제가 되지 않는다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 갑은 차등의 원칙과 기회균등의 원칙을 제시한다.\nㄴ. 을은 개인의 소유 권리가 최대한 보장되어야 한다고 본다.\nㄷ. 을은 취득과 양도의 원칙이 지켜져도 빈부 격차는 반드시 시정되어야 한다고 본다.\nㄹ. 갑, 을 모두 개인의 자유와 권리를 보호하고 존중하는 것을 정의로 본다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄱ, ㄷ　③ ㄴ, ㄷ　④ ㄱ, ㄴ, ㄹ　⑤ ㄴ, ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10. 개발 제한 구역을 둘러싼 논쟁에 대한 설명으로 옳지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;① 자유주의적 정의관은 개발 제한 구역 정책이 토지 소유자의 권리와 사익을 부당하게 침해한다고 볼 것이다.\n② 공동체주의적 정의관은 개발 제한 구역 정책이 개인선을 침해하므로 폐지해야 한다고 볼 것이다.\n③ 토지 소유자에게 적절한 보상을 주어 갈등을 해결할 수도 있다.\n④ 두 정의관은 상호 보완적 관점에서 개인선을 실현하면서도 공동선을 훼손하지 않는 대안을 모색할 수 있다.\n⑤ 권리는 의무를 전제로 하고, 의무는 권리를 전제로 한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11. 다음 자료에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;2023년 1분기 소득 수준 하위 20% 가구와 상위 20% 가구의 월평균 소득 격차는 약 10.7배였다. 또한 균등화 처분 가능 소득을 기준으로 한 소득 5분위 배율은 6.45배로 나타났다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 소득 5분위 배율은 하위 20%의 평균 소득을 상위 20%의 평균 소득으로 나눈 값이다.\n② 소득 5분위 배율이 높을수록 빈부 격차가 크고 소득 불평등이 심하다는 의미이다.\n③ 사회 계층의 양극화는 중간 계층의 비중이 점점 늘어나는 현상이다.\n④ 균등화 처분 가능 소득은 직접 번 소득에서 연금 소득을 빼고 세금을 더한 소득이다.\n⑤ 소득 격차가 커지면 계층 간 이동이 쉬워져 계층 간 갈등이 줄어든다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12. 다음 자료를 바탕으로 한 추론으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;한국 사회의 불평등은 소득, 자산, 주거, 교육, 문화, 건강 등 여러 영역에서 격차가 벌어지는 &amp;#39;다중 격차&amp;#39;로 나타난다.\n• 농촌 가구 소득은 도시 근로자 가구 소득의 약 64%이다.\n• 고2 학업 성취도 평가에서 &amp;#39;보통 학력 이상&amp;#39; 비율은 세 과목 모두 대도시가 읍·면 지역보다 높았다.\n• 부모의 소득이 높을수록 자녀의 대학 진학률도 높아진다.\n• 학력이 높을수록 월평균 임금이 높아진다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 도시와 농촌 사이에 소득 격차가 나타난다.\nㄴ. 학업 성취도는 읍·면 지역이 대도시보다 높다.\nㄷ. 소득 격차가 교육 격차로, 교육 격차가 다시 소득 격차로 이어질 수 있다.\nㄹ. 지역 간 교육 격차는 공간 불평등의 사례로 볼 수 있다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄴ　② ㄴ, ㄹ　③ ㄷ, ㄹ　④ ㄱ, ㄴ, ㄷ　⑤ ㄱ, ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;13. 공간 불평등과 지역 격차 완화 정책에 대한 설명으로 옳지 않은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cp&gt;① 공간 불평등은 지역 간에 사회적·경제적·문화적으로 격차가 발생하는 현상이다.\n② 성장 거점 개발은 성장 잠재력이 큰 지역을 집중 육성하고 그 효과가 주변으로 확산하도록 하는 방식이다.\n③ 수도권 기업에 세금 감면이나 규제 완화 혜택을 주어 지방 이전을 유도하는 것은 지방 일자리 창출에 목적이 있다.\n④ 1차 공공 기관 지방 이전으로 수도권의 공공 기관이 모두 지방으로 옮겨 가 추가 이전은 필요하지 않게 되었다.\n⑤ 고향 사랑 기부제는 현재 주소지를 제외한 지방 자치 단체에 기부하면 세금 감면과 지역 특산품 답례를 받는 제도이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;14. 표는 우리나라 사회 복지 제도 A~C를 나타낸 것이다. 이에 대한 설명으로 옳은 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;A\u003c/th&gt;\n\u003cth&gt;B\u003c/th&gt;\n\u003cth&gt;C\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;사회적 위험을 보험 방식으로 사전에 대처하여 국민의 건강과 생활 보전을 보장\u003c/td&gt;\n\u003ctd&gt;생활 유지 능력이 없거나 생활이 어려운 국민의 최저 생활 보장 및 자립 지원\u003c/td&gt;\n\u003ctd&gt;도움이 필요한 모든 국민에게 상담, 재활, 돌봄 등을 제공\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;① A는 일정 수준의 소득이 있는 개인과 정부, 사업주가 보험료를 분담한다.\n② B의 대표적인 사례로 고용 보험, 산업 재해 보상 보험이 있다.\n③ C의 대표적인 사례로 기초 연금, 의료 급여가 있다.\n④ 기초 연금은 소득과 관계없이 65세 이상 모든 노인에게 지급되는 A에 해당한다.\n⑤ 국민연금은 국가와 지방 자치 단체의 책임하에 최저 생활을 보장하는 B에 해당한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;15. 다음 글의 밑줄 친 &amp;#39;이 정책&amp;#39;에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/strong&gt;\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;텍사스 법학 전문 대학원은 사회적 소수자에게 가산점을 주는 이 정책으로 입학생의 약 15%를 소수 집단에서 선발하였다. 대학 성적과 입학시험 점수가 높았지만 불합격한 백인 홉우드는 자신이 이 정책에 의해 희생되었다며 소송을 제기하였다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 장애인 의무 고용 제도, 여성 할당제와 같은 적극적 평등 실현 조치에 해당한다.\nㄴ. 오랫동안 차별받아 온 사회적 약자에게 실질적인 기회의 평등을 보장하려는 것이다.\nㄷ. 역차별 문제가 나타날 수 있으므로 사회적 합의가 필요하다.\nㄹ. 장애인 의무 고용 제도는 기업 규모에 따라 서로 다른 의무 고용 비율을 적용한다.\u003c/p&gt;\n\u003cp&gt;① ㄱ, ㄹ　② ㄴ, ㄷ　③ ㄱ, ㄴ, ㄷ　④ ㄱ, ㄷ, ㄹ　⑤ ㄴ, ㄷ, ㄹ\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;번호\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003cth&gt;해설\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;교정적 정의는 잘못과 처벌 사이에 \u003cstrong&gt;적정한 균형\u003c/strong&gt;이 필요하다. 작은 잘못에는 작은 벌, 큰 잘못에는 큰 벌이 가해져야 공정하다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;아리스토텔레스. ㄴ은 분배적 정의가 아니라 \u003cstrong&gt;교환적 정의\u003c/strong&gt;에 대한 설명이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;3\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;갑 = 칸트(동등성의 원리), 을 = 베카리아. ②는 을(종신 노역형), ③은 갑, ④ 을은 사형의 예방 효과를 기대하기 어렵다고 본다, ⑤ 을은 사형이 필요하지 않다고 본다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;A 업적, B 능력, C 필요. ①은 능력(B)의 단점, ②는 업적(A)의 장점, ③ 필요는 일할 동기를 약화할 수 있다, ⑤ 교과서는 사회적 합의로 상황에 맞는 기준을 마련해야 한다고 본다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;5\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;성과 연봉제 = \u003cstrong&gt;업적\u003c/strong&gt;에 따른 분배. 노력 동기를 제공한다. ①④는 필요, ⑤는 능력에 따른 분배이며, 업적은 사회적 약자를 배려하기 어렵다(③).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;샌델, 《공정하다는 착각》. 능력에는 부모의 사회적·경제적 지위 같은 \u003cstrong&gt;우연적 요소\u003c/strong&gt;가 개입될 수 있다는 문제 제기다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;7\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;ㄹ: 사회적·경제적 가치는 \u003cstrong&gt;한정\u003c/strong&gt;되어 모든 사람의 필요를 충족하기 어렵다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;갑 = 밀(자유주의), 을 = 매킨타이어(공동체주의). ②는 을이 아니라 자유주의, ③은 갑이 아니라 공동체주의의 입장, ④는 매킨타이어가 비판하는 자유주의적 인간관, ⑤ 공동체주의는 후손의 배상 책임이 있다고 본다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;9\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;갑 = 롤스, 을 = 노직. ㄷ: 노직은 취득·양도의 원칙이 지켜지면 빈부 격차는 \u003cstrong&gt;문제가 되지 않는다\u003c/strong&gt;고 본다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;공동체주의는 구성원에게 \u003cstrong&gt;환경을 보호할 의무\u003c/strong&gt;가 있으므로 개발 제한 구역 정책이 \u003cstrong&gt;필요하다\u003c/strong&gt;고 본다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;11\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;① 상위 20% ÷ 하위 20%, ③ 양극화는 중간 계층 감소, ④ 연금 등은 더하고 세금·사회 보험료는 뺀다, ⑤ 계층 이동이 어려워지고 갈등이 생길 수 있다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;12\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;ㄴ: 세 과목 모두 \u003cstrong&gt;대도시\u003c/strong&gt;가 읍·면보다 높았다. ㄷ은 다중 격차의 연결 고리, ㄹ은 지역 간 격차이므로 공간 불평등이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;13\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;2019년까지 154개가 이전했지만 여전히 \u003cstrong&gt;40%가 넘는 공공 기관이 수도권\u003c/strong&gt;에 있어 2차 이전이 추진될 예정이다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;14\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;A 사회 보험, B 공공 부조, C 사회 서비스. ② 고용·산재 보험은 A, ③ 기초 연금·의료 급여는 B, ④ 기초 연금은 소득 인정액이 기준 이하인 노인에게 지급하는 B, ⑤ 국민연금은 A.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;15\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;소수 집단 우대 정책 = 적극적 평등 실현 조치. ㄹ: 장애인 의무 고용 제도는 \u003cstrong&gt;기업 규모와 상관없이 같은 비율\u003c/strong&gt;을 적용해 대기업의 불만이 크다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;}]},{&quot;id&quot;:&quot;science-life&quot;,&quot;subject&quot;:&quot;통합과학&quot;,&quot;title&quot;:&quot;① 지질 시대와 생물다양성&quot;,&quot;file&quot;:&quot;통합과학_정리_1_지질시대와생물다양성.md&quot;,&quot;range&quot;:&quot;교과서 12~35쪽&quot;,&quot;flow&quot;:[[&quot;선캄브리아시대&quot;,&quot;생명의 시작&quot;,&quot;바다의 단세포생물 / 남세균 · 스트로마톨라이트&quot;],[&quot;고생대&quot;,&quot;육지 진출&quot;,&quot;오존층 형성 / 삼엽충 · 양서류 · 양치식물 / 말기 대멸종&quot;],[&quot;중생대&quot;,&quot;공룡 · 겉씨식물&quot;,&quot;판게아 분리 / 암모나이트 / 말기 대멸종&quot;],[&quot;신생대&quot;,&quot;포유류 · 속씨식물&quot;,&quot;현재와 비슷한 대륙 / 후기 인류의 조상&quot;],[&quot;변이 → 자연선택&quot;,&quot;진화와 다양성&quot;,&quot;유리한 변이를 지닌 개체의 생존 · 번식 → 집단 변화&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;생물다양성의 세 수준&quot;,&quot;head&quot;:[&quot;구분&quot;,&quot;비교할 대상&quot;,&quot;구분 단서&quot;],&quot;rows&quot;:[[&quot;유전적 다양성&quot;,&quot;같은 종 안의 개체&quot;,&quot;유전적 차이 · 다양한 형질&quot;],[&quot;종다양성&quot;,&quot;한 생태계의 여러 종&quot;,&quot;종의 종류와 분포&quot;],[&quot;생태계다양성&quot;,&quot;여러 종류의 생태계&quot;,&quot;숲 · 사막 · 바다 등 다양한 환경&quot;]]},&quot;note&quot;:&quot;시대의 순서와 대표 생물을 함께 연결. 위 단계 간격은 실제 지질 시대의 길이를 나타내지 않음.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;천재교육(신영준) 통합과학2. 이 파일의 내용은 교과서 본문·그림 설명·탐구 활동·단원 문제에 근거함.\n부교재는 아직 반영 안 됨.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 한눈에 보기&quot;,&quot;html&quot;:&quot;\u003ch3&gt;표 1. 단원 흐름\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;소단원\u003c/th&gt;\n\u003cth&gt;핵심 질문\u003c/th&gt;\n\u003cth&gt;핵심 개념\u003c/th&gt;\n\u003cth&gt;교과서 쪽\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;지질 시대의 환경과 생물의 변화\u003c/td&gt;\n\u003ctd&gt;지질 시대는 어떻게 구분할까?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;화석\u003c/strong&gt;, \u003cstrong&gt;지질 시대\u003c/strong&gt;, 선캄브리아시대·고생대·중생대·신생대\u003c/td&gt;\n\u003ctd&gt;14~15\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003ctd&gt;지질 시대의 환경과 생물은 어떻게 변해 왔을까?\u003c/td&gt;\n\u003ctd&gt;시대별 환경·대표 생물\u003c/td&gt;\n\u003ctd&gt;16~19\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003ctd&gt;대멸종은 생물다양성에 어떤 영향을 주었을까?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;대멸종\u003c/strong&gt;, 소행성 충돌설·화산 폭발설\u003c/td&gt;\n\u003ctd&gt;20~21\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;자연선택과 생물의 진화\u003c/td&gt;\n\u003ctd&gt;같은 종인데 생김새가 다른 까닭은?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;변이\u003c/strong&gt;, 자연선택 모의실험\u003c/td&gt;\n\u003ctd&gt;22~23\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003ctd&gt;(자연선택)\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;자연선택\u003c/strong&gt;, 사사패모\u003c/td&gt;\n\u003ctd&gt;24\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003ctd&gt;다윈이 밝힌 진화의 원리는 무엇일까?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;진화\u003c/strong&gt;, \u003cstrong&gt;자연선택설\u003c/strong&gt;, 핀치, 영양다람쥐\u003c/td&gt;\n\u003ctd&gt;25~27\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;생물다양성과 보전 방안\u003c/td&gt;\n\u003ctd&gt;생물다양성이란 무엇일까?\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;생물다양성\u003c/strong&gt;, \u003cstrong&gt;유전적 다양성\u003c/strong&gt;·\u003cstrong&gt;종다양성\u003c/strong&gt;·\u003cstrong&gt;생태계다양성\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;28~29\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003ctd&gt;보전 실천 방안\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;생물다양성협약(CBD)\u003c/strong&gt;, 쿤밍-몬트리올 글로벌 생물다양성 프레임워크\u003c/td&gt;\n\u003ctd&gt;30~31\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;표 2. 지질 시대 비교표 (반드시 암기)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시대\u003c/th&gt;\n\u003cth&gt;시작 시기 / 상대 길이\u003c/th&gt;\n\u003cth&gt;환경(기후·대륙·대기)\u003c/th&gt;\n\u003cth&gt;대표 생물·화석\u003c/th&gt;\n\u003cth&gt;끝날 때 사건\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;선캄브리아시대\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;약 46억 년 전 지구 탄생 ~ / \u003cstrong&gt;88.3 %\u003c/strong&gt; (지질 시대의 대부분)\u003c/td&gt;\n\u003ctd&gt;원시 지구가 식으며 수증기 응결 → 비 → \u003cstrong&gt;바다\u003c/strong&gt; 형성. \u003cstrong&gt;자외선\u003c/strong&gt;이 강해 생물은 바다에 서식. 대기 중 산소 매우 희박 → 광합성 생물 등장 후 산소가 쌓이기 시작\u003c/td&gt;\n\u003ctd&gt;최초의 \u003cstrong&gt;단세포생물\u003c/strong&gt;(바다에서 출현), \u003cstrong&gt;남세균\u003c/strong&gt;, 후기 \u003cstrong&gt;에디아카라 생물군\u003c/strong&gt;(복잡한 다세포 생물). 화석: \u003cstrong&gt;스트로마톨라이트\u003c/strong&gt;, 에디아카라 생물군 화석 정도\u003c/td&gt;\n\u003ctd&gt;(교과서 확인 필요)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;고생대\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;5억 4천만 년 전\u003c/strong&gt; / \u003cstrong&gt;6.3 %\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;시작 무렵 생물 종류·숫자 \u003cstrong&gt;폭발적 증가\u003c/strong&gt;. 산소 증가 → \u003cstrong&gt;오존층\u003c/strong&gt; 형성 → 자외선 차단 → \u003cstrong&gt;육지 진출\u003c/strong&gt;. 후기 산소 농도 약 35 %(현재 약 21 %)\u003c/td&gt;\n\u003ctd&gt;바다: \u003cstrong&gt;삼엽충\u003c/strong&gt;, 어류, \u003cstrong&gt;완족류\u003c/strong&gt;. 육지: \u003cstrong&gt;양서류\u003c/strong&gt;, \u003cstrong&gt;곤충\u003c/strong&gt;, 거대 \u003cstrong&gt;양치식물\u003c/strong&gt;(고사리류, 수십 m) 숲 → 현재 \u003cstrong&gt;석탄층\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;대륙이 합쳐져 \u003cstrong&gt;판게아\u003c/strong&gt; 형성 → 얕은 바다 면적 감소, 기후 급변 → \u003cstrong&gt;고생대 말 대멸종\u003c/strong&gt;(생물종의 \u003cstrong&gt;90 % 이상\u003c/strong&gt; 멸종, 페름기 말 대멸종)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;중생대\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;2억 5천만 년 전\u003c/strong&gt; / \u003cstrong&gt;4.0 %\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;판게아 \u003cstrong&gt;분리 시작\u003c/strong&gt;, 활발한 화산 활동 → 대기에 CO₂ 쌓여 기온 상승. \u003cstrong&gt;전 기간 온난\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;바다: \u003cstrong&gt;암모나이트\u003c/strong&gt;. 육지: 대형 파충류 \u003cstrong&gt;공룡\u003c/strong&gt;. 식물: \u003cstrong&gt;겉씨식물\u003c/strong&gt;(은행류, 소철류). 중생대 중기 \u003cstrong&gt;포유류 출현\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;급격한 지구 환경 변화 → \u003cstrong&gt;중생대 말 대멸종\u003c/strong&gt;(50 % 이상의 해양 생물, 육상 동물과 공룡 멸종, 암모나이트도 멸종)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;\u003cstrong&gt;신생대\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;6천 6백만 년 전\u003c/strong&gt; ~ 현재 / \u003cstrong&gt;1.4 %\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;대체로 온난, \u003cstrong&gt;말기에 빙하기와 간빙기 반복\u003c/strong&gt;. 대서양 넓어짐, 인도-유라시아 충돌 → \u003cstrong&gt;히말라야산맥\u003c/strong&gt;, 현재와 같은 대륙 분포. 호주가 남극에서 멀어짐 → 남극 주변 차가운 해류\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;포유류\u003c/strong&gt; 번성(매머드 등 대형 포유류), 후기 \u003cstrong&gt;인류의 조상\u003c/strong&gt; 출현, \u003cstrong&gt;속씨식물\u003c/strong&gt; 지배적, 바다: \u003cstrong&gt;화폐석\u003c/strong&gt;\u003c/td&gt;\n\u003ctd&gt;현재 진행 중(인류는 신생대에 삶)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 소단원(차시)별 핵심 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;0. 단원 도입 &amp;#39;배운 내용 되감기&amp;#39; (12~13쪽) — O/X로 확인\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;대륙의 모양은 과거부터 그대로이다 → \u003cstrong&gt;X\u003c/strong&gt; (지권은 변해 왔음)\u003c/li&gt;\n\u003cli&gt;화석은 과거 생물의 뼈만을 말한다 → \u003cstrong&gt;X\u003c/strong&gt; (뼈·이빨·표피 등 유해 + 기어다닌 흔적, 이빨 자국도 화석)\u003c/li&gt;\n\u003cli&gt;유전정보를 저장하고 전달하는 물질을 \u003cstrong&gt;핵산\u003c/strong&gt;이라고 한다 → \u003cstrong&gt;O\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;같은 생물 무리 내에서는 개체마다 형질 차이가 없다 → \u003cstrong&gt;X\u003c/strong&gt; (변이가 있음)\u003c/li&gt;\n\u003cli&gt;생물을 분류하는 기본 단위는 \u003cstrong&gt;종\u003c/strong&gt;이다 → \u003cstrong&gt;O\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;환경오염은 생물다양성에 큰 영향을 주지 않는다 → \u003cstrong&gt;X\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;이 단원에서 배울 내용: 지질 시대의 환경과 생물의 변화 / 자연선택과 생물의 진화 / 생물다양성과 보전 방안\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n\u003ch3&gt;1차시. 화석과 지질 시대의 구분 (14~15쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;화석\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;화석\u003c/strong&gt;: 과거에 살았던 생물의 \u003cstrong&gt;뼈나 이빨, 표피 등의 유해\u003c/strong&gt;나 \u003cstrong&gt;기어다닌 흔적, 이빨 자국\u003c/strong&gt; 등이 \u003cstrong&gt;지층에 남아 있는 것\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;우리나라 공룡 예: \u003cstrong&gt;코리아케라톱스 화성엔시스\u003c/strong&gt;(화성), \u003cstrong&gt;코리아노사우루스 보성엔시스\u003c/strong&gt;(보성) — 처음 화석이 발견된 지명을 따서 이름 붙임\u003c/li&gt;\n\u003cli&gt;화석을 이용해 \u003cstrong&gt;각 시대에 살았던 생물과 지구 환경을 추론\u003c/strong&gt;할 수 있다\u003c/li&gt;\n\u003cli&gt;&amp;#39;표준 화석&amp;#39;, &amp;#39;시상 화석&amp;#39;이라는 용어는 이 교과서 12~35쪽 본문에 나오지 않음 \u003cstrong&gt;(교과서 확인 필요)\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 화석을 통해 과거의 환경 추론하기 (14쪽 해 보기)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 태백 \u003cstrong&gt;구문소\u003c/strong&gt; 지역에서 \u003cstrong&gt;삼엽충 화석\u003c/strong&gt;과 현재 조개와 비슷한 다양한 \u003cstrong&gt;바다 생물 화석\u003c/strong&gt;이 발견됨을 관찰\u003c/li&gt;\n\u003cli&gt;결과: 바다 생물 화석이 나옴 → 이 지층은 \u003cstrong&gt;바다(물속)에서 퇴적\u003c/strong&gt;된 것\u003c/li&gt;\n\u003cli&gt;결론: 지금은 산지인 태백이 \u003cstrong&gt;삼엽충이 살던 고생대에는 바다\u003c/strong&gt;였다 → 지구 환경은 변해 왔고, 환경이 변하면 그곳에 사는 생물도 달라진다\u003cul&gt;\n\u003cli&gt;(35쪽 문제에서도 태백 화석 → 이름·번성 시대·당시 환경 서술형으로 출제됨)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;지질 시대와 구분 기준\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;지질 시대\u003c/strong&gt;: 약 \u003cstrong&gt;46억 년 전\u003c/strong&gt; 지구가 생긴 뒤 현재까지의 지구의 역사\u003c/li&gt;\n\u003cli&gt;46억 년 동안 \u003cstrong&gt;지각 변동, 대규모 화산 분출, 소행성 충돌\u003c/strong&gt; 같은 환경 변화 → 환경이 변하면 적응해 사는 \u003cstrong&gt;생물종도 달라짐\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;지층의 화석 종류와 수를 과거부터 차례로 보면 \u003cstrong&gt;특정 시기에 급격한 변화\u003c/strong&gt; → 생물의 \u003cstrong&gt;서식 환경이 크게 변했다\u003c/strong&gt;는 뜻\u003c/li&gt;\n\u003cli&gt;따라서 \u003cstrong&gt;화석에 드러난 지구 환경의 변화를 기준으로 지질 시대를 구분\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;크게 두 시기로 나눔\u003cul&gt;\n\u003cli&gt;화석이 \u003cstrong&gt;거의 발견되지 않는\u003c/strong&gt; 시기 = \u003cstrong&gt;선캄브리아시대\u003c/strong&gt; (지질 시대의 \u003cstrong&gt;대부분\u003c/strong&gt;)\u003c/li&gt;\n\u003cli&gt;화석이 \u003cstrong&gt;많이 발견되는\u003c/strong&gt; 시기 → \u003cstrong&gt;생물의 급격한 변화\u003c/strong&gt;를 기준으로 오래된 것부터 \u003cstrong&gt;고생대 → 중생대 → 신생대\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;그림 I-1 지질 시대 구분과 상대적 길이가 말하는 것\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;선캄브리아시대 88.3 % &amp;gt; 고생대 6.3 % &amp;gt; 중생대 4.0 % &amp;gt; 신생대 1.4 %\u003c/li&gt;\n\u003cli&gt;시작: 고생대 \u003cstrong&gt;5억 4천만 년 전\u003c/strong&gt;, 중생대 \u003cstrong&gt;2억 5천만 년 전\u003c/strong&gt;, 신생대 \u003cstrong&gt;6천 6백만 년 전\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;현재 인류는 \u003cstrong&gt;신생대\u003c/strong&gt;, 신생대는 전체의 약 1.4 %로 \u003cstrong&gt;가장 짧음\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;각 시대마다 \u003cstrong&gt;번성했던 생물이 변한다\u003c/strong&gt; (고생대: 삼엽충·완족류 / 중생대: 암모나이트·공룡 / 신생대: 화폐석·매머드·원시 포유류)\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;완족류\u003c/strong&gt;: 두 장의 껍데기를 가진 바다 생물(고생대)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n\u003ch3&gt;2차시. 지질 시대별 환경과 생물 (16~19쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;선캄브리아시대 (16쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;원시 지구가 식으며 \u003cstrong&gt;응결된 수증기가 비\u003c/strong&gt;가 되어 \u003cstrong&gt;바다\u003c/strong&gt;를 만듦\u003c/li&gt;\n\u003cli&gt;강한 \u003cstrong&gt;자외선\u003c/strong&gt;을 피해 생물은 \u003cstrong&gt;바다에 서식\u003c/strong&gt;, \u003cstrong&gt;최초의 단세포생물\u003c/strong&gt;도 바다에서 출현\u003c/li&gt;\n\u003cli&gt;대기 중 \u003cstrong&gt;산소가 매우 희박\u003c/strong&gt; → \u003cstrong&gt;남세균\u003c/strong&gt; 같은 \u003cstrong&gt;광합성 생물\u003c/strong&gt; 등장 → 대기에 점차 \u003cstrong&gt;산소가 쌓이기 시작\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;후기: \u003cstrong&gt;에디아카라 생물군\u003c/strong&gt;처럼 점차 \u003cstrong&gt;복잡한 다세포 생물\u003c/strong&gt; 출현\u003c/li&gt;\n\u003cli&gt;화석이 거의 없음 — \u003cstrong&gt;스트로마톨라이트\u003c/strong&gt;(남세균이 분비한 끈끈한 물질에 퇴적물이 겹겹이 쌓여 만들어짐)와 \u003cstrong&gt;에디아카라 생물군 화석\u003c/strong&gt; 정도\u003c/li&gt;\n\u003cli&gt;그림 I-2: 생물은 해파리처럼 떠다니거나 바다 밑바닥에 붙어 살았고, \u003cstrong&gt;단단한 껍데기가 없어 화석으로 남기 어려웠다\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;고생대 (17쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;시작 무렵 생물의 종류와 숫자가 \u003cstrong&gt;폭발적으로 증가\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;껍데기나 뼈 같은 단단한 부분\u003c/strong&gt;을 가진 생물 출현 → 포식자로부터 스스로 보호\u003c/li&gt;\n\u003cli&gt;바다: \u003cstrong&gt;삼엽충\u003c/strong&gt;과 \u003cstrong&gt;어류\u003c/strong&gt; 번성\u003c/li&gt;\n\u003cli&gt;대기 중 산소 농도 증가 → \u003cstrong&gt;오존층\u003c/strong&gt; 생성 → \u003cstrong&gt;자외선 차단\u003c/strong&gt; → 생물이 \u003cstrong&gt;육지로 진출\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;육지: \u003cstrong&gt;양서류\u003c/strong&gt;와 \u003cstrong&gt;곤충\u003c/strong&gt; 번성, 고사리 같은 \u003cstrong&gt;양치식물\u003c/strong&gt;이 거대 군락(크기 수십 m, 습지 중심의 광대한 숲) → 현재 \u003cstrong&gt;석탄층\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;고생대 말: 흩어져 있던 대륙이 이동해 합쳐짐(\u003cstrong&gt;판게아\u003c/strong&gt;) → 대륙을 둘러싼 \u003cstrong&gt;얕은 바다 면적 감소\u003c/strong&gt;, \u003cstrong&gt;기후 급변\u003c/strong&gt; → \u003cstrong&gt;생물종 수 크게 감소\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;그림 I-3: 산소 함량 증가가 \u003cstrong&gt;산소호흡을 하는 생물의 진화를 촉진\u003c/strong&gt;, 고생대 후기 산소 농도 \u003cstrong&gt;35 %\u003c/strong&gt;(현재 약 21 %) → \u003cstrong&gt;몸집이 큰 곤충과 파충류\u003c/strong&gt; 번성\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;중생대 (18쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;중생대 초부터 \u003cstrong&gt;판게아가 분리\u003c/strong&gt;되기 시작 → 여러 대륙으로 갈라짐\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;활발한 화산 활동\u003c/strong&gt; → 대기에 \u003cstrong&gt;이산화 탄소\u003c/strong&gt;가 쌓여 \u003cstrong&gt;기온 상승\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;전 기간 내내 온난한 기후\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;고생대 말 대멸종에서 살아남은 생물이 새 환경에 적응하여 번성, 새로운 생물종도 출현\u003c/li&gt;\n\u003cli&gt;바다: \u003cstrong&gt;암모나이트\u003c/strong&gt; / 파충류: 육지와 바다 등 다양한 환경에서 번성, 특히 육지의 \u003cstrong&gt;공룡\u003c/strong&gt; / 식물: \u003cstrong&gt;은행류, 소철류\u003c/strong&gt; 같은 \u003cstrong&gt;겉씨식물\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;중생대 말 급격한 지구 환경 변화 → \u003cstrong&gt;공룡과 암모나이트\u003c/strong&gt;를 포함한 많은 생물종 \u003cstrong&gt;멸종\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;그림 I-4: 판게아가 분리되어 \u003cstrong&gt;대륙과 해양의 분포가 다양\u003c/strong&gt;해지면서 \u003cstrong&gt;다양한 생물이 번성\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;신생대 (19쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;대체로 \u003cstrong&gt;온난\u003c/strong&gt;, 말기에는 기후 급변 → \u003cstrong&gt;빙하기와 간빙기가 반복\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;중생대 중기에 출현한 포유류\u003c/strong&gt;가 공룡이 멸종한 \u003cstrong&gt;빈자리를 차지\u003c/strong&gt;하여 번성\u003cul&gt;\n\u003cli&gt;포유류는 \u003cstrong&gt;체온을 일정하게 유지\u003c/strong&gt; → 급격한 기후 변화에도 생존\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;매머드\u003c/strong&gt;처럼 몸집 큰 포유류 번성, 종류도 다양해짐 / 후기에 \u003cstrong&gt;인류의 조상\u003c/strong&gt; 출현\u003c/li&gt;\n\u003cli&gt;씨앗과 열매를 먹는 \u003cstrong&gt;조류와 포유류\u003c/strong&gt;가 많아지며 꽃을 피우는 \u003cstrong&gt;속씨식물\u003c/strong&gt;이 지배적인 식물이 됨\u003c/li&gt;\n\u003cli&gt;바다: \u003cstrong&gt;화폐석\u003c/strong&gt; 번성\u003c/li&gt;\n\u003cli&gt;대륙 이동: \u003cstrong&gt;대서양\u003c/strong&gt;이 넓어짐, \u003cstrong&gt;인도 대륙 + 유라시아 대륙 충돌 → 히말라야산맥\u003c/strong&gt;, \u003cstrong&gt;현재와 같은 대륙 분포\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;호주 대륙이 \u003cstrong&gt;남극에서 멀어짐\u003c/strong&gt; → 남극 주변에 \u003cstrong&gt;차가운 해류\u003c/strong&gt; → 남극 기후에 영향\u003c/li&gt;\n\u003cli&gt;그림 I-5: 빙하기 → \u003cstrong&gt;해수면 낮아짐\u003c/strong&gt; → 대륙과 대륙 사이가 \u003cstrong&gt;육지로 연결\u003c/strong&gt; → 신생대 후기 생물들이 \u003cstrong&gt;다른 대륙으로 퍼져 나감\u003c/strong&gt; / 간빙기 → 빙하가 녹아 해수면 높아짐\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n\u003ch3&gt;3차시. 대멸종과 생물다양성 (20~21쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;대멸종\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;변화에 \u003cstrong&gt;적응하지 못하거나 경쟁에서 도태된 생물은 멸종\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;대멸종\u003c/strong&gt;: \u003cstrong&gt;대량의 생물종이 한꺼번에 멸종\u003c/strong&gt;하는 사건\u003c/li&gt;\n\u003cli&gt;화석 기록 → 대멸종은 지구 역사에서 \u003cstrong&gt;여러 번\u003c/strong&gt; 일어남\u003c/li&gt;\n\u003cli&gt;원인 추정: \u003cstrong&gt;대규모 화산 분화, 운석 충돌, 기후의 변화\u003c/strong&gt; 등 비교적 \u003cstrong&gt;급격한 환경 변화\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;그림 I-6 대멸종(생물 과의 수 그래프)이 말하는 것\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과의 수가 급격히 줄어드는 시기가 있음 → 대멸종\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;고생대 말 대멸종\u003c/strong&gt;: 지구에 있던 \u003cstrong&gt;생물종의 90 % 이상\u003c/strong&gt;이 멸종\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;중생대 말 대멸종\u003c/strong&gt;: \u003cstrong&gt;50 % 이상의 해양 생물, 육상 동물과 공룡\u003c/strong&gt;이 멸종\u003c/li&gt;\n\u003cli&gt;대멸종 이후 과의 수가 다시 늘어남 → 살아남은 생물이 \u003cstrong&gt;다양한 종으로 진화\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;(그래프의 세부 숫자는 변환으로 뒤섞여 생략)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;대멸종의 의미\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;많은 생물종을 사라지게 했지만, 살아남은 생물종에게는 \u003cstrong&gt;새로운 기회\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;예: 공룡 멸종 뒤 \u003cstrong&gt;먹이에 쉽게 접근\u003c/strong&gt;할 수 있게 된 \u003cstrong&gt;포유류가 번성\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;46억 년 동안 \u003cstrong&gt;여러 번의 대멸종 + 새로운 생물종의 등장\u003c/strong&gt; → \u003cstrong&gt;오늘날의 생물다양성\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 대멸종 원인에 대한 가설 조사·타당성 평가 (21쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정: 중생대 말 대멸종 전후 환경·생물권 변화 조사 → 두 가설의 근거 조사 → 평가 기준을 만들어 타당성 평가 → 발표·비교\u003c/li&gt;\n\u003cli&gt;두 가설 비교(아래 비교표 참고)\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;소행성 충돌설\u003c/strong&gt;: 지름 약 \u003cstrong&gt;10 km 소행성\u003c/strong&gt; 충돌 → 두꺼운 \u003cstrong&gt;먼지 구름이 성층권\u003c/strong&gt;을 덮어 \u003cstrong&gt;햇빛 차단\u003c/strong&gt;, \u003cstrong&gt;대규모 해일\u003c/strong&gt; → \u003cstrong&gt;광합성량 감소, 기온 하강\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;화산 폭발설\u003c/strong&gt;: \u003cstrong&gt;인도 데칸 지역\u003c/strong&gt; 화산 폭발 → 먼지·\u003cstrong&gt;유독 가스\u003c/strong&gt;가 대기를 덮어 \u003cstrong&gt;기후 변화\u003c/strong&gt; → \u003cstrong&gt;기온 하강, 산성비로 토양 산성화\u003c/strong&gt;, \u003cstrong&gt;화산재\u003c/strong&gt;가 내려앉아 식물이 자라지 못함\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;평가 기준(교과서 제시): 과학적 증거(지층, 화석 등)가 있는가? / 생물 생존에 위협이 되는 사건인가? / \u003cstrong&gt;일부 지역이 아닌 전 지구적으로 영향\u003c/strong&gt;을 주었는가? / 대멸종 전후 환경 변화를 설명할 수 있는가?\u003c/li&gt;\n\u003cli&gt;결론: 대멸종은 \u003cstrong&gt;급격한 전 지구적 환경 변화\u003c/strong&gt;로 설명하며, 가설은 \u003cstrong&gt;근거(증거)\u003c/strong&gt; 로 타당성을 평가한다 (어느 가설이 정답인지는 교과서에 없음)\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;읽기 자료 — 페름기 말 대멸종 (35쪽 문제 9)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;지구 역사상 \u003cstrong&gt;가장 방대한 멸종\u003c/strong&gt; = 고생대 말 \u003cstrong&gt;&amp;#39;페름기 말 대멸종&amp;#39;\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;유력 원인: \u003cstrong&gt;시베리아 화산 분출설\u003c/strong&gt; — 100만 년 가까이 화산 활동, 용암이 넓은 지역을 덮음(\u003cstrong&gt;시베리아 트랩\u003c/strong&gt;)\u003c/li&gt;\n\u003cli&gt;이산화 탄소 + 툰드라 해빙으로 나온 \u003cstrong&gt;메테인\u003c/strong&gt; 등 \u003cstrong&gt;온실 기체\u003c/strong&gt; → 기온 급상승\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;삼엽충\u003c/strong&gt; 등 \u003cstrong&gt;90 % 이상의 생물종 멸종\u003c/strong&gt;, 이 기록이 \u003cstrong&gt;고생대와 중생대를 나누는 기준\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n\u003ch3&gt;4차시. 변이와 자연선택 (22~24쪽)\u003c/h3&gt;\n\u003cp&gt;\u003cstrong&gt;변이\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;같은 종이라도 개체마다 형질이 조금씩 다름 (달팽이 껍데기 무늬·색, 사람 생김새)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;변이\u003c/strong&gt;: \u003cstrong&gt;같은 종 내에서 개체마다 다른 형질이 나타나는 것\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;변이가 생기는 까닭: 형질은 \u003cstrong&gt;유전정보로 만들어지는 단백질\u003c/strong&gt;에 따라 결정 → 개체마다 \u003cstrong&gt;유전정보가 조금씩 다름\u003c/strong&gt; → 만들어지는 \u003cstrong&gt;단백질의 종류와 양이 달라\u003c/strong&gt; 변이가 나타남\u003c/li&gt;\n\u003cli&gt;그림 I-7 \u003cstrong&gt;사랑앵무\u003c/strong&gt;: 개체마다 만들어지는 \u003cstrong&gt;색소 단백질\u003c/strong&gt;이 달라 모두 다른 색\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;탐구 포인트 — 자연선택 모의실험 (23쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;과정\u003col&gt;\n\u003cli&gt;나무 이쑤시개 20개 + 녹말 이쑤시개 20개를 \u003cstrong&gt;황갈색 종이\u003c/strong&gt; 위에 섞음(1세대, 각 50 %)\u003c/li&gt;\n\u003cli&gt;에어 캡을 덧씌운 보안경을 쓰고 \u003cstrong&gt;핀셋\u003c/strong&gt;으로 이쑤시개 20개 제거\u003c/li&gt;\n\u003cli&gt;남은 수를 세어 \u003cstrong&gt;같은 종류를 남은 수만큼 더함\u003c/strong&gt;(2세대)\u003c/li&gt;\n\u003cli&gt;2~3을 2회 더 반복 → 4세대까지 수와 비율 기록\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;녹색 종이\u003c/strong&gt;로 바꿔 1~5 반복\u003c/li&gt;\n\u003c/ol&gt;\n\u003c/li&gt;\n\u003cli&gt;결과: 교과서에는 결과 수치가 없는 빈 표만 있음 → 세대가 거듭될수록 \u003cstrong&gt;종이 색에 잘 띄지 않는 쪽 이쑤시개의 비율이 커지는 방향\u003c/strong&gt;으로 무리의 구성이 변한다고 해석 (종이 색이 바뀌면 유리한 쪽도 바뀜)\u003c/li&gt
