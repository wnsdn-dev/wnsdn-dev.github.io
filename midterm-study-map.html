음 법령을 제정한 정부의 활동으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;제1조 대한민국은 민주 공화제로 함.\n제3조 대한민국의 인민은 남녀 귀천, 빈부의 계급이 없고 일체 평등함.\n제10조 임시 정부는 국토 회복 후 만 1개년 내에 국회를 소집함.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 조선 물산 장려회를 조직하였다.\n② 연통제와 교통국을 운영하였다.\n③ 봉오동에서 일본군을 유인해 격파하였다.\n④ 정우회 선언을 발표하였다.\n⑤ 미쓰야 협정을 체결하였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4.\u003c/strong&gt; 다음 사건을 일어난 순서대로 옳게 나열한 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 국민 대표 회의가 열려 창조파와 개조파가 대립하였다.\n(나) 한성 정부의 내각 구성안을 중심으로 임시 정부가 통합되었다.\n(다) 이승만이 탄핵되고 박은식이 임시 대통령으로 추대되었다.\n(라) 일제에 발각되어 연통제가 사실상 붕괴되었다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① (나)-(가)-(라)-(다) ② (나)-(라)-(가)-(다) ③ (라)-(나)-(가)-(다) ④ (나)-(라)-(다)-(가) ⑤ (라)-(가)-(나)-(다)\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5.\u003c/strong&gt; 다음 대화의 ㉠~㉢에 해당하는 독립운동 방향을 옳게 연결한 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;㉠ 이동휘: 독립이라는 목표를 이루기 위해서는 전쟁 외에는 다른 방도가 없습니다.\n㉡ 이승만: 우리의 운동은 외국의 원조를 받지 않고는 어렵습니다.\n㉢ 안창호: 우리나라가 왜 일본에 망했습니까? 지식이 저들보다 부족하기 때문입니다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① ㉠ 외교 운동론 ㉡ 무장 투쟁론 ㉢ 실력 양성론\n② ㉠ 무장 투쟁론 ㉡ 실력 양성론 ㉢ 외교 운동론\n③ ㉠ 무장 투쟁론 ㉡ 외교 운동론 ㉢ 실력 양성론\n④ ㉠ 실력 양성론 ㉡ 외교 운동론 ㉢ 무장 투쟁론\n⑤ ㉠ 외교 운동론 ㉡ 실력 양성론 ㉢ 무장 투쟁론\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6.\u003c/strong&gt; 다음 사건을 일어난 순서대로 옳게 나열한 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 러시아 혁명군이 무장 해제를 강요해 많은 독립군이 희생되었다.\n(나) 대한 독립군 등 연합 부대가 일본군을 봉오동으로 유인해 격파하였다.\n(다) 북로 군정서 등이 백두산 부근 청산리 일대에서 큰 승리를 거두었다.\n(라) 남만주에 참의부·정의부, 북만주에 신민부가 조직되었다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① (나)-(다)-(가)-(라) ② (나)-(가)-(다)-(라) ③ (다)-(나)-(가)-(라) ④ (나)-(다)-(라)-(가) ⑤ (다)-(나)-(라)-(가)\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7.\u003c/strong&gt; 다음 선언을 활동 지침으로 삼은 단체에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;민중은 우리 혁명의 대본영(大本營)이다. 폭력은 우리 혁명의 유일한 무기이다. 우리는 민중 속으로 가서 민중과 손을 맞잡아 끊임없는 폭력 ‐ 암살, 파괴, 폭동으로써 강도 일본의 통치를 타도하고 ……\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 1931년 김구가 조직하였다.\n② 이봉창이 도쿄에서 일왕에게 폭탄을 던졌다.\n③ 김상옥이 종로 경찰서에 폭탄을 던졌다.\n④ 윤봉길의 의거로 중국 국민당 정부의 지원을 이끌어 냈다.\n⑤ 고종의 비밀 칙령을 받아 복벽주의를 추구하였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8.\u003c/strong&gt; 한인 애국단에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cp&gt;① 만주에서 김원봉 등이 조직하였다.\n② 단원들을 황푸 군관 학교에 입학시켰다.\n③ 나석주가 동양 척식 주식회사를 공격하였다.\n④ 윤봉길이 상하이 훙커우 공원 기념식장에 폭탄을 던졌다.\n⑤ 국민부 아래 조선 혁명군을 두었다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9.\u003c/strong&gt; 다음 구호를 내세운 운동에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;&amp;#39;내 살림 내 것으로&amp;#39;, &amp;#39;조선 사람 조선 것&amp;#39;\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 이상재 등이 1천만 원 모금 운동을 벌였다.\n② 1920년 평양에서 조만식 등이 조직한 단체가 시작하였다.\n③ 사회주의 세력이 주도하고 자본가들이 비판하였다.\n④ 일제가 경성 제국 대학을 설립하는 결과를 가져왔다.\n⑤ 치안 유지법 제정에 반대하는 것이 주요 목적이었다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10.\u003c/strong&gt; 다음 글을 쓴 인물 등이 전개한 운동에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;우리는 조선 내에서 (일본이) 허용하는 범위 내에서 일대 정치적 결사를 조직해야 한다. — 《동아일보》, 1924. 1. 3.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 공화제 정부 수립을 목표로 의연금을 거두었다.\n② 비타협적 민족주의 세력과 사회주의 세력이 격렬히 비판하였다.\n③ 신간회 창립을 주도하였다.\n④ 조선 공산당과 함께 6·10 만세 운동을 계획하였다.\n⑤ 민중의 직접 혁명을 추구하였다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11.\u003c/strong&gt; 다음 (가), (나)와 관련된 단체에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 민족주의적 세력에 대해서는 …… 우리와 과정적 동맹자가 될 수 있음을 충분히 인정하면서 …… 적극적으로 제휴해 ……\n(나) •우리는 정치·경제적 각성을 촉진함. •우리는 단결을 공고히 함. •우리는 기회주의를 일체 부인함.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 자치 의회 구성을 목표로 하였다.\n② 회장 이상재, 부회장 홍명희를 선출하였다.\n③ 코민테른의 지부로 승인받았다.\n④ 일제의 강제 명령으로 1931년 해산되었다.\n⑤ 국외에는 지회를 두지 않았다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12.\u003c/strong&gt; 다음 표의 (가), (나)에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;(가)\u003c/th&gt;\n\u003cth&gt;(나)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;계기\u003c/td&gt;\n\u003ctd&gt;순종의 사망\u003c/td&gt;\n\u003ctd&gt;나주역에서 한일 학생 충돌\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;연도\u003c/td&gt;\n\u003ctd&gt;1926\u003c/td&gt;\n\u003ctd&gt;1929\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;① (가)는 3·1 운동 이후 가장 큰 규모의 항일 민족 운동이었다.\n② (가)는 신간회가 진상 조사단을 파견해 지원하였다.\n③ (나)는 민족 유일당 운동을 추진하는 계기가 되었다.\n④ (나)는 11월 3일 광주 학생들의 대규모 시위로 시작되어 전국으로 확대되었다.\n⑤ (가), (나) 모두 일제의 문화 정치 실시에 직접적인 계기가 되었다.\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003col&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — &amp;#39;민족 자결의 기회&amp;#39;, &amp;#39;조선 청년 독립단&amp;#39; → 2·8 독립 선언(1919, 도쿄 유학생). ① 3·1 독립 선언서 ③ 조선 혁명 선언 ④ 대동단결 선언(1917) ⑤ 신한 청년당은 김규식을 파리 강화 회의에 파견함.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;④\u003c/strong&gt; — 농촌에서는 장날을 이용해 시위. ① 민족 대표는 태화관에서 선언식 후 연행, 탑골 공원은 학생·시민 ② 서간도·북간도·연해주·일본·미국에서도 시위 ③ 임시 정부는 3·1 운동을 계기로 수립 ⑤ 3·1 운동 이후 이른바 문화 정치로 전환.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — 대한민국 임시 헌장(1919. 4.) → 임시 정부는 연통제(비밀 행정 조직)·교통국(통신 기관) 운영. ① 조만식 등 ③ 홍범도의 대한 독립군 등 ④ 사회주의 세력 ⑤ 일제와 만주 군벌.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — (나) 1919. 9. 통합 → (라) 1921 연통제 붕괴 → (가) 1923 국민 대표 회의 → (다) 1925 이승만 탄핵·박은식 추대.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;③\u003c/strong&gt; — 이동휘 = 무장 투쟁론, 이승만 = 외교 운동론, 안창호 = 실력 양성론 (교과서 36쪽 탐구 활동).\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;①\u003c/strong&gt; — (나) 봉오동 전투(1920. 6.) → (다) 청산리 대첩(1920. 10.) → (가) 자유시 참변(1921. 6.) → (라) 3부 성립.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;③\u003c/strong&gt; — &amp;#39;민중은 대본영&amp;#39;, &amp;#39;폭력은 유일한 무기&amp;#39; → 조선 혁명 선언(1923) → 의열단. 김상옥의 종로 경찰서 의거(1923). ①②④ 한인 애국단 ⑤ 독립 의군부.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;④\u003c/strong&gt; — 윤봉길 의거(1932). ①②③ 의열단 ⑤ 국민부(3부 통합 후 남만주).\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — 물산 장려 운동: 1920년 평양 조만식 등 조선 물산 장려회. ①④ 민립 대학 설립 운동 ③ 일부 사회주의 세력이 &amp;quot;자본가만의 이익&amp;quot;이라며 비판 ⑤ 관련 없음.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — 이광수 &amp;lt;민족적 경륜&amp;gt; → 자치 운동. 비타협적 민족주의·사회주의 세력이 격렬히 비판. ① 대한 광복회 ③ 신간회는 비타협적 민족주의 + 사회주의 세력이 창립 ④ 6·10 만세 운동은 천도교 등 민족주의 세력과 조선 공산당이 계획 ⑤ 의열단(조선 혁명 선언).\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;②\u003c/strong&gt; — (가) 정우회 선언(1926), (나) 신간회 강령(1927) → 신간회. ① 자치 운동 ③ 한인 사회당 ④ 사회주의 세력의 해소 주장으로 전체 대회에서 해소 결정 ⑤ 만주·일본에도 지회.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;④\u003c/strong&gt; — (가) 6·10 만세 운동, (나) 광주 학생 항일 운동. ①② (나)에 대한 설명 ③ (가)에 대한 설명 ⑤ 문화 정치의 계기는 3·1 운동(1919).\u003c/li&gt;\n\u003c/ol&gt;\n&quot;}]},{&quot;id&quot;:&quot;history-liberation&quot;,&quot;subject&quot;:&quot;한국사&quot;,&quot;title&quot;:&quot;③ 사회·문화와 광복&quot;,&quot;file&quot;:&quot;한국사_정리_3_사회문화와광복.md&quot;,&quot;range&quot;:&quot;교과서 48~71쪽&quot;,&quot;flow&quot;:[[&quot;사회 · 문화&quot;,&quot;민족 문화 수호 · 대중 운동&quot;,&quot;조선어 학회 / 농민 · 노동 · 여성 · 형평 운동&quot;],[&quot;1930년대&quot;,&quot;한중 연대 · 세력 결집&quot;,&quot;한국 독립군 · 조선 혁명군 / 조선 민족 혁명당&quot;],[&quot;1938~1942&quot;,&quot;무장 부대와 건국 준비&quot;,&quot;조선 의용대(1938) / 한국광복군(1940) / 건국 강령(1941)&quot;],[&quot;1943~1945&quot;,&quot;독립 약속과 광복 준비&quot;,&quot;카이로(1943) / 건국 동맹(1944) / 포츠담(1945)&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;광복 준비의 주체와 역할&quot;,&quot;head&quot;:[&quot;이름&quot;,&quot;인물 · 지역&quot;,&quot;기억할 특징&quot;],&quot;rows&quot;:[[&quot;한국 독립군&quot;,&quot;지청천 · 북만주&quot;,&quot;쌍성보 · 대전자령 / 한중 연합&quot;],[&quot;조선 혁명군&quot;,&quot;양세봉 · 남만주&quot;,&quot;영릉가 · 흥경성 / 한중 연합&quot;],[&quot;조선 의용대&quot;,&quot;우한 · 1938&quot;,&quot;중국 관내 최초의 한인 무장 부대&quot;],[&quot;한국광복군&quot;,&quot;지청천 · 충칭 · 1940&quot;,&quot;임시 정부 / 연합군과 합동 작전&quot;],[&quot;조선 건국 동맹&quot;,&quot;여운형 · 국내 · 1944&quot;,&quot;국내에서 건국 준비&quot;]]},&quot;note&quot;:&quot;정리 파일에 표시된 전투 연도 확인 필요 항목은 그대로 원문에 남겨 둠.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cp&gt;천재교육(정요근) Ⅰ단원 04·05 + 대단원 마무리 (교과서 48~71쪽)\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;1. 한눈에 보기&quot;,&quot;html&quot;:&quot;\u003ch3&gt;04 사회·문화의 변화와 대중 운동 (분야별)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;분야\u003c/th&gt;\n\u003cth&gt;운동·단체·사건\u003c/th&gt;\n\u003cth&gt;인물\u003c/th&gt;\n\u003cth&gt;핵심 내용\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;도시\u003c/td&gt;\n\u003ctd&gt;근대 도시 성장\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;철도 교통 중심지·항만 도시 발달, 1930년대 이후 북부 공업 도시 성장 / 신작로·전차·버스 / 서울은 청계천 기준 북촌(한국인)·남촌(일본인)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;도시 빈민\u003c/td&gt;\n\u003ctd&gt;토막민\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;도시 외곽 빈민촌, 토막에 거주, 날품팔이·지게꾼·인력거꾼\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;농촌\u003c/td&gt;\n\u003ctd&gt;수탈적 농업 정책\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;토지 조사 사업(1910년대)·산미 증식 계획(1920년대) → 높은 소작료·세금·빚 → 화전민, 토막민, 해외 이주 / 5일장 = 새 문물 접하는 곳\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;언론\u003c/td&gt;\n\u003ctd&gt;《조선일보》, 《동아일보》 / 《개벽》, 《신여성》, 《별건곤》, 《삼천리》\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;3·1 운동 이후 발행 허가, 일제는 정간·압수·삭제로 통제\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;의식주\u003c/td&gt;\n\u003ctd&gt;모던 보이·모던 걸, 색깔 옷 장려, 국민복·몸뻬 / 아지노모도 / 문화 주택, 도시형 개량 한옥\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;서양식 근대 문화 확산. 서민은 잡곡밥·초가집\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;연극·무용·영화\u003c/td&gt;\n\u003ctd&gt;신파극, 토월회, 극예술 연구회 / 영화 &amp;lt;아리랑&amp;gt;(1926, 단성사)\u003c/td&gt;\n\u003ctd&gt;최승희, 나운규\u003c/td&gt;\n\u003ctd&gt;영화가 가장 영향력 큰 대중오락\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;대중가요·방송\u003c/td&gt;\n\u003ctd&gt;&amp;lt;사의 찬미&amp;gt;, &amp;lt;목포의 눈물&amp;gt;, &amp;lt;눈물 젖은 두만강&amp;gt; / 경성 방송국(1927)\u003c/td&gt;\n\u003ctd&gt;윤심덕\u003c/td&gt;\n\u003ctd&gt;축음기·음반 보급. 중일 전쟁 이후 침략 전쟁 선전 가요 강요\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;체육\u003c/td&gt;\n\u003ctd&gt;경평 축구 대회(1929~), 베를린 올림픽 마라톤 우승(1936)\u003c/td&gt;\n\u003ctd&gt;손기정\u003c/td&gt;\n\u003ctd&gt;일장기 지운 보도 → 기자 구속, 두 신문 무기 정간\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;우리말\u003c/td&gt;\n\u003ctd&gt;조선어 연구회(1921) → 조선어 학회(1931) → 조선어 학회 사건(1942)\u003c/td&gt;\n\u003ctd&gt;주시경의 제자들, 최현배, 이윤재\u003c/td&gt;\n\u003ctd&gt;가갸날, 《한글》 / 맞춤법 통일안, 《우리말 큰사전》 편찬\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;문맹 퇴치\u003c/td&gt;\n\u003ctd&gt;문자 보급 운동(《조선일보》, 1929~), 브나로드 운동(《동아일보》, 1931~)\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;야학, 한글 강습소 → 일제가 중단시킴\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;문화유산\u003c/td&gt;\n\u003ctd&gt;보화각(1938, 최초의 사설 박물관 → 간송미술관)\u003c/td&gt;\n\u003ctd&gt;전형필\u003c/td&gt;\n\u003ctd&gt;《훈민정음》 해례본 등 보호\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;역사\u003c/td&gt;\n\u003ctd&gt;민족주의 사학, 조선학 운동, 사회 경제 사학, 실증 사학(진단 학회)\u003c/td&gt;\n\u003ctd&gt;박은식, 신채호, 정인보, 안재홍, 백남운, 이병도\u003c/td&gt;\n\u003ctd&gt;식민 사관·조선사 편수회에 맞섬\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;문학\u003c/td&gt;\n\u003ctd&gt;저항 문학 / 친일 문학\u003c/td&gt;\n\u003ctd&gt;이상화·심훈 / 노천명\u003c/td&gt;\n\u003ctd&gt;&amp;lt;빼앗긴 들에도 봄은 오는가&amp;gt;, &amp;lt;그날이 오면&amp;gt; / &amp;lt;부인 근로대&amp;gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;농민\u003c/td&gt;\n\u003ctd&gt;암태도 소작 쟁의(1923~1924), 조선 노농 총동맹(1924), 조선 농민 총동맹(1927)\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;소작료 인하 요구. 1930년대 사회주의와 연계, 항일 투쟁\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;노동\u003c/td&gt;\n\u003ctd&gt;조선 노동 총동맹(1927), 원산 총파업(1929), 평원 고무 공장 파업(1931)\u003c/td&gt;\n\u003ctd&gt;강주룡\u003c/td&gt;\n\u003ctd&gt;임금 인상·노동 시간 단축 요구\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;청년\u003c/td&gt;\n\u003ctd&gt;청년회, 조선 청년 총동맹(1924)\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;강연회·야학, 식민 교육 비판, 노농 운동 지원\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;소년\u003c/td&gt;\n\u003ctd&gt;천도교 소년회, 어린이날, 잡지 《어린이》\u003c/td&gt;\n\u003ctd&gt;방정환\u003c/td&gt;\n\u003ctd&gt;&amp;#39;어린이&amp;#39; 말 사용 제안\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;형평\u003c/td&gt;\n\u003ctd&gt;조선 형평사(1923, 경남 진주)\u003c/td&gt;\n\u003ctd&gt;이학찬\u003c/td&gt;\n\u003ctd&gt;백정 차별 철폐, 저울처럼 평등한 세상\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;여성\u003c/td&gt;\n\u003ctd&gt;조선 여자 교육회(1920), 근우회(1927)\u003c/td&gt;\n\u003ctd&gt;차미리사, 김활란, 허정숙, 강향란, 나혜석, 김일엽\u003c/td&gt;\n\u003ctd&gt;여성 해방, 차별 철폐, 조혼 폐지\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;종교\u003c/td&gt;\n\u003ctd&gt;대종교(중광단), 천도교, 불교(조선 불교 유신회), 원불교, 기독교, 천주교(의민단)\u003c/td&gt;\n\u003ctd&gt;나철, 한용운, 박중빈\u003c/td&gt;\n\u003ctd&gt;종교별 민족·사회 운동 (차시 정리 참고)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;05 광복을 위한 노력 (1930~1945 연도순)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;연도\u003c/th&gt;\n\u003cth&gt;사건·단체\u003c/th&gt;\n\u003cth&gt;지역\u003c/th&gt;\n\u003cth&gt;핵심 인물\u003c/th&gt;\n\u003cth&gt;의의\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1930년대 초 (연도 교과서 확인 필요)\u003c/td&gt;\n\u003ctd&gt;한국 독립군: 쌍성보·대전자령 전투\u003c/td&gt;\n\u003ctd&gt;북만주\u003c/td&gt;\n\u003ctd&gt;지청천\u003c/td&gt;\n\u003ctd&gt;한중 연합 작전 승리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1930년대 초 (연도 교과서 확인 필요)\u003c/td&gt;\n\u003ctd&gt;조선 혁명군: 영릉가·흥경성 전투\u003c/td&gt;\n\u003ctd&gt;남만주\u003c/td&gt;\n\u003ctd&gt;양세봉\u003c/td&gt;\n\u003ctd&gt;한중 연합 작전 승리\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1932 이후\u003c/td&gt;\n\u003ctd&gt;윤봉길 거사 후 임시 정부 이동\u003c/td&gt;\n\u003ctd&gt;상하이 → 항저우\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;일본 탄압 피해 이동\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1935\u003c/td&gt;\n\u003ctd&gt;조선 민족 혁명당 결성\u003c/td&gt;\n\u003ctd&gt;난징\u003c/td&gt;\n\u003ctd&gt;김원봉(의열단), 조소앙, 지청천\u003c/td&gt;\n\u003ctd&gt;중국 관내 최대 규모 통일 전선 정당\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1935\u003c/td&gt;\n\u003ctd&gt;한국 국민당 조직\u003c/td&gt;\n\u003ctd&gt;항저우\u003c/td&gt;\n\u003ctd&gt;김구\u003c/td&gt;\n\u003ctd&gt;임시 정부 재정비\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1937\u003c/td&gt;\n\u003ctd&gt;보천보 공격\u003c/td&gt;\n\u003ctd&gt;함경남도\u003c/td&gt;\n\u003ctd&gt;동북 항일 연군 유격대\u003c/td&gt;\n\u003ctd&gt;국내 진공 작전\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1937\u003c/td&gt;\n\u003ctd&gt;조선 민족 전선 연맹\u003c/td&gt;\n\u003ctd&gt;난징\u003c/td&gt;\n\u003ctd&gt;조선 민족 혁명당 + 중도 좌파\u003c/td&gt;\n\u003ctd&gt;중일 전쟁 직후 결성\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1937\u003c/td&gt;\n\u003ctd&gt;한국 광복 운동 단체 연합회\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;김구, 조소앙, 지청천\u003c/td&gt;\n\u003ctd&gt;한국 독립당의 기반\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1938\u003c/td&gt;\n\u003ctd&gt;조선 의용대 창설\u003c/td&gt;\n\u003ctd&gt;우한\u003c/td&gt;\n\u003ctd&gt;(조선 민족 전선 연맹 산하)\u003c/td&gt;\n\u003ctd&gt;중국 관내 최초의 한인 무장 부대\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1940\u003c/td&gt;\n\u003ctd&gt;한국 독립당 결성\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;김구, 조소앙, 지청천\u003c/td&gt;\n\u003ctd&gt;임시 정부를 통해 항일 운동 주도\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1940\u003c/td&gt;\n\u003ctd&gt;한국광복군 창설\u003c/td&gt;\n\u003ctd&gt;충칭\u003c/td&gt;\n\u003ctd&gt;총사령관 지청천\u003c/td&gt;\n\u003ctd&gt;이어 김구 주석 단일 지도 체제\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1940 무렵\u003c/td&gt;\n\u003ctd&gt;동북 항일 연군 남은 세력 이동\u003c/td&gt;\n\u003ctd&gt;소련 연해주\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;소련군에 합류\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1941\u003c/td&gt;\n\u003ctd&gt;대한민국 건국 강령 발표\u003c/td&gt;\n\u003ctd&gt;충칭\u003c/td&gt;\n\u003ctd&gt;조소앙(삼균주의)\u003c/td&gt;\n\u003ctd&gt;민주 공화국, 토지·주요 산업 국유화\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1941\u003c/td&gt;\n\u003ctd&gt;태평양 전쟁 → 임시 정부 대일 선전 포고 / 주미 외교 위원부\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;이승만(위원장)\u003c/td&gt;\n\u003ctd&gt;연합군과 합동 작전\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1941\u003c/td&gt;\n\u003ctd&gt;조선 의용대 화북 지대 결성\u003c/td&gt;\n\u003ctd&gt;화북\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;팔로군과 타이항산·후자좡 전투\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1942\u003c/td&gt;\n\u003ctd&gt;조선 독립 동맹 결성, 조선 의용군 개편\u003c/td&gt;\n\u003ctd&gt;옌안\u003c/td&gt;\n\u003ctd&gt;김두봉(위원장)\u003c/td&gt;\n\u003ctd&gt;민족 통일 전선 지향\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1943\u003c/td&gt;\n\u003ctd&gt;카이로 회담\u003c/td&gt;\n\u003ctd&gt;이집트 카이로\u003c/td&gt;\n\u003ctd&gt;미국·영국·중국 정상\u003c/td&gt;\n\u003ctd&gt;연합국이 처음으로 한국 독립 약속\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1944\u003c/td&gt;\n\u003ctd&gt;조선 건국 동맹 조직\u003c/td&gt;\n\u003ctd&gt;국내\u003c/td&gt;\n\u003ctd&gt;여운형\u003c/td&gt;\n\u003ctd&gt;전국 10개 도 지방 조직, 건국 준비\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1945. 2.\u003c/td&gt;\n\u003ctd&gt;얄타 회담\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;미국·영국·소련 정상\u003c/td&gt;\n\u003ctd&gt;소련의 대일전 참전 결정\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1945. 7.\u003c/td&gt;\n\u003ctd&gt;포츠담 회담\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;카이로 선언 이행 재확인, 일본 항복 요구\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;2. 차시별 핵심 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;04-1 도시와 농촌의 변화 (48~50쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;근대 도시: 철도 교통의 중심지, 항만 도시 발달 → 1930년대 이후 북부 지방의 공업 도시 성장\u003c/li&gt;\n\u003cli&gt;신작로, 전차·버스·자동차 / 전차 노선 따라 시가지 확장 / 전신·전화, 백화점\u003c/li&gt;\n\u003cli&gt;도시 문화는 일본인과 일부 한국인만 누린 특권 = 도시의 양면성\u003c/li&gt;\n\u003cli&gt;서울: 청계천 중심으로 북촌(한국인 거리) – 남촌(일본인 거리, 본정)\u003cul&gt;\n\u003cli&gt;백화점은 남촌에 집중(미쓰코시, 조지아), 북촌에는 박흥식이 세운 화신 백화점\u003c/li&gt;\n\u003cli&gt;남산에 조선 신궁 → 1930년대 황국 신민화 위해 참배 강요\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;철도: 일제에게는 수탈·대륙 침략 수단, 한국인에게는 저항(3·1 운동 소식 전파)·문화 전파(수학여행) 수단\u003c/li&gt;\n\u003cli&gt;도시 빈민: 토막민(땅을 파거나 나뭇가지·가마니로 토막을 짓고 삶) → 날품팔이, 지게꾼, 인력거꾼\u003c/li&gt;\n\u003cli&gt;농민: 토지 조사 사업, 산미 증식 계획 → 토지 잃고 소작료·세금·빚 → 화전민(가장 빈곤한 계층), 토막민, 해외 이주\u003c/li&gt;\n\u003cli&gt;5일장 같은 장시: 물건 거래, 정보 교환, 순회 극단 공연·영화 관람\u003c/li&gt;\n\u003cli&gt;사료 포인트: &amp;quot;궁민이 만여 명&amp;quot;, &amp;quot;유리걸식의 길을 떠났다&amp;quot;(《조선일보》, 1932) → 피폐한 농촌\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;04-2 일상의 변화와 대중문화 (51~53쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;의생활: 1920년대 관료·학생 중심 서양식 옷차림 / &amp;#39;모던 보이·모던 걸&amp;#39;(비판하는 쪽은 &amp;#39;못된 보이·못된 걸&amp;#39;)\u003cul&gt;\n\u003cli&gt;1920년대 일부 민족주의자가 색깔 옷 장려 → 1930년대 조선 총독부가 강제 / 전쟁 후 남성 국민복, 여성 몸뻬\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;식생활: 우동·어묵(일본), 짜장면·호떡(중국), &amp;#39;아지노모도&amp;#39; 조미료, 외식이 여가 / 커피·빵·아이스크림은 도시 상류층 / 서민은 잡곡밥\u003c/li&gt;\n\u003cli&gt;주생활: 문화 주택(욕실·화장실), 1920년대 이후 도시형 개량 한옥(상류층) / 서민은 초가집·전통 가옥\u003c/li&gt;\n\u003cli&gt;언론: 1910년대 한국인 언론 금지 → 3·1 운동 이후 신문·잡지 허가 → 문화 확산, 새 사상 소개, 민족 운동 지원 / 정간·압수·삭제\u003c/li&gt;\n\u003cli&gt;소비문화: 1920~1930년대 경성 중심, 모던 보이·모던 걸이 앞장 / 경제력 갖춘 일부 상류층만 누림\u003c/li&gt;\n\u003cli&gt;연극·무용: 신파극 유행, 토월회·극예술 연구회 / 최승희(전통 무용의 현대화)\u003c/li&gt;\n\u003cli&gt;영화: 가장 영향력 큰 대중오락, 1926 단성사 나운규 &amp;lt;아리랑&amp;gt;(민족 정서, 식민지 현실의 아픔)\u003c/li&gt;\n\u003cli&gt;대중가요: 1920년대 축음기·음반 → &amp;lt;사의 찬미&amp;gt;(윤심덕) 등 / 1927 경성 방송국 개국 / 중일 전쟁 이후 전쟁 선전 가요 강요\u003c/li&gt;\n\u003cli&gt;체육: 구기 종목 대중화, 1929년부터 경평 축구 대회 / 1936 베를린 올림픽 손기정 우승 → 일장기 지운 보도 → 기자 구속, 두 신문 무기 정간\u003c/li&gt;\n\u003cli&gt;사료 포인트: &amp;#39;때의 소리&amp;#39;(《동아일보》, 1921) = 독자란 / 1933 《동아일보》 장신구 가격 vs 조선인 노동 임금(성년 남자 85전, 일본인 남자 1원 87전) → 소비문화는 일부만 누림\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;04-3 민족 문화 수호 운동 (54~57쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;우리말 지키기\u003cul&gt;\n\u003cli&gt;조선어 연구회(1921, 주시경의 제자들): 가갸날 제정(음력 9월 29일, 《세종실록》 근거), 기관지 《한글》, 강습회·강연회\u003c/li&gt;\n\u003cli&gt;가갸날 → 《훈민정음》 해례본 발견으로 9월 상순 반포 확인 → 광복 후 양력 10월 9일\u003c/li&gt;\n\u003cli&gt;조선어 학회(1931, 최현배·이윤재 등으로 확대 개편): 한글 맞춤법 통일안, 표준어 및 외래어 표기법 통일안 → 《우리말 큰사전》 편찬\u003c/li&gt;\n\u003cli&gt;조선어 학회 사건(1942): 독립운동 단체로 간주, 치안 유지법 위반 이유로 검거·해산\u003c/li&gt;\n\u003cli&gt;이윤재: 1929 조선어 사전 편찬 위원회, 1934 진단 학회 창립 참여, 1942 조선어 학회 사건으로 체포\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;문맹 퇴치 운동(1920년대 후반~, 언론 기관 + 한글 연구 단체)\u003cul&gt;\n\u003cli&gt;《조선일보》 문자 보급 운동(1929~): &amp;#39;아는 것이 힘이다, 배워야 산다&amp;#39;, 《한글 원본》\u003c/li&gt;\n\u003cli&gt;《동아일보》 브나로드 운동(1931~): 문맹 퇴치, 미신 타파, 근검절약 / 브나로드 = &amp;#39;민중 속으로&amp;#39;(러시아어)\u003c/li&gt;\n\u003cli&gt;학생·청년이 야학, 한글 강습소, 음악·연극 공연 → 일제가 민족의식 고취 이유로 중단\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;전형필(간송): 1938 서울 성북동 보화각(최초의 사설 박물관) → 오늘날 간송미술관, 《훈민정음》 해례본 등 10여 점 국보\u003c/li&gt;\n\u003cli&gt;식민 사관: 타율성론, 정체성론, 당파성론 / 조선 총독부가 조선사 편수회 설치, 《조선사》 편찬\u003c/li&gt;\n\u003cli&gt;민족주의 사학(&amp;#39;민족&amp;#39;이 주체): 박은식 《한국통사》, 《한국독립운동지혈사》 / 신채호 《조선사 연구초》, 《조선 상고사》\u003cul&gt;\n\u003cli&gt;1930년대 정인보·안재홍 → 조선학 운동, 《여유당전서》 간행(정약용), 실학 재평가\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;사회 경제 사학: 유물 사관, 백남운 《조선사회경제사》 → 정체성론·타율성론 비판\u003c/li&gt;\n\u003cli&gt;실증 사학: 이병도 등, 문헌 고증, 진단 학회 조직, 《진단 학보》\u003c/li&gt;\n\u003cli&gt;문학: 저항 문학(이상화 &amp;lt;빼앗긴 들에도 봄은 오는가&amp;gt;(1926), 심훈 &amp;lt;그날이 오면&amp;gt;(1930)), 친일 문학(노천명 &amp;lt;부인 근로대&amp;gt;(1942, 《매일신보》)), 이육사(저항시, 여러 차례 옥살이)\u003c/li&gt;\n\u003cli&gt;사료 포인트\u003cul&gt;\n\u003cli&gt;&amp;quot;훈민정음을 처음 제정&amp;quot;, &amp;quot;가갸문 강습회&amp;quot;, &amp;quot;음력 9월 29일&amp;quot; → 조선어 연구회(《동아일보》, 1926)\u003c/li&gt;\n\u003cli&gt;&amp;quot;문자 보급 반원&amp;quot;, &amp;quot;비료 가마니&amp;quot;, &amp;quot;야학&amp;quot; → 《조선일보》 문자 보급 운동(1930)\u003c/li&gt;\n\u003cli&gt;&amp;quot;아(我)와 비아(非我)의 투쟁&amp;quot; → 신채호 《조선 상고사》\u003c/li&gt;\n\u003cli&gt;&amp;quot;나라는 형체이고 역사는 정신&amp;quot; → 박은식\u003c/li&gt;\n\u003cli&gt;&amp;quot;세계사적이고 일원론적 역사 법칙&amp;quot; → 백남운\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;04-4 다양한 분야의 대중 운동 (58~62쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;농민 운동: 1920년대 사회주의 확산 → 소작료 인하 요구 소작 쟁의\u003cul&gt;\n\u003cli&gt;암태도 소작 쟁의(1923~1924, 전남): 일제 경찰은 지주 편 → 농민 투쟁 끝에 소작료 인하 성공 → 전국 농민 운동 자극\u003c/li&gt;\n\u003cli&gt;조선 노농 총동맹(1924) → 분리된 조선 농민 총동맹(1927)\u003c/li&gt;\n\u003cli&gt;1930년대: 대공황 → 더욱 격화, 사회주의와 연계, 항일 투쟁\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;노동 운동: 한국인 노동자는 일본인보다 턱없이 적은 임금 / 조선 노농 총동맹, 조선 노동 총동맹(1927)\u003cul&gt;\n\u003cli&gt;원산 총파업(1929): 석유 회사 일본인 감독의 한국인 노동자 구타 계기, 일제 식민지 시기 최대의 노동 운동\u003c/li&gt;\n\u003cli&gt;1930년대: 사회주의와 연계, 계급 해방 주장 항일 투쟁 / 1931 평원 고무 공장 강주룡, 을밀대 고공 농성\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;청년 운동: 3·1 운동 전후 청년회(강연회·토론회·운동회·야학) → 사회주의 수용, 급진화 → 조선 청년 총동맹(1924)\u003c/li&gt;\n\u003cli&gt;소년 운동: 방정환 주도 천도교 소년회 → &amp;#39;어린이&amp;#39; 용어, 어린이날, 잡지 《어린이》\u003cul&gt;\n\u003cli&gt;어린이날: &amp;#39;오월 첫 공일&amp;#39; 5월 1일 → 5월 첫 일요일 → 광복 후 5월 5일\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;형평 운동(1923): 갑오개혁 뒤에도 백정 차별(호적 붉은 점, 입학 거부) → 경남 진주 백정들이 조선 형평사 조직\u003cul&gt;\n\u003cli&gt;언론·사회주의 계열 지지로 전국 확산 → 호적의 백정 신분 표시 삭제 / 반(反)형평 운동도 있었음\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;여성 운동: 신여성, 가부장제 거부, 경제권 요구\u003cul&gt;\n\u003cli&gt;근우회(1927): 신간회 결성 뒤 민족주의·사회주의 세력 연대, 김활란(기독교계)·허정숙(사회주의) / 여성 교육, 조혼 폐지, 임금 차별 철폐\u003c/li&gt;\n\u003cli&gt;차미리사: 1920 조선 여자 교육회, 부인 야학 강습소 / 강향란: 1922 &amp;#39;단발한 낭자&amp;#39; / 김일엽·나혜석: 자유연애, 나혜석 &amp;lt;이혼 고백서&amp;gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;종교계\u003cul&gt;\n\u003cli&gt;대종교: 나철 등, 단군 신앙, 만주에서 중광단 조직(무장 투쟁)\u003c/li&gt;\n\u003cli&gt;천도교: 동학 계승, 《개벽》·《신여성》, 청년·여성 운동\u003c/li&gt;\n\u003cli&gt;불교: 한용운 등 사찰령(1911) 폐지 운동, 일부 승려 조선 불교 유신회\u003c/li&gt;\n\u003cli&gt;원불교: 박중빈 창시, 허례허식 폐지·남녀평등, 새생활 운동\u003c/li&gt;\n\u003cli&gt;기독교: 학교 설립, 1930년대 후반 신사 참배 거부 운동\u003c/li&gt;\n\u003cli&gt;천주교: 보육원·양로원, 만주에서 의민단 무장 투쟁\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;사료 포인트\u003cul&gt;\n\u003cli&gt;근우회 행동 강령: &amp;quot;조혼 폐지 및 결혼의 자유&amp;quot;, &amp;quot;부인 노동의 임금 차별 철폐&amp;quot;(《동아일보》, 1929)\u003c/li&gt;\n\u003cli&gt;&amp;quot;암태도&amp;quot;, &amp;quot;소작료를 경감&amp;quot;, &amp;quot;문재철&amp;quot;(《동아일보》, 1924) → 암태도 소작 쟁의\u003c/li&gt;\n\u003cli&gt;&amp;quot;고달픈 점원 노동자여 단결하자&amp;quot;(《동아일보》, 1921) → 노동 운동\u003c/li&gt;\n\u003cli&gt;&amp;quot;공평은 사회의 근본&amp;quot;, &amp;quot;백정&amp;quot;, &amp;quot;사십여 만이 단결&amp;quot; → 조선 형평사 취지문(1923)\u003c/li&gt;\n\u003cli&gt;&amp;quot;어린이의 인격을 존중&amp;quot; → 방정환(《조선일보》, 1926)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;05-1 한중 연대와 민족 운동 세력의 결집 (63~65쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;한중 연합 작전(1930년대 만주)\u003cul&gt;\n\u003cli&gt;북만주: 지청천의 한국 독립군 → 쌍성보 전투, 대전자령 전투 승리 (지도에는 동경성 전투도 표시)\u003c/li&gt;\n\u003cli&gt;남만주: 양세봉의 조선 혁명군 → 영릉가 전투, 흥경성 전투 승리\u003c/li&gt;\n\u003cli&gt;만주국 성립 → 투쟁 여건 악화 → 지청천 등 한국 독립군 일부 중국 관내 이동 / 조선 혁명군은 양세봉 전사 후 약화, 일부 중국 공산당 항일 무장 투쟁 가담\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;항일 유격대: 한국인 사회주의자 + 중국인 공산주의자 → 동북 인민 혁명군 → 동북 항일 연군\u003cul&gt;\n\u003cli&gt;1937 함경남도 보천보 공격(《동아일보》는 김일성 일파가 일으킨 것으로 보도) → 1940 무렵 소련 연해주로 이동, 소련군 합류\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;조선 민족 혁명당(1935, 난징): 김원봉의 의열단 중심 + 조소앙·지청천 참여, 민족주의·사회주의 협력 → 중국 관내 최대 규모 통일 전선 정당\u003cul&gt;\n\u003cli&gt;김구 세력 불참(임시 정부 유지 주장), 조소앙·지청천 등은 의열단 주도에 반발해 탈당\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;조선 민족 전선 연맹(1937, 난징, 중도 좌파와 함께) → 조선 의용대(1938, 우한): 중국 관내 최초의 한인 무장 부대, 중국 국민당 지원, 심리전·포로 심문·후방 공작 → 많은 대원 화북 이동\u003c/li&gt;\n\u003cli&gt;임시 정부: 윤봉길 거사(1932) 후 상하이 → 항저우 / 김구 한국 국민당(1935) / 한국 광복 운동 단체 연합회(1937) → 한국 독립당(1940)\u003c/li&gt;\n\u003cli&gt;1940 충칭: 한국광복군 창설(총사령관 지청천) → 김구 주석 단일 지도 체제 → 김원봉 등 조선 민족 전선 연맹 참여, 남은 조선 의용대 일부 한국광복군 합류 → 좌우익 통일 전선\u003c/li&gt;\n\u003cli&gt;다양한 독립운동가: 정정화(임시 정부 살림, 대한 애국 부인회 훈련부장), 후세 다쓰지(일본인 변호사, 2·8 독립 선언 참가자 변호, 건국 훈장 받은 최초의 일본인), 황기환(파리 위원부 서기장, 2023 유해 송환)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;05-2 건국 준비 활동과 연합국의 한국 독립 확인 (66~68쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;한국광복군: 1941 태평양 전쟁 → 임시 정부 대일 선전 포고 / 영국군 요청으로 인도·미얀마 전선 파견(포로 심문, 전단 살포, 정보 수집) / 김준엽·장준하 등 일본군 탈출 청년 합류\u003cul&gt;\n\u003cli&gt;미국 전략 첩보국(OSS) 특수 훈련 → 국내 정진군 조직, 국내 진공 작전 계획 → 일본의 항복으로 실행 못 함\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;조선 의용대 화북 지대(1941): 팔로군과 타이항산 전투, 후자좡 전투\u003c/li&gt;\n\u003cli&gt;조선 독립 동맹(1942): 조선 의용대 + 한인 사회주의자, 위원장 김두봉, 옌안, 조선 의용군으로 개편, 임시 정부와 연대 추구 → 핵심 인물들 광복 후 북한 정권 수립 참여\u003c/li&gt;\n\u003cli&gt;조선 건국 동맹(1944): 여운형이 국내에서 비밀 조직, 민족주의자+사회주의자 민족 연합 전선, 전국 10개 도 지방 조직, 무장봉기 계획, 조선 독립 동맹과 연계, 충칭 임시 정부와도 연락 노력\u003c/li&gt;\n\u003cli&gt;임시 정부 외교: 1941 주미 외교 위원부(위원장 이승만) / 미국의 국제 공동 관리(신탁 통치) 검토 → 반대, 즉시 독립 요구 / 김구 등이 장제스에게 즉시 독립 약속 요구\u003c/li&gt;\n\u003cli&gt;건국 강령: 임시 정부(1941, 조소앙 삼균주의: 보통 선거 민주 공화국, 토지·주요 산업 국유화), 조선 독립 동맹(1942), 조선 건국 동맹(1944) → 대한민국 헌법으로 계승\u003cul&gt;\n\u003cli&gt;삼균주의: 정치·경제·교육의 균등 → 개인, 민족, 국가 간 균등\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;연합국의 독립 약속: 카이로 회담(1943, 미·영·중) → 얄타 회담(1945. 2., 미·영·소) → 포츠담 회담(1945. 7.)\u003c/li&gt;\n\u003cli&gt;사료 포인트\u003cul&gt;\n\u003cli&gt;&amp;quot;OSS 특수 공작 훈련&amp;quot;, &amp;quot;국내로 침투시킬 계획&amp;quot; → 한국광복군(김준엽, 《장정》)\u003c/li&gt;\n\u003cli&gt;&amp;quot;삼균 제도&amp;quot;, &amp;quot;토지와 대생산 기관의 국유&amp;quot;, &amp;quot;만 18세 이상 남녀&amp;quot; → 임시 정부 건국 강령(1941)\u003c/li&gt;\n\u003cli&gt;&amp;quot;조선 민주 공화국&amp;quot;, &amp;quot;일본 제국주의자의 일체 자산 및 토지를 몰수&amp;quot; → 조선 독립 동맹(1942)\u003c/li&gt;\n\u003cli&gt;&amp;quot;각인 각파를 대동단결&amp;quot;, &amp;quot;반추축 제국(연합국)과 협력&amp;quot;, &amp;quot;노농 대중의 해방&amp;quot; → 조선 건국 동맹(1944)\u003c/li&gt;\n\u003cli&gt;카이로 선언은 원문 사료 없이 본문 설명만 있음: &amp;quot;한국인의 노예 상태에 유의&amp;quot;, &amp;quot;적절한 절차를 거쳐 자유 독립&amp;quot;\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;대단원 마무리 배움 노트 빈칸 (70~71쪽, 04·05 부분)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;➏ 경성 방송국 / ➐ 조선어 학회 / ➑ 조선 형평사 / ➒ 조선 민족 혁명당 / ➓ 카이로 선언\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;3. 헷갈리는 것 비교&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;조선어 연구회\u003c/th&gt;\n\u003cth&gt;조선어 학회\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;조직\u003c/td&gt;\n\u003ctd&gt;1921, 주시경의 제자들\u003c/td&gt;\n\u003ctd&gt;1931 확대 개편, 최현배·이윤재 등\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;활동\u003c/td&gt;\n\u003ctd&gt;가갸날 제정, 《한글》 발행, 강습회·강연회\u003c/td&gt;\n\u003ctd&gt;한글 맞춤법 통일안, 표준어·외래어 표기법 통일안, 《우리말 큰사전》 편찬\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;끝\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003ctd&gt;1942 조선어 학회 사건(치안 유지법 위반)으로 해산\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;문자 보급 운동\u003c/th&gt;\n\u003cth&gt;브나로드 운동\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;주도\u003c/td&gt;\n\u003ctd&gt;《조선일보》, 1929~\u003c/td&gt;\n\u003ctd&gt;《동아일보》, 1931~\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;특징\u003c/td&gt;\n\u003ctd&gt;&amp;#39;아는 것이 힘이다, 배워야 산다&amp;#39;, 《한글 원본》\u003c/td&gt;\n\u003ctd&gt;&amp;#39;민중 속으로&amp;#39;, 문맹 퇴치·미신 타파·근검절약\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;민족주의 사학\u003c/th&gt;\n\u003cth&gt;사회 경제 사학\u003c/th&gt;\n\u003cth&gt;실증 사학\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;관점\u003c/td&gt;\n\u003ctd&gt;&amp;#39;민족&amp;#39;이 주체, 정신 강조\u003c/td&gt;\n\u003ctd&gt;유물 사관, 세계사 보편 법칙\u003c/td&gt;\n\u003ctd&gt;문헌 고증, 객관적 서술\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;인물·책\u003c/td&gt;\n\u003ctd&gt;박은식 《한국통사》·《한국독립운동지혈사》 / 신채호 《조선사 연구초》·《조선 상고사》 / 정인보·안재홍(조선학 운동)\u003c/td&gt;\n\u003ctd&gt;백남운 《조선사회경제사》\u003c/td&gt;\n\u003ctd&gt;이병도 등, 진단 학회, 《진단 학보》\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;비판 대상\u003c/td&gt;\n\u003ctd&gt;일제의 역사 왜곡\u003c/td&gt;\n\u003ctd&gt;정체성론·타율성론\u003c/td&gt;\n\u003ctd&gt;-\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;한국 독립군\u003c/th&gt;\n\u003cth&gt;조선 혁명군\u003c/th&gt;\n\u003cth&gt;동북 항일 연군\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;지휘·구성\u003c/td&gt;\n\u003ctd&gt;지청천\u003c/td&gt;\n\u003ctd&gt;양세봉\u003c/td&gt;\n\u003ctd&gt;한국인 사회주의자 + 중국 공산당\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;지역\u003c/td&gt;\n\u003ctd&gt;북만주\u003c/td&gt;\n\u003ctd&gt;남만주\u003c/td&gt;\n\u003ctd&gt;만주 → 1940 무렵 연해주\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;전투\u003c/td&gt;\n\u003ctd&gt;쌍성보, 대전자령\u003c/td&gt;\n\u003ctd&gt;영릉가, 흥경성\u003c/td&gt;\n\u003ctd&gt;1937 보천보\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;이후\u003c/td&gt;\n\u003ctd&gt;일부 중국 관내 이동\u003c/td&gt;\n\u003ctd&gt;양세봉 전사 후 약화, 일부 중국 공산당 가담\u003c/td&gt;\n\u003ctd&gt;소련군 합류\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;조선 민족 혁명당\u003c/th&gt;\n\u003cth&gt;한국 국민당\u003c/th&gt;\n\u003cth&gt;한국 독립당(1940)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;연도·지역\u003c/td&gt;\n\u003ctd&gt;1935, 난징\u003c/td&gt;\n\u003ctd&gt;1935, 항저우\u003c/td&gt;\n\u003ctd&gt;1940\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;중심\u003c/td&gt;\n\u003ctd&gt;김원봉(의열단), 조소앙·지청천 참여(후에 탈당)\u003c/td&gt;\n\u003ctd&gt;김구\u003c/td&gt;\n\u003ctd&gt;김구, 조소앙, 지청천\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;성격\u003c/td&gt;\n\u003ctd&gt;중국 관내 최대 규모 통일 전선 정당\u003c/td&gt;\n\u003ctd&gt;임시 정부 재정비\u003c/td&gt;\n\u003ctd&gt;임시 정부 통해 항일 운동 주도\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;조선 의용대\u003c/th&gt;\n\u003cth&gt;한국광복군\u003c/th&gt;\n\u003cth&gt;조선 의용군\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;창설\u003c/td&gt;\n\u003ctd&gt;1938, 우한\u003c/td&gt;\n\u003ctd&gt;1940, 충칭\u003c/td&gt;\n\u003ctd&gt;1942 이후 옌안에서 개편\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;소속\u003c/td&gt;\n\u003ctd&gt;조선 민족 전선 연맹 산하\u003c/td&gt;\n\u003ctd&gt;대한민국 임시 정부(총사령관 지청천)\u003c/td&gt;\n\u003ctd&gt;조선 독립 동맹\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;지원·협력\u003c/td&gt;\n\u003ctd&gt;중국 국민당 지원\u003c/td&gt;\n\u003ctd&gt;중국 국민당 정부와 교섭해 창설, 영국군·미국 OSS와 협력\u003c/td&gt;\n\u003ctd&gt;중국 공산당 근거지 화북 (팔로군과 함께 싸운 것은 화북 지대 시절)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;활동\u003c/td&gt;\n\u003ctd&gt;심리전, 포로 심문, 후방 공작\u003c/td&gt;\n\u003ctd&gt;인도·미얀마 전선, OSS 훈련, 국내 진공 작전 계획\u003c/td&gt;\n\u003ctd&gt;항일 선전\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;포인트\u003c/td&gt;\n\u003ctd&gt;중국 관내 최초의 한인 무장 부대, 일부 → 화북, 일부 → 한국광복군\u003c/td&gt;\n\u003ctd&gt;국내 진공 작전은 일본 항복으로 실행 못 함\u003c/td&gt;\n\u003ctd&gt;핵심 인물 광복 후 북한 정권 수립 참여\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;대한민국 임시 정부\u003c/th&gt;\n\u003cth&gt;조선 독립 동맹\u003c/th&gt;\n\u003cth&gt;조선 건국 동맹\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;연도·지역\u003c/td&gt;\n\u003ctd&gt;충칭 (건국 강령 1941)\u003c/td&gt;\n\u003ctd&gt;1942, 옌안(화북)\u003c/td&gt;\n\u003ctd&gt;1944, 국내\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;인물\u003c/td&gt;\n\u003ctd&gt;김구(주석), 조소앙(삼균주의)\u003c/td&gt;\n\u003ctd&gt;김두봉(위원장)\u003c/td&gt;\n\u003ctd&gt;여운형\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;군대\u003c/td&gt;\n\u003ctd&gt;한국광복군\u003c/td&gt;\n\u003ctd&gt;조선 의용군\u003c/td&gt;\n\u003ctd&gt;무장봉기 계획\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;건국 강령\u003c/td&gt;\n\u003ctd&gt;보통 선거 민주 공화국, 토지·대생산 기관 국유\u003c/td&gt;\n\u003ctd&gt;민주 공화국, 일본 제국주의자 자산·토지 몰수, 토지 분배, 의무 교육\u003c/td&gt;\n\u003ctd&gt;각인 각파 대동단결, 연합국과 협력, 노농 대중 해방\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;카이로 회담\u003c/th&gt;\n\u003cth&gt;얄타 회담\u003c/th&gt;\n\u003cth&gt;포츠담 회담\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;시기\u003c/td&gt;\n\u003ctd&gt;1943\u003c/td&gt;\n\u003ctd&gt;1945. 2.\u003c/td&gt;\n\u003ctd&gt;1945. 7. (독일 항복 이후)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;참가\u003c/td&gt;\n\u003ctd&gt;미국·영국·중국 정상\u003c/td&gt;\n\u003ctd&gt;미국·영국·소련 정상\u003c/td&gt;\n\u003ctd&gt;(교과서 확인 필요)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;핵심\u003c/td&gt;\n\u003ctd&gt;한국 독립 최초 약속\u003c/td&gt;\n\u003ctd&gt;전후 국제 질서, 소련 대일전 참전 결정\u003c/td&gt;\n\u003ctd&gt;카이로 선언 이행 재확인(한국 독립 재확인), 일본 항복 요구\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;구분\u003c/th&gt;\n\u003cth&gt;암태도 소작 쟁의\u003c/th&gt;\n\u003cth&gt;원산 총파업\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;시기·지역\u003c/td&gt;\n\u003ctd&gt;1923~1924, 전남 암태도\u003c/td&gt;\n\u003ctd&gt;1929, 원산\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;주체\u003c/td&gt;\n\u003ctd&gt;농민\u003c/td&gt;\n\u003ctd&gt;노동자\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;계기·결과\u003c/td&gt;\n\u003ctd&gt;높은 소작료 → 소작료 인하 성공\u003c/td&gt;\n\u003ctd&gt;일본인 감독의 한국인 노동자 구타 → 일제 식민지 시기 최대 노동 운동\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;조선 노농 총동맹(1924) → 조선 농민 총동맹(1927) + 조선 노동 총동맹(1927)로 나뉨\u003c/li&gt;\n\u003cli&gt;조선 청년 총동맹(1924, 청년) vs 천도교 소년회(방정환, 소년) 구분\u003c/li&gt;\n\u003c/ul&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;4. 예상 문제&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;1.\u003c/strong&gt; 일제 식민지 시기 도시와 농촌의 모습으로 옳은 것은?\n① 서울에서는 청계천을 중심으로 북촌에 일본인, 남촌에 한국인이 주로 살았다.\n② 1930년대 이후 남부 지방을 중심으로 공업 도시가 성장했다.\n③ 토막민은 주로 날품팔이, 지게꾼, 인력거꾼 등 일용 노동직에 종사했다.\n④ 발달한 도시 문화는 대다수의 한국인이 누릴 수 있었다.\n⑤ 5일장이 사라져 농민들은 새로운 문물을 접하기 어려웠다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;2.\u003c/strong&gt; 일제 식민지 시기 대중문화에 대한 설명으로 옳지 않은 것은?\n① 1926년 단성사에서 나운규의 영화 &amp;lt;아리랑&amp;gt;이 개봉되었다.\n② 1927년 라디오 방송국인 경성 방송국이 개국했다.\n③ 1929년부터 경평 축구 대회가 열려 전국적인 관심을 받았다.\n④ 손기정의 일장기를 지운 보도로 두 신문이 무기 정간되었다.\n⑤ 일제는 1910년대부터 《조선일보》, 《동아일보》의 발행을 허가했다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;3.\u003c/strong&gt; 다음 기사에서 밑줄 친 &amp;#39;이 단체&amp;#39;의 활동으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;이날은 …… 세종 29년에 세계에 자랑될 만한 훈민정음을 처음 제정하고 발표한 아름다운 날이다. &amp;lt;u&amp;gt;이 단체&amp;lt;/u&amp;gt;는 …… 농촌의 문맹 타파를 목적으로 가갸문 강습회를 개최하는 등 …… 이날(음력 9월 29일)은 영원히 가갸날로 정해 기념케 하리라 한다더라. - 《동아일보》, 1926 -\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 《진단 학보》를 발행했다.\n② 기관지 《한글》을 발행했다.\n③ 한글 교재인 《한글 원본》을 보급했다.\n④ 한글 맞춤법 통일안을 제정했다.\n⑤ 치안 유지법 위반을 이유로 1942년에 해산되었다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;4.\u003c/strong&gt; (가), (나) 역사학자에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 고른 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 역사란 무엇인가? 인류 사회의 아(我)와 비아(非我)의 투쟁이 …… 심적 활동 상태의 기록이니 ……\n(나) 조선의 역사 발전은 …… 세계사적이고 일원론적 역사 법칙에 따라 다른 여러 민족과 거의 동일한 발전 과정을 거쳐 왔다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; ㄱ. (가)는 《조선사 연구초》를 저술했다. ㄴ. (가)는 문헌 고증을 통한 객관적 서술을 강조했다. ㄷ. (나)는 유물 사관에 입각해 《조선사회경제사》를 저술했다. ㄹ. (나)는 진단 학회를 조직했다.\n① ㄱ, ㄴ　② ㄱ, ㄷ　③ ㄴ, ㄷ　④ ㄴ, ㄹ　⑤ ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;5.\u003c/strong&gt; 다음 사건에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;목포 무안면 암태도 사람들이 과중한 소작료를 경감하라고 지주에게 교섭한 일이 있었다. 문재철이란 자가 지독히 동의하지 않았다. …… 경찰의 태도가 사건이 이렇게 커진 것에 중요한 관건이 되었다. - 《동아일보》, 1924 -\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 일본인 감독의 한국인 노동자 구타가 계기가 되었다.\n② 일제 경찰은 농민의 편에 서서 지주를 체포했다.\n③ 일제 식민지 시기 최대의 노동 운동으로 평가된다.\n④ 농민들은 투쟁 끝에 소작료 인하에 성공했다.\n⑤ 대공황의 영향으로 1930년대에 처음 일어났다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;6.\u003c/strong&gt; 다음 취지문을 발표한 단체에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;공평은 사회의 근본이고, 애정은 인류의 본령이다. 그런 까닭에 우리는 계급을 타파하고 모욕적 칭호를 폐지하며 …… 지금까지 조선의 백정은 어떠한 지위와 어떠한 압박을 받아 왔던가? - 1923 -\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 방정환의 주도로 조직되어 어린이날을 제정했다.\n② 김활란, 허정숙 등이 결성에 함께했다.\n③ 경남 진주에서 조직되어 전국으로 퍼졌다.\n④ 한용운 등이 중심이 되어 사찰령 폐지 운동을 벌였다.\n⑤ 갑오개혁으로 신분제가 폐지되기 전에 조직되었다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;7.\u003c/strong&gt; 다음 행동 강령을 내건 단체에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003col&gt;\n\u003cli&gt;여성에 대한 사회적·법률적 일체 차별 철폐 / 3. 조혼 폐지 및 결혼의 자유 / 6. 부인 노동의 임금 차별 철폐 및 산전, 산후 임금 지불 - 《동아일보》, 1929 -\u003c/li&gt;\n\u003c/ol&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 1920년 차미리사가 창설해 부인 야학 강습소를 열었다.\n② 잡지 《개벽》, 《신여성》을 발행했다.\n③ 만주에서 중광단을 조직해 무장 투쟁을 벌였다.\n④ 허례허식 폐지와 남녀평등을 내세운 새생활 운동을 펼쳤다.\n⑤ 신간회 결성 이후 민족주의와 사회주의 세력이 연대해 결성했다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8.\u003c/strong&gt; (가), (나) 부대에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 고른 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 지청천이 이끈 부대 　(나) 양세봉이 이끈 부대\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt; ㄱ. (가)는 쌍성보 전투와 대전자령 전투에서 승리했다. ㄴ. (나)는 북만주에서 중국군과 연합 작전을 벌였다. ㄷ. (가)의 일부는 만주국 성립 이후 중국 관내로 이동했다. ㄹ. (나)는 1937년 함경남도 보천보를 공격했다.\n① ㄱ, ㄴ　② ㄴ, ㄷ　③ ㄱ, ㄷ　④ ㄴ, ㄹ　⑤ ㄷ, ㄹ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9.\u003c/strong&gt; 다음 사건을 일어난 순서대로 바르게 나열한 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;ㄱ. 우한에서 중국 관내 최초의 한인 무장 부대가 창설되었다.\nㄴ. 난징에서 의열단 중심의 조선 민족 혁명당이 결성되었다.\nㄷ. 여운형이 국내에서 비밀리에 조선 건국 동맹을 조직했다.\nㄹ. 충칭에서 지청천을 총사령관으로 하는 한국광복군이 창설되었다.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① ㄱ-ㄴ-ㄷ-ㄹ　② ㄱ-ㄹ-ㄴ-ㄷ　③ ㄴ-ㄹ-ㄱ-ㄷ　④ ㄴ-ㄱ-ㄹ-ㄷ　⑤ ㄹ-ㄴ-ㄷ-ㄱ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10.\u003c/strong&gt; 다음 회고에 나타난 부대에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;드디어 3개월간의 제1기생 50명의 OSS 특수 공작 훈련이 끝났다. …… 미군도 대만족해 즉각 국내로 침투시킬 계획을 작성했다. - 김준엽, 《장정》 -\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① 중국 관내 최초의 한인 무장 부대였다.\n② 영국군의 요청으로 인도·미얀마 전선에 대원을 파견했다.\n③ 팔로군과 함께 타이항산 전투에서 일본군에 맞섰다.\n④ 김두봉을 위원장으로 하는 단체의 무장 조직이었다.\n⑤ 국내 진공 작전을 실행해 국내에 진입했다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11.\u003c/strong&gt; (가)~(다) 건국 강령에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 삼균 제도를 골자로 한 헌법을 실시해 …… 전국의 토지와 대생산 기관의 국유가 완성되고 …… (1941)\n(나) 독립 자유의 조선 민주 공화국을 수립할 목적으로 …… 전 국민의 보통 선거에 의한 민주 정권의 수립 (1942)\n(다) 각인 각파를 대동단결해 거국일치로 일본 제국주의의 제 세력을 구축하고 …… (1944)\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① (나)를 발표한 단체는 여운형이 국내에서 비밀리에 조직했다.\n② (다)를 발표한 단체는 옌안에서 조선 의용군을 거느렸다.\n③ (가)는 토지와 주요 산업의 사유화를 강조했다.\n④ 세 강령은 모두 입헌 군주제 국가 건설을 목표로 했다.\n⑤ (가)는 조소앙의 삼균주의를 바탕으로 했다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12.\u003c/strong&gt; (가)~(다) 회담에 대한 설명으로 옳은 것은?\u003c/p&gt;\n\u003cblockquote&gt;\n\u003cp&gt;(가) 1943년 이집트에서 열린 회담 (나) 1945년 2월에 열린 회담 (다) 1945년 7월에 열린 회담\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003cp&gt;① (나)에서 연합국이 처음으로 한국의 독립을 약속했다.\n② (가)에는 미국·영국·소련의 정상이 참여했다.\n③ (나)에서 중국의 대일전 참전이 결정되었다.\n④ (다)에서 카이로 선언의 모든 조항을 이행할 것을 다시 확인했다.\n⑤ (다)는 독일이 항복하기 전에 열렸다.\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003col&gt;\n\u003cli&gt;③ — 토막민은 일용 노동직에 종사. ① 북촌이 한국인, 남촌이 일본인 ② 북부 지방 ④ 일본인과 일부 한국인만 누린 특권 ⑤ 장시는 새 문물을 접하는 중요한 장소\u003c/li&gt;\n\u003cli&gt;⑤ — 1910년대에는 한국인 언론 활동 금지, 3·1 운동 이후 발행 허가\u003c/li&gt;\n\u003cli&gt;② — 가갸날 제정 = 조선어 연구회. ① 진단 학회 ③ 《조선일보》 ④⑤ 조선어 학회\u003c/li&gt;\n\u003cli&gt;② — (가) 신채호(민족주의 사학), (나) 백남운(사회 경제 사학). ㄴ 실증 사학 ㄹ 진단 학회는 이병도 등\u003c/li&gt;\n\u003cli&gt;④ — 암태도 소작 쟁의. ①③ 원산 총파업 ② 경찰은 지주 편 ⑤ 1923~1924년\u003c/li&gt;\n\u003cli&gt;③ — 조선 형평사(1923, 진주). ① 천도교 소년회 ② 근우회 ④ 불교계 ⑤ 갑오개혁 이후에도 남은 차별에 맞섬\u003c/li&gt;\n\u003cli&gt;⑤ — 근우회(1927). ① 조선 여자 교육회 ② 천도교 ③ 대종교 ④ 원불교\u003c/li&gt;\n\u003cli&gt;③ — (가) 한국 독립군, (나) 조선 혁명군. ㄴ 조선 혁명군은 남만주 ㄹ 보천보는 동북 항일 연군 유격대\u003c/li&gt;\n\u003cli&gt;④ — ㄴ 조선 민족 혁명당(1935) → ㄱ 조선 의용대(1938) → ㄹ 한국광복군(1940) → ㄷ 조선 건국 동맹(1944)\u003c/li&gt;\n\u003cli&gt;② — OSS 훈련 = 한국광복군. ① 조선 의용대 ③ 조선 의용대 화북 지대 ④ 조선 독립 동맹(조선 의용군) ⑤ 일본의 항복으로 실행 못 함\u003c/li&gt;\n\u003cli&gt;⑤ — (가) 임시 정부, (나) 조선 독립 동맹, (다) 조선 건국 동맹. ①② 설명이 서로 바뀜 ③ 국유화 ④ (가)·(나)는 민주 공화국, (다)는 민주주의적 원칙을 내세움 → 대한민국 헌법의 민주 공화제로 계승\u003c/li&gt;\n\u003cli&gt;④ — (가) 카이로, (나) 얄타, (다) 포츠담. ① 최초 약속은 카이로 ② 카이로는 미·영·중 ③ 소련의 대일전 참전 ⑤ 독일 항복 이후\u003c/li&gt;\n\u003c/ol&gt;\n&quot;}]},{&quot;id&quot;:&quot;history-recall&quot;,&quot;subject&quot;:&quot;한국사&quot;,&quot;title&quot;:&quot;백지 복습 · 시대와 인물&quot;,&quot;file&quot;:&quot;한국사_백지복습.md&quot;,&quot;range&quot;:&quot;통치 · 수탈 · 운동의 연결 복습&quot;,&quot;flow&quot;:[[&quot;첫 단계&quot;,&quot;시대 뼈대&quot;,&quot;1910년대 / 1920년대 / 1930년대 이후&quot;],[&quot;두 번째&quot;,&quot;분야 연결&quot;,&quot;통치 방식 ↔ 경제 수탈 ↔ 민족 운동&quot;],[&quot;세 번째&quot;,&quot;순서 배열&quot;,&quot;사건을 연도순으로 연결&quot;],[&quot;마지막&quot;,&quot;인물 짝 맞추기&quot;,&quot;김원봉 · 신채호 · 김구 · 이상재 · 홍범도 · 김좌진&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;인물별 기억 단서&quot;,&quot;head&quot;:[&quot;인물&quot;,&quot;연결할 내용&quot;],&quot;rows&quot;:[[&quot;김원봉 / 신채호&quot;,&quot;의열단 / 조선 혁명 선언&quot;],[&quot;김구 / 이상재&quot;,&quot;한인 애국단 / 민립 대학 · 신간회&quot;],[&quot;홍범도 / 김좌진&quot;,&quot;봉오동 전투 / 청산리 대첩&quot;]]},&quot;note&quot;:&quot;아래 복습 항목을 먼저 펼쳐 공책에 답한 뒤, 「답」을 펼쳐 대조하기.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cp&gt;사용법: 공책에 표를 똑같이 그리고, 정리 파일을 덮은 채로 칸을 채운다. 다 채우면 맨 아래 답과 비교해서 빠진 것만 빨간 펜으로 쓴다. 다음 날에는 빨간 펜으로 쓴 것만 다시 본다.\u003c/p&gt;\n&quot;},{&quot;title&quot;:&quot;1. 뼈대 표 (시기 × 분야)&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;\u003c/th&gt;\n\u003cth&gt;통치 방식\u003c/th&gt;\n\u003cth&gt;경제 수탈\u003c/th&gt;\n\u003cth&gt;민족 운동\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1910년대 ( ① )\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1920년대 ( ⑤ )\u003c/td&gt;\n\u003ctd&gt;⑥\u003c/td&gt;\n\u003ctd&gt;⑦\u003c/td&gt;\n\u003ctd&gt;⑧\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;1930년대 이후 ( ⑨ )\u003c/td&gt;\n\u003ctd&gt;⑩\u003c/td&gt;\n\u003ctd&gt;⑪\u003c/td&gt;\n\u003ctd&gt;⑫\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;},{&quot;title&quot;:&quot;2. 순서 배열&quot;,&quot;html&quot;:&quot;\u003col&gt;\n\u003cli&gt;봉오동 전투, 자유시 참변, 청산리 대첩, 간도 참변\u003c/li&gt;\n\u003cli&gt;조선 태형령, 국가 총동원법, 치안 유지법, 창씨개명\u003c/li&gt;\n\u003cli&gt;신간회 창립, 6·10 만세 운동, 광주 학생 항일 운동, 정우회 선언\u003c/li&gt;\n\u003cli&gt;한인 애국단 조직, 한국광복군 창설, 이봉창·윤봉길 의거, 신간회 해소\u003c/li&gt;\n\u003c/ol&gt;\n&quot;},{&quot;title&quot;:&quot;3. 짝 맞추기 (누가 / 무엇을)&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;인물·단체\u003c/th&gt;\n\u003cth&gt;한 일\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;김원봉\u003c/td&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;신채호\u003c/td&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;김구\u003c/td&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;이상재\u003c/td&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;홍범도\u003c/td&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;김좌진\u003c/td&gt;\n\u003ctd&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;답&quot;,&quot;html&quot;:&quot;\u003ch3&gt;1. 뼈대 표\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;① 무단 통치 / ② 헌병 경찰, 조선 태형령 / ③ 토지 조사 사업, 회사령 / ④ 독립 의군부, 대한 광복회, 국외 독립운동 기지 → 3·1 운동(1919)\u003c/li&gt;\n\u003cli&gt;⑤ 문화 정치 / ⑥ 보통 경찰, 치안 유지법(1925) / ⑦ 산미 증식 계획, 회사령 철폐 / ⑧ 대한민국 임시 정부, 봉오동·청산리, 의열단, 실력 양성 운동, 신간회(1927), 광주 학생 항일 운동(1929)\u003c/li&gt;\n\u003cli&gt;⑨ 민족 말살 정책 / ⑩ 황국 신민 서사, 창씨개명 / ⑪ 병참 기지화, 국가 총동원법(1938) / ⑫ 한인 애국단, 한중 연대, 한국광복군(1940)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;2. 순서 배열\u003c/h3&gt;\n\u003col&gt;\n\u003cli&gt;봉오동 전투 → 청산리 대첩 → 간도 참변 → 자유시 참변 (1920~1921)\u003c/li&gt;\n\u003cli&gt;조선 태형령(1912) → 치안 유지법(1925) → 국가 총동원법(1938) → 창씨개명(1940)\u003c/li&gt;\n\u003cli&gt;6·10 만세 운동(1926) → 정우회 선언(1926) → 신간회 창립(1927) → 광주 학생 항일 운동(1929)\u003c/li&gt;\n\u003cli&gt;신간회 해소(1931) → 한인 애국단 조직(1931) → 이봉창·윤봉길 의거(1932) → 한국광복군 창설(1940)\u003cul&gt;\n\u003cli&gt;신간회 해소와 한인 애국단 조직은 같은 해(1931)라 순서 문제로는 잘 안 나온다. 연도만 기억하기.\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ol&gt;\n\u003ch3&gt;3. 짝 맞추기\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;김원봉: 의열단 조직(1919)\u003c/li&gt;\n\u003cli&gt;신채호: &amp;lt;조선 혁명 선언&amp;gt;(1923, 의열단 활동 지침)\u003c/li&gt;\n\u003cli&gt;김구: 한인 애국단 조직(1931)\u003c/li&gt;\n\u003cli&gt;이상재: 조선 민립 대학 기성회, 신간회 회장\u003c/li&gt;\n\u003cli&gt;홍범도: 대한 독립군, 봉오동 전투\u003c/li&gt;\n\u003cli&gt;김좌진: 북로 군정서, 청산리 대첩\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;자세한 내용은 \u003ccode&gt;한국사_정리_1~3\u003c/code&gt; 파일에서 확인하기.\u003c/p&gt;\n&quot;}]},{&quot;id&quot;:&quot;korean-bakery&quot;,&quot;subject&quot;:&quot;국어&quot;,&quot;title&quot;:&quot;① 뉴욕제과점 · 우리말 바로 쓰기&quot;,&quot;file&quot;:&quot;국어_정리_1_뉴욕제과점_우리말.md&quot;,&quot;range&quot;:&quot;뉴욕제과점 10~27쪽 / 우리말 62~75쪽&quot;,&quot;flow&quot;:[[&quot;작품의 시작&quot;,&quot;제과점과 가족의 삶&quot;,&quot;어머니의 생계 · 삼남매의 성장&quot;],[&quot;시대의 변화&quot;,&quot;전성기 → 쇠락 → 폐업&quot;,&quot;1980년대 전성기 / 1995년 8월 폐업&quot;],[&quot;인식의 변화&quot;,&quot;상실 → 추억의 가치&quot;,&quot;사라진 것들이 마음속에 남아 삶을 지탱&quot;],[&quot;작품의 결말&quot;,&quot;국밥집 방문 · 위안&quot;,&quot;불빛 = 소중한 추억 / 따뜻한 국밥&quot;],[&quot;우리말&quot;,&quot;원리 → 규칙 → 적용&quot;,&quot;소리대로 적되 어법에 맞게 / 형태 보존 · 띄어쓰기&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;핵심 소재와 의미&quot;,&quot;head&quot;:[&quot;소재&quot;,&quot;연결할 의미&quot;],&quot;rows&quot;:[[&quot;뉴욕제과점&quot;,&quot;가족의 생계와 성장 / 추억의 중심&quot;],[&quot;불빛&quot;,&quot;삶을 지탱하는 소중한 추억&quot;],[&quot;어머니의 웃음&quot;,&quot;등록금보다 소중하게 여기는 어머니의 유산&quot;],[&quot;검은 비닐봉투 속 빵&quot;,&quot;가게의 쇠락 / 어머니의 남은 자존심&quot;],[&quot;따뜻한 국밥&quot;,&quot;과거의 추억을 만나는 현재의 위안(해석)&quot;]]},&quot;note&quot;:&quot;우리말 규칙·헷갈리는 표기는 PART B를 펼쳐보기. 열린 감상 문항의 해석 예시 표시는 원문대로 유지.&quot;,&quot;sections&quot;:[{&quot;title&quot;:&quot;자료 안내 · 범위&quot;,&quot;html&quot;:&quot;\u003cblockquote&gt;\n\u003cp&gt;천재교육(김수학) 공통국어2. 1단원 (1) 주체적으로 감상하기(10\u003cdel&gt;27쪽), 2단원 (1) 우리말 바로 쓰기(62\u003c/del&gt;75쪽).\n모든 내용은 교과서 본문·날개 설명·학습 활동·소단원 정리에 근거함. &amp;#39;해석 예시&amp;#39;는 교과서가 정답을 주지 않은 열린 문항의 모범 답안 방향임.\n&amp;lt;뉴욕제과점&amp;gt;은 저작권 작품이므로 짧은 핵심 구절만 인용함. 원문은 교과서 12~20쪽에서 꼭 다시 읽을 것.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;PART A. 1-(1) 주체적으로 감상하기 · 0. 소단원 학습 목표 (11쪽)&quot;,&quot;html&quot;:&quot;\u003cul&gt;\n\u003cli&gt;작품을 \u003cstrong&gt;주체적인 관점에서 해석\u003c/strong&gt;하고 \u003cstrong&gt;능동적으로 평가\u003c/strong&gt;할 수 있다.\u003c/li&gt;\n\u003cli&gt;작품에 대한 해석과 평가를 \u003cstrong&gt;설득력 있게 표현\u003c/strong&gt;함으로써 문학을 주체적으로 즐기며 \u003cstrong&gt;생활화\u003c/strong&gt;하는 태도를 지닌다.\u003c/li&gt;\n\u003cli&gt;생각 깨우기(10쪽): 좋아하는 빵을 까닭과 함께 말하기 → 좋아한다는 느낌에만 머무르지 말고 \u003cstrong&gt;까닭(근거)을 설명\u003c/strong&gt;하면 대상의 가치를 더 깊이 느낄 수 있음. 문학도 \u003cstrong&gt;평가를 근거와 함께 설명\u003c/strong&gt;하면 작품의 가치를 더 깊이 이해할 수 있음.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;PART A. 1-(1) 주체적으로 감상하기 · 1. 작품 한눈에 보기&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;항목\u003c/th&gt;\n\u003cth&gt;내용\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;작가\u003c/td&gt;\n\u003ctd&gt;김연수(1970~ ). 타인에 대한 사랑과 이해, 삶과 세상을 향한 따뜻한 시선을 보여 주는 작품을 많이 씀\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;출전\u003c/td&gt;\n\u003ctd&gt;소설집 《내가 아직 아이였을 때》(2002, 작가의 두 번째 소설집, 아홉 편 수록, 모든 작품의 배경이 1980년대 김천)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;갈래\u003c/td&gt;\n\u003ctd&gt;현대 소설, 단편 소설, \u003cstrong&gt;자전적 소설\u003c/strong&gt;(작가의 경험이 담김)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;성격\u003c/td&gt;\n\u003ctd&gt;자전적, 회상적, 담담한 어조 / 블로그 예시에서는 &amp;#39;따뜻한 추억을 다룬 소설&amp;#39;, &amp;#39;따뜻한 소설&amp;#39;로 소개\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;시점\u003c/td&gt;\n\u003ctd&gt;1인칭 주인공 시점 — &amp;#39;나&amp;#39;가 작품의 서술자이자 주인공\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;시간적 배경\u003c/td&gt;\n\u003ctd&gt;1960년대(개업, 누나 1965년생) ~ 1980년대(전성기) ~ 1995년 8월(폐업) ~ 그 이후 &amp;#39;나&amp;#39;가 글을 쓰는 현재\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;공간적 배경\u003c/td&gt;\n\u003ctd&gt;고향 김천의 역전(김천역 앞 광장 왼쪽) 뉴욕제과점, 그 주변 거리 → 이후 24시간 국밥집\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;주제\u003c/td&gt;\n\u003ctd&gt;사라진 뉴욕제과점에 얽힌 추억이 &amp;#39;나&amp;#39;를 살아가게 하는 힘이 됨 / 이 세상에서 사라진 것들도 마음속에 고스란히 남아 삶을 지탱함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;특징\u003c/td&gt;\n\u003ctd&gt;① 서술자가 자신의 과거를 \u003cstrong&gt;회상\u003c/strong&gt;하는 방식으로 전개 ② 시대의 변화, 뉴욕제과점의 변화, 막내아들인 자신의 성장기를 \u003cstrong&gt;담담한 어조\u003c/strong&gt;로 표현 ③ 실제 역사적 사건을 언급해 시대 배경 제시 ④ 중간 부분은 교과서에 줄거리로 요약됨\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;},{&quot;title&quot;:&quot;PART A. 1-(1) 주체적으로 감상하기 · 2. 줄거리 (장면 순서대로)&quot;,&quot;html&quot;:&quot;\u003cp&gt;\u003cstrong&gt;[발단] 글을 쓰는 현재 → 뉴욕제과점의 시작 (12~13쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;&amp;#39;나&amp;#39;는 이 소설만은 연필로 쓰기로 결심한다. 그리고 &amp;quot;오래전의 일&amp;quot;로부터 이야기를 시작한다.\u003c/li&gt;\n\u003cli&gt;&amp;#39;나&amp;#39;는 뉴욕제과점이 언제 문을 열었는지 정확히 모른다. 초등학생 때 물었더니 어머니는 난로 옆에서 뜨개질을 하며 &amp;quot;니가 태어나기도 한참 전&amp;quot;이라고 답했다.\u003c/li&gt;\n\u003cli&gt;가게 뒤 골방에서 어머니가 갓난 누나를 혼자 두었던 것을 미안해했다. 예전에는 수족관 있는 데까지가 방이었고, 온 가족이 한방에서 먹고 잤다.\u003c/li&gt;\n\u003cli&gt;&amp;#39;나&amp;#39;만 빼고 형제들은 모두 뉴욕제과점에서 태어난 셈이다(&amp;quot;단팥빵이나 크림빵처럼&amp;quot;). 누나가 1965년생이므로 개업은 1965년 이전 → 월남 파병, 이승만 사망, 한일 협정 조인 무렵.\u003c/li&gt;\n\u003cli&gt;&amp;#39;나&amp;#39;는 거기서 태어나지 않았는데도 사람들은 &amp;#39;나&amp;#39;를 &amp;quot;뉴욕제과점 막내아들&amp;quot;이라 불렀다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;[전개] 사라진 고향 거리 (13~14쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;서울에서 만난 고향 사람들은 뉴욕제과점을 &amp;quot;여고 시절 미팅하던 곳&amp;quot; 정도로 기억한다.\u003c/li&gt;\n\u003cli&gt;&amp;#39;나&amp;#39;가 &amp;quot;이젠 더 이상 제과점을 하지 않아요.&amp;quot;라고 해도 사람들은 놀라지 않는다 → &amp;#39;나&amp;#39;는 그런 사람들이 좀 야속하다.\u003c/li&gt;\n\u003cli&gt;&amp;#39;나&amp;#39;는 거리에서 사라진 상점들과 떠난 사람들을 모두 기억한다. 개발이 작은 상점들을 없애 버려 예전의 고향 거리는 이제 없다 → &amp;quot;어떤 의미에서 나는 실향민이나 마찬가지다.&amp;quot;\u003c/li&gt;\n\u003cli&gt;뉴욕제과점은 새 환경에 적응하지 못하고 \u003cstrong&gt;1995년 8월\u003c/strong&gt; 문을 닫았다. &amp;#39;나&amp;#39;는 &amp;quot;그저 사라져 버리면 그만일까?&amp;quot; 하고 되묻는다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;[중간 부분 줄거리 — 교과서 요약]\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;근검절약의 시대가 지나고 1980년대 소비가 미덕인 시대 → \u003cstrong&gt;전성기\u003c/strong&gt;.\u003c/li&gt;\n\u003cli&gt;바게트 같은 새 빵을 파는 세련된 제과점 등장 + 어머니의 건강 악화 → \u003cstrong&gt;쇠락\u003c/strong&gt;.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;[위기] 빙수 134그릇과 어머니의 웃음 (16~17쪽, 중간 부분 읽어 보기)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;1994년 여름방학(‘나’의 등단 사실이 뒤늦게 고향에 알려진 해), 가게를 보던 대학생 &amp;#39;나&amp;#39;는 하루에 빙수 \u003cstrong&gt;134그릇\u003c/strong&gt;을 판다.\u003c/li&gt;\n\u003cli&gt;입원 중인 어머니(대구의 병원)에게 자랑하자, 어머니는 &amp;quot;그거보다는 내가 더 많이 팔았지.&amp;quot;라며 옛날에는 여름 빙수를 팔아 자식들 학교 보내고 옷 사 입혔다고 한다.\u003c/li&gt;\n\u003cli&gt;&amp;#39;나&amp;#39;가 &amp;quot;엄마, 이제 가게 그만해요.&amp;quot;라고 하자 어머니는 대학 등록금까지만 대 주고 그다음부터는 스스로 벌어 살라고 한다. 실제로 졸업 뒤 돈을 주지 않았다.\u003c/li&gt;\n\u003cli&gt;수술 뒤 어머니는 사소한 일에도 웃음을 터뜨렸다. &amp;#39;나&amp;#39;는 어머니에게 받은 가장 훌륭한 것이 등록금이 아니라 \u003cstrong&gt;그 웃음\u003c/strong&gt;이라고 생각한다.\u003c/li&gt;\n\u003cli&gt;졸업 뒤 한 해 동안 많은 글을 썼지만 번 돈은 전성기 가게의 며칠 벌이만도 못해 겁이 덜컥 난다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;[절정 전] 뉴욕제과점의 쇠락과 폐업 (17~18쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;세계화 시대, 대기업이 운영하는 빵집(◯◯◯, ×××)이 작은 도시에도 생긴다. 다른 가게들은 바뀌었지만 뉴욕제과점은 바뀔 능력이 없어 1980년대풍으로 버틴다.\u003c/li&gt;\n\u003cli&gt;뉴욕제과점은 삼남매가 자라는 데 필요한 돈과 어머니의 수술비·병원비·약값을 만들어 내고 생명을 다해 간다.\u003c/li&gt;\n\u003cli&gt;어머니는 팔지 못해 상한 빵을 \u003cstrong&gt;검은색 비닐봉투\u003c/strong&gt;에 꽁꽁 묶어 버린다(예전엔 기레빠시도 버리지 않던 분). 그러나 고양이들이 봉투를 뒤져 모두가 알게 된다 → &amp;#39;나&amp;#39;의 심정은 매우 처참했다.\u003c/li&gt;\n\u003cli&gt;그래도 어머니는 가게를 그만두겠다는 말은 하지 않고, 빙수·케이크를 많이 팔던 옛이야기만 한다.\u003c/li&gt;\n\u003cli&gt;&amp;#39;나&amp;#39;가 대학을 졸업한 해, 가게가 팔렸다는 전화가 온다. 그 자리에는 기차 승객을 상대로 한 \u003cstrong&gt;24시간 국밥집\u003c/strong&gt;이 생긴다. &amp;#39;나&amp;#39;는 &amp;quot;잘됐다&amp;quot;고 말하고, 곧 집도 시 외곽 아파트촌으로 이사한다. 그 뒤로 그곳에 한 번도 가지 않는다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;[절정] &amp;#39;나&amp;#39;의 깨달음 (19쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;어느 날 &amp;#39;나&amp;#39;는 앞으로의 세상에는 \u003cstrong&gt;괴로운 일만 남았다\u003c/strong&gt;는 두려움에 사로잡힌다(아는 사람이 죽고, 거리가 바뀌고, 소중한 것들이 떠날 것이므로).\u003c/li&gt;\n\u003cli&gt;그러면서 내 안에 간직한 \u003cstrong&gt;불빛들\u003c/strong&gt;을 자꾸 꺼내 본다(사탕 넣은 유리 항아리를 자꾸 여는 아이처럼). 그 불빛들의 중심에는 늘 뉴욕제과점이 있다.\u003c/li&gt;\n\u003cli&gt;깨달음: 뉴욕제과점이 만들어 준 \u003cstrong&gt;추억으로 살아간다\u003c/strong&gt;. 사라졌다고 믿은 것들이 실은 \u003cstrong&gt;내 안에 고스란히 존재\u003c/strong&gt;한다. 나도 누군가에게 \u003cstrong&gt;위안이 되는 사람\u003c/strong&gt;으로 남을 수 있다.\u003c/li&gt;\n\u003cli&gt;그즈음 아이가 생기고, 자신이 없는 세상을 아이가 살아갈 것을 &amp;#39;상식적으로&amp;#39; 받아들이게 된다.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cp&gt;\u003cstrong&gt;[결말] 국밥집 방문 (19~20쪽)\u003c/strong&gt;\u003c/p&gt;\n\u003cul&gt;\n\u003cli&gt;어느 명절 밤, &amp;#39;나&amp;#39;는 망설이다 24시간 국밥집에 들어간다. 옛 가게의 구조(진열대, 1~9번 테이블, 텔레비전, 어머니가 앉던 1번 테이블)를 자세히 떠올린다.\u003c/li&gt;\n\u003cli&gt;텔레비전 받침대, 바닥 무늬, 천장이 그대로다. 모든 곳에서 가족과 어린 시절~대학생 시절의 자신을 본다 → 더 이상 고개를 들 수 없어 고개를 숙이고 국밥을 먹는다. &amp;quot;국밥은 따뜻했다.&amp;quot;\u003c/li&gt;\n\u003cli&gt;밖으로 나오니 역전 거리의 불빛들이 둥글게 아롱져 보인다.\u003c/li&gt;\n\u003cli&gt;마지막 문장: 세상을 살아가는 데 많은 불빛이 필요한 것은 아니고, &amp;quot;그저 조금만 있으면 된다.&amp;quot;\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;등장인물 관계\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;인물\u003c/th&gt;\n\u003cth&gt;특징\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;&amp;#39;나&amp;#39;\u003c/td&gt;\n\u003ctd&gt;서술자. 뉴욕제과점 막내아들(삼남매 중 막내), 형제 중 유일하게 제과점에서 태어나지 않음. 대학생 때 가게를 보았고 시와 소설로 등단한 작가. 뉴욕제과점에 대한 추억을 떠올리며 삶의 의미를 깨달음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;어머니\u003c/td&gt;\n\u003ctd&gt;거의 혼자서 뉴욕제과점을 지켜 옴. \u003cstrong&gt;집념\u003c/strong&gt;이 있고 가게에 대한 \u003cstrong&gt;자부심\u003c/strong&gt;이 강함. 장사로 삼남매를 키우고 대학 등록금까지 댐. 병으로 입원·수술을 반복함\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;누나\u003c/td&gt;\n\u003ctd&gt;1965년생. 갓난아기 때 제과점 골방에 혼자 있었던 적이 많음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;형\u003c/td&gt;\n\u003ctd&gt;누나와 함께 어머니가 번 돈으로 대학 등록금을 냄\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;고향 사람들\u003c/td&gt;\n\u003ctd&gt;뉴욕제과점을 학창 시절 미팅 장소 정도로만 기억 → &amp;#39;나&amp;#39;와 생각이 다름\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;국밥집 주인\u003c/td&gt;\n\u003ctd&gt;뉴욕제과점을 인수해 24시간 국밥집을 차림(직접 등장은 없음)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cul&gt;\n\u003cli&gt;관계 요약: 어머니 ─(뉴욕제과점 운영으로 부양)→ 삼남매(형, 누나, &amp;#39;나&amp;#39;) / &amp;#39;나&amp;#39; ↔ 고향 사람들: 뉴욕제과점을 기억하는 무게가 다름\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;PART A. 1-(1) 주체적으로 감상하기 · 3. 핵심 소재·상징과 서술상 특징&quot;,&quot;html&quot;:&quot;\u003ch3&gt;핵심 소재·상징\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;소재\u003c/th&gt;\n\u003cth&gt;의미 (원본 근거)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;뉴욕제과점\u003c/td&gt;\n\u003ctd&gt;&amp;#39;나&amp;#39;가 태어나 자라고 어른이 되는 동안 늘 있던 공간, 가족의 생계와 &amp;#39;나&amp;#39;의 성장의 공간, 추억 속 불빛들의 \u003cstrong&gt;중심\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;불빛\u003c/td&gt;\n\u003ctd&gt;&amp;#39;나&amp;#39;가 마음속에 간직한 \u003cstrong&gt;소중한 추억\u003c/strong&gt;. 두려움 속에서 자꾸 꺼내 보게 되며, &amp;#39;나&amp;#39;를 살아가게 함. 마지막 문장에서 &amp;#39;많지 않아도 조금만 있으면 되는 것&amp;#39;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;역전 거리의 불빛들이 &amp;quot;둥글게 아롱져&amp;quot; 보임\u003c/td&gt;\n\u003ctd&gt;국밥집에서 과거를 떠올린 뒤의 장면. 눈물이 고인 &amp;#39;나&amp;#39;의 모습을 짐작할 수 있음(해석)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;단팥빵·크림빵\u003c/td&gt;\n\u003ctd&gt;&amp;quot;단팥빵이나 크림빵처럼&amp;quot; 형제들이 제과점에서 태어났다는 비유 → 가족의 삶과 제과점이 하나였음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;검은 비닐봉투에 버리는 빵\u003c/td&gt;\n\u003ctd&gt;쇠락해 가는 가게, 어머니에게 \u003cstrong&gt;남은 자존심\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;빙수 134그릇\u003c/td&gt;\n\u003ctd&gt;&amp;#39;나&amp;#39;가 세운 기록, 어머니의 전성기 자부심(&amp;quot;내가 더 많이 팔았지&amp;quot;), 빙수로 자식들을 키운 어머니의 삶\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;어머니의 웃음\u003c/td&gt;\n\u003ctd&gt;등록금보다 더 훌륭한, 어머니에게서 받은 가장 소중한 것\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;대기업 빵집(◯◯◯, ×××)\u003c/td&gt;\n\u003ctd&gt;세계화에 따른 시대 변화, 뉴욕제과점 쇠락의 원인\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;사라진 상점들·개발\u003c/td&gt;\n\u003ctd&gt;예전 고향 거리의 소멸 → &amp;#39;나&amp;#39;가 실향민이나 마찬가지라고 느끼는 까닭\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;24시간 국밥집 / 따뜻한 국밥\u003c/td&gt;\n\u003ctd&gt;변해 버린 현재. 그러나 그 안에서 가족의 추억을 만나고, 국밥의 따뜻함은 &amp;#39;나&amp;#39;를 위로함(해석)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;연필\u003c/td&gt;\n\u003ctd&gt;&amp;#39;나&amp;#39;가 이 소설만은 연필로 쓰기로 결심함 → 이해·탐구 2(1)에서 그 의미를 해석하게 함\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;서술상 특징\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;1인칭 &amp;#39;나&amp;#39;가 \u003cstrong&gt;과거를 회상\u003c/strong&gt;하는 방식. 글을 쓰는 현재와 과거가 오가며 전개됨.\u003c/li&gt;\n\u003cli&gt;실제 \u003cstrong&gt;역사적 사건\u003c/strong&gt;(월남 파병, 한일 협정 조인, 김영삼 대통령의 세계화 주창)을 언급하여 시대 배경과 변화를 드러냄.\u003c/li&gt;\n\u003cli&gt;가게의 구조(진열대, 1~9번 테이블, 텔레비전 위치)를 매우 \u003cstrong&gt;구체적으로 묘사\u003c/strong&gt; → 추억이 생생하게 남아 있음을 보여 줌.\u003c/li&gt;\n\u003cli&gt;스스로에게 묻는 \u003cstrong&gt;질문\u003c/strong&gt;을 던짐: &amp;quot;그저 사라져 버리면 그만일까?&amp;quot;, &amp;quot;어차피 인생은 그런 것이었던가?&amp;quot;\u003c/li&gt;\n\u003cli&gt;&amp;quot;어차피 인생은 그런 것&amp;quot; 류의 표현이 \u003cstrong&gt;반복\u003c/strong&gt;됨 → 처음엔 체념처럼, 마지막엔 깨달음을 담은 말로 쓰임.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;비유\u003c/strong&gt;: 단팥빵·크림빵처럼, 사탕 유리 항아리를 여는 아이처럼, 추억 = 불빛.\u003c/li&gt;\n\u003cli&gt;슬픈 일도 \u003cstrong&gt;담담한 어조\u003c/strong&gt;로 말함.\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;PART A. 1-(1) 주체적으로 감상하기 · 4. 학습 활동 포인트 (21~27쪽)&quot;,&quot;html&quot;:&quot;\u003ch3&gt;주체적 감상이란? (21쪽 날개)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;작품을 주체적인 관점에서 해석·평가한다 = \u003cstrong&gt;자신의 경험, 지식, 가치관 등이 반영된 자신만의 관점\u003c/strong&gt;으로, \u003cstrong&gt;타당한 근거\u003c/strong&gt;를 들어 작품의 의미를 해석하고 평가하는 것.\u003c/li&gt;\n\u003cli&gt;핵심: ① 나만의 관점 ② 타당한 근거 ③ 해석 + 평가\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;이해·탐구 1 — 뉴욕제과점에서 일어난 일 시간순 정리\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;시기\u003c/th&gt;\n\u003cth&gt;교과서 제시\u003c/th&gt;\n\u003cth&gt;빈칸에 들어갈 내용(원본 근거)\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;초창기\u003c/td&gt;\n\u003ctd&gt;&amp;#39;나&amp;#39;가 태어나기 이전에 문을 엶\u003c/td&gt;\n\u003ctd&gt;가게 뒤 골방에서 가족이 먹고 자며 생활함, &amp;#39;나&amp;#39;를 뺀 형제들이 제과점에서 태어남\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;전성기\u003c/td&gt;\n\u003ctd&gt;1980년대 소비가 미덕인 시대에 전성기\u003c/td&gt;\n\u003ctd&gt;여름엔 빙수, 크리스마스엔 케이크 대목으로 장사가 잘되어 삼남매를 키움\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;쇠락기\u003c/td&gt;\n\u003ctd&gt;어머니의 건강이 악화됨\u003c/td&gt;\n\u003ctd&gt;세련된 제과점·대기업 빵집 등장, 팔지 못해 상한 빵을 버림\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;폐업\u003c/td&gt;\n\u003ctd&gt;&amp;#39;나&amp;#39;가 대학을 졸업한 해에 폐업\u003c/td&gt;\n\u003ctd&gt;다른 사람에게 팔려 24시간 국밥집으로 바뀜 (본문: 1995년 8월 문을 닫음)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;이해·탐구 2 — 내용 해석하기\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;(1) 표현의 의미 (해석 예시)\u003cul&gt;\n\u003cli&gt;&amp;quot;이 소설만은 연필로 쓰기로 결심했다&amp;quot;(12쪽): 뉴욕제과점의 추억을 한 글자씩 공들여, 소중하게 되살려 쓰겠다는 마음.\u003c/li&gt;\n\u003cli&gt;&amp;quot;제일 훌륭한 것은 대학교 등록금이 아니라 그 웃음&amp;quot;(17쪽): 물질적 지원보다 어머니의 웃음(사랑, 삶을 대하는 태도)이 더 소중했다는 뜻.\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;(2) 마지막 부분 &amp;#39;나&amp;#39;의 감정과 까닭\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;작품 속 표현\u003c/th&gt;\n\u003cth&gt;&amp;#39;나&amp;#39;의 감정\u003c/th&gt;\n\u003cth&gt;까닭\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;괴로운 일만 남았다는 생각(19쪽)\u003c/td&gt;\n\u003ctd&gt;두려움\u003c/td&gt;\n\u003ctd&gt;아는 사람이 죽고, 아는 거리가 바뀌고, 소중한 것들이 떠날 것이므로\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;괴로운 일만 남은 것은 아니라는 사실(19쪽)\u003c/td&gt;\n\u003ctd&gt;위안, 안도\u003c/td&gt;\n\u003ctd&gt;사라진 것들이 추억으로 내 안에 남아 나를 살아가게 함을 깨달음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;더 이상 고개를 들고 실내를 바라볼 수 없었다(20쪽)\u003c/td&gt;\n\u003ctd&gt;그리움, 슬픔이 북받침\u003c/td&gt;\n\u003ctd&gt;국밥집 곳곳에서 가족과 자신의 옛 모습을 보았기 때문\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;이해·탐구 3 — 인물과 주제 평가하기\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;(1) 어머니를 여러 측면에서 평가: ① 등록금까지만 대 주고 그 뒤는 스스로 벌게 함 ② 장사하느라 갓난 딸을 돌보지 못한 적이 있음 ③ 팔지 못한 빵을 남들이 못 보게 검은 봉투에 버림 ④ 장사가 안 돼도 가게를 그만두지 않으려 함 → 한 면만 보지 말고 \u003cstrong&gt;여러 측면을 종합\u003c/strong&gt;해 근거를 들어 평가하기.\u003c/li&gt;\n\u003cli&gt;(2) 주제 평가: ① &amp;#39;나&amp;#39;에게 뉴욕제과점의 의미(성장의 공간, 추억의 중심, 나를 살아가게 하는 불빛) ② 작가가 나타내려 한 주제 ③ 그 주제에 대한 나의 생각 → 짝과 비교.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;적용·창의 1 — 작품 소개 자료(블로그) 만들기\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;자료의 성격을 고려해 \u003cstrong&gt;제목\u003c/strong&gt; 짓기 / 이미지와 글귀를 조합해 \u003cstrong&gt;마중그림(섬네일)\u003c/strong&gt; 만들기 / 작품 특징과 감상 평을 포함해 \u003cstrong&gt;두 문단 정도\u003c/strong&gt; 글쓰기 / 내용을 요약하는 단어로 \u003cstrong&gt;해시태그\u003c/strong&gt; 달기 → 게시 후 친구 자료에 \u003cstrong&gt;댓글\u003c/strong&gt;로 생각 나누기.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;적용·창의 2 — 모둠 &amp;#39;이야기 책&amp;#39; 만들기\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;마지막 문단과 관련해 나에게 &amp;#39;불빛&amp;#39;에 해당하는 것 쓰기 → 이야기 종이(제목에 &amp;#39;불빛&amp;#39;에 해당하는 것, 관련 그림·사진) → 모둠별 이야기 책으로 엮어 돌려 읽기.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;문학의 생활화\u003c/strong&gt;: 문학 활동이 생활의 한 부분으로 자리 잡는 것. 해석·평가를 설득력 있게 표현하거나 창작·재창작하며 이룰 수 있고, 삶을 더욱 풍성하게 가꿀 수 있음.\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;소단원 정리 빈칸 정답 (27쪽)\u003c/h3&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;빈칸 문장\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;서술자가 자신의 과거를 (  )하는 방식으로 전개됨\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;회상\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;(  ): 거의 혼자서 뉴욕제과점을 지켜 왔을 정도로 집념이 있고 자부심이 강함\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;어머니\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;괴로운 일만 남았다는 생각이 들어 (  )을/를 느낌\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;두려움\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;자신을 살아가게 하는, 불빛과도 같은 소중한 (  ) 속에 항상 뉴욕제과점이 있음\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;추억\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;자신만의 관점으로, 타당한 (  )을/를 들어 작품의 의미를 해석·평가\u003c/td&gt;\n\u003ctd&gt;\u003cstrong&gt;근거\u003c/strong&gt;\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cblockquote&gt;\n\u003cp&gt;참고(교과서 55쪽 대단원 어휘 학습, 담당 범위 밖): 본문 문장 &amp;quot;(그러고) 보니&amp;quot;(=그리하고), &amp;quot;(그렇게) 오래전부터&amp;quot;(=그러하게)를 고르는 문제가 있음.\u003c/p&gt;\n\u003c/blockquote&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;PART B. 2-(1) 우리말 바로 쓰기 (62~75쪽) · 0. 소단원 학습 목표 (63쪽)&quot;,&quot;html&quot;:&quot;\u003cul&gt;\n\u003cli&gt;단어의 표기, 띄어쓰기와 관련된 \u003cstrong&gt;한글 맞춤법의 원리\u003c/strong&gt;를 탐구할 수 있다.\u003c/li&gt;\n\u003cli&gt;한글 맞춤법 원리를 적용하여 국어생활을 \u003cstrong&gt;성찰\u003c/strong&gt;하고 문제를 해결할 수 있다.\u003c/li&gt;\n\u003cli&gt;한글 맞춤법 = 우리말을 한글로 표기할 때 지켜야 할 기준을 정한 \u003cstrong&gt;어문 규범\u003c/strong&gt;.\u003c/li&gt;\n\u003cli&gt;생각 깨우기: 간판·안내문·SNS의 잘못된 표기 찾기. 예) 상담 전화 속 &amp;quot;엿 줄게 있어서&amp;quot; → 바른 표기는 &amp;#39;여쭐 게 있어서&amp;#39;(그림 속 나머지 오류는 교과서 확인 필요).\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;PART B. 2-(1) 우리말 바로 쓰기 (62~75쪽) · 1. 교과서가 다루는 규칙 정리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;① 한글 맞춤법의 기본 원리 — 제1장 총칙 제1항 (64쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;제1항\u003c/strong&gt; 한글 맞춤법은 표준어를 \u003cstrong&gt;소리대로\u003c/strong&gt; 적되, \u003cstrong&gt;어법에 맞도록\u003c/strong&gt; 함을 원칙으로 한다.\u003c/li&gt;\n\u003cli&gt;소리대로: 표음 문자인 한글의 특성을 고려해 \u003cstrong&gt;발음에 따라\u003c/strong&gt; 적음. 예) 거위, 바다\u003c/li&gt;\n\u003cli&gt;어법에 맞도록: 뜻을 파악하기 쉽도록 \u003cstrong&gt;각 형태소의 원형을 밝혀\u003c/strong&gt; 적음. 예) 넓고(×널꼬), 찾으래(×차즈래) → 어간 형태를 고정해 가독성을 높임\u003c/li&gt;\n\u003cli&gt;한글 맞춤법의 구성: 제1장 총칙 / 제2장 자모 / 제3장 소리에 관한 것 / 제4장 형태에 관한 것 / 제5장 띄어쓰기 / 제6장 그 밖의 것 / &amp;lt;부록&amp;gt; 문장 부호\u003c/li&gt;\n\u003cli&gt;확인 정답: 소리대로 → \u003cstrong&gt;구름, 설거지, 망설이다\u003c/strong&gt; / 원형을 밝혀 → \u003cstrong&gt;얼음\u003c/strong&gt;(얼-+-음), \u003cstrong&gt;젊다\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;② 된소리 나는 단어의 표기 — 제3장 제5항 (65쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;제5항\u003c/strong&gt; 한 단어(= 한 형태소로 된 단어) 안에서 \u003cstrong&gt;뚜렷한 까닭 없이\u003c/strong&gt; 나는 된소리는 다음 음절 첫소리를 된소리로 적는다.\u003col&gt;\n\u003cli&gt;두 모음 사이에서 나는 된소리\u003c/li&gt;\n\u003cli&gt;&amp;#39;ㄴ, ㄹ, ㅁ, ㅇ&amp;#39; 받침 뒤에서 나는 된소리\u003c/li&gt;\n\u003c/ol&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;다만\u003c/strong&gt;, &amp;#39;ㄱ, ㅂ&amp;#39; 받침 뒤의 된소리는 (같은/비슷한 음절이 겹치는 경우가 아니면) 된소리로 적지 않는다 → 필연적으로 된소리가 나는 환경이므로\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;원리: 발음이 원래 형태와 다를 때 \u003cstrong&gt;일반적인 음운 변동으로 설명되면 원형\u003c/strong&gt;을, 설명되지 않으면 \u003cstrong&gt;소리대로\u003c/strong&gt; 적음.\u003c/li&gt;\n\u003c/ul&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;옳은 표기\u003c/th&gt;\n\u003cth&gt;틀린 표기\u003c/th&gt;\n\u003cth&gt;까닭\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;듬뿍\u003c/td&gt;\n\u003ctd&gt;듬북\u003c/td&gt;\n\u003ctd&gt;&amp;#39;ㅁ&amp;#39; 받침 뒤, 뚜렷한 까닭 없는 된소리 → 소리대로\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;깍두기 [깍뚜기]\u003c/td&gt;\n\u003ctd&gt;깍뚜기\u003c/td&gt;\n\u003ctd&gt;&amp;#39;ㄱ&amp;#39; 받침 뒤 → 된소리로 적지 않음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;접시 [접씨]\u003c/td&gt;\n\u003ctd&gt;접씨\u003c/td&gt;\n\u003ctd&gt;&amp;#39;ㅂ&amp;#39; 받침 뒤 → 된소리로 적지 않음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;싹둑\u003c/td&gt;\n\u003ctd&gt;싹뚝\u003c/td&gt;\n\u003ctd&gt;&amp;#39;ㄱ&amp;#39; 받침 뒤 (확인 정답)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;함빡\u003c/td&gt;\n\u003ctd&gt;함박\u003c/td&gt;\n\u003ctd&gt;&amp;#39;ㅁ&amp;#39; 받침 뒤 (확인 정답)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;갑자기\u003c/td&gt;\n\u003ctd&gt;갑짜기\u003c/td&gt;\n\u003ctd&gt;&amp;#39;ㅂ&amp;#39; 받침 뒤 (탐구 활동)\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003ch3&gt;③ 어간과 어미의 표기 — 제4장 제15항 (66쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;제15항\u003c/strong&gt; 용언의 어간과 어미는 \u003cstrong&gt;구별하여\u003c/strong&gt; 적는다. 예) 베풀-+-ㅁ → \u003cstrong&gt;베풂\u003c/strong&gt;(×베품)\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;[붙임 1]\u003c/strong&gt; 두 용언이 어울려 한 용언이 될 때, 앞말의 \u003cstrong&gt;본뜻이 유지\u003c/strong&gt;되면 원형을 밝혀 적고, \u003cstrong&gt;본뜻에서 멀어지면\u003c/strong&gt; 밝혀 적지 않는다(소리대로).\u003cul&gt;\n\u003cli&gt;늘어나다: &amp;#39;늘다&amp;#39;의 뜻 유지 → 원형 밝힘\u003c/li&gt;\n\u003cli&gt;쓰러지다(×쓸어지다): &amp;#39;쓸다&amp;#39;의 뜻과 멀어짐 → 소리대로\u003c/li&gt;\n\u003cli&gt;들어내다(물건을 들어서 밖으로 옮김) ↔ 드러나다(×들어나다, 가려진 것이 보이게 됨)\u003c/li&gt;\n\u003cli&gt;돌아가면(×도라가면): &amp;#39;돌다&amp;#39;의 뜻 유지(탐구 활동)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;날개 — \u003cstrong&gt;명사형 어미 &amp;#39;-음/-ㅁ&amp;#39;\u003c/strong&gt;: 어간이 \u003cstrong&gt;모음이나 &amp;#39;ㄹ&amp;#39; 받침\u003c/strong&gt;으로 끝나면 &amp;#39;-ㅁ&amp;#39;, &amp;#39;ㄹ&amp;#39; 외의 받침이면 &amp;#39;-음&amp;#39;. 예) 설렘, 놂, 많음, 찾음\u003c/li&gt;\n\u003cli&gt;확인 정답: (1) \u003cstrong&gt;낯섦\u003c/strong&gt;(×낯설음, ×낯섬) (2) 책장을 \u003cstrong&gt;들어내니\u003c/strong&gt; 비밀의 문이 \u003cstrong&gt;드러났다\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;④ 접미사가 붙어서 된 말의 표기 — 제4장 제19항 (67쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;제19항\u003c/strong&gt; 어간에 &amp;#39;-이&amp;#39;, &amp;#39;-음/-ㅁ&amp;#39;이 붙어 \u003cstrong&gt;명사\u003c/strong&gt;가 된 것, &amp;#39;-이&amp;#39;, &amp;#39;-히&amp;#39;가 붙어 \u003cstrong&gt;부사\u003c/strong&gt;가 된 것은 어간의 원형을 밝혀 적는다. (본뜻 유지 + 여러 어간에 두루 결합하는 접미사)\u003cul&gt;\n\u003cli&gt;높이, 같이, 목걸이, 웃음, 꽃꽂이(×꽃꼬지)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;[붙임]\u003c/strong&gt; &amp;#39;-이&amp;#39;, &amp;#39;-음&amp;#39; \u003cstrong&gt;이외의 모음\u003c/strong&gt;으로 시작된 접미사가 붙어 다른 품사가 된 것은 원형을 밝히지 않는다. (결합하는 어간이 제약되고 결합 형태가 쉽게 인식되지 않음)\u003cul&gt;\n\u003cli&gt;부터(붙-+-어), 마주(맞-+-우), 너무, 우스개, 차마\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;확인 정답: (1) \u003cstrong&gt;우스개\u003c/strong&gt;, \u003cstrong&gt;웃음\u003c/strong&gt; (2) \u003cstrong&gt;목걸이\u003c/strong&gt;, \u003cstrong&gt;차마\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;⑤ 조사의 띄어쓰기 — 제1장 제2항, 제5장 제41항 (68쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;제2항\u003c/strong&gt; 문장의 각 단어는 띄어 씀을 원칙으로 한다.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;제41항\u003c/strong&gt; 조사는 그 앞말에 붙여 쓴다. (조사는 단어지만 홀로 쓰일 수 없음)\u003c/li&gt;\n\u003cli&gt;조사가 \u003cstrong&gt;둘 이상 연속\u003c/strong&gt;되거나 \u003cstrong&gt;어미 뒤\u003c/strong&gt;에 붙을 때도 앞말에 붙여 씀.\u003cul&gt;\n\u003cli&gt;너밖에 없어(×너 밖에) — &amp;#39;밖에&amp;#39;는 &amp;#39;그것 말고는&amp;#39;을 뜻하는 조사. 띄우면 &amp;#39;바깥&amp;#39;의 뜻으로 오해(민수: &amp;quot;나 지금 밖에 있는데?&amp;quot;)\u003c/li&gt;\n\u003cli&gt;오늘만이라도(×오늘만 이라도) — 조사 &amp;#39;만&amp;#39;+&amp;#39;이라도&amp;#39; 연속\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;확인 정답: \u003cstrong&gt;비가 오기는커녕 하늘에 구름조차 없다.\u003c/strong&gt; (조사 &amp;#39;는커녕&amp;#39;, &amp;#39;에&amp;#39;, &amp;#39;조차&amp;#39;는 붙여 씀)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;⑥ 의존 명사, 단위를 나타내는 명사의 띄어쓰기 — 제42항, 제43항 (69쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;제42항\u003c/strong&gt; 의존 명사는 띄어 쓴다. (꾸며 주는 말이 있어야 쓰이지만 명사 기능) 예) 아는 것이 힘이다 / 먹을 만큼 / 떠난 지가 오래다 / 이용 시 / 변경될 수 있음\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;제43항\u003c/strong&gt; 단위를 나타내는 명사는 띄어 쓴다. \u003cstrong&gt;다만\u003c/strong&gt; 순서를 나타내거나 숫자와 어울리면 붙여 쓸 수 있다.\u003cul&gt;\n\u003cli&gt;원칙: 제이 차, 제2 차, 열 개, 10 개, 제육 회 / 허용: 제이차, 제2차, 10개, 제육회\u003c/li&gt;\n\u003cli&gt;단위 명사에는 의존 명사(마리, 대)도, 자립 명사(사람, 그릇)도 있음: 새 한 마리, 차 두 대, 두 사람, 밥 한 그릇\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;확인 정답: (1) \u003cstrong&gt;계획대로\u003c/strong&gt;(조사) / \u003cstrong&gt;꿈꾸는 대로\u003c/strong&gt;(의존 명사) (2) \u003cstrong&gt;나무 한 그루는\u003c/strong&gt; / \u003cstrong&gt;약 삼십오 그램의\u003c/strong&gt;\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;⑦ 사이시옷 표기 — 제30항 도식 (70~71쪽 탐구 활동)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;사이시옷을 적는 조건 (순서대로 따짐)\u003col&gt;\n\u003cli&gt;두 명사가 결합한 \u003cstrong&gt;합성어\u003c/strong&gt;에서 \u003cstrong&gt;하나 이상이 고유어\u003c/strong&gt;인가?\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;앞 단어가 받침 없이 모음\u003c/strong&gt;으로 끝나는가?\u003c/li&gt;\n\u003cli&gt;다음 중 하나에 해당하는가? ㉮ 뒷말 첫소리가 \u003cstrong&gt;된소리\u003c/strong&gt; ㉯ 뒷말 첫소리 ㄴ, ㅁ 앞에서 \u003cstrong&gt;&amp;#39;ㄴ&amp;#39; 소리가 덧남\u003c/strong&gt; ㉰ 뒷말 첫소리 모음 앞에서 \u003cstrong&gt;&amp;#39;ㄴㄴ&amp;#39; 소리가 덧남\u003c/strong&gt;\u003c/li&gt;\n\u003c/ol&gt;\n\u003cul&gt;\n\u003cli&gt;모두 &amp;#39;예&amp;#39; → 사이시옷을 적는다 / 하나라도 &amp;#39;아니요&amp;#39; → 적지 않는다\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;예외 ① \u003cstrong&gt;고유어+외래어\u003c/strong&gt;에는 적지 않음: 핑크빛, 피자집\u003c/li&gt;\n\u003cli&gt;예외 ② \u003cstrong&gt;한자어\u003c/strong&gt;에는 적지 않지만, 두 음절 한자어 6개만 적음: \u003cstrong&gt;곳간, 셋방, 숫자, 찻간, 툇간, 횟수\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;교과서 예: 만두(饅頭, 한자어)+국(고유어), 앞말 모음, [만두꾹/만둗꾹] 된소리 → \u003cstrong&gt;만둣국\u003c/strong&gt;\u003c/li&gt;\n\u003cli&gt;(1) 빈칸(도식 적용 결과): 깨+잎 → \u003cstrong&gt;깻잎\u003c/strong&gt;([깬닙], ㄴㄴ 덧남) / 돌솥+밥 → \u003cstrong&gt;돌솥밥\u003c/strong&gt;(앞말 받침 있음) / 머리+말 → \u003cstrong&gt;머리말\u003c/strong&gt;(된소리·ㄴ 덧남 없음) / 혼자+말 → \u003cstrong&gt;혼잣말\u003c/strong&gt;([혼잔말], ㄴ 덧남) / 교차+점 → \u003cstrong&gt;교차점\u003c/strong&gt;(한자어끼리) / 최대+값 → \u003cstrong&gt;최댓값\u003c/strong&gt;(한자어+고유어, 된소리)\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;PART B. 2-(1) 우리말 바로 쓰기 (62~75쪽) · 2. 헷갈리는 것 비교표&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;비교\u003c/th&gt;\n\u003cth&gt;바른 표기\u003c/th&gt;\n\u003cth&gt;구별 포인트\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;듬뿍 vs 깍두기\u003c/td&gt;\n\u003ctd&gt;둘 다 바름\u003c/td&gt;\n\u003ctd&gt;&amp;#39;ㅁ&amp;#39; 받침 뒤 된소리는 적고, &amp;#39;ㄱ·ㅂ&amp;#39; 받침 뒤 된소리는 안 적음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;늘어나다 vs 쓰러지다\u003c/td&gt;\n\u003ctd&gt;둘 다 바름\u003c/td&gt;\n\u003ctd&gt;앞말 뜻 유지(늘다) → 원형 / 뜻 멀어짐(쓸다) → 소리대로\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;들어내다 vs 드러나다\u003c/td&gt;\n\u003ctd&gt;문맥에 따라\u003c/td&gt;\n\u003ctd&gt;&amp;#39;들다&amp;#39;의 뜻(들어서 옮김)이 살아 있으면 들어내다, 보이게 되면 드러나다\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;얼음 vs 얾\u003c/td&gt;\n\u003ctd&gt;둘 다 바름\u003c/td&gt;\n\u003ctd&gt;얼음 = 명사 / 얾 = &amp;#39;얼다&amp;#39;의 명사형(서술어로 쓰임, 사전 표제어 아님)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;낯섦 vs 낯설음\u003c/td&gt;\n\u003ctd&gt;낯섦\u003c/td&gt;\n\u003ctd&gt;&amp;#39;ㄹ&amp;#39; 받침 어간 + &amp;#39;-ㅁ&amp;#39;\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;높이·같이 vs 부터·마주\u003c/td&gt;\n\u003ctd&gt;모두 바름\u003c/td&gt;\n\u003ctd&gt;&amp;#39;-이&amp;#39;는 원형 밝힘 / &amp;#39;-어, -우&amp;#39; 등 다른 모음 접미사는 원형 안 밝힘\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;웃음 vs 우스개\u003c/td&gt;\n\u003ctd&gt;모두 바름\u003c/td&gt;\n\u003ctd&gt;&amp;#39;-음&amp;#39;은 원형 밝힘 / &amp;#39;-으개&amp;#39;는 원형 안 밝힘\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;목걸이 vs 차마\u003c/td&gt;\n\u003ctd&gt;모두 바름\u003c/td&gt;\n\u003ctd&gt;&amp;#39;-이&amp;#39;는 원형 밝힘 / 참-+-아 → 차마\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;너밖에(조사) vs 밖에(명사)\u003c/td&gt;\n\u003ctd&gt;문맥에 따라\u003c/td&gt;\n\u003ctd&gt;&amp;#39;~말고는&amp;#39;이면 붙이고, &amp;#39;바깥&amp;#39;이면 띄움\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;계획대로 vs 꿈꾸는 대로\u003c/td&gt;\n\u003ctd&gt;둘 다 바름\u003c/td&gt;\n\u003ctd&gt;체언 뒤 &amp;#39;대로&amp;#39;는 조사(붙임) / 관형어 뒤 &amp;#39;대로&amp;#39;는 의존 명사(띄움)\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;제육 회 vs 제육회\u003c/td&gt;\n\u003ctd&gt;둘 다 가능\u003c/td&gt;\n\u003ctd&gt;띄어 씀이 원칙, 순서를 나타내므로 붙임 허용\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;10 개 vs 10개\u003c/td&gt;\n\u003ctd&gt;둘 다 가능\u003c/td&gt;\n\u003ctd&gt;원칙 띄움, 숫자와 어울리면 붙임 허용\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;되요 vs 돼요\u003c/td&gt;\n\u003ctd&gt;돼요\u003c/td&gt;\n\u003ctd&gt;&amp;#39;되-+-어요&amp;#39;가 줄어든 말 → 제35항 [붙임 2]\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;만둣국 vs 피자집\u003c/td&gt;\n\u003ctd&gt;둘 다 바름\u003c/td&gt;\n\u003ctd&gt;한자어+고유어는 사이시옷 가능 / 외래어+고유어는 적지 않음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;숫자 vs 교차점\u003c/td&gt;\n\u003ctd&gt;둘 다 바름\u003c/td&gt;\n\u003ctd&gt;두 음절 한자어 6개만 사이시옷 / 그 외 한자어끼리는 안 적음\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;},{&quot;title&quot;:&quot;PART B. 2-(1) 우리말 바로 쓰기 (62~75쪽) · 3. 학습 활동 핵심과 정답&quot;,&quot;html&quot;:&quot;\u003ch3&gt;이해·탐구 후반 활동 (70~72쪽)\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cstrong&gt;예문-조항 연결\u003c/strong&gt;: 갑자기(×갑짜기) → 제5항 다만 / 돌아가면(×도라가면) → 제15항 [붙임 1] / 꽃꽂이(×꽃꼬지) → 제19항 / 만둣국 → 사이시옷 규정\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;사이시옷 도식\u003c/strong&gt; → 위 ⑦ 정답 참고. (2) 주변에서 사이시옷 오류 찾기는 자유 답.\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;띄어쓰기 고치기\u003c/strong&gt;(정호승, 《내 인생에 힘이 되어 준 한마디》) — 바르게 고친 문장:\u003cul&gt;\n\u003cli&gt;당신이 지금 실패했다\u003cstrong&gt;고\u003c/strong&gt; 생각한다면, 당신은 실패한 \u003cstrong&gt;게\u003c/strong&gt; 아니라, 이루어\u003cstrong&gt;지지\u003c/strong&gt; 않는 \u003cstrong&gt;한 가지\u003c/strong&gt; 방법을 발견했을 \u003cstrong&gt;뿐\u003c/strong&gt;입니다. 성공\u003cstrong&gt;이라는\u003c/strong&gt; 글자를 현미경으로 들여다보면 그 \u003cstrong&gt;속엔\u003c/strong&gt; 크고 \u003cstrong&gt;작은\u003c/strong&gt; 실패가 \u003cstrong&gt;수없이\u003c/strong&gt; 숨어 있습니다.\u003c/li&gt;\n\u003cli&gt;포인트: 조사 &amp;#39;고&amp;#39;, &amp;#39;이라는&amp;#39;은 붙임 / 의존 명사 &amp;#39;게(것이)&amp;#39;, &amp;#39;뿐&amp;#39;은 띄움 / 단위 명사 &amp;#39;가지&amp;#39; 띄움 / &amp;#39;이루어지다&amp;#39;, &amp;#39;수없이&amp;#39;는 한 단어라 붙임 (날개: 국어사전에서 한 단어인지 확인)\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cstrong&gt;탐구 과정 — &amp;quot;주의! 이 길은 잘 얾.&amp;quot;\u003c/strong&gt;\u003cul&gt;\n\u003cli&gt;학생의 의문: ㉠ 왜 &
