&gt;변화 없음\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;두부를 넣었을 때\u003c/td&gt;\n\u003ctd&gt;—\u003c/td&gt;\n\u003ctd&gt;두부가 녹음\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. A는 묽은 염산이다.\nㄴ. B의 수용액에는 수산화 이온(OH⁻)이 들어 있다.\nㄷ. A에 마그네슘 조각을 넣었을 때 발생하는 기체는 이산화 탄소이다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;8.\u003c/strong&gt; 여러 가지 산이 공통적인 성질을 나타내는 까닭에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 황산(H₂SO₄)은 수용액에서 H⁺과 SO₄²⁻을 2 : 1의 개수비로 내놓는다.\nㄴ. 아세트산(CH₃COOH)은 수용액에서 수소 이온을 내놓는다.\nㄷ. 산의 종류에 따라 음이온의 종류는 다르지만 양이온의 종류는 같다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄴ ③ ㄱ, ㄷ ④ ㄴ, ㄷ ⑤ ㄱ, ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;9.\u003c/strong&gt; 염기에 대한 설명으로 옳지 않은 것은?\n① 염기는 마그네슘과 반응하여 수소 기체를 발생시킨다.\n② 수산화 나트륨은 수용액에서 나트륨 이온과 수산화 이온으로 이온화된다.\n③ 수산화 칼슘(Ca(OH)₂) 1개는 수용액에서 수산화 이온 2개를 내놓는다.\n④ 염기의 수용액에 전원을 연결하면 이온들이 전극으로 움직여 전류가 흐른다.\n⑤ 여러 가지 염기가 공통적인 성질을 나타내는 것은 수산화 이온 때문이다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;10.\u003c/strong&gt; 생활 속에서 중화 반응을 이용한 예로 옳지 않은 것은?\n① 위산 때문에 속이 쓰릴 때 염기성인 제산제를 먹는다.\n② 생선 비린내의 원인인 염기성 물질의 양을 산성인 레몬즙으로 줄인다.\n③ 벌에 쏘였을 때 나오는 물질을 중화하기 위해 산성인 식초를 바른다.\n④ 산성화된 토양에 석회 가루를 뿌린다.\n⑤ 입속 박테리아가 만든 젖산을 없애기 위해 염기성 치약으로 이를 닦는다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;11.\u003c/strong&gt; 표와 같이 농도와 온도가 같은 묽은 염산과 수산화 나트륨 수용액을 부피를 달리하여 혼합하고 최고 온도를 측정하였다. 이에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;홈\u003c/th&gt;\n\u003cth&gt;1\u003c/th&gt;\n\u003cth&gt;2\u003c/th&gt;\n\u003cth&gt;3\u003c/th&gt;\n\u003cth&gt;4\u003c/th&gt;\n\u003cth&gt;5\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;묽은 염산 (mL)\u003c/td&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;수산화 나트륨 수용액 (mL)\u003c/td&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 최고 온도가 가장 높은 것은 홈 3이다.\nㄴ. 홈 1의 혼합 용액은 산성이다.\nㄷ. 생성된 물 분자 수는 홈 2가 홈 4보다 많다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄷ ③ ㄱ, ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;12.\u003c/strong&gt; 일정량의 묽은 염산에 수산화 나트륨 수용액을 조금씩 넣었다. 넣은 수산화 나트륨 수용액의 부피에 따라 그 수가 &amp;quot;처음에는 0이다가, 혼합 용액이 중성이 된 이후부터 증가&amp;quot;하는 입자는?\n① 수산화 이온(OH⁻)\n② 수소 이온(H⁺)\n③ 나트륨 이온(Na⁺)\n④ 염화 이온(Cl⁻)\n⑤ 혼합 용액 속 전체 이온\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;13.\u003c/strong&gt; 다음 중 에너지를 방출하여 주변의 온도가 높아지는 현상은?\n① 더운 날 땀이 증발한다.\n② 드라이아이스가 승화한다.\n③ 냉각 팩 속에서 화학 반응이 일어난다.\n④ 냉장고 안에서 냉매가 기화한다.\n⑤ 발열 용기에서 물과 산화 칼슘이 반응한다.\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;14.\u003c/strong&gt; 자연 현상과 생명 활동에서의 에너지 출입에 대한 설명으로 옳은 것만을 &amp;lt;보기&amp;gt;에서 있는 대로 고른 것은?\u003c/p&gt;\n\u003cp&gt;&amp;lt;보기&amp;gt;\nㄱ. 광합성은 에너지를 방출하는 반응이다.\nㄴ. 기체 상태의 수증기가 액화되어 구름을 이룰 때 에너지를 방출한다.\nㄷ. 세포호흡은 에너지를 흡수하는 반응이다.\u003c/p&gt;\n\u003cp&gt;① ㄱ ② ㄴ ③ ㄷ ④ ㄱ, ㄴ ⑤ ㄴ, ㄷ\u003c/p&gt;\n\u003cp&gt;\u003cstrong&gt;15.\u003c/strong&gt; 농도와 온도가 같은 묽은 염산과 수산화 나트륨 수용액을 전체 부피가 20 mL가 되도록 혼합하였다. 혼합 용액의 최고 온도가 가장 높은 것은? (단, 묽은 염산의 부피 : 수산화 나트륨 수용액의 부피)\n① 16 mL : 4 mL\n② 12 mL : 8 mL\n③ 10 mL : 10 mL\n④ 8 mL : 12 mL\n⑤ 4 mL : 16 mL\u003c/p&gt;\n\u003chr&gt;\n&quot;},{&quot;title&quot;:&quot;정답과 해설&quot;,&quot;html&quot;:&quot;\u003cdiv class=\&quot;table-responsive\&quot;&gt;\u003ctable class=\&quot;table table-sm\&quot;&gt;\n\u003cthead&gt;\n\u003ctr&gt;\n\u003cth&gt;번호\u003c/th&gt;\n\u003cth&gt;정답\u003c/th&gt;\n\u003cth&gt;해설\u003c/th&gt;\n\u003c/tr&gt;\n\u003c/thead&gt;\n\u003ctbody&gt;\u003ctr&gt;\n\u003ctd&gt;1\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;산소나 전자를 한쪽이 잃으면 다른 쪽이 얻으므로 산화와 환원은 \u003cstrong&gt;동시에\u003c/strong&gt; 일어난다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;2\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;검은색 CuO → 붉은색 Cu(ㄱ), C는 산소를 얻어 산화(ㄴ), 생성된 CO₂는 석회수를 뿌옇게(ㄷ).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;3\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;Cu → Cu²⁺(산화, ㄱ 옳음). Ag⁺ → Ag는 전자를 얻으므로 환원(ㄴ 틀림). Ag⁺ 2개가 없어지고 Cu²⁺ 1개가 생기므로 양이온 수는 감소(ㄷ 틀림).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;4\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;광합성은 CO₂ 환원·H₂O 산화, 세포호흡은 포도당 산화·산소 환원, 메테인 연소는 메테인 산화·산소 환원, 구리+질산 은은 구리 산화·은 이온 환원.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;5\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;(가) Al은 산소를 얻어 산화(ㄱ). (나) CuO는 산소를 잃어 환원(ㄴ 틀림). (다) CO₂는 산소를 잃고 C가 되므로 환원(ㄷ).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;6\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;촉매 장치에서는 산화 질소가 \u003cstrong&gt;환원\u003c/strong&gt;되어 배기가스가 정화된다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;7\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;탄산 칼슘·마그네슘과 반응하는 A는 산(묽은 염산), 단백질을 녹이는 B는 염기(OH⁻ 포함). 산과 마그네슘이 반응하면 \u003cstrong&gt;수소\u003c/strong&gt; 기체 발생(ㄷ 틀림).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;8\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;H₂SO₄ → 2H⁺ + SO₄²⁻, 아세트산도 H⁺을 내놓음. 산마다 음이온은 다르지만 양이온은 H⁺로 같다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;9\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;염기는 탄산 칼슘이나 마그네슘 등의 금속과 반응하지 않는다. 마그네슘과 반응해 수소를 내는 것은 산.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;10\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;개미나 벌에 쏘이면 \u003cstrong&gt;산성\u003c/strong&gt; 물질이 나오므로 \u003cstrong&gt;염기성\u003c/strong&gt;인 약을 바른다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;11\u003c/td&gt;\n\u003ctd&gt;④\u003c/td&gt;\n\u003ctd&gt;부피가 같은 홈 3에서 중화 반응이 가장 많이 일어나 최고 온도가 가장 높다(ㄱ). 홈 1은 H⁺이 남아 산성(ㄴ). 홈 2와 홈 4는 모두 작은 쪽이 4 mL라 생성된 물의 양이 같다(ㄷ 틀림).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;12\u003c/td&gt;\n\u003ctd&gt;①\u003c/td&gt;\n\u003ctd&gt;넣은 OH⁻은 H⁺이 남아 있는 동안 모두 물이 되므로 0, H⁺이 다 반응한 뒤(중성 이후)부터 남아 증가. H⁺은 감소, Na⁺은 계속 증가, Cl⁻은 일정, 전체 이온은 일정하다가 증가.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;13\u003c/td&gt;\n\u003ctd&gt;⑤\u003c/td&gt;\n\u003ctd&gt;물과 산화 칼슘의 반응은 열이 발생(방출). 나머지는 주변의 열을 흡수하여 온도를 낮춘다.\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;14\u003c/td&gt;\n\u003ctd&gt;②\u003c/td&gt;\n\u003ctd&gt;광합성은 빛에너지를 \u003cstrong&gt;흡수\u003c/strong&gt;(ㄱ 틀림), 세포호흡은 에너지를 \u003cstrong&gt;방출\u003c/strong&gt;(ㄷ 틀림). 수증기는 에너지를 방출하며 액화되어 구름(ㄴ).\u003c/td&gt;\n\u003c/tr&gt;\n\u003ctr&gt;\n\u003ctd&gt;15\u003c/td&gt;\n\u003ctd&gt;③\u003c/td&gt;\n\u003ctd&gt;전체 부피가 같으면 생성된 물 분자 수가 많을수록 온도가 높다. 물의 양은 두 부피 중 작은 쪽에 비례하므로 10 mL : 10 mL일 때 최대.\u003c/td&gt;\n\u003c/tr&gt;\n\u003c/tbody&gt;\u003c/table&gt;\u003c/div&gt;\n&quot;}]},{&quot;id&quot;:&quot;plan&quot;,&quot;subject&quot;:&quot;공부계획&quot;,&quot;title&quot;:&quot;10월 1~14일 공부 흐름&quot;,&quot;file&quot;:&quot;공부계획표.md&quot;,&quot;range&quot;:&quot;첨부 계획표 기준 / 2026년 10월&quot;,&quot;flow&quot;:[[&quot;10/1~10/4&quot;,&quot;개념 한 번 끝까지&quot;,&quot;핵심 정리와 교과서 함께 보기&quot;],[&quot;10/5~10/8&quot;,&quot;문제 · 오답 · 백지 복습&quot;,&quot;예상 문제 / 헷갈리는 비교 / 한국사 백지 복습&quot;],[&quot;10/9~10/11&quot;,&quot;부교재 두 번째 · 과학 마무리&quot;,&quot;틀린 문제 중심 / 첫 시험 과목 최종 복습&quot;],[&quot;10/12~10/14&quot;,&quot;시험 직전 복습&quot;,&quot;과학 → 국어 · 한국사 → 사회&quot;]],&quot;compare&quot;:{&quot;title&quot;:&quot;정리 자료가 있는 과목의 시험&quot;,&quot;head&quot;:[&quot;날짜&quot;,&quot;과목&quot;,&quot;시간&quot;],&quot;rows&quot;:[[&quot;10/12(월)&quot;,&quot;통합과학2&quot;,&quot;3교시 12:10~13:00&quot;],[&quot;10/13(화)&quot;,&quot;공통국어2&quot;,&quot;1교시 09:30~10:20&quot;],[&quot;10/13(화)&quot;,&quot;한국사2&quot;,&quot;3교시 12:10~13:00&quot;],[&quot;10/14(수)&quot;,&quot;통합사회2&quot;,&quot;3교시 12:10~13:00&quot;]]},&quot;note&quot;:&quot;일정은 공부계획표.md를 그대로 사용. 일자별 할 일과 확인할 항목은 아래 펼쳐보기.&quot;,&quot;sections&quot;:[{&quot;title&qu c/code&gt; → 예상 문제 빼고 전부, 교과서 34~61쪽과 같이\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합과학 화학 변화와 에너지 출입 (2시간)\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;통합과학_정리_2_화학변화와에너지.md\u003c/code&gt; → 예상 문제 빼고 전부, 교과서 36~66쪽과 같이\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국어 뉴욕제과점 (1시간)\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;국어_정리_1_뉴욕제과점_우리말.md\u003c/code&gt; → PART A\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;5~8일차: 문제 풀기&quot;,&quot;html&quot;:&quot;\u003ch3&gt;10/5(월) 대체공휴일 5시간\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합과학 부교재 1~33쪽 + 예상 문제 (2시간): 첫날 시험이라 먼저\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;통합과학_정리_1~2\u003c/code&gt; → 예상 문제 (총 30문제), 틀린 번호 표시\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국어 춘향전 (1.5시간)\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;국어_정리_2_춘향전.md\u003c/code&gt; → 예상 문제 빼고 전부\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 한국사 문제 풀기 (1.5시간)\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;한국사_정리_1~3\u003c/code&gt; → 예상 문제 (총 36문제), 틀린 번호 표시\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;10/6(화) 3시간\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합사회 부교재 4~41쪽 + 예상 문제 (2시간)\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;통합사회_정리_1~2\u003c/code&gt; → 예상 문제 (총 30문제), 틀린 번호 표시\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국어 문제 (1시간)\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;국어_정리_1~3\u003c/code&gt; → 예상 문제 (총 42문제), 틀린 번호 표시\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;10/7(수) 3시간\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합과학 틀린 문제 (1시간)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합사회 틀린 문제 (1시간)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 한국사 틀린 문제 (1시간)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;10/8(목) 3시간\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국어 작품 여섯 개와 우리말 바로 쓰기 다시 보기 (1.5시간)\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;국어_정리_1~3\u003c/code&gt; → 헷갈리는 것 비교, 소단원 정리 빈칸\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 한국사 백지 복습 (1.5시간)\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;한국사_백지복습.md\u003c/code&gt; → 처음부터 다시 채우기\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;9~11일차: 부교재 두 번째 풀기와 첫날 과목 마무리&quot;,&quot;html&quot;:&quot;\u003ch3&gt;10/9(금) 한글날 5시간\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합과학 부교재 다시 풀기, 틀린 문제 위주 (2시간)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합사회 부교재 다시 풀기, 틀린 문제 위주 (2시간)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국어 틀린 문제 다시 보기 (1시간)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;10/10(토) 5시간\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합과학 교과서 핵심 개념과 계산 유형 다시 보기 (2.5시간)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합사회 헷갈리는 개념 정리 (1.5시간)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 한국사 틀린 문제 다시 보기 (1시간)\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;10/11(일) 5시간: 통합과학 시험 전날\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합과학 최종 정리 (3시간): 틀린 문제, 헷갈리는 것, 외울 것\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;통합과학_정리_1~2\u003c/code&gt; → 헷갈리는 것 비교, 외울 것 체크리스트\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국어·한국사 가볍게 훑기 (2시간): 10/13 시험 대비\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;시험 기간&quot;,&quot;html&quot;:&quot;\u003ch3&gt;10/12(월): 통합과학 시험\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 1~2교시 자기주도학습: 통합과학 틀린 문제·외울 것 마지막으로 보기\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 시험 끝나고 오후 국어 (2시간): 작품별 핵심, 우리말 규칙, 틀린 문제\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 오후 한국사 (2시간): 백지 복습, 틀린 문제\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;10/13(화): 국어, 한국사 시험\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 1교시 전: 국어 헷갈리는 것 비교만 빠르게\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 2교시 자기주도학습: 한국사 뼈대 표와 순서 배열 마지막으로 보기\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 시험 끝나고 오후 통합사회 최종 정리 (4시간): 틀린 문제, 부교재, 외울 것\u003cul&gt;\n\u003cli&gt;\u003ccode&gt;통합사회_정리_1~2\u003c/code&gt; → 헷갈리는 것 비교, 외울 것 체크리스트\u003c/li&gt;\n\u003c/ul&gt;\n\u003c/li&gt;\n\u003c/ul&gt;\n\u003ch3&gt;10/14(수): 통합사회 시험\u003c/h3&gt;\n\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 2교시 자기주도학습: 통합사회 외울 것 마지막으로 보기\u003c/li&gt;\n\u003cli&gt;이후 공통영어2(10/15)는 학원 일정대로\u003c/li&gt;\n\u003c/ul&gt;\n&quot;},{&quot;title&quot;:&quot;확인할 것 (필기·프린트로)&quot;,&quot;html&quot;:&quot;\u003cul&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 접동새, 낡은 집: 교과서에 없는 작품 → 수업 프린트와 \u003ccode&gt;국어_정리_3_시4편.md\u003c/code&gt; 대조\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 국어 정리 파일의 &amp;#39;예시&amp;#39;, &amp;#39;(교과서 확인 필요)&amp;#39; 표시 부분\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 한국사 3번 파일의 &amp;#39;(교과서 확인 필요)&amp;#39; 3군데\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 통합과학·통합사회 정리 파일의 &amp;#39;(교과서 확인 필요)&amp;#39; 표시 부분 (각 4~8군데)\u003c/li&gt;\n\u003cli&gt;\u003cinput disabled=\&quot;\&quot; type=\&quot;checkbox\&quot;&gt; 10/5 대체공휴일 여부 학교 일정표로 확인\u003c/li&gt;\n\u003c/ul&gt;\n&quot;}]}]&lt;/script&gt;
  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById('midterm-map');
    const units = JSON.parse(root.querySelector('#study-data').textContent);
    const picker = root.querySelector('#study-unit');
    const content = root.querySelector('#study-content');
    const subjects = ['국어','한국사','통합사회','통합과학','공부계획'];
    const esc = s =&gt; String(s).replace(/[&amp;&lt;&gt;&quot;']/g,c=&gt;({'&amp;':'&amp;amp;','&lt;':'&amp;lt;','&gt;':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;'}[c]));
    let subject = '한국사';
    let unitId = units.find(x=&gt;x.subject===subject).id;
    let opened = [];
    const state = () =&gt; ({modelContent:{과목:subject,단원:units.find(x=&gt;x.id===unitId).title},privateContent:{subject,unitId,opened}});
    function save() { if(window.openai?.setWidgetState) window.openai.setWidgetState(state()).catch(()=&gt;{}); }
    function render() {
      root.querySelector('.subjects').innerHTML = subjects.map(s=&gt;`&lt;button type=&quot;button&quot; class=&quot;btn&quot; aria-pressed=&quot;${s===subject}&quot; data-subject=&quot;${s}&quot;&gt;${s}&lt;/button&gt;`).join('');
      const selected = units.filter(x=&gt;x.subject===subject);
      if(!selected.some(x=&gt;x.id===unitId)) unitId=selected[0].id;
      picker.innerHTML=selected.map(x=&gt;`&lt;option value=&quot;${x.id}&quot;&gt;${esc(x.title)}&lt;/option&gt;`).join('');
      picker.value=unitId;
      const u=units.find(x=&gt;x.id===unitId);
      content.innerHTML=`&lt;h3&gt;${esc(u.title)}&lt;/h3&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;${esc(u.range)}&lt;/div&gt;
        &lt;div class=&quot;map-flow&quot; role=&quot;figure&quot; aria-label=&quot;${esc(u.title)} 핵심 흐름&quot;&gt;${u.flow.map((n,i)=&gt;`&lt;div class=&quot;map-step&quot;&gt;&lt;div class=&quot;step-order text-small&quot;&gt;${esc(n[0])}&lt;/div&gt;&lt;div class=&quot;step-name&quot;&gt;${esc(n[1])}&lt;/div&gt;&lt;div class=&quot;step-detail&quot;&gt;${esc(n[2])}&lt;/div&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;
        ${u.compare?`&lt;h3 class=&quot;section-title&quot;&gt;${esc(u.compare.title)}&lt;/h3&gt;&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table comparison&quot;&gt;&lt;thead&gt;&lt;tr&gt;${u.compare.head.map(x=&gt;`&lt;th scope=&quot;col&quot;&gt;${esc(x)}&lt;/th&gt;`).join('')}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${u.compare.rows.map(r=&gt;`&lt;tr&gt;${r.map(x=&gt;`&lt;td&gt;${esc(x)}&lt;/td&gt;`).join('')}&lt;/tr&gt;`).join('')}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`:''}
        &lt;div class=&quot;source-note text-small text-muted&quot;&gt;${esc(u.note)}&lt;/div&gt;
        &lt;h3 class=&quot;section-title&quot;&gt;정리 노트 펼쳐보기&lt;/h3&gt;
        ${u.sections.map((s,i)=&gt;`&lt;details data-section=&quot;${i}&quot; ${opened.includes(i)?'open':''}&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;${esc(s.title)}&lt;/summary&gt;&lt;div class=&quot;source-body&quot;&gt;${s.html}&lt;/div&gt;&lt;/details&gt;`).join('')}
        &lt;div class=&quot;source-note text-small text-muted&quot;&gt;출처 · ${esc(u.file)}&lt;/div&gt;`;
      content.querySelectorAll('details').forEach(d=&gt;d.addEventListener('toggle',()=&gt;{const next=[...content.querySelectorAll('details[open]')].map(x=&gt;Number(x.dataset.section));if(JSON.stringify(next)!==JSON.stringify(opened)){opened=next;save();}}));
    }
    function restore(snapshot) {
      const p=snapshot?.privateContent;
      if(p &amp;&amp; subjects.includes(p.subject) &amp;&amp; units.some(u=&gt;u.id===p.unitId&amp;&amp;u.subject===p.subject)) { subject=p.subject;unitId=p.unitId;opened=Array.isArray(p.opened)?p.opened.filter(Number.isInteger):[]; }
      render();
    }
    root.querySelector('.subjects').addEventListener('click',e=&gt;{const b=e.target.closest('button[data-subject]');if(!b)return;subject=b.dataset.subject;unitId=units.find(x=&gt;x.subject===subject).id;opened=[];render();save();});
    picker.addEventListener('change',()=&gt;{unitId=picker.value;opened=[];render();save();});
    window.addEventListener('openai:set_globals',e=&gt;{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
    restore(window.openai?.widgetState);
  })();
  &lt;/script&gt;

    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
